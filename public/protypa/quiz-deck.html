<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>Κουίζ</title>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#6B3FA0;
  --purple-dark:#4A2D6F;
  --purple-light:#8B6BB5;
  --navy:#1B2A4A;
  --cyan:#4AAFC7;
  --coral:#E8735A;
  --gold:#E8B84B;
  --cream:#FAFAF7;
  --ink:#1a1610;
  --muted:#7a7060;
  --correct:#2d8e4e;
  --wrong:#c44a3d;
  --shadow:4px 8px 28px rgba(26,22,16,.16);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;color-scheme:light only;}
@media(prefers-color-scheme:dark){
  html,body{background:var(--cream)!important;color:var(--ink)!important;}
  .big-card{background:#fff!important;}
  .opt-btn{background:#fff!important;color:var(--ink)!important;}
  .quiz-topbar,.quiz-bottom{background:var(--cream)!important;}
  #startScreen{background:var(--cream)!important;}
  .deck-card{background:#fff!important;color:var(--ink)!important;}
}
body{
  background:var(--cream);
  font-family:'Source Sans 3',sans-serif;
  color:var(--ink);
  min-height:100%;
}

/* ═══ DECORATIVE CIRCLES (book motif) — 2 sets ═══ */
/* Κύκλος 1: πάνω δεξιά — navy/cyan/κίτρινο (όπως στο εξώφυλλο) */
.circle-top{
  position:absolute;bottom:-20vw;right:-25vw;
  width:max(55vw,55vh);height:max(55vw,55vh);min-width:350px;min-height:350px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--navy),var(--cyan));
  z-index:0;pointer-events:none;
  animation:ballIn1 1.2s cubic-bezier(.34,1.56,.64,1) .2s both;
}
@media(min-width:769px){
  .circle-top{right:-32vw;}
}
@keyframes ballIn1{
  0%{transform:translate(0,60vh) scale(.3);opacity:0;}
  60%{opacity:1;}
  100%{transform:translate(0,0) scale(1);opacity:1;}
}
.circle-top::before{
  content:'';position:absolute;
  top:18%;left:18%;
  width:64%;height:64%;border-radius:50%;
  background:var(--cyan);
}
.circle-top::after{
  content:'';position:absolute;
  top:33%;left:33%;
  width:34%;height:34%;border-radius:50%;
  background:var(--gold);
}

/* Κύκλος 2: κάτω αριστερά — κίτρινο/σομόν/κόκκινο (εξώφυλλο) */
.circle-bottom{
  position:absolute;top:-15vw;left:-35vw;
  width:max(55vw,55vh);height:max(55vw,55vh);min-width:350px;min-height:350px;
  border-radius:50%;
  background:#E8B84B;
  z-index:0;pointer-events:none;
  animation:ballIn2 1.4s cubic-bezier(.34,1.56,.64,1) .5s both;
}
@media(min-width:769px){
  .circle-bottom{left:-32vw;}
}
@keyframes ballIn2{
  0%{transform:translate(-40vw,-40vh) scale(.3);opacity:0;}
  60%{opacity:1;}
  100%{transform:translate(0,0) scale(1);opacity:1;}
}
.circle-bottom::before{
  content:'';position:absolute;
  top:16%;left:16%;
  width:68%;height:68%;border-radius:50%;
  background:#F0C9A8;
}
.circle-bottom::after{
  content:'';position:absolute;
  top:32%;left:32%;
  width:36%;height:36%;border-radius:50%;
  background:#D94F4F;
}

/* ═══ START SCREEN ═══ */
#startScreen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:40px 20px;text-align:center;
  position:relative;z-index:1;
}
.start-eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--purple-light);font-weight:600;margin-bottom:10px;position:relative;z-index:2;}
.start-title{font-family:'Literata',serif;font-size:clamp(24px,5vw,42px);font-weight:700;line-height:1.2;margin-bottom:6px;color:var(--navy);position:relative;z-index:2;text-shadow:0 2px 10px rgba(255,255,255,0.8),0 0 20px rgba(255,255,255,0.5);}
.start-title em{font-style:italic;color:var(--purple);}
.start-accent{width:70px;height:3px;background:linear-gradient(90deg,var(--purple),var(--cyan));margin:14px auto 22px;border-radius:2px;position:relative;z-index:2;}
.start-sub{color:var(--muted);font-size:14px;max-width:460px;line-height:1.6;margin-bottom:36px;position:relative;z-index:2;text-shadow:0 2px 8px rgba(255,255,255,0.7),0 0 16px rgba(255,255,255,0.4);}
.start-credits{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:1.5px;color:rgba(26,22,16,.5);font-weight:400;z-index:2;text-shadow:0 1px 4px rgba(255,255,255,.6);border-top:1px solid rgba(26,22,16,.2);padding-top:8px;white-space:nowrap;display:flex;align-items:center;gap:6px;justify-content:center;}
.credits-logo{width:16px;height:16px;opacity:0.7;flex-shrink:0;}
@media(min-width:769px){
  .start-credits{color:var(--ink);opacity:0.6;border-top-color:rgba(26,22,16,.3);}
  .credits-logo{opacity:0.5;}
}

.deck-pick{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;position:relative;z-index:2;}
.deck-card{
  background:#fff;border-radius:10px;box-shadow:var(--shadow);
  padding:22px 28px;width:240px;cursor:pointer;
  border:2.5px solid transparent;transition:all .22s;
  text-align:left;position:relative;overflow:hidden;
}
.deck-card::before{
  content:'';position:absolute;top:0;left:0;width:5px;height:100%;
  background:linear-gradient(180deg,var(--purple),var(--cyan));
  border-radius:10px 0 0 10px;
}
.deck-card:hover{transform:translateY(-3px);cursor:pointer;}
.deck-card.active{border-color:var(--purple);border-width:3px;background:#fff;box-shadow:0 0 20px rgba(107,63,160,0.2),4px 8px 28px rgba(26,22,16,.16);}
.deck-card.active .dc-num{color:var(--purple);opacity:.35;font-size:48px;}
.deck-card.active .dc-title{color:var(--purple);}
.deck-card.active .dc-ktitle{color:var(--purple-dark);}
.deck-card.active .dc-author{color:var(--coral);}
.deck-card.active .dc-sub{color:var(--muted);}
.dc-num{font-family:'Literata',serif;font-size:40px;font-weight:700;opacity:.07;line-height:1;margin-bottom:6px;color:var(--purple);}
.dc-title{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--purple-light);margin-bottom:5px;}
.dc-ktitle{font-family:'Literata',serif;font-size:14px;font-style:italic;font-weight:700;color:var(--ink);line-height:1.35;margin-bottom:4px;}
.dc-author{font-size:11.5px;font-weight:600;color:var(--coral);margin-bottom:7px;}
.dc-sub{font-size:11px;color:var(--muted);line-height:1.5;border-top:1px solid rgba(26,22,16,.08);padding-top:7px;margin-top:2px;}

.btn-start{
  position:relative;z-index:2;align-self:center;
  padding:16px 52px;
  background:linear-gradient(135deg,var(--purple),var(--purple-dark));
  color:#fff;
  border:none;border-radius:8px;
  font-size:16px;font-weight:700;
  font-family:'Source Sans 3',sans-serif;
  cursor:pointer;transition:all .2s;
  letter-spacing:.5px;
  box-shadow:0 4px 16px rgba(107,63,160,.3);
}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(107,63,160,.4);}

/* ═══ QUIZ SCREEN ═══ */
#quizScreen{display:none;min-height:100vh;flex-direction:column;}
#quizScreen.active{height:100vh;height:100dvh;min-height:0;} /* σταθερό ύψος → αυτόματη προσαρμογή γραμμάτων */
.big-card{min-height:0;}
#quizScreen.active{display:flex;}

.quiz-topbar{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;
  border-bottom:1px solid rgba(107,63,160,.08);
  background:var(--cream);
}
.qt-left{display:flex;align-items:center;gap:12px;}
.btn-quit{
  background:none;border:1px solid rgba(107,63,160,.25);border-radius:4px;
  padding:5px 12px;font-size:12px;font-family:'Source Sans 3',sans-serif;
  cursor:pointer;color:var(--purple-light);transition:all .18s;
}
.btn-quit:hover{border-color:var(--purple);color:var(--purple);}
.qt-deck-lbl{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.dk1-lbl{color:var(--purple);}.dk2-lbl{color:var(--navy);}.dk3-lbl{color:var(--coral);}

.qt-right{display:flex;align-items:center;gap:12px;}
.qt-score{font-size:13px;color:var(--muted);}
.qt-score strong{font-family:'Literata',serif;font-size:17px;}
.s-c{color:var(--correct);}.s-w{color:var(--wrong);}

.progress-wrap{flex-shrink:0;height:3px;background:rgba(107,63,160,.08);}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));transition:width .4s ease;}

.card-stage{
  flex:1;display:flex;align-items:stretch;
  padding:12px;gap:0;
  min-height:0;
}

.big-card{
  width:100%;
  background:#fff;border-radius:10px;
  box-shadow:var(--shadow);
  border:1px solid rgba(107,63,160,.12);
  display:grid;grid-template-columns:minmax(216px, 32.4%) 1fr; /* φαρδύτερη η ερώτηση (ήταν 25%) */
  overflow:hidden;
  animation:cardIn .3s ease both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

.bc-left{
  padding:30px 26px;
  display:flex;flex-direction:column;
  gap:14px;
  position:relative;overflow:hidden;
}
/* Clean left panel — no pattern */
.bc-left::after{
  content:'';position:absolute;bottom:-60px;right:-60px;
  width:140px;height:140px;border-radius:50%;
  background:rgba(255,255,255,.05);
}
.dk1 .bc-left{background:linear-gradient(160deg,var(--purple),var(--purple-dark));}
.dk2 .bc-left{background:linear-gradient(160deg,var(--navy),var(--cyan));}
.dk3 .bc-left{background:linear-gradient(160deg,#D94F4F,#B83A3A);}
.bc-left.answered-ok{background:linear-gradient(160deg,var(--correct),#1E6B3A)!important;}
.bc-left.answered-ko{background:linear-gradient(160deg,var(--wrong),#8B2D23)!important;}

.bc-qnum{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:600;position:relative;z-index:1;}
.bc-qtext{
  font-family:'Literata',serif;
  font-size:clamp(15px,2vw,19px);
  font-style:italic;color:#fff;line-height:1.5;flex:1;
  position:relative;z-index:1;
}
.bc-qtype{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.4);font-weight:600;position:relative;z-index:1;}
.bc-result{font-size:48px;font-weight:700;line-height:1;color:#fff;position:relative;z-index:1;}

.bc-right>*{flex-shrink:0;} /* να μη «ζουλιούνται» η τράπεζα και οι θέσεις (επικάλυψη στο κινητό) */
.bc-right{
  padding:24px 28px;
  display:flex;flex-direction:column;
  gap:9px;
  overflow-y:auto;
  position:relative;
}
.dk1 .bc-right{background:rgba(107,63,160,.08);}
.dk2 .bc-right{background:rgba(27,42,74,.08);}
.dk3 .bc-right{background:rgba(232,115,90,.08);}

/* ═══ MCQ ═══ */
.opt-btn{
  display:flex;align-items:flex-start;gap:10px;
  padding:12px 15px;
  border:2px solid rgba(107,63,160,.18);
  border-radius:10px;background:#fff;
  cursor:pointer;transition:all .18s;
  font-family:'Source Sans 3',sans-serif;
  font-size:clamp(13px,1.7vw,15px);
  line-height:1.45;text-align:left;width:100%;
}
.opt-btn:hover:not(.disabled){border-color:var(--purple);background:rgba(107,63,160,.05);}
.opt-btn.disabled{pointer-events:none;}
.opt-lbl{font-weight:700;flex-shrink:0;font-size:12px;}
.dk1 .opt-lbl{color:var(--purple);}.dk2 .opt-lbl{color:var(--navy);}.dk3 .opt-lbl{color:var(--coral);}
.opt-btn.chosen.correct{border-color:var(--correct);background:var(--correct);color:#fff;}
.opt-btn.chosen.correct .opt-lbl{color:#fff;}
.opt-btn.chosen.wrong{border-color:var(--wrong);background:var(--wrong);color:#fff;opacity:1;text-decoration:line-through;}
.opt-btn.reveal{border-color:var(--correct);background:rgba(45,142,78,.15);}
.opt-btn.reveal .opt-lbl{color:var(--correct);font-weight:900;}

/* ═══ DRAG DROP ═══ */
.drag-instr{font-size:12px;color:var(--muted);line-height:1.4;padding:6px 0;}
.drag-bank{
  display:flex;flex-wrap:wrap;gap:7px;
  padding:10px 12px;
  background:rgba(255,255,255,.65);border-radius:8px;
  min-height:46px;
}
.drag-chip{
  padding:7px 14px;background:#fff;
  border:1.5px solid var(--purple-light);border-radius:20px;
  font-size:12.5px;font-weight:600;cursor:grab;
  transition:background .15s,transform .15s;
  color:var(--ink);user-select:none;
  touch-action:none;
}
.drag-chip:hover{background:rgba(107,63,160,.08);}
.drag-chip.dragging{opacity:.45;cursor:grabbing;}
.drag-chip.sel-tap{background:var(--purple);color:#fff;transform:scale(1.04);cursor:pointer;}

.drag-slots{display:flex;flex-direction:column;gap:7px;margin-top:4px;}
.slot-row{display:flex;align-items:center;gap:10px;}
.slot-lbl{font-size:12.5px;font-weight:700;flex-shrink:0;line-height:1.3;color:var(--ink);}
.slot-zone{
  flex:1;min-height:40px;
  border:1.5px dashed rgba(107,63,160,.25);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  padding:7px 11px;transition:all .18s;
  background:rgba(255,255,255,.7);
  font-size:12.5px;color:var(--muted);
  text-align:center;line-height:1.3;
  cursor:pointer;
}
.slot-zone.drag-over{border-color:var(--purple);background:rgba(107,63,160,.08);border-style:solid;}
.slot-zone.filled{border-style:solid;border-color:var(--purple);background:rgba(107,63,160,.06);color:var(--ink);font-weight:700;}
.slot-zone.ok-slot{border-color:var(--correct)!important;background:rgba(45,142,78,.1)!important;color:var(--correct)!important;font-weight:700;}
.slot-zone.ko-slot{border-color:var(--wrong)!important;background:rgba(196,74,61,.07)!important;color:var(--wrong)!important;}

/* ═══ FEEDBACK ═══ */
.fb-box{
  padding:12px 15px;border-radius:8px;
  font-size:13.5px;line-height:1.6;display:none;
  border-left:3px solid transparent;margin-top:4px;
}
.fb-box.show{display:block;}
.fb-box.ok{background:rgba(45,142,78,.09);border-left-color:var(--correct);}
.fb-box.ko{background:rgba(196,74,61,.07);border-left-color:var(--wrong);}
.fb-ref{display:block;margin-top:5px;font-size:11.5px;color:var(--muted);font-style:italic;}

/* ═══ SUBMIT ═══ */
.btn-submit{
  align-self:flex-start;margin-top:4px;
  padding:10px 24px;
  background:linear-gradient(135deg,var(--purple),var(--purple-dark));
  color:#fff;
  border:none;border-radius:6px;font-size:13.5px;font-weight:700;
  font-family:'Source Sans 3',sans-serif;cursor:pointer;transition:all .2s;
}
.btn-submit:disabled{opacity:.38;cursor:not-allowed;}
.btn-submit:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(107,63,160,.3);}

/* ═══ BOTTOM BAR ═══ */
.quiz-bottom{
  flex-shrink:0;
  padding:14px 20px;
  border-top:1px solid rgba(107,63,160,.1);
  background:var(--cream);
  display:flex;align-items:center;justify-content:space-between;
}
.qb-info{font-size:15px;color:var(--muted);font-weight:300;opacity:0.65;letter-spacing:0.3px;}
.btn-next{
  padding:13px 36px;
  background:linear-gradient(135deg,var(--purple),var(--purple-dark));
  color:#fff;
  border:none;border-radius:8px;
  font-size:15px;font-weight:700;
  font-family:'Source Sans 3',sans-serif;
  cursor:pointer;transition:all .2s;
  display:none;
  box-shadow:0 4px 16px rgba(107,63,160,.25);
}
.btn-next.show{display:block;}
.btn-next:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(107,63,160,.35);}

/* ═══ RESULTS ═══ */
#resultsScreen{
  display:none;min-height:100vh;
  flex-direction:column;align-items:center;justify-content:center;
  padding:40px 20px;text-align:center;
}
#resultsScreen.active{display:flex;}
.res-score{font-family:'Literata',serif;font-size:72px;font-weight:700;line-height:1;color:var(--purple);}
.res-denom{font-size:28px;opacity:.5;margin-left:4px;}
.res-label{font-size:14px;color:var(--muted);margin-top:6px;}
.res-msg{font-size:16px;line-height:1.65;margin-top:18px;max-width:420px;}
.res-gold{width:70px;height:3px;background:linear-gradient(90deg,var(--purple),var(--cyan));margin:20px auto;border-radius:2px;}
.res-btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:14px;}
.btn-res{
  padding:13px 32px;border:none;border-radius:8px;
  font-size:14px;font-weight:700;font-family:'Source Sans 3',sans-serif;
  cursor:pointer;transition:all .2s;min-width:280px;
}
.btn-res.primary{background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff;box-shadow:0 4px 16px rgba(107,63,160,.25);}
.btn-res.primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(107,63,160,.35);}
.btn-res.secondary{background:transparent;border:2px solid rgba(107,63,160,.25);color:var(--purple);}
.btn-res.secondary:hover{border-color:var(--purple);}

/* ═══ RESPONSIVE ═══ */
@media(max-width:640px){
  .big-card{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);}
  .bc-left{max-height:37.8dvh;}
  .bc-left{min-height:24.3vh;padding:22px 18px;flex-direction:row;align-items:center;gap:10px;} /* ψηλότερη ζώνη ερώτησης στο κινητό */
  .bc-qnum{display:none;}
  .bc-qtype{display:none;}
  .bc-qtext{font-size:clamp(17px, 5vw, 22px);flex:1;}
  .bc-result{font-size:40px;}
  .bc-right{padding:12px 12px;gap:clamp(6px, 2vw, 10px);}
  .opt-btn{padding:clamp(10px, 3vw, 14px) clamp(12px, 3.5vw, 16px);font-size:clamp(14px, 4vw, 17px);border-radius:8px;gap:9px;min-height:auto;}
  .opt-lbl{font-size:clamp(13px, 3.5vw, 16px);}
  .fb-box{font-size:clamp(13px, 3.8vw, 16px);padding:clamp(10px, 3vw, 14px);}
  .fb-ref{font-size:clamp(11px, 3vw, 13px);}
  .slot-lbl{font-size:11.5px;width:90px;}
  .slot-row{flex-wrap:wrap;gap:4px 10px;} .slot-row .slot-lbl{width:100%;} .slot-row .slot-zone{flex:1 1 100%;}
  .drag-chip{font-size:12px;padding:6px 11px;}
  .drag-bank{min-height:40px;padding:8px 10px;}
  .slot-zone{min-height:36px;font-size:12px;}
  .deck-pick{flex-direction:column;align-items:center;}
  .deck-card{width:90%;max-width:320px;}
  .card-stage{padding:8px;}
  .quiz-bottom{padding:8px 12px;}
  .quiz-topbar{padding:8px 12px;}
  .quiz-bottom{padding:10px 12px;}
  .btn-next{padding:11px 24px;font-size:14px;}
  .btn-submit{padding:10px 20px;font-size:13px;}
  .circle-top{min-width:400px;min-height:400px;width:140vw;height:140vw;bottom:-35vw;right:-20vw;top:auto;}
  .circle-bottom{min-width:400px;min-height:400px;width:140vw;height:140vw;top:5vh;left:-50vw;bottom:auto;}
  .start-title{text-shadow:0 2px 8px rgba(255,255,255,0.8),0 0 16px rgba(255,255,255,0.5);}
  .start-sub{text-shadow:0 1px 6px rgba(255,255,255,0.6);font-size:13px;}
  .bc-copy{font-size:7px;bottom:8px;left:16px;}
}
@media(min-width:641px){
  .slot-lbl{width:clamp(120px, 15vw, 20vh);}
  .bc-left{min-width:0;padding:clamp(28px, 4vw, 5vh) clamp(24px, 3vw, 4vh);gap:clamp(14px, 2vw, 3vh);}
  .bc-qnum{font-size:clamp(9px, 1.2vw, 1.6vh);letter-spacing:3px;}
  .bc-qtext{font-size:clamp(16px, 2.5vw, 3.2vh);line-height:1.55;}
  .bc-qtype{font-size:clamp(9px, 1.1vw, 1.5vh);letter-spacing:2px;}
  .bc-result{font-size:clamp(52px, 7vw, 11vh);}

/* ═══ ΠΡΟΤΥΠΟ: επιπλέον τύποι (Σ/Λ, κενά, επιλογή λέξεων) ═══ */

.tf-row .opt-btn{justify-content:center;text-align:center;font-weight:700;}
.gap-text,.clk-text{
  font-family:'Literata',serif;font-size:clamp(15px,1.9vw,19px);line-height:2.1;
  background:#fff;border-radius:10px;padding:14px 16px;border:1px solid rgba(107,63,160,.12);
}
.gap-in{
  font:inherit;font-family:'Source Sans 3',sans-serif;font-weight:600;font-size:.92em;
  min-width:6ch;padding:2px 8px;margin:0 2px;
  border:none;border-bottom:2px solid var(--purple-light);background:rgba(107,63,160,.06);
  border-radius:4px 4px 0 0;color:var(--ink);outline:none;text-align:center;
}
select.gap-in{cursor:pointer;}
.gap-in:focus{border-bottom-color:var(--purple);background:rgba(107,63,160,.1);}
.gap-in.ok{border-bottom-color:var(--correct);background:rgba(45,142,78,.12);color:var(--correct);}
.gap-in.ko{border-bottom-color:var(--wrong);background:rgba(196,74,61,.08);color:var(--wrong);text-decoration:line-through;}
.gap-fix{font-family:'Source Sans 3',sans-serif;font-size:.8em;font-weight:700;color:var(--correct);margin-left:2px;}
.clk-tok{
  cursor:pointer;border-radius:5px;padding:1px 3px;margin:0 -1px;
  transition:background .15s,color .15s;-webkit-tap-highlight-color:transparent;
}
.clk-tok:hover{background:rgba(107,63,160,.1);}
.clk-tok.sel{background:var(--purple);color:#fff;}
.clk-done .clk-tok{cursor:default;}
.clk-done .clk-tok:hover{background:none;}
.clk-tok.hit{background:var(--correct)!important;color:#fff!important;}
.clk-tok.bad{background:var(--wrong)!important;color:#fff!important;text-decoration:line-through;}
.clk-tok.miss{outline:2px dashed var(--correct);outline-offset:1px;}
.q-instr{font-size:12px;color:var(--muted);line-height:1.4;padding:2px 0;}

/* ═══ ΝΕΟΙ ΤΥΠΟΙ: Αναδιάταξη · Ταξινόμηση · Μικρό σταυρόλεξο ═══ */
.ord-list{display:flex;flex-direction:column;gap:8px;}
.ord-tile{display:flex;align-items:stretch;background:#fff;border:2px solid rgba(107,63,160,.18);border-radius:9px;touch-action:none;position:relative;transition:border-color .2s,background .2s;}
.ord-tile.dragging{z-index:5;box-shadow:0 10px 24px rgba(26,22,16,.2);border-color:var(--purple);transition:none;}
.ord-tile .og{display:flex;align-items:center;justify-content:center;width:32px;flex-shrink:0;color:var(--purple-light);cursor:grab;background:rgba(107,63,160,.04);border-radius:7px 0 0 7px;}
.ord-tile .on{display:flex;align-items:center;justify-content:center;width:32px;font-size:1.3em;flex-shrink:0;font-family:'Literata',serif;font-weight:700;color:var(--purple);}
.ord-tile .ot{flex:1;padding:10px 8px 10px 2px;font-family:'Literata',serif;font-size:clamp(19.5px,2.35vw,24.5px);line-height:1.5;cursor:grab;}
.ord-tile .oa{display:flex;flex-direction:column;flex-shrink:0;border-left:1px solid rgba(107,63,160,.1);}
.ord-tile .oa button{flex:1;width:34px;border:none;background:none;color:var(--purple);cursor:pointer;font-size:13px;}
.ord-tile .oa button:disabled{opacity:.25;cursor:default;}
.ord-tile.fixed{background:#f6f2fb;border-style:dashed;}
.ord-tile.fixed .og,.ord-tile.fixed .ot,.ord-done .ord-tile .og,.ord-done .ord-tile .ot{cursor:default;}
.ord-tile.ok{border-color:var(--correct);background:#eef8f1;}
.ord-tile.ko{border-color:var(--wrong);background:#fdeeec;}
.ord-sol{margin-top:10px;background:rgba(45,142,78,.07);border-radius:8px;padding:10px 14px;font-family:'Literata',serif;font-size:clamp(18px,2.1vw,22px);line-height:1.55;}
.ord-sol b{font-family:'Source Sans 3',sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--correct);display:block;margin-bottom:4px;}
.ord-sol ol{margin:0;padding-left:22px;}

.sort-bank{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:10px;border:2px dashed rgba(107,63,160,.2);border-radius:10px;background:rgba(107,63,160,.03);}
.sort-bank:empty::after{content:'✓ Όλα τοποθετήθηκαν';color:var(--muted);font-size:13px;align-self:center;}
.sort-chip{padding:9px 15px;background:#fff;border:1.5px solid rgba(107,63,160,.3);border-radius:999px;font-size:clamp(16px,2vw,21px);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Source Sans 3',sans-serif;line-height:1.3;}
.sort-chip.sel{background:var(--purple);color:#fff;border-color:var(--purple);}
.sort-chip.ok{border-color:var(--correct);background:#eef8f1;color:var(--correct);font-weight:700;}
.sort-chip.ko{border-color:var(--wrong);background:#fdeeec;color:var(--wrong);}
.sort-chip .fix{font-size:.75em;opacity:.85;margin-left:4px;}
.sort-ghost{position:fixed;z-index:999;pointer-events:none;box-shadow:0 10px 24px rgba(26,22,16,.25);transform:translate(-50%,-50%) scale(1.05);}
.sort-bins{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
.sort-bins>.sort-bin:last-child:nth-child(odd){grid-column:1/-1;} /* 2 ανά σειρά· η μόνη της τελευταίας σειράς πιάνει όλο το πλάτος */
.sort-bin{border:2px solid rgba(107,63,160,.2);border-radius:10px;background:#fff;min-height:130px;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s,background .15s;}
.sort-bin.over{border-color:var(--purple);background:rgba(107,63,160,.06);}
.sort-bin h4{font-size:15px;letter-spacing:1px;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple-dark));margin:0;padding:10px 14px;border-radius:7px 7px 0 0;font-family:'Source Sans 3',sans-serif;}
.sort-bin .sb-items{display:flex;flex-wrap:wrap;gap:6px;padding:10px;flex:1;align-content:flex-start;}

.mcw-wrap{container-type:inline-size;}
.mcw-board{display:grid;margin:0 auto 10px;--mcwF:22;}
.mcw-cell{position:relative;aspect-ratio:1;border:1px solid #2a2440;margin:0 -1px -1px 0;background:#fff;}
.mcw-cell input{position:absolute;inset:0;width:100%;height:100%;border:none;background:transparent;text-align:center;font-weight:700;font-family:'Source Sans 3',sans-serif;text-transform:uppercase;color:var(--ink);padding:8% 0 0;font-size:16px;font-size:calc(var(--mcwF,1) * 1px);caret-color:transparent;outline:none;border-radius:0;}
.mcw-cell .n{position:absolute;top:1px;left:2px;font-size:9px;font-size:calc(var(--mcwF,30) * .42px);line-height:1;color:#4a4060;pointer-events:none;z-index:1;}
.mcw-cell.hl{background:#efe8f8;} .mcw-cell.cur{background:#d9c8f0;box-shadow:inset 0 0 0 2px var(--purple);z-index:1;}
.mcw-cell.ok{background:#e9f6ee;} .mcw-cell.ko{background:#fbe7e4;} .mcw-cell.ko input{color:var(--wrong);}
.mcw-cell.fixed input{color:var(--purple);}
.mcw-clues{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:clamp(13.5px,1.5vw,16px);line-height:1.4;}
.mcw-clues h5{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--purple-light);margin:4px 0;}
.mcw-clues div.c{padding:3px 6px;border-radius:6px;cursor:pointer;}
.mcw-clues div.c b{color:var(--purple);margin-right:4px;}
.mcw-clues div.c.on{background:#efe8f8;}
.mcw-warn{background:#fff7e0;border:1px solid var(--gold);color:#7a5a00;border-radius:8px;padding:6px 10px;font-size:13px;margin-bottom:8px;}
@media(max-width:640px){ .mcw-clues{grid-template-columns:1fr;} .sort-bins{gap:8px;} }
/* ═══ ΕΚΤΥΠΩΣΗ / PDF — παράθυρο ρυθμίσεων ═══ */
.btn-print-open{position:relative;z-index:2;margin:4px 0 46px;padding:10px 20px;border-radius:999px;border:1.5px solid rgba(107,63,160,.3);background:rgba(255,255,255,.85);color:var(--purple);font-weight:700;font-size:14px;font-family:'Source Sans 3',sans-serif;cursor:pointer;box-shadow:0 3px 12px rgba(26,22,16,.08);}
.btn-print-open:hover{border-color:var(--purple);background:#fff;}
.print-modal-overlay{position:fixed;inset:0;background:rgba(26,22,16,.5);display:flex;align-items:center;justify-content:center;z-index:2000;opacity:0;pointer-events:none;transition:opacity .3s;padding:10px;}
.print-modal-overlay.active{opacity:1;pointer-events:auto;}
.print-modal{background:#fff;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.2);max-width:520px;width:100%;max-height:90vh;max-height:90dvh;overflow-y:auto;text-align:left;font-family:'Source Sans 3',sans-serif;color:var(--ink);}
.pm-hdr{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #e6e1d8;position:sticky;top:0;background:#fff;z-index:2;}
.pm-hdr h2{font-family:'Literata',serif;font-size:1.1rem;font-weight:700;color:var(--navy);margin:0;}
.pm-close{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--muted);width:32px;height:32px;}
.pm-close:hover{color:var(--ink);}
.pm-section{padding:16px 22px;border-bottom:1px solid #e6e1d8;}
.pm-section h3{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--purple);margin-bottom:12px;}
.pm-lbl{display:block;font-size:.75rem;font-weight:700;color:#4a4238;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;}
.pm-input,.pm-textarea,.pm-select{width:100%;padding:9px 11px;border:1.5px solid #e0dbd2;border-radius:8px;font-family:inherit;font-size:.92rem;color:var(--ink);background:#fff;}
.pm-input:focus,.pm-textarea:focus,.pm-select:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(107,63,160,.1);}
.pm-textarea{min-height:56px;resize:vertical;}
.pm-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;}
.pm-toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;}
.pm-toggle-row>label:first-child{font-size:.9rem;font-weight:600;color:#4a4238;}
.pm-switch{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0;}
.pm-switch input{opacity:0;width:0;height:0;}
.pm-slider{position:absolute;cursor:pointer;inset:0;background:#ccc;transition:.3s;border-radius:26px;}
.pm-slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background:#fff;transition:.3s;border-radius:50%;}
.pm-switch input:checked+.pm-slider{background:var(--purple);}
.pm-switch input:checked+.pm-slider:before{transform:translateX(20px);}
.pm-decks{display:flex;flex-direction:column;gap:6px;}
.pm-deck{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1.5px solid #e6e1d8;border-radius:8px;cursor:pointer;font-size:.92rem;}
.pm-deck:has(input:checked){border-color:var(--purple);background:rgba(107,63,160,.05);}
.pm-deck input{width:18px;height:18px;accent-color:var(--purple);flex-shrink:0;}
.pm-deck span{flex:1;min-width:0;}
.pm-deck small{color:var(--muted);white-space:nowrap;}
.pm-links{display:flex;gap:14px;margin-top:8px;font-size:.85rem;}
.pm-links a{color:var(--purple);cursor:pointer;text-decoration:underline;}
.pm-sum{margin-top:8px;font-size:.85rem;color:var(--muted);}
.pm-footer{padding:14px 22px;display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:0;background:#fff;border-top:1px solid #e6e1d8;}
.pm-btn{flex:1 1 auto;padding:11px 16px;border:none;border-radius:8px;font-size:.92rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
.pm-btn-primary{background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff;}
.pm-btn-primary:disabled{opacity:.5;cursor:default;}
.pm-btn-secondary{background:#ece8e1;color:var(--ink);}
@media(max-width:600px){.pm-section{padding:14px 16px;}.pm-hdr,.pm-footer{padding:14px 16px;}.pm-grid2{grid-template-columns:1fr;}}
</style>

<!-- ══ ΡΥΘΜΙΣΕΙΣ ΕΚΤΥΠΩΣΗΣ ══ -->
<div class="print-modal-overlay" id="printModalOverlay">
  <div class="print-modal">
    <div class="pm-hdr"><h2>🖨️ Ρυθμίσεις εκτύπωσης</h2><button class="pm-close" id="pmClose" aria-label="Κλείσιμο">✕</button></div>

    <div class="pm-section">
      <h3>📚 Ενότητες</h3>
      <div class="pm-decks" id="pmDecks"></div>
      <div class="pm-links"><a id="pmAll">Όλες</a><a id="pmNone">Καμία</a></div>

      <div class="pm-toggle-row"><label for="pmKey">Λύσεις σε ξεχωριστή σελίδα στο τέλος</label><label class="pm-switch"><input type="checkbox" id="pmKey"><span class="pm-slider"></span></label></div>
    </div>

    <div class="pm-section">
      <h3>📝 Κείμενο άσκησης</h3>
      <div style="margin-bottom:10px"><label class="pm-lbl">Τίτλος</label><input type="text" class="pm-input" id="pmTitle" value="ΑΣΚΗΣΗ"></div>
      <div style="margin-bottom:10px"><label class="pm-lbl">Εκφώνηση / Οδηγία</label><textarea class="pm-textarea" id="pmInstructions">Να απαντήσετε στις παρακάτω ερωτήσεις.</textarea></div>
      <div><label class="pm-lbl">Βαθμολογία (προαιρετικά)</label><input type="text" class="pm-input" id="pmScore" placeholder="π.χ. Μονάδες: 25"></div>
    </div>

    <div class="pm-section">

<script>
/* ═════════════════════════════════════════════════════════════════
   ΠΡΟΤΥΠΟ «Κουίζ ενοτήτων» — ΛΕΒΙΑΘΑΝ
   Τα δεδομένα βρίσκονται ΜΟΝΟ ανάμεσα στους δείκτες QUIZ_DATA.
   Ο Δημιουργός του ΛΕΒΙΑΘΑΝ (/creator) τα γράφει και τα ξαναδιαβάζει
   από εκεί — μην αλλάξετε τους δείκτες.
   ═════════════════════════════════════════════════════════════════ */
const QUIZ=/*QUIZ_DATA_START*/{"v":1,"template":"quiz-deck","title":"Κουίζ — Παράδειγμα","eyebrow":"Κουίζ αυτοαξιολόγησης","heading":"Παράδειγμα *προτύπου*","subtitle":"Διάλεξε ενότητα και ξεκίνα. Κάθε ερώτηση εμφανίζεται ξεχωριστά.","credits":"ΛΕΒΙΑΘΑΝ","shuffleOpts":false,"shuffleQs":false,"decks":[{"label":"Ενότητα 1","ktitle":"Δείγμα ερωτήσεων","author":"","sub":"Πέντε τύποι ερωτήσεων","qs":[{"t":"mcq","q":"Ποια έγκλιση εκφράζει εντολή;","opts":["Οριστική","Προστακτική","Υποτακτική"],"ans":1,"ref":"Εγκλίσεις","fbC":"","fbW":""},{"t":"tf","q":"Η παθητική σύνταξη αποσιωπά συχνά τον δράστη.","labels":["Σωστό","Λάθος"],"ans":0,"ref":"","fbC":"","fbW":""},{"t":"drag","q":"Αντιστοίχισε.","tgts":["Μεταφορά","Παρομοίωση"],"items":["«μύγα ενοχλητική»","«σαν μύγα»"],"ans":[0,1],"ref":"","fbC":"","fbW":""},{"t":"gap","q":"Συμπλήρωσε το κενό.","text":"Η ονοματοποίηση κάνει τον λόγο πιο [πυκνό|δύσκολο].","mode":"type","distractors":[],"strict":false,"ref":"","fbC":"","fbW":""},{"t":"click","q":"Επίλεξε τα ρήματα.","text":"Ο Θανάσης [έπαιζε] κάθε βράδυ και [ξεχνούσε] τον χρόνο.","ref":"","fbC":"","fbW":""}]}]}/*QUIZ_DATA_END*/;

/* © ΛΕΒΙΑΘΑΝ · χρονολογία δημιουργίας · όνομα δημιουργού (αν έχει δηλωθεί) */
const LEV_YEAR=QUIZ.year||((String(QUIZ.credits||'').match(/\b(19|20)\d{2}\b/)||[])[0])||new Date().getFullYear();
const LEV_AUTHOR=String(QUIZ.credits||'').replace(/[\s,·–—-]*\b(19|20)\d{2}\s*$/,'').trim().replace(/^(ΛΕΒΙΑΘΑΝ|leviathan)$/i,'');
const LEV_COPY='ΛΕΒΙΑΘΑΝ '+LEV_YEAR+(LEV_AUTHOR?' · '+LEV_AUTHOR:'');

const LABS=['Α','Β','Γ','Δ','Ε','ΣΤ','Ζ','Η'];
const TYPE_LBL={mcq:'● Πολλαπλής επιλογής',tf:'◐ Σωστό / Λάθος',drag:'⇄ Αντιστοίχιση',gap:'▭ Συμπλήρωση κενών',click:'☝ Επιλογή λέξεων',order:'⇅ Αναδιάταξη',sort:'▤ Ταξινόμηση',cw:'✎ Σταυρόλεξο'};
const DECKS=(QUIZ.decks||[]).filter(d=>d&&Array.isArray(d.qs)&&d.qs.length);

/* ── Βοηθητικά ── */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// Ελαφριά μορφοποίηση: **έντονα**, *πλάγια*, αλλαγή γραμμής
function fmt(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\n/g,'<br>');}
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function dkCls(i){return 'dk'+((i%3)+1);}
function norm(s,strict){
  let x=String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); x=x.replace(/[.,;:!·…]+$/,'')||x;
  if(!strict) x=x.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ς/g,'σ');
  return x;
}
function splitMarked(text){ // «α [β] γ» → ['α ', 'β', ' γ'] — μονοί δείκτες = σημειωμένα
  return String(text||'').split(/\[([^\]]+)\]/);
}

/* ═════════════════════════════════════
   ΑΡΧΙΚΗ ΟΘΟΝΗ
   ═════════════════════════════════════ */
document.title=QUIZ.title||'Κουίζ';
document.getElementById('sEyebrow').textContent=QUIZ.eyebrow||'';
document.getElementById('sTitle').innerHTML=fmt(QUIZ.heading||QUIZ.title||'');
document.getElementById('sSub').innerHTML=fmt(QUIZ.subtitle||'');
document.getElementById('sCredits').textContent=LEV_COPY;
(function buildDecks(){
  const wrap=document.getElementById('deckPick');
  DECKS.forEach((d,i)=>{
    const c=document.createElement('div');
    c.className='deck-card';
    c.id='pick'+i;
    c.onclick=()=>{ pickDeck(i); startQuiz(); }; // πάτημα κάρτας = άμεση έναρξη
    c.innerHTML=
      `<div class="dc-num">${String(i+1).padStart(2,'0')}</div>`+
      (d.label?`<div class="dc-title">${esc(d.label)}</div>`:'')+
      (d.ktitle?`<div class="dc-ktitle">${fmt(d.ktitle)}</div>`:'')+
      (d.author?`<div class="dc-author">${esc(d.author)}</div>`:'')+
      (d.sub?`<div class="dc-sub">${fmt(d.sub)}</div>`:'')+
      `<div class="dc-count">${d.qs.length} ερωτήσεις</div>`;
    wrap.appendChild(c);
  });
})();

/* ═════════════════════════════════════
   STATE
   ═════════════════════════════════════ */
let curDk=DECKS.length?0:null, curQi=0, score={c:0,w:0}, wrongQs=[], retryMode=false, runList=[];

/* ═════════════════════════════════════
   ΛΕΒΙΑΘΑΝ — ζωντανά αποτελέσματα
   Ενεργό μόνο όταν ο σύνδεσμος έχει #session=XXXX
   ═════════════════════════════════════ */
const LEV_SESSION=(location.hash.match(/session=(\d{4})/)||[])[1]||null;
const LEV_API=(/vercel\.app$/.test(location.hostname)?location.origin:'https://leviathan-olive.vercel.app')+'/api/quiz-results';
let levName=null, levChoice=null;
function levAskName(){
  if(!LEV_SESSION) return;
  let n=null; try{n=localStorage.getItem('lev_name_'+LEV_SESSION);}catch(e){}
  while(!n||!n.trim()){ n=prompt('Γράψε το όνομά σου (θα το δει ο/η καθηγητής/τρια):'); if(n===null) n=''; }
  levName=n.trim().slice(0,40);
  try{localStorage.setItem('lev_name_'+LEV_SESSION,levName);}catch(e){}
}
function levSend(body){
  if(!LEV_SESSION||!levName) return;
  try{ fetch(LEV_API,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({code:LEV_SESSION,student:levName},body)),keepalive:true}).catch(()=>{}); }catch(e){}
}

/* ═════════════════════════════════════
   NAVIGATION
   ═════════════════════════════════════ */
function pickDeck(n){ curDk=n; }
function goStart(){
  document.getElementById('startScreen').style.display='flex';
  document.getElementById('quizScreen').classList.remove('active');
  document.getElementById('resultsScreen').classList.remove('active');
}
function enterQuiz(label){
  document.getElementById('startScreen').style.display='none';
  document.getElementById('resultsScreen').classList.remove('active');
  document.getElementById('quizScreen').classList.add('active');
  const lbl=document.getElementById('qdLabel');
  lbl.textContent=label;
  lbl.className='qt-deck-lbl '+dkCls(curDk)+'-lbl';
  updateScoreBar();
  renderCard();
}
function startQuiz(){
  if(LEV_SESSION&&!levName) levAskName();
  curQi=0; score={c:0,w:0}; wrongQs=[]; retryMode=false;
  const qs=DECKS[curDk].qs;
  runList=QUIZ.shuffleQs?shuffle(qs):[...qs];
  enterQuiz(DECKS[curDk].label||('Ενότητα '+(curDk+1)));
}
function retryWrong(){
  retryMode=true;
  runList=[...wrongQs];
  curQi=0; score={c:0,w:0}; wrongQs=[];
  enterQuiz((DECKS[curDk].label||('Ενότητα '+(curDk+1)))+' — Επανάληψη λαθών');
}
function showResults(){
  document.getElementById('quizScreen').classList.remove('active');
  document.getElementById('resultsScreen').classList.add('active');
  const s=score.c, total=runList.length;
  document.getElementById('resScore').innerHTML=`${s}<span class="res-denom">/${total}</span>`;
  document.getElementById('resMsg').textContent=
    s>=total?'Εξαιρετικά! Όλες σωστές!':
    s>=Math.ceil(total*.8)?'Πολύ καλά! Ξαναδές τα σημεία που δυσκολεύτηκες.':
    s>=Math.ceil(total*.5)?'Καλή προσπάθεια. Μελέτησε ξανά τη θεωρία και δοκίμασε πάλι.':
         'Χρειάζεται λίγη παραπάνω μελέτη. Ξαναδιάβασε και δοκίμασε ξανά!';
  if(!retryMode) levSend({ final:true, score:s, totalQ:total });
  document.getElementById('btnRetryWrong').style.display=(wrongQs.length>0)?'block':'none';
}
function nextCard(){
  curQi++;
  if(curQi>=runList.length) showResults(); else renderCard();
}

/* ═════════════════════════════════════
   SCORE BAR & RENDER CARD
   ═════════════════════════════════════ */
function updateScoreBar(){
  const total=runList.length;
  document.getElementById('qsc').textContent=score.c;
  document.getElementById('qsw').textContent=score.w;
  document.getElementById('qsn').textContent=`${curQi+1} / ${total}`;
  document.getElementById('progBar').style.width=((curQi/total)*100)+'%';
  document.getElementById('qbInfo').textContent='© '+LEV_COPY;
}

function renderCard(){
  updateScoreBar();
  document.getElementById('btnNext').classList.remove('show');
  const q=runList[curQi];
  const stage=document.getElementById('cardStage');
  stage.innerHTML='';
  const card=document.createElement('div');
  card.className='big-card '+dkCls(curDk);
  const left=document.createElement('div');
  left.className='bc-left'; left.id='bcLeft';
  left.innerHTML=`
    <div class="bc-qnum">Ερώτηση ${curQi+1} / ${runList.length}</div>
    <div class="bc-qtext">${fmt(q.q)}</div>
    <div class="bc-qtype">${TYPE_LBL[q.t]||''}</div>
    <div class="bc-result" id="bcResult"></div>`;
  const right=document.createElement('div');
  right.className='bc-right'; right.id='bcRight';
  ({mcq:buildMCQ,tf:buildTF,drag:buildDrag,gap:buildGap,click:buildClick,order:buildOrder,sort:buildSort,cw:buildCw}[q.t]||buildMCQ)(q,right);
  card.appendChild(left); card.appendChild(right);
  stage.appendChild(card);
  fitCard();
}

/* ═════════════════════════════════════
   ΑΥΤΟΜΑΤΗ ΠΡΟΣΑΡΜΟΓΗ ΓΡΑΜΜΑΤΩΝ — όλο το υλικό μέσα στο πλαίσιο
   • Ερώτηση: μικραίνει το μέγεθος γραμμάτων μέχρι να χωρέσει (όριο 13px)
   • Απαντήσεις/σχόλιο: σμίκρυνση όλης της στήλης (zoom) μέχρι να χωρέσει (όριο 60%)
   • Αν ούτε τότε χωρά (πολύ μεγάλο κείμενο) → κύλιση μέσα στη στήλη
   ═════════════════════════════════════ */
const NO_ZOOM=matchMedia('(max-width:640px)').matches || (/^((?!chrome|chromium|crios|fxios|android|edg).)*safari/i.test(navigator.userAgent)) || /iPad|iPhone|iPod/.test(navigator.userAgent);
function fitCard(){
  const left=document.getElementById('bcLeft'), right=document.getElementById('bcRight');
  if(!left||!right) return;
  const qt=left.querySelector('.bc-qtext');
  if(qt){
    // Περίσσευμα = πόσο ξεπερνά το κάτω άκρο του περιεχομένου το εσωτερικό πλαίσιο
    // (μετριούνται μόνο τα στοιχεία — όχι ο διακοσμητικός κύκλος ::after)
    const leftOver=()=>{ const r=left.getBoundingClientRect(), pb=parseFloat(getComputedStyle(left).paddingBottom)||0;
      let bottom=0; for(const c of left.children){ const cr=c.getBoundingClientRect(); if(cr.height) bottom=Math.max(bottom,cr.bottom); }
      return bottom-(r.bottom-pb); };
    qt.style.fontSize='';
    let fs=parseFloat(getComputedStyle(qt).fontSize)||18, guard=0;
    while(leftOver()>1 && fs>13 && guard++<40){ fs=Math.max(13,fs*0.93); qt.style.fontSize=fs+'px'; }
  }
  right.style.zoom='';
  // Στο κινητό και στο Safari (iPhone/iPad/Mac) όχι CSS zoom — χαλά τη διάταξη
  // (π.χ. στην αντιστοίχιση οι κάρτες έπεφταν πάνω στις προτάσεις)· εκεί η στήλη απλώς κυλά.
  if(NO_ZOOM) return;
  let z=1, g2=0;
  while(right.scrollHeight>right.clientHeight+1 && z>0.6 && g2++<20){ z=Math.max(0.6,z-0.05); right.style.zoom=z; }
}
let _fitT=null;
window.addEventListener('resize',()=>{ clearTimeout(_fitT); _fitT=setTimeout(fitCard,120); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitCard);

/* ═════════════════════════════════════
   MCQ  &  ΣΩΣΤΟ / ΛΑΘΟΣ
   ═════════════════════════════════════ */
function optButtons(q,opts,ans,container,withLetters){
  const order=(QUIZ.shuffleOpts&&q.t==='mcq')?shuffle(opts.map((_,i)=>i)):opts.map((_,i)=>i);
  const btns=[];
  order.forEach((oi,pos)=>{
    const btn=document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML=withLetters?`<span class="opt-lbl">${LABS[pos]}.</span><span>${fmt(opts[oi])}</span>`:`<span>${fmt(opts[oi])}</span>`;
    btn.dataset.oi=oi;
    btn.addEventListener('click',()=>{
      const ok=oi===ans;
      levChoice=withLetters?LABS[pos]:opts[oi];
      btns.forEach(b=>b.classList.add('disabled'));
      btn.classList.add('chosen',ok?'correct':'wrong');
      if(!ok) btns.forEach(b=>{if(+b.dataset.oi===ans) b.classList.add('reveal');});
      finishQuestion(ok,q,container, ok?'':'Σωστή απάντηση: '+opts[ans]);
    });
    btns.push(btn);
  });
  return btns;
}
function buildMCQ(q,container){
  optButtons(q,q.opts||[],q.ans,container,true).forEach(b=>container.appendChild(b));
  addFB(container);
}
function buildTF(q,container){
  const labels=(q.labels&&q.labels.length===2)?q.labels:['Σωστό','Λάθος'];
  const row=document.createElement('div'); row.className='tf-row';
  optButtons(q,labels,q.ans,container,false).forEach(b=>row.appendChild(b));
  container.appendChild(row);
  addFB(container);
}

/* ═════════════════════════════════════
   DRAG DROP (αντιστοίχιση)
   ═════════════════════════════════════ */
// Ανακάτεμα χωρίς «σταθερά σημεία»: κανένα στοιχείο της τράπεζας δεν μένει
// στη θέση της σωστής του αντιστοίχισης (ans[θέση] = στοιχείο της θέσης).
function derange(q){
  const n=q.items.length, idx=q.items.map((_,i)=>i);
  if(n<2) return idx;
  for(let t=0;t<80;t++){ const o=shuffle(idx); if(o.every((v,p)=>v!==q.ans[p])) return o; }
  return idx.map((_,p)=>q.ans[(p+1)%n]); // εφεδρικά: κυκλική μετατόπιση
}
function buildDrag(q,container){
  const order=derange(q);
  const slotVal=new Array(q.tgts.length).fill(null);
  const chips={}, zones=[];
  let tapSel=null;

  const instr=document.createElement('div');
  instr.className='drag-instr';
  instr.innerHTML='<strong>Υπολογιστής:</strong> σύρε · <strong>Κινητό:</strong> πάτα chip → πάτα θέση';
  container.appendChild(instr);

  const bank=document.createElement('div');
  bank.className='drag-bank';
  container.appendChild(bank);

  order.forEach(orig=>{
    const chip=document.createElement('div');
    chip.className='drag-chip';
    chip.textContent=q.items[orig];
    chip.dataset.orig=orig;
    chip.draggable=true;
    chip.addEventListener('dragstart',e=>{
      e.dataTransfer.setData('text/plain',String(orig));
      setTimeout(()=>chip.classList.add('dragging'),0);
      clearTapSel();
    });
    chip.addEventListener('dragend',()=>chip.classList.remove('dragging'));
    chip.addEventListener('click',e=>{
      e.stopPropagation();
      if(tapSel===orig){clearTapSel();}
      else{clearTapSel();tapSel=orig;chip.classList.add('sel-tap');}
    });
    bank.appendChild(chip);
    chips[orig]=chip;
  });

  const slotsWrap=document.createElement('div');
  slotsWrap.className='drag-slots';
  container.appendChild(slotsWrap);

  q.tgts.forEach((tgt,ti)=>{
    const row=document.createElement('div');row.className='slot-row';
    const lbl=document.createElement('div');lbl.className='slot-lbl';lbl.textContent=tgt;
    const zone=document.createElement('div');zone.className='slot-zone';
    zone.textContent='Τοποθέτησε εδώ';
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag-over');});
    zone.addEventListener('dragleave',()=>zone.classList.remove('drag-over'));
    zone.addEventListener('drop',e=>{
      e.preventDefault();zone.classList.remove('drag-over');
      const orig=parseInt(e.dataTransfer.getData('text/plain'));
      if(isNaN(orig)) return;
      placeInSlot(orig,ti,zone,slotVal,chips,zones);
      sub.disabled=(countPlaced()<q.tgts.length);
    });
    zone.addEventListener('click',e=>{
      e.stopPropagation();
      if(sub.style.display==='none') return;
      if(tapSel!==null){
        placeInSlot(tapSel,ti,zone,slotVal,chips,zones);
        clearTapSel();
        sub.disabled=(countPlaced()<q.tgts.length);
      } else if(slotVal[ti]!==null){
        chips[slotVal[ti]].style.display='';
        slotVal[ti]=null;
        zone.textContent='Τοποθέτησε εδώ';
        zone.classList.remove('filled');
        sub.disabled=true;
      }
    });
    row.appendChild(lbl);row.appendChild(zone);
    slotsWrap.appendChild(row);
    zones.push(zone);
  });

  addFB(container);
  const sub=document.createElement('button');
  sub.className='btn-submit';sub.textContent='Υποβολή';sub.disabled=true;
  container.appendChild(sub);

  sub.addEventListener('click',()=>{
    let allOk=true;
    zones.forEach((z,ti)=>{
      // Σωστό αν το στοιχείο ανήκει σε θέση με την ΙΔΙΑ ετικέτα (επιτρέπει επαναλαμβανόμενες κατηγορίες)
      const it=slotVal[ti];
      // ans[θέση] = στοιχείο που ανήκει σε αυτή τη θέση (όπως στο αρχικό κουίζ)
      const belongs=it===null?undefined:q.tgts[q.ans.indexOf(it)];
      // …ή αν το στοιχείο έχει το ΙΔΙΟ κείμενο με το σωστό (επαναλαμβανόμενες απαντήσεις, π.χ. «Επιστημική» ×2)
      const sameItem=it!==null && norm(q.items[it],true)===norm(q.items[q.ans[ti]],true);
      if(it!==null && (sameItem || (belongs!==undefined && norm(belongs,true)===norm(q.tgts[ti],true)))) z.classList.add('ok-slot');
      else{z.classList.add('ko-slot');allOk=false;}
    });
    sub.style.display='none'; bank.style.display='none'; instr.style.display='none';
    const fix=allOk?'':q.tgts.map((t,ti)=>t+' → '+q.items[q.ans[ti]]).join(' · ');
    finishQuestion(allOk,q,container,fix);
  });

  function clearTapSel(){
    if(tapSel!==null && chips[tapSel]) chips[tapSel].classList.remove('sel-tap');
    tapSel=null;
  }
  function countPlaced(){return slotVal.filter(v=>v!==null).length;}
}
function placeInSlot(orig,ti,zone,slotVal,chips,zones){
  const prev=slotVal.indexOf(orig);            // το chip ήταν ήδη σε άλλη θέση;
  if(prev>-1 && prev!==ti){slotVal[prev]=null;zones[prev].textContent='Τοποθέτησε εδώ';zones[prev].classList.remove('filled');}
  const old=slotVal[ti];
  if(old!==null && old!==orig) chips[old].style.display='';
  slotVal[ti]=orig;
  zone.textContent=chips[orig].textContent;
  zone.classList.add('filled');
  chips[orig].style.display='none';
  chips[orig].classList.remove('sel-tap');
}

/* ═════════════════════════════════════
   ΣΥΜΠΛΗΡΩΣΗ ΚΕΝΩΝ  — κείμενο με [απάντηση] ή [απ1|απ2]
   mode:'type' (πληκτρολόγηση) ή 'select' (λίστα με τις απαντήσεις + παραπλανητικές)
   ═════════════════════════════════════ */
function buildGap(q,container){
  const parts=splitMarked(q.text);
  const answers=[]; for(let i=1;i<parts.length;i+=2) answers.push(parts[i].split('|').map(s=>s.trim()).filter(Boolean));
  const useSelect=q.mode==='select';
  const pool=useSelect?shuffle([...new Set(answers.map(a=>a[0]).concat((q.distractors||[]).filter(Boolean)))]):[];
  const instr=document.createElement('div'); instr.className='q-instr';
  instr.textContent=useSelect?'Διάλεξε τη σωστή λέξη σε κάθε κενό.':'Γράψε τη σωστή λέξη σε κάθε κενό.';
  container.appendChild(instr);
  const box=document.createElement('div'); box.className='gap-text';
  const inputs=[];
  parts.forEach((p,i)=>{
    if(i%2===0){ const s=document.createElement('span'); s.innerHTML=fmt(p); box.appendChild(s); return; }
    let el;
    if(useSelect){
      el=document.createElement('select');
      el.innerHTML='<option value="">— επίλεξε —</option>'+pool.map(w=>`<option>${esc(w)}</option>`).join('');
    } else {
      el=document.createElement('input'); el.type='text'; el.autocomplete='off'; el.spellcheck=false;
      el.setAttribute('autocapitalize','off');
      el.size=Math.max(6,Math.min(22,answers[(i-1)/2][0].length+2));
    }
    el.className='gap-in';
    el.addEventListener('input',check); el.addEventListener('change',check);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!sub.disabled) sub.click();});
    inputs.push(el); box.appendChild(el);
  });
  container.appendChild(box);
  addFB(container);
  const sub=document.createElement('button');
  sub.className='btn-submit';sub.textContent='Υποβολή';sub.disabled=true;
  container.appendChild(sub);
  function check(){sub.disabled=inputs.some(x=>!x.value.trim());}
  sub.addEventListener('click',()=>{
    let allOk=true;
    inputs.forEach((el,k)=>{
      const ok=answers[k].some(a=>norm(a,q.strict)===norm(el.value,q.strict));
      el.disabled=true; el.classList.add(ok?'ok':'ko');
      if(!ok){allOk=false; const f=document.createElement('span'); f.className='gap-fix'; f.textContent=answers[k][0]; el.after(f);}
    });
    sub.style.display='none';
    finishQuestion(allOk,q,container,'');
  });
}

/* ═════════════════════════════════════
   ΕΠΙΛΟΓΗ ΛΕΞΕΩΝ (click) — κείμενο με [σωστές] λέξεις/φράσεις
   ═════════════════════════════════════ */
function buildClick(q,container){
  const parts=splitMarked(q.text);
  const instr=document.createElement('div'); instr.className='q-instr';
  instr.textContent='Πάτησε πάνω στις λέξεις που ζητούνται· ξαναπάτα για να αναιρέσεις.';
  container.appendChild(instr);
  const box=document.createElement('div'); box.className='clk-text';
  const toks=[];
  const mk=(text,good)=>{
    const s=document.createElement('span'); s.className='clk-tok'; s.innerHTML=fmt(text); s.dataset.good=good?'1':'';
    s.addEventListener('click',()=>{ if(box.classList.contains('clk-done')) return; s.classList.toggle('sel'); sub.disabled=!toks.some(t=>t.classList.contains('sel')); });
    toks.push(s); return s;
  };
  parts.forEach((p,i)=>{
    if(i%2===1){ box.appendChild(mk(p,true)); return; }
    // Μη σημειωμένο κείμενο: κάθε λέξη επιλέξιμη, η στίξη μένει εκτός
    p.split(/(\s+)/).forEach(w=>{
      if(!w) return;
      const m=w.match(/^([«"'(\[“‘—–-]*)(.*?)([.,;:!?·»"')\]”’…—–-]*)$/);
      if(!m||!/[\p{L}\p{N}]/u.test(m[2])){ box.appendChild(document.createTextNode(w)); return; }
      if(m[1]) box.appendChild(document.createTextNode(m[1]));
      box.appendChild(mk(m[2],false));
      if(m[3]) box.appendChild(document.createTextNode(m[3]));
    });
  });
  container.appendChild(box);
  addFB(container);
  const sub=document.createElement('button');
  sub.className='btn-submit';sub.textContent='Υποβολή';sub.disabled=true;
  container.appendChild(sub);
  sub.addEventListener('click',()=>{
    let allOk=true;
    toks.forEach(t=>{
      const sel=t.classList.contains('sel'), good=!!t.dataset.good;
      t.classList.remove('sel');
      if(sel&&good) t.classList.add('hit');
      else if(sel&&!good){t.classList.add('bad');allOk=false;}
      else if(!sel&&good){t.classList.add('miss');allOk=false;}
    });
    box.classList.add('clk-done'); sub.style.display='none';
    finishQuestion(allOk,q,container,allOk?'':'Με διακεκομμένο πλαίσιο όσες έπρεπε να επιλεγούν.');
  });
}

/* ═════════════════════════════════════
   ΑΝΑΔΙΑΤΑΞΗ (order) — περίοδοι με τη σωστή σειρά στο q.lines
   ═════════════════════════════════════ */
function buildOrder(q,container){
  const lines=(q.lines||[]).map(s=>String(s||'').trim()).filter(Boolean), n=lines.length;
  const instr=document.createElement('div'); instr.className='q-instr';
  instr.textContent='Σύρε τις περιόδους (ή πάτα τα βελάκια) για να τις βάλεις στη σωστή σειρά.'+(q.fixFirst?' Η πρώτη είναι ήδη στη θέση της.':'');
  container.appendChild(instr);
  const idx=[...Array(n).keys()], head=q.fixFirst?[0]:[], rest=q.fixFirst?idx.slice(1):idx;
  let sh=shuffle(rest), g=0; while(rest.length>1&&sh.every((v,i)=>v===rest[i])&&g++<20) sh=shuffle(rest);
  let order=head.concat(sh), done=false;
  const list=document.createElement('div'); list.className='ord-list'; container.appendChild(list);
  const minIdx=q.fixFirst?1:0;
  function draw(){
    list.innerHTML='';
    order.forEach((li,pos)=>{
      const fixed=q.fixFirst&&pos===0, t=document.createElement('div');
      t.className='ord-tile'+(fixed?' fixed':''); t.dataset.li=li;
      t.innerHTML=`<div class="og">${fixed?'📌':'⠿'}</div><div class="on">${pos+1}</div><div class="ot">${fmt(lines[li])}</div>`+
        (fixed||done?'':`<div class="oa"><button aria-label="Πάνω" ${pos<=minIdx?'disabled':''}>▲</button><button aria-label="Κάτω" ${pos===n-1?'disabled':''}>▼</button></div>`);
      if(!fixed&&!done){
        const [u,d]=t.querySelectorAll('.oa button');
        u.onclick=e=>{e.stopPropagation();swap(pos,pos-1);}; d.onclick=e=>{e.stopPropagation();swap(pos,pos+1);};
        drag(t);
      }
      list.appendChild(t);
    });
  }
  function swap(a,b){ if(b<minIdx||b>=n) return; [order[a],order[b]]=[order[b],order[a]]; draw(); }
  function drag(tile){
    let startY=0,downY=0,on=false,pid=null;
    tile.addEventListener('pointerdown',e=>{ if(e.target.closest('.oa')) return; pid=e.pointerId; downY=startY=e.clientY; on=false; tile.setPointerCapture(pid); });
    tile.addEventListener('pointermove',e=>{
      if(e.pointerId!==pid) return;
      if(!on){ if(Math.abs(e.clientY-downY)<6) return; on=true; tile.classList.add('dragging'); }
      e.preventDefault();
      const z=parseFloat(document.getElementById('bcRight').style.zoom)||1;
      const nx=tile.nextElementSibling, pv=tile.previousElementSibling;
      if(nx){const r=nx.getBoundingClientRect(); if(e.clientY>r.top+r.height/2){ list.insertBefore(nx,tile); startY+=r.height+8*z; }}
      if(pv&&[...list.children].indexOf(pv)>=minIdx){const r=pv.getBoundingClientRect(); if(e.clientY<r.top+r.height/2){ list.insertBefore(tile,pv); startY-=r.height+8*z; }}
      tile.style.transform=`translateY(${(e.clientY-startY)/z}px)`;
      const sc=document.getElementById('bcRight'), sr=sc.getBoundingClientRect();
      if(e.clientY<sr.top+36) sc.scrollTop-=10; else if(e.clientY>sr.bottom-36) sc.scrollTop+=10;
    });
    const end=e=>{ if(e.pointerId!==pid) return; pid=null; if(!on) return; on=false; tile.classList.remove('dragging'); tile.style.transform=''; order=[...list.children].map(t=>+t.dataset.li); draw(); };
    tile.addEventListener('pointerup',end); tile.addEventListener('pointercancel',end);
  }
  draw();
  addFB(container);
  const sub=document.createElement('button'); sub.className='btn-submit'; sub.textContent='Υποβολή'; container.appendChild(sub);
  sub.addEventListener('click',()=>{
    done=true; draw(); list.classList.add('ord-done');
    let ok=0; [...list.children].forEach((t,pos)=>{ const good=+t.dataset.li===pos; if(good) ok++; t.classList.add(good?'ok':'ko'); });
    const all=ok===n; sub.style.display='none'; levChoice=`${ok}/${n}`;
    if(!all){ const s=document.createElement('div'); s.className='ord-sol'; s.innerHTML='<b>Σωστή σειρά</b><ol>'+lines.map(l=>`<li>${fmt(l)}</li>`).join('')+'</ol>'; list.after(s); }
    finishQuestion(all,q,container,all?'':`${ok} από ${n} περιόδους στη σωστή θέση. Δες τη σωστή σειρά.`);
  });
}

/* ═════════════════════════════════════
   ΤΑΞΙΝΟΜΗΣΗ (sort) — q.cats:[{name, items:[...]}]
   Πάτημα στοιχείου → πάτημα κατηγορίας, ή σύρσιμο
   ═════════════════════════════════════ */
function buildSort(q,container){
  const cats=(q.cats||[]).map(c=>({name:String(c.name||'').trim(),items:(c.items||[]).map(s=>String(s||'').trim()).filter(Boolean)})).filter(c=>c.name&&c.items.length);
  const instr=document.createElement('div'); instr.className='q-instr';
  instr.textContent='Πάτα ένα στοιχείο και μετά την κατηγορία του (ή σύρε το). Πάτα ξανά ένα τοποθετημένο στοιχείο για να το επιστρέψεις.';
  container.appendChild(instr);
  const bank=document.createElement('div'); bank.className='sort-bank'; container.appendChild(bank);
  const binsWrap=document.createElement('div'); binsWrap.className='sort-bins'; container.appendChild(binsWrap);
  const bins=cats.map((c,ci)=>{ const b=document.createElement('div'); b.className='sort-bin'; b.dataset.ci=ci; b.innerHTML=`<h4>${esc(c.name)}</h4><div class="sb-items"></div>`; binsWrap.appendChild(b); return b; });
  let sel=null, locked=false;
  const all=[]; cats.forEach((c,ci)=>c.items.forEach(it=>all.push({it,ci})));
  const chips=shuffle(all).map(o=>{ const ch=document.createElement('div'); ch.className='sort-chip'; ch.textContent=o.it; ch.dataset.ci=o.ci; bank.appendChild(ch); return ch; });
  const update=()=>{ sub.disabled=bank.children.length>0; };
  const place=(ch,bin)=>{ (bin?bin.querySelector('.sb-items'):bank).appendChild(ch); ch.classList.remove('sel'); if(sel===ch) sel=null; update(); fitCard(); };
  chips.forEach(ch=>{
    let downX=0,downY=0,ghost=null,pid=null;
    ch.addEventListener('pointerdown',e=>{ if(locked) return; pid=e.pointerId; downX=e.clientX; downY=e.clientY; ch.setPointerCapture(pid); });
    ch.addEventListener('pointermove',e=>{
      if(e.pointerId!==pid||locked) return;
      if(!ghost){ if(Math.hypot(e.clientX-downX,e.clientY-downY)<7) return; ghost=ch.cloneNode(true); ghost.classList.add('sort-ghost'); ghost.classList.remove('sel'); document.body.appendChild(ghost); ch.style.opacity='.35'; }
      e.preventDefault(); ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
      const el=document.elementFromPoint(e.clientX,e.clientY), bin=el&&el.closest('.sort-bin');
      bins.forEach(b=>b.classList.toggle('over',b===bin));
    });
    const end=e=>{
      if(e.pointerId!==pid) return; pid=null;
      if(ghost){ const el=document.elementFromPoint(e.clientX,e.clientY); ghost.remove(); ghost=null; ch.style.opacity=''; bins.forEach(b=>b.classList.remove('over'));
        const bin=el&&el.closest('.sort-bin'); if(bin) place(ch,bin); else if(el&&el.closest('.sort-bank')) place(ch,null); return; }
      if(locked) return;
      // απλό πάτημα
      if(ch.parentElement!==bank){ place(ch,null); return; }
      if(sel===ch){ ch.classList.remove('sel'); sel=null; return; }
      if(sel) sel.classList.remove('sel'); sel=ch; ch.classList.add('sel');
    };
    ch.addEventListener('pointerup',end); ch.addEventListener('pointercancel',e=>{ if(ghost){ghost.remove();ghost=null;ch.style.opacity='';} pid=null; });
  });
  bins.forEach(b=>b.addEventListener('click',e=>{ if(locked||!sel||e.target.closest('.sort-chip')) return; place(sel,b); }));
  addFB(container);
  const sub=document.createElement('button'); sub.className='btn-submit'; sub.textContent='Υποβολή'; sub.disabled=true; container.appendChild(sub);
  sub.addEventListener('click',()=>{
    locked=true; let bad=0;
    chips.forEach(ch=>{ const bin=ch.closest('.sort-bin'); const good=bin&&bin.dataset.ci===ch.dataset.ci; ch.classList.add(good?'ok':'ko');
      if(!good){ bad++; const f=document.createElement('span'); f.className='fix'; f.textContent='→ '+cats[+ch.dataset.ci].name; ch.appendChild(f); } });
    sub.style.display='none'; levChoice=`${chips.length-bad}/${chips.length}`;
    finishQuestion(bad===0,q,container,bad?`Λάθος θέση: ${bad} από ${chips.length}. Δίπλα σε καθένα φαίνεται η σωστή κατηγορία.`:'');
  });
}

/* ═════════════════════════════════════
   ΜΙΚΡΟ ΣΤΑΥΡΟΛΕΞΟ (cw) — q.words:[{w,c}], q.seed
   ═════════════════════════════════════ */
function cwNorm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-ZΑ-Ω0-9]/g,'');}
function cwEnum(s){return String(s||'').split(/[\s\-–]+/).map(cwNorm).filter(Boolean).map(x=>x.length).join(',');}
function cwRng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function cwLayout(words,seed){
  const K=(r,c)=>r+','+c, DIR={A:[0,1],D:[1,0]};
  const seen=new Set(), items=[];
  (words||[]).forEach(x=>{const a=cwNorm(x&&x.w); if(a.length<2||seen.has(a)) return; seen.add(a); items.push({a,w:x.w,clue:x.c||'',en:cwEnum(x.w)});});
  function attempt(order,rnd){
    const grid=new Map(), placed=[], later=[];
    const put=(it,r,c,d)=>{const[dr,dc]=DIR[d];for(let k=0;k<it.a.length;k++){const key=K(r+dr*k,c+dc*k);const cl=grid.get(key)||{ch:it.a[k],dirs:{}};cl.dirs[d]=1;grid.set(key,cl);}placed.push(Object.assign({},it,{r,c,dir:d}));};
    const fits=(a,r,c,d)=>{const[dr,dc]=DIR[d];let x=0;if(grid.has(K(r-dr,c-dc))||grid.has(K(r+dr*a.length,c+dc*a.length)))return -1;
      for(let k=0;k<a.length;k++){const rr=r+dr*k,cc=c+dc*k,cl=grid.get(K(rr,cc));
        if(cl){if(cl.ch!==a[k]||cl.dirs[d])return -1;x++;}else{const n1=d==='A'?K(rr-1,cc):K(rr,cc-1),n2=d==='A'?K(rr+1,cc):K(rr,cc+1);if(grid.has(n1)||grid.has(n2))return -1;}}return x;};
    const bb=()=>{let a=1e9,b=-1e9,c=1e9,d=-1e9;grid.forEach((_,k)=>{const[r,cc]=k.split(',').map(Number);a=Math.min(a,r);b=Math.max(b,r);c=Math.min(c,cc);d=Math.max(d,cc);});return{r0:a,r1:b,c0:c,c1:d};};
    const tryPut=it=>{let best=null;const B=bb();grid.forEach((cl,key)=>{const[r,c]=key.split(',').map(Number);
      for(let j=0;j<it.a.length;j++){if(it.a[j]!==cl.ch)continue;for(const d of['A','D']){if(cl.dirs[d])continue;const[dr,dc]=DIR[d],r0=r-dr*j,c0=c-dc*j,x=fits(it.a,r0,c0,d);if(x<1)continue;
        const r1=r0+dr*(it.a.length-1),c1=c0+dc*(it.a.length-1),h=Math.max(B.r1,r1)-Math.min(B.r0,r0)+1,w=Math.max(B.c1,c1)-Math.min(B.c0,c0)+1;
        const s=x*12-h*w*.15-Math.abs(h-w)*.6+rnd()*2;if(!best||s>best.s)best={s,r0,c0,d};}}});if(best){put(it,best.r0,best.c0,best.d);return true;}return false;};
    order.forEach((it,i)=>{if(i===0)put(it,0,0,rnd()<.5?'A':'D');else if(!tryPut(it))later.push(it);});
    const unplaced=later.filter(it=>!tryPut(it)), B=bb();
    return{placed:placed.map(p=>Object.assign(p,{r:p.r-B.r0,c:p.c-B.c0})),unplaced,rows:B.r1-B.r0+1,cols:B.c1-B.c0+1};
  }
  let best=null; const base=(seed|0)||1;
  for(let t=0;t<40;t++){const rnd=cwRng(base*7919+t*104729);const order=items.map(it=>({it,k:it.a.length+rnd()*3})).sort((p,q)=>q.k-p.k).map(x=>x.it);
    const L=attempt(order,rnd),v=L.placed.length*1000-Math.max(L.rows,L.cols)*8-L.rows*L.cols*.2;if(!best||v>best.v)best=Object.assign(L,{v});}
  const starts=[...new Set(best.placed.map(p=>K(p.r,p.c)))].map(k=>k.split(',').map(Number)).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  best.nums=new Map(starts.map((s,i)=>[K(s[0],s[1]),i+1]));
  best.placed.forEach(p=>{p.num=best.nums.get(K(p.r,p.c));p.key=p.dir+p.num;});
  best.placed.sort((a,b)=>(a.dir<b.dir?-1:a.dir>b.dir?1:0)||a.num-b.num);
  best.cells=new Map(); best.placed.forEach(p=>{const[dr,dc]=DIR[p.dir];for(let k=0;k<p.a.length;k++){const key=K(p.r+dr*k,p.c+dc*k);const cl=best.cells.get(key)||{ch:p.a[k],words:{}};cl.words[p.dir]=p;best.cells.set(key,cl);}});

function buildCw(q,container){
  const L=cwLayout(q.words,q.seed), K=L.K, DIR=L.DIR;
  const instr=document.createElement('div'); instr.className='q-instr';
  instr.textContent='Πάτα ένα τετράγωνο και γράψε. Πάτα ξανά για να αλλάξεις κατεύθυνση.';
  container.appendChild(instr);
  if(window.LEV_PREVIEW&&L.unplaced.length){ const w=document.createElement('div'); w.className='mcw-warn'; w.textContent='Δεν χώρεσαν: '+L.unplaced.map(u=>u.w).join(', ')+' (Δημιουργός → «Νέα διάταξη»).'; container.appendChild(w); }
  const wrap=document.createElement('div'); wrap.className='mcw-wrap'; container.appendChild(wrap);
  const board=document.createElement('div'); board.className='mcw-board';
  board.style.gridTemplateColumns=`repeat(${L.cols},minmax(0,1fr))`;
  board.style.maxWidth=Math.min(L.cols*46,100*L.cols)+'px';
  wrap.appendChild(board);
  const inputs=new Map(); let cur=null, locked=false;
  for(let r=0;r<L.rows;r++) for(let c=0;c<L.cols;c++){
    const key=K(r,c), cl=L.cells.get(key), d=document.createElement('div');
    if(!cl){ d.style.aspectRatio='1'; board.appendChild(d); continue; }
    d.className='mcw-cell'; const n=L.nums.get(key);
    d.innerHTML=(n?`<span class="n">${n}</span>`:'')+'<input maxlength="2" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">';
    const inp=d.querySelector('input'); inputs.set(key,{inp,cell:d,r,c});
    inp.addEventListener('focus',()=>{ if(!cur||cur.r!==r||cur.c!==c) setCur(r,c,null); });
    inp.addEventListener('pointerdown',e=>{ if(locked) return; if(cur&&cur.r===r&&cur.c===c&&cl.words.A&&cl.words.D){ e.preventDefault(); cur.dir=cur.dir==='A'?'D':'A'; paint(); } });
    inp.addEventListener('input',()=>{ const v=cwNorm(inp.value); inp.value=v.slice(-1); if(v) step(1); check(); });
    inp.addEventListener('keydown',e=>{
      if(e.key==='Backspace'&&!inp.value){ e.preventDefault(); step(-1); const o=inputs.get(K(cur.r,cur.c)); if(o) o.inp.value=''; check(); }
      const m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
      if(m){ e.preventDefault(); let rr=r+m[0],cc=c+m[1]; while(rr>=0&&cc>=0&&rr<L.rows&&cc<L.cols){ if(inputs.has(K(rr,cc))){ setCur(rr,cc,m[0]?'D':'A'); break; } rr+=m[0];cc+=m[1]; } }
    });
    board.appendChild(d);
  }
  const clues=document.createElement('div'); clues.className='mcw-clues';
  [['A','Οριζόντια'],['D','Κάθετα']].forEach(([dir,t])=>{ const ws=L.placed.filter(p=>p.dir===dir); if(!ws.length) return;
    const col=document.createElement('div'); col.innerHTML=`<h5>${t}</h5>`+ws.map(p=>`<div class="c" data-k="${p.key}"><b>${p.num}</b>${fmt(p.clue)} <span style="opacity:.6">(${p.en})</span></div>`).join('');
    clues.appendChild(col); });
  wrap.appendChild(clues);
  clues.querySelectorAll('.c').forEach(el=>el.addEventListener('click',()=>{ if(locked) return; const p=L.placed.find(x=>x.key===el.dataset.k); if(p) setCur(p.r,p.c,p.dir,true); }));
  function setCur(r,c,dir,focus){ const cl=L.cells.get(K(r,c)); dir=dir&&cl.words[dir]?dir:(cur&&cl.words[cur.dir]?cur.dir:(cl.words.A?'A':'D')); cur={r,c,dir}; paint(); const o=inputs.get(K(r,c)); if(o&&document.activeElement!==o.inp) o.inp.focus({preventScroll:true}); }
  function step(s){ if(!cur) return; const[dr,dc]=DIR[cur.dir], k=K(cur.r+dr*s,cur.c+dc*s); if(inputs.has(k)){ const o=inputs.get(k); cur.r=o.r; cur.c=o.c; paint(); o.inp.focus({preventScroll:true}); } }
  function paint(){
    const p=cur?L.cells.get(K(cur.r,cur.c)).words[cur.dir]:null; const inW=new Set();
    if(p){const[dr,dc]=DIR[p.dir];for(let k=0;k<p.a.length;k++) inW.add(K(p.r+dr*k,p.c+dc*k));}
    inputs.forEach((o,k)=>{ o.cell.classList.toggle('hl',inW.has(k)); o.cell.classList.toggle('cur',!!cur&&k===K(cur.r,cur.c)); });
    clues.querySelectorAll('.c').forEach(el=>el.classList.toggle('on',!!p&&el.dataset.k===p.key));
  }
  function sizeFont(){ const w=board.getBoundingClientRect().width/(parseFloat(document.getElementById('bcRight')?.style.zoom)||1)/L.cols; board.style.setProperty('--mcwF',Math.max(10,Math.round(w*.58))); }
  requestAnimationFrame(sizeFont); window.addEventListener('resize',sizeFont);
  addFB(container);
  const sub=document.createElement('button'); sub.className='btn-submit'; sub.textContent='Υποβολή'; sub.disabled=true; container.appendChild(sub);
  function check(){ sub.disabled=[...inputs.values()].some(o=>!o.inp.value); }
  sub.addEventListener('click',()=>{
    locked=true; let bad=0;
    inputs.forEach((o,k)=>{ const want=L.cells.get(k).ch, good=o.inp.value===want; o.inp.disabled=true; o.cell.classList.remove('hl','cur'); o.cell.classList.add(good?'ok':'ko'); if(!good){ bad++; o.inp.value=want; } });
    sub.style.display='none'; levChoice=bad?`✗ ${bad} γράμματα`:'✓';
    finishQuestion(bad===0,q,container,bad?`Λάθος γράμματα: ${bad} — με κόκκινο φαίνεται η σωστή λέξη.`:'');
  });
}

/* ═════════════════════════════════════
   FINISH QUESTION
   ═════════════════════════════════════ */
function addFB(container){
  const fb=document.createElement('div');
  fb.className='fb-box'; fb.id='currentFB';
  container.appendChild(fb);
}
function finishQuestion(ok,q,container,autoFix){
  if(ok) score.c++; else{score.w++; wrongQs.push(q);}
  document.getElementById('qsc').textContent=score.c;
  document.getElementById('qsw').textContent=score.w;
  document.getElementById('bcLeft').classList.add(ok?'answered-ok':'answered-ko');
  document.getElementById('bcResult').textContent=ok?'✓':'✗';
  const fb=document.getElementById('currentFB');
  fb.className='fb-box show '+(ok?'ok':'ko');
  // Αν ο συντάκτης δεν έγραψε σχόλιο, δίνεται αυτόματο
  const msg=ok?(q.fbC||'Σωστά!'):(q.fbW||(autoFix?esc(autoFix):'Δεν είναι σωστό.'));
  const msgHtml=(ok?q.fbC:q.fbW)?fmt(msg):msg;
  fb.innerHTML=`<strong>${ok?'✓':'✗'}</strong> ${msgHtml}`+(q.ref?`<span class="fb-ref">→ ${esc(q.ref)}</span>`:'');
  const done=curQi+1, total=runList.length;
  document.getElementById('progBar').style.width=((done/total)*100)+'%';
  const btnNext=document.getElementById('btnNext');
  btnNext.textContent=done<total?'Επόμενη →':'Αποτελέσματα →';
  btnNext.classList.add('show');
  fitCard();
  setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'nearest'}),150);
  if(!retryMode){
    const qi=DECKS[curDk].qs.indexOf(q);
    levSend({ qid:'K'+(curDk+1)+'-'+(qi+1), qtext:q.q, cat:q.ref||TYPE_LBL[q.t],
      choice:(q.t==='mcq'||q.t==='tf')?levChoice:(ok?'✓ '+q.t:'✗ '+q.t), ok });
  }
  levChoice=null;
}

/* ═════════════════════════════════════
   ΕΚΤΥΠΩΣΗ / PDF — φύλλο εργασίας με επιλογή ενοτήτων

const PR_LET='ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ';
const $pm=id=>document.getElementById(id);
function openPrintModal(){
  const box=$pm('pmDecks');
  box.innerHTML=DECKS.map((d,i)=>`<label class="pm-deck"><input type="checkbox" value="${i}"${PR_SEL.has(i)?' checked':''}><span><b>${String(i+1).padStart(2,'0')}</b> ${esc(d.label||('Ενότητα '+(i+1)))}${d.ktitle?' — <i>'+fmt(d.ktitle)+'</i>':''}</span><small>${d.qs.length} ερ.</small></label>`).join('');
  if(!$pm('pmTitle').dataset.set){ $pm('pmTitle').value=(QUIZ.title||'ΑΣΚΗΣΗ'); $pm('pmTitle').dataset.set='1'; }

  $pm('printModalOverlay').classList.add('active');
}
let PR_SEL=new Set(); // καμία προεπιλεγμένη ενότητα· η επιλογή κρατιέται όσο είναι ανοιχτή η σελίδα
function prPicked(){ return [...$pm('pmDecks').querySelectorAll('input:checked')].map(x=>+x.value); }
function prSum(){
  const p=prPicked(), n=p.reduce((s,i)=>s+DECKS[i].qs.length,0);
  $pm('pmSum').textContent=p.length?`Επιλέχθηκ${p.length===1?'ε 1 ενότητα':'αν '+p.length+' ενότητες'} · ${n} ερωτήσεις`:'Διάλεξε τουλάχιστον μία ενότητα.';

}
function closePrintModal(){ $pm('printModalOverlay').classList.remove('active'); }
(function initPrintModal(){

  $pm('pmNone').onclick=()=>{ $pm('pmDecks').querySelectorAll('input').forEach(x=>x.checked=false); PR_SEL=new Set(); prSum(); };

// Μία ερώτηση → { html (φύλλο), key (λύση) }
function prQuestion(q,num,s){
  let h=`<div class="pq"><p class="pq-num">Ερώτηση ${num}</p>`, key='';
  if(q.t!=='gap' && q.t!=='click') h+=`<p class="pq-q">${fmt(q.q)}</p>`;
  if(q.t==='mcq'){
    const o=(q.opts||[]).map((t,i)=>({t,i})).filter(x=>String(x.t).trim());
    h+=`<div class="pq-opts">`+o.map((x,k)=>`<div class="pq-opt"><span class="pq-k">${PR_LET[k]}.</span> ${fmt(x.t)}</div>`).join('')+`</div>`;
    const k=o.findIndex(x=>x.i===q.ans); key=k>=0?`${PR_LET[k]}. ${fmt(o[k].t)}`:'';
  } else if(q.t==='tf'){
    const L=q.labels&&q.labels.length===2?q.labels:['Σωστό','Λάθος'];
    h+=`<div class="pq-yn"><span>☐ ${esc(L[0])}</span><span>☐ ${esc(L[1])}</span></div>`; key=esc(L[q.ans|0]);
  } else if(q.t==='drag'){
    const T=q.tgts||[], ans=Array.isArray(q.ans)?q.ans:T.map((_,i)=>i);
    const items=(q.items||[]).map((t,i)=>({t,i})), sh=shuffle(items), rows=Math.max(T.length,sh.length);
    h+=`<table class="pq-dd"><thead><tr><th>Στήλη Α</th><th>Στήλη Β</th></tr></thead><tbody>`;
    for(let i=0;i<rows;i++) h+=`<tr><td>${T[i]!=null?(i+1)+'. '+fmt(T[i]):''}</td><td>${sh[i]?PR_LET[i]+'. '+fmt(sh[i].t):''}</td></tr>`;
    h+=`</tbody></table><p class="pq-dd-ans">Αντιστοιχίσεις: ${T.map((_,i)=>(i+1)+' → ___').join(' &nbsp;&nbsp; ')}</p>`;
    key=T.map((_,i)=>(i+1)+' → '+PR_LET[sh.findIndex(x=>x.i===ans[i])]).join(', ');
  } else if(q.t==='gap'){
    const parts=splitMarked(q.text), ans=[]; let n=0;
    h+=`<p class="pq-q">${fmt(q.q)}</p><div class="pq-excerpt">`+parts.map((p,i)=>{ if(i%2===0) return fmt(p); const a=p.split('|').map(x=>x.trim()).filter(Boolean); ans.push(a[0]||''); n++;
      return `<span class="pq-gap">(${n}) ${'_'.repeat(Math.max(8,Math.min(22,(a[0]||'').length+4)))}</span>`; }).join('')+`</div>`;
    if(q.mode==='select'){ const pool=[...new Set(ans.concat((q.distractors||[]).filter(Boolean)))].sort((a,b)=>a.localeCompare(b,'el')); h+=`<p class="pq-bank"><b>Λέξεις:</b> ${pool.map(esc).join(' · ')}</p>`; }
    key=ans.map((a,i)=>`(${i+1}) ${esc(a)}`).join(' · ');
  } else if(q.t==='click'){
    const parts=splitMarked(q.text);
    h+=`<p class="pq-q">${fmt(q.q)} <i>(Υπογράμμισε.)</i></p><div class="pq-excerpt">${parts.map(fmt).join('')}</div>`;
    key=parts.filter((_,i)=>i%2).map(esc).join(' · ');
  } else if(q.t==='order'){
    const lines=(q.lines||[]).map(x=>String(x).trim()).filter(Boolean).map((t,i)=>({t,i}));
    const sh=q.fixFirst?[lines[0]].concat(shuffle(lines.slice(1))):shuffle(lines);
    h+=`<div class="pq-opts">`+sh.map((x,k)=>`<div class="pq-opt"><span class="pq-k">${PR_LET[k]}.</span> ${fmt(x.t)}${q.fixFirst&&k===0?' <i>(1η)</i>':''}</div>`).join('')+`</div>`;
    h+=`<p class="pq-dd-ans">Σωστή σειρά: ${sh.map(()=>'___').join(' – ')}</p>`;
    key=lines.map(x=>PR_LET[sh.indexOf(x)]).join(' – ');
  } else if(q.t==='sort'){
    const cats=(q.cats||[]).map(c=>({name:String(c.name||'').trim(),items:(c.items||[]).map(x=>String(x).trim()).filter(Boolean)})).filter(c=>c.name&&c.items.length);
    const bank=cats.flatMap(c=>c.items).sort((a,b)=>a.localeCompare(b,'el')), rows=Math.max(...cats.map(c=>c.items.length),1);
    h+=`<p class="pq-bank">${bank.map(esc).join(' · ')}</p><table class="pq-dd"><thead><tr>${cats.map(c=>`<th>${esc(c.name)}</th>`).join('')}</tr></thead><tbody>`;
    for(let r=0;r<rows;r++) h+=`<tr>${cats.map(()=>'<td>&nbsp;</td>').join('')}</tr>`;
    h+=`</tbody></table>`;
    key=cats.map(c=>`<b>${esc(c.name)}:</b> ${c.items.map(esc).join(', ')}`).join(' · ');
  } else if(q.t==='cw'){
    const L=cwLayout(q.words,q.seed), K=L.K;
    let g=`<table class="pq-cw">`;
    for(let r=0;r<L.rows;r++){ g+='<tr>'; for(let c=0;c<L.cols;c++){ const cl=L.cells.get(K(r,c)), n=L.nums.get(K(r,c)); g+=cl?`<td class="on">${n?`<span>${n}</span>`:''}</td>`:'<td></td>'; } g+='</tr>'; }
    g+='</table>';
    const cl=d=>L.placed.filter(p=>p.dir===d).map(p=>`<div><b>${p.num}.</b> ${fmt(p.clue)} <small>(${p.en})</small></div>`).join('');
    h+=g+`<div class="pq-clues"><div><p><b>Οριζόντια</b></p>${cl('A')}</div><div><p><b>Κάθετα</b></p>${cl('D')}</div></div>`;
    key=['A','D'].map(d=>`<b>${d==='A'?'Οριζόντια':'Κάθετα'}:</b> `+L.placed.filter(p=>p.dir===d).map(p=>p.num+'. '+p.a).join(', ')).join(' · ');
  }
  if(s.showLines && (q.t==='gap'||q.t==='click')){ h+=`<div class="pq-lines">`+'<div class="pq-line"></div>'.repeat(s.linesCount)+`</div>`; }
  return { html:h+`</div>`, key };
}
function printWorksheet(s){

  let num=0; const keys=[]; let body='';
  blocks.forEach(b=>{
    if(s.deckHead && b.d && s.decks.length>0) body+=`<div class="pdeck">${esc(b.d.label||('Ενότητα '+(b.i+1)))}${b.d.ktitle?' — <i>'+fmt(b.d.ktitle)+'</i>':''}${b.d.author?' <small>('+esc(b.d.author)+')</small>':''}</div>`;

    hdr+=`</tr></table><hr class="hdr-line">`;

  const html=`<!DOCTYPE html><html lang="el"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(s.title)}</title><style>

.print-score{font-style:italic;color:#444;margin-bottom:14px}
.pdeck{font-weight:bold;font-size:calc(${fs} + 1pt);border-bottom:1px solid #999;padding-bottom:2px;margin:14px 0 8px;page-break-after:avoid}
.pq{margin-bottom:${s.qSpacing};page-break-inside:avoid}
.pq-num{font-weight:bold;margin-bottom:3px}
.pq-q{margin-bottom:8px;line-height:${lh}}
.pq-excerpt{line-height:${lh};text-align:justify;margin-bottom:8px;padding:4px 0}
.pq-yn{display:flex;gap:32px;margin-top:6px}
.pq-opts{display:flex;flex-direction:column;gap:${s.optSpacing};margin-top:6px}
.pq-opt{display:flex;align-items:baseline;gap:6px;line-height:${lh}}
.pq-k{font-weight:bold}
.pq-dd{width:100%;border-collapse:collapse;margin-top:6px;font-size:${fs}}
.pq-dd th,.pq-dd td{border:1px solid #bbb;padding:6px 10px;text-align:left;vertical-align:top}
.pq-dd th{background:#f0f0f0;font-weight:bold}
.pq-dd td{height:1.9em}
.pq-dd-ans{font-size:calc(${fs} - 1pt);color:#444;margin-top:8px}
.pq-bank{margin:4px 0 6px;line-height:${lh}}
.pq-gap{white-space:nowrap}
.pq-cw{border-collapse:collapse;margin:6px 0 8px}
.pq-cw td{width:7mm;height:7mm;padding:0;position:relative}
.pq-cw td.on{border:1px solid #000}
.pq-cw td span{position:absolute;top:0;left:1px;font-size:6.5pt;line-height:1}
.pq-clues{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;line-height:${lh}}
.pq-clues small{color:#555}
.pq-lines{margin-top:10px}
.pq-line{border-bottom:1px solid #aaa;height:24px;margin-bottom:2px}
.pkey-page{page-break-before:always}
.pkey{margin-bottom:5px;line-height:${lh}}
${tight?`.hdr-table{margin-bottom:4px}.hdr-table td{padding:1px 0}.hdr-line{margin-bottom:6px}.print-title{margin-bottom:3px}.print-instr{line-height:${lh};margin-bottom:3px}.print-score{margin-bottom:6px}.pq-excerpt{margin-bottom:3px;padding:1px 0}.pq-num{margin-bottom:1px}.pq-q{margin-bottom:3px}.pq-yn,.pq-opts,.pq-dd{margin-top:2px}.pq-dd th,.pq-dd td{padding:2px 6px}.pq-dd-ans{margin-top:3px}.pq-lines{margin-top:4px}`:''}
${s.watermark?`.watermark{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-45deg);font-size:80pt;font-weight:900;color:${s.watermarkColor};opacity:${s.watermarkOpacity};white-space:nowrap;pointer-events:none;z-index:9999;letter-spacing:8px}`:''}
</style></head><body>
${s.watermark?`<div class="watermark">${esc(s.watermarkText)}</div>`:''}
${hdr}
<div class="print-title">${esc(s.title)}</div>
${s.instructions?`<p class="print-instr">${esc(s.instructions)}</p>`:''}
${s.score?`<p class="print-score">${esc(s.score)}</p>`:''}
${body}
${s.key?`<div class="pkey-page"><div class="print-title">${esc(s.title)} — Λύσεις</div>${keys.join('')}</div>`:''}
<button class="no-print" onclick="setTimeout(function(){window.print()},300)" style="position:fixed;top:20px;right:20px;padding:12px 24px;font-size:15px;background:#6B3FA0;color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:sans-serif">🖨️ Εκτύπωση / PDF</button>
</body></html>`;
  const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  const w=window.open(url,'_blank');
  if(!w){ const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove(); }
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

/* ═════════════════════════════════════
   ΠΡΟΕΠΙΣΚΟΠΗΣΗ (μόνο μέσα στον Δημιουργό)
   ═════════════════════════════════════ */
if(window.LEV_PREVIEW && DECKS.length){
  const P=window.LEV_PREVIEW, d=Math.min(Math.max(P.d|0,0),DECKS.length-1);
  pickDeck(d);
  if(P.q>=0){
    const qs=DECKS[d].qs;
    startQuiz(); runList=[...qs]; curQi=Math.min(P.q,qs.length-1); renderCard();
  }
}
if(!DECKS.length){
  document.getElementById('deckPick').innerHTML='<div class="start-sub" style="margin:0">Δεν υπάρχουν ακόμη ερωτήσεις.</div>';
}
</script>
</body>
