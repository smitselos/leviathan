<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>Αναδιάταξη παραγράφων</title>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#6B3FA0;
  --purple-dark:#4A2D6F;
  --purple-light:#8B6BB5;
  --navy:#1B2A4A;
  --cyan:#4AAFC7;
  --coral:#E8735A;
  --gold:#E8B84B;
  --cream:#FAFAF7;
  --ink:#1a1610;
  --muted:#7a7060;
  --correct:#2d8e4e;
  --wrong:#c44a3d;
  --shadow:4px 8px 28px rgba(26,22,16,.16);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;color-scheme:light only;}
@media(prefers-color-scheme:dark){
  html,body{background:var(--cream)!important;color:var(--ink)!important;}
  .big-card{background:#fff!important;}
  .opt-btn{background:#fff!important;color:var(--ink)!important;}
  .quiz-topbar,.quiz-bottom{background:var(--cream)!important;}
  #startScreen{background:var(--cream)!important;}
  .deck-card{background:#fff!important;color:var(--ink)!important;}
}
body{
  background:var(--cream);
  font-family:'Source Sans 3',sans-serif;
  color:var(--ink);
  min-height:100%;
}

/* ═══ DECORATIVE CIRCLES (book motif) — 2 sets ═══ */
/* Κύκλος 1: πάνω δεξιά — navy/cyan/κίτρινο (όπως στο εξώφυλλο) */
.circle-top{
  position:absolute;bottom:-20vw;right:-25vw;
  width:max(55vw,55vh);height:max(55vw,55vh);min-width:350px;min-height:350px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--navy),var(--cyan));
  z-index:0;pointer-events:none;
  animation:ballIn1 1.2s cubic-bezier(.34,1.56,.64,1) .2s both;
}
@media(min-width:769px){
  .circle-top{right:-32vw;}
}
@keyframes ballIn1{
  0%{transform:translate(0,60vh) scale(.3);opacity:0;}
  60%{opacity:1;}
  100%{transform:translate(0,0) scale(1);opacity:1;}
}
.circle-top::before{
  content:'';position:absolute;
  top:18%;left:18%;
  width:64%;height:64%;border-radius:50%;
  background:var(--cyan);
}
.circle-top::after{
  content:'';position:absolute;
  top:33%;left:33%;
  width:34%;height:34%;border-radius:50%;
  background:var(--gold);
}

/* Κύκλος 2: κάτω αριστερά — κίτρινο/σομόν/κόκκινο (εξώφυλλο) */
.circle-bottom{
  position:absolute;top:-15vw;left:-35vw;
  width:max(55vw,55vh);height:max(55vw,55vh);min-width:350px;min-height:350px;
  border-radius:50%;
  background:#E8B84B;
  z-index:0;pointer-events:none;
  animation:ballIn2 1.4s cubic-bezier(.34,1.56,.64,1) .5s both;
}
@media(min-width:769px){
  .circle-bottom{left:-32vw;}
}
@keyframes ballIn2{
  0%{transform:translate(-40vw,-40vh) scale(.3);opacity:0;}
  60%{opacity:1;}
  100%{transform:translate(0,0) scale(1);opacity:1;}
}
.circle-bottom::before{
  content:'';position:absolute;
  top:16%;left:16%;
  width:68%;height:68%;border-radius:50%;
  background:#F0C9A8;
}
.circle-bottom::after{
  content:'';position:absolute;
  top:32%;left:32%;
  width:36%;height:36%;border-radius:50%;
  background:#D94F4F;
}

/* ═══ START SCREEN ═══ */
#startScreen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:40px 20px;text-align:center;
  position:relative;z-index:1;
}
.start-eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--purple-light);font-weight:600;margin-bottom:10px;position:relative;z-index:2;}
.start-title{font-family:'Literata',serif;font-size:clamp(24px,5vw,42px);font-weight:700;line-height:1.2;margin-bottom:6px;color:var(--navy);position:relative;z-index:2;text-shadow:0 2px 10px rgba(255,255,255,0.8),0 0 20px rgba(255,255,255,0.5);}
.start-title em{font-style:italic;color:var(--purple);}
.start-accent{width:70px;height:3px;background:linear-gradient(90deg,var(--purple),var(--cyan));margin:14px auto 22px;border-radius:2px;position:relative;z-index:2;}
.start-sub{color:var(--muted);font-size:14px;max-width:460px;line-height:1.6;margin-bottom:36px;position:relative;z-index:2;text-shadow:0 2px 8px rgba(255,255,255,0.7),0 0 16px rgba(255,255,255,0.4);}
.start-credits{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:1.5px;color:rgba(26,22,16,.5);font-weight:400;z-index:2;text-shadow:0 1px 4px rgba(255,255,255,.6);border-top:1px solid rgba(26,22,16,.2);padding-top:8px;white-space:nowrap;display:flex;align-items:center;gap:6px;justify-content:center;}
.credits-logo{width:16px;height:16px;opacity:0.7;flex-shrink:0;}
@media(min-width:769px){
  .start-credits{color:var(--ink);opacity:0.6;border-top-color:rgba(26,22,16,.3);}
  .credits-logo{opacity:0.5;}
}

.deck-pick{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;position:relative;z-index:2;}
.deck-card{
  background:#fff;border-radius:10px;box-shadow:var(--shadow);
  padding:22px 28px;width:240px;cursor:pointer;
  border:2.5px solid transparent;transition:all .22s;
  text-align:left;position:relative;overflow:hidden;
}
.deck-card::before{
  content:'';position:absolute;top:0;left:0;width:5px;height:100%;
  background:linear-gradient(180deg,var(--purple),var(--cyan));
  border-radius:10px 0 0 10px;
}
.deck-card:hover{transform:translateY(-3px);cursor:pointer;}
.deck-card.active{border-color:var(--purple);border-width:3px;background:#fff;box-shadow:0 0 20px rgba(107,63,160,0.2),4px 8px 28px rgba(26,22,16,.16);}
.deck-card.active .dc-num{color:var(--purple);opacity:.35;font-size:48px;}
.deck-card.active .dc-title{color:var(--purple);}
.deck-card.active .dc-ktitle{color:var(--purple-dark);}
.deck-card.active .dc-author{color:var(--coral);}
.deck-card.active .dc-sub{color:var(--muted);}
.dc-num{font-family:'Literata',serif;font-size:40px;font-weight:700;opacity:.07;line-height:1;margin-bottom:6px;color:var(--purple);}
.dc-title{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--purple-light);margin-bottom:5px;}
.dc-ktitle{font-family:'Literata',serif;font-size:14px;font-style:italic;font-weight:700;color:var(--ink);line-height:1.35;margin-bottom:4px;}
.dc-author{font-size:11.5px;font-weight:600;color:var(--coral);margin-bottom:7px;}
.dc-sub{font-size:11px;color:var(--muted);line-height:1.5;border-top:1px solid rgba(26,22,16,.08);padding-top:7px;margin-top:2px;}

.btn-start{
  position:relative;z-index:2;align-self:center;
  padding:16px 52px;
  background:linear-gradient(135deg,var(--purple),var(--purple-dark));
  color:#fff;
  border:none;border-radius:8px;
  font-size:16px;font-weight:700;
  font-family:'Source Sans 3',sans-serif;
  cursor:pointer;transition:all .2s;
  letter-spacing:.5px;
  box-shadow:0 4px 16px rgba(107,63,160,.3);
}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(107,63,160,.4);}
.dc-count{font-size:10.5px;font-weight:700;color:var(--purple-light);margin-top:6px;letter-spacing:.5px;}
@media(max-width:640px){
  .deck-pick{flex-direction:column;align-items:center;}
  .deck-card{width:90%;max-width:320px;}
  .circle-top{min-width:400px;min-height:400px;width:140vw;height:140vw;bottom:-35vw;right:-20vw;top:auto;}
  .circle-bottom{min-width:400px;min-height:400px;width:140vw;height:140vw;top:5vh;left:-50vw;bottom:auto;}
  .start-title{text-shadow:0 2px 8px rgba(255,255,255,0.8),0 0 16px rgba(255,255,255,0.5);}
  .start-sub{text-shadow:0 1px 6px rgba(255,255,255,0.6);font-size:13px;}
}

/* ═══ ΟΘΟΝΗ ΑΣΚΗΣΗΣ ═══ */
#exScreen{display:none;flex-direction:column;height:100vh;height:100dvh;}
#exScreen.active{display:flex;}
.ex-top{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid rgba(107,63,160,.1);background:var(--cream);}
.ex-top-l,.ex-top-r{display:flex;align-items:center;gap:12px;min-width:0;}
.btn-quit{background:none;border:1px solid rgba(107,63,160,.25);border-radius:4px;padding:5px 12px;font-size:12px;font-family:'Source Sans 3',sans-serif;cursor:pointer;color:var(--purple-light);white-space:nowrap;}
.btn-quit:hover{border-color:var(--purple);color:var(--purple);}
.ex-lbl{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--purple);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ex-score{font-size:13px;color:var(--muted);white-space:nowrap;}
.ex-score strong{font-family:'Literata',serif;font-size:17px;}
.s-c{color:var(--correct);}.s-w{color:var(--wrong);}
.progress-wrap{flex-shrink:0;height:3px;background:rgba(107,63,160,.08);}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));transition:width .4s ease;}

.ex-stage{flex:1;min-height:0;display:flex;padding:12px;}
.ex-card{width:100%;min-height:0;background:#fff;border-radius:10px;box-shadow:var(--shadow);border:1px solid rgba(107,63,160,.12);display:grid;grid-template-columns:minmax(207px,27%) minmax(0,1fr);overflow:hidden;animation:cardIn .3s ease both;}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.ex-left{padding:28px 24px;display:flex;flex-direction:column;gap:12px;color:#fff;background:linear-gradient(160deg,var(--purple),var(--purple-dark));transition:background .3s;}
.ex-left.ok{background:linear-gradient(160deg,var(--correct),#1E6B3A);}
.ex-left.ko{background:linear-gradient(160deg,var(--wrong),#8B2D23);}
.ex-num{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:600;}
.ex-title{font-family:'Literata',serif;font-size:clamp(18px,2.2vw,24px);font-weight:700;line-height:1.3;}
.ex-src{font-size:13px;color:rgba(255,255,255,.75);font-style:italic;}
.ex-instr{font-size:14.5px;line-height:1.55;color:rgba(255,255,255,.9);border-top:1px solid rgba(255,255,255,.2);padding-top:12px;}
.ex-result{font-size:15px;font-weight:700;line-height:1.5;}
.ex-right{min-height:0;display:flex;flex-direction:column;}
.ex-list{flex:1;min-height:0;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;}
.tile{display:flex;align-items:stretch;gap:0;background:#fff;border:2px solid rgba(107,63,160,.18);border-radius:10px;box-shadow:0 2px 8px rgba(26,22,16,.06);position:relative;touch-action:none;transition:border-color .2s,background .2s,box-shadow .2s;}
.tile.dragging{z-index:5;box-shadow:0 12px 28px rgba(26,22,16,.22);border-color:var(--purple);transition:none;cursor:grabbing;}
.tile .grip{display:flex;align-items:center;justify-content:center;width:38px;flex-shrink:0;color:var(--purple-light);font-size:18px;cursor:grab;border-right:1px solid rgba(107,63,160,.1);background:rgba(107,63,160,.04);border-radius:8px 0 0 8px;}
.tile .pos{display:flex;align-items:center;justify-content:center;width:36px;flex-shrink:0;font-family:'Literata',serif;font-weight:700;color:var(--purple);font-size:21px;}
.tile .txt{flex:1;padding:12px 10px 12px 4px;font-family:'Literata',serif;font-size:clamp(19.5px,2.2vw,23.5px);line-height:1.55;color:var(--ink);cursor:grab;}
.tile .arrows{display:flex;flex-direction:column;flex-shrink:0;border-left:1px solid rgba(107,63,160,.1);}
.tile .arrows button{flex:1;width:36px;border:none;background:none;color:var(--purple);font-size:14px;cursor:pointer;}
.tile .arrows button:hover{background:rgba(107,63,160,.07);}
.tile .arrows button:disabled{opacity:.25;cursor:default;}
.tile.fixed{background:#f6f2fb;border-style:dashed;}
.tile.fixed .grip,.tile.fixed .txt{cursor:default;}
.tile.ok{border-color:var(--correct);background:#eef8f1;}
.tile.ko{border-color:var(--wrong);background:#fdeeec;}
.tile.ok .pos{color:var(--correct);} .tile.ko .pos{color:var(--wrong);}
.tile.locked .grip,.tile.locked .txt{cursor:default;}
.ex-fb{margin:0 18px 14px;background:rgba(45,142,78,.08);border-left:3px solid var(--correct);border-radius:6px;padding:10px 14px;font-size:15px;line-height:1.55;display:none;}
.ex-fb.show{display:block;}
.ex-fb.ko{background:rgba(196,74,61,.07);border-left-color:var(--wrong);}

.ex-bottom{flex-shrink:0;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center;padding:10px 16px;border-top:1px solid rgba(107,63,160,.1);background:var(--cream);}
.ex-bottom .info{flex:1;font-size:11px;color:var(--muted);min-width:120px;}
.ex-btn{padding:10px 18px;border-radius:8px;border:1.5px solid rgba(107,63,160,.28);background:#fff;color:var(--purple);font-weight:700;font-size:14px;font-family:'Source Sans 3',sans-serif;cursor:pointer;}
.ex-btn:hover{border-color:var(--purple);}
.ex-btn.primary{background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(107,63,160,.25);}
.ex-btn[hidden]{display:none;}

/* ═══ ΑΠΟΤΕΛΕΣΜΑΤΑ ═══ */
#resultsScreen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;text-align:center;}
#resultsScreen.active{display:flex;}
.res-score{font-family:'Literata',serif;font-size:72px;font-weight:700;line-height:1;color:var(--purple);}
.res-denom{font-size:28px;opacity:.5;margin-left:4px;}
.res-label{font-size:14px;color:var(--muted);margin-top:6px;}
.res-gold{width:70px;height:3px;background:linear-gradient(90deg,var(--purple),var(--cyan));margin:20px auto;border-radius:2px;}
.res-msg{font-size:16px;line-height:1.65;max-width:440px;}
.res-btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:22px;}
.res-btns .ex-btn{min-width:260px;}

.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:40;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;}
.toast.show{opacity:1;}
.modal{position:fixed;inset:0;background:rgba(26,22,16,.45);z-index:50;display:none;align-items:center;justify-content:center;padding:16px;}
.modal.show{display:flex;}
.dialog{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:26px 24px;max-width:420px;width:100%;text-align:center;}
.dialog h2{font-family:'Literata',serif;color:var(--navy);font-size:24px;margin-bottom:8px;}
.dialog p{color:var(--muted);font-size:15px;line-height:1.55;margin-bottom:18px;}
.dialog .btns{display:flex;flex-direction:column;gap:10px;}

@media(max-width:768px){
  .ex-card{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);}
  .ex-left{padding:12.5px 15px;gap:5.5px;}
  .ex-title{font-size:16px;}
  .ex-instr{font-size:12.5px;padding-top:5.5px;line-height:1.5;}
  .ex-result{font-size:13.5px;}
  .ex-num{display:none;}
  .ex-stage{padding:8px;}
  .ex-list{padding:10px;gap:8px;}
  .tile .grip{width:30px;font-size:16px;}
  .tile .pos{width:30px;font-size:18px;}
  .tile .txt{font-size:19.5px;padding:10px 6px 10px 2px;}
  .tile .arrows button{width:34px;}
  .ex-top{padding:8px 10px;}
  .ex-bottom{padding:8px 10px;}
  .ex-bottom .info{display:none;}
  .ex-btn{padding:9px 14px;font-size:13.5px;}
  .ex-fb{margin:0 10px 10px;font-size:14px;}
}

/* ═══ ΕΚΤΥΠΩΣΗ / PDF ═══ */
#printArea{display:none;}
@media print{
  @page{size:A4;margin:15mm;}
  html,body{background:#fff!important;height:auto;}
  body>*:not(#printArea){display:none!important;}
  #printArea{display:block;color:#000;font-family:'Source Sans 3',sans-serif;}
  .pa-page{page-break-after:always;}
  .pa-page:last-child{page-break-after:auto;}
  .pa-head{border-bottom:2px solid #6B3FA0;padding-bottom:6px;margin-bottom:10px;}
  .pa-eyebrow{font-size:9pt;letter-spacing:2px;text-transform:uppercase;color:#6B3FA0;font-weight:700;}
  .pa-title{font-family:'Literata',serif;font-size:18pt;font-weight:700;}
  .pa-meta{font-size:10pt;margin-top:2px;}
  .pa-name{font-size:10pt;margin:8px 0 12px;}
  .pa-instr{font-size:10.5pt;margin-bottom:10px;}
  .pa-ex{break-inside:avoid;margin-bottom:9mm;}
  .pa-ex h3{font-family:'Literata',serif;font-size:12.5pt;margin:0 0 4px;}
  .pa-ex .src{font-size:9.5pt;font-style:italic;margin-bottom:4px;}
  .pa-ex ol{list-style:none;margin:0;padding:0;}
  .pa-ex li{font-family:'Literata',serif;font-size:11pt;line-height:1.5;margin:0 0 4px;display:flex;gap:3mm;}
  .pa-ex li b{min-width:7mm;font-family:'Source Sans 3',sans-serif;}
  .pa-order{font-size:10.5pt;margin-top:4px;}
  .pa-box{display:inline-block;width:9mm;height:7mm;border:1px solid #000;margin-right:2mm;vertical-align:middle;}
  .pa-sol{font-family:'Literata',serif;font-size:11pt;line-height:1.6;}
  .pa-key{font-size:10pt;font-weight:700;margin-bottom:3px;}
  .pa-foot{font-size:8pt;color:#555;margin-top:8px;text-align:center;}
}
</style>
</head>
<body>

<div id="startScreen" style="position:relative;overflow:hidden;">
  <div class="circle-top"></div>
  <div class="circle-bottom"></div>
  <div class="start-eyebrow" id="sEyebrow"></div>
  <div class="start-title" id="sTitle"></div>
  <div class="start-accent"></div>
  <div class="start-sub" id="sSub"></div>
  <div class="deck-pick" id="deckPick"></div>
  <div class="start-credits">
    <svg class="credits-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="12" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor">C</text>
    </svg>
    <span id="sCredits"></span>
  </div>
</div>

<!-- ══ ΑΣΚΗΣΗ ══ -->
<div id="exScreen">
  <div class="ex-top">
    <div class="ex-top-l">
      <button class="btn-quit" onclick="goStart()">← Έξοδος</button>
      <div class="ex-lbl" id="exLabel"></div>
    </div>
    <div class="ex-top-r">
      <div class="ex-score">✓ <strong class="s-c" id="sc">0</strong> &nbsp; ✗ <strong class="s-w" id="sw">0</strong></div>
      <div class="ex-score" id="sn" style="opacity:.6"></div>
    </div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progBar" style="width:0%"></div></div>
  <div class="ex-stage">
    <div class="ex-card" id="exCard">
      <div class="ex-left" id="exLeft">
        <div class="ex-num" id="exNum"></div>
        <div class="ex-title" id="exTitle"></div>
        <div class="ex-src" id="exSrc"></div>
        <div class="ex-instr" id="exInstr"></div>
        <div class="ex-result" id="exResult"></div>
      </div>
      <div class="ex-right">
        <div class="ex-list" id="exList"></div>
        <div class="ex-fb" id="exFb"></div>
      </div>
    </div>
  </div>
  <div class="ex-bottom">
    <div class="info" id="exInfo"></div>
    <button class="ex-btn" onclick="openPrint()" title="Εκτύπωση / PDF της ενότητας">🖨</button>
    <button class="ex-btn" id="btnSol" onclick="showSolution()">👁 Λύση</button>
    <button class="ex-btn primary" id="btnCheck" onclick="check()">✓ Έλεγχος</button>
    <button class="ex-btn primary" id="btnNext" onclick="next()" hidden>Επόμενη →</button>
  </div>
</div>

<!-- ══ ΑΠΟΤΕΛΕΣΜΑΤΑ ══ -->
<div id="resultsScreen">
  <div class="res-score" id="resScore"></div>
  <div class="res-label">παράγραφοι σωστά με την πρώτη</div>
  <div class="res-gold"></div>
  <div class="res-msg" id="resMsg"></div>
  <div class="res-btns">
    <button class="ex-btn primary" onclick="startDeck(curDk)">↺ Ξανά (ίδια ενότητα)</button>
    <button class="ex-btn" onclick="openPrint()">🖨 Εκτύπωση / PDF</button>
    <button class="ex-btn" onclick="goStart()">← Έξοδος στην αρχή</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="printModal">
  <div class="dialog">
    <h2>Εκτύπωση / PDF</h2>
    <p>Φύλλο εργασίας της ενότητας. Στο παράθυρο εκτύπωσης διάλεξε εκτυπωτή ή <b>«Αποθήκευση ως PDF»</b>.</p>
    <div class="btns">
      <button class="ex-btn primary" onclick="doPrint(false)">📄 Φύλλο εργασίας</button>
      <button class="ex-btn" onclick="doPrint(true)">📄 Φύλλο εργασίας + λύσεις</button>
      <button class="ex-btn" onclick="closeModal('printModal')">Άκυρο</button>
    </div>
  </div>
</div>
<div id="printArea"></div>

<script>
/* ═════════════════════════════════════════════════════════════════
   ΠΡΟΤΥΠΟ «Αναδιάταξη παραγράφων» — ΛΕΒΙΑΘΑΝ
   Τα δεδομένα βρίσκονται ΜΟΝΟ ανάμεσα στους δείκτες QUIZ_DATA.
   Ο Δημιουργός του ΛΕΒΙΑΘΑΝ (/creator) τα γράφει και τα ξαναδιαβάζει
   από εκεί — μην αλλάξετε τους δείκτες.
   Ενότητα: { label, ktitle, author, sub, ps:[{ title, src, lines:[περίοδοι με ΣΩΣΤΗ σειρά], fixFirst, fb }] }
   ═════════════════════════════════════════════════════════════════ */
const QUIZ=/*QUIZ_DATA_START*/{"v":1,"template":"paragraph-deck","title":"Αναδιάταξη παραγράφων — Παράδειγμα","eyebrow":"Αναδιάταξη παραγράφου","heading":"Η δομή της *παραγράφου*","subtitle":"Διάλεξε ενότητα. Βάλε τις περιόδους κάθε παραγράφου στη σωστή σειρά και πάτησε «Έλεγχος».","credits":"ΛΕΒΙΑΘΑΝ","decks":[{"label":"Ενότητα 1","ktitle":"Θεματική περίοδος, λεπτομέρειες, κατακλείδα","author":"","sub":"Συνοχή και συνεκτικότητα","ps":[{"title":"Η αξία της ανάγνωσης","src":"","lines":["Η ανάγνωση λογοτεχνίας καλλιεργεί πολύπλευρα τον νέο άνθρωπο.","Αρχικά, εμπλουτίζει το λεξιλόγιό του και βελτιώνει την έκφρασή του.","Επιπλέον, τον φέρνει σε επαφή με διαφορετικούς τρόπους σκέψης και ζωής.","Έτσι, αναπτύσσει την ενσυναίσθηση και την κριτική του ικανότητα.","Συνεπώς, το βιβλίο παραμένει πολύτιμος σύντροφος στην πορεία της ενηλικίωσης."],"fixFirst":false,"fb":"Θεματική περίοδος → δύο λεπτομέρειες («Αρχικά», «Επιπλέον») → αποτέλεσμα («Έτσι») → κατακλείδα («Συνεπώς»)."}]}]}/*QUIZ_DATA_END*/;

/* © ΛΕΒΙΑΘΑΝ · χρονολογία δημιουργίας · όνομα δημιουργού (αν έχει δηλωθεί) */
const LEV_YEAR=QUIZ.year||((String(QUIZ.credits||'').match(/\b(19|20)\d{2}\b/)||[])[0])||new Date().getFullYear();
const LEV_AUTHOR=String(QUIZ.credits||'').replace(/[\s,·–—-]*\b(19|20)\d{2}\s*$/,'').trim().replace(/^(ΛΕΒΙΑΘΑΝ|leviathan)$/i,'');
const LEV_COPY='ΛΕΒΙΑΘΑΝ '+LEV_YEAR+(LEV_AUTHOR?' · '+LEV_AUTHOR:'');

/* ── Βοηθητικά ── */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\n/g,'<br>');}
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
const LETTERS=['Α','Β','Γ','Δ','Ε','ΣΤ','Ζ','Η','Θ','Ι','ΙΑ','ΙΒ','ΙΓ','ΙΔ','ΙΕ'];
const cleanLines=p=>(p.lines||[]).map(s=>String(s||'').trim()).filter(Boolean);
const DECKS=(QUIZ.decks||[]).map(d=>Object.assign({},d,{ps:(d.ps||[]).filter(p=>cleanLines(p).length>=2)})).filter(d=>d.ps.length);

/* ═════════════════════════════════════
   ΑΡΧΙΚΗ ΟΘΟΝΗ
   ═════════════════════════════════════ */
document.title=QUIZ.title||'Αναδιάταξη παραγράφων';
document.getElementById('sEyebrow').textContent=QUIZ.eyebrow||'';
document.getElementById('sTitle').innerHTML=fmt(QUIZ.heading||QUIZ.title||'');
document.getElementById('sSub').innerHTML=fmt(QUIZ.subtitle||'');
document.getElementById('sCredits').textContent=LEV_COPY;
(function buildDecks(){
  const wrap=document.getElementById('deckPick');
  DECKS.forEach((d,i)=>{
    const c=document.createElement('div');
    c.className='deck-card'; c.id='pick'+i; c.onclick=()=>startDeck(i);
    c.innerHTML=`<div class="dc-num">${String(i+1).padStart(2,'0')}</div>`+
      (d.label?`<div class="dc-title">${esc(d.label)}</div>`:'')+
      (d.ktitle?`<div class="dc-ktitle">${fmt(d.ktitle)}</div>`:'')+
      (d.author?`<div class="dc-author">${esc(d.author)}</div>`:'')+
      (d.sub?`<div class="dc-sub">${fmt(d.sub)}</div>`:'')+
      `<div class="dc-count">⇅ ${d.ps.length} ${d.ps.length===1?'παράγραφος':'παράγραφοι'}</div>`;
    wrap.appendChild(c);
  });
  if(!DECKS.length) wrap.innerHTML='<div class="start-sub" style="margin:0">Δεν υπάρχουν ακόμη παράγραφοι.</div>';
})();

/* ═════════════════════════════════════
   ΛΕΒΙΑΘΑΝ — ζωντανά αποτελέσματα (μόνο με #session=XXXX)
   ═════════════════════════════════════ */
const LEV_SESSION=(location.hash.match(/session=(\d{4})/)||[])[1]||null;
const LEV_API=(/vercel\.app$/.test(location.hostname)?location.origin:'https://leviathan-olive.vercel.app')+'/api/quiz-results';
let levName=null;
function levAskName(){
  if(!LEV_SESSION) return;
  let n=null; try{n=localStorage.getItem('lev_name_'+LEV_SESSION);}catch(e){}
  while(!n||!n.trim()){ n=prompt('Γράψε το όνομά σου (θα το δει ο/η καθηγητής/τρια):'); if(n===null) n=''; }
  levName=n.trim().slice(0,40);
  try{localStorage.setItem('lev_name_'+LEV_SESSION,levName);}catch(e){}
}
function levSend(body){
  if(!LEV_SESSION||!levName) return;
  try{ fetch(LEV_API,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({code:LEV_SESSION,student:levName},body)),keepalive:true}).catch(()=>{}); }catch(e){}
}

/* ═════════════════════════════════════
   ΚΑΤΑΣΤΑΣΗ
   ═════════════════════════════════════ */
let curDk=0, curPi=0, score={c:0,w:0}, order=[], tries=0, solved=false;
const $=id=>document.getElementById(id);

function goStart(){
  $('startScreen').style.display='flex';
  $('exScreen').classList.remove('active');
  $('resultsScreen').classList.remove('active');
}
function startDeck(i){
  if(LEV_SESSION&&!levName) levAskName();
  curDk=i; curPi=0; score={c:0,w:0};
  $('startScreen').style.display='none';
  $('resultsScreen').classList.remove('active');
  $('exScreen').classList.add('active');
  $('exLabel').textContent=DECKS[i].label||('Ενότητα '+(i+1));
  $('exInfo').textContent='© '+LEV_COPY;
  render();
}
function next(){ curPi++; if(curPi>=DECKS[curDk].ps.length) showResults(); else render(); }
function showResults(){
  $('exScreen').classList.remove('active');
  $('resultsScreen').classList.add('active');
  const s=score.c, t=DECKS[curDk].ps.length;
  $('resScore').innerHTML=`${s}<span class="res-denom">/${t}</span>`;
  $('resMsg').textContent= s>=t?'Εξαιρετικά! Όλες οι παράγραφοι σωστές με την πρώτη!':
    s>=Math.ceil(t*.6)?'Πολύ καλά! Πρόσεξε τις διαρθρωτικές λέξεις που δείχνουν τη σειρά.':
    'Δες ξανά πώς ξεκινά μια παράγραφος (θεματική περίοδος) και πώς κλείνει (κατακλείδα) και δοκίμασε πάλι.';
  levSend({ final:true, score:s, totalQ:t });
}
function updateBar(){
  const t=DECKS[curDk].ps.length;
  $('sc').textContent=score.c; $('sw').textContent=score.w;
  $('sn').textContent=`${curPi+1} / ${t}`;
  $('progBar').style.width=(curPi/t*100)+'%';
}

/* ═════════════════════════════════════
   ΑΣΚΗΣΗ
   ═════════════════════════════════════ */
function curP(){return DECKS[curDk].ps[curPi];}
function render(){
  updateBar();
  const p=curP(), lines=cleanLines(p), n=lines.length;
  tries=0; solved=false;
  $('exLeft').className='ex-left';
  $('exNum').textContent=`Παράγραφος ${curPi+1} / ${DECKS[curDk].ps.length}`;
  $('exTitle').innerHTML=fmt(p.title||'Αναδιάταξη παραγράφου');
  $('exSrc').innerHTML=p.src?fmt(p.src):'';
  $('exInstr').innerHTML=`Βάλε τις ${n} περιόδους στη σωστή σειρά, ώστε να σχηματιστεί μια συνεκτική παράγραφος.`+(p.fixFirst?' Η πρώτη περίοδος είναι ήδη στη θέση της.':'')+' Σύρε ή χρησιμοποίησε τα βελάκια.';
  $('exResult').textContent='';
  $('exFb').className='ex-fb'; $('exFb').innerHTML='';
  $('btnCheck').hidden=false; $('btnNext').hidden=true; $('btnSol').hidden=false;
  // ανακάτεμα (ποτέ η σωστή σειρά)· με fixFirst η 1η μένει πρώτη
  const idx=[...Array(n).keys()], head=p.fixFirst?[0]:[], rest=p.fixFirst?idx.slice(1):idx;
  let sh=shuffle(rest), guard=0; while(rest.length>1&&sh.every((v,i)=>v===rest[i])&&guard++<20) sh=shuffle(rest);
  order=head.concat(sh);
  drawList();
}
function drawList(){
  const p=curP(), lines=cleanLines(p), list=$('exList'); list.innerHTML='';
  order.forEach((li,pos)=>{
    const fixed=p.fixFirst&&pos===0;
    const t=document.createElement('div');
    t.className='tile'+(fixed?' fixed':'')+(solved?' locked':''); t.dataset.li=li;
    t.innerHTML=`<div class="grip">${fixed?'📌':'⠿'}</div><div class="pos">${pos+1}</div><div class="txt">${fmt(lines[li])}</div>`+
      (fixed||solved?'':`<div class="arrows"><button aria-label="Πάνω" ${pos<=(p.fixFirst?1:0)?'disabled':''}>▲</button><button aria-label="Κάτω" ${pos===order.length-1?'disabled':''}>▼</button></div>`);
    if(!fixed&&!solved){
      const [up,dn]=t.querySelectorAll('.arrows button');
      up.onclick=e=>{e.stopPropagation();move(pos,-1);};
      dn.onclick=e=>{e.stopPropagation();move(pos,1);};
      enableDrag(t);
    }
    list.appendChild(t);
  });
}
function move(pos,d){
  const j=pos+d, min=curP().fixFirst?1:0; if(j<min||j>=order.length) return;
  [order[pos],order[j]]=[order[j],order[pos]]; clearMarks(); drawList();
}
function clearMarks(){ $('exLeft').className='ex-left'; $('exResult').textContent=''; }

/* ── Σύρσιμο (ποντίκι & αφή) ── */
function enableDrag(tile){
  let startY=0, dragging=false, pid=null, downY=0;
  const list=$('exList');
  tile.addEventListener('pointerdown',e=>{
    if(e.target.closest('.arrows')) return;
    pid=e.pointerId; downY=startY=e.clientY; dragging=false;
    tile.setPointerCapture(pid);
  });
  tile.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid) return;
    if(!dragging){ if(Math.abs(e.clientY-downY)<6) return; dragging=true; tile.classList.add('dragging'); }
    e.preventDefault();
    const minIdx=curP().fixFirst?1:0;
    let nx=tile.nextElementSibling, pv=tile.previousElementSibling;
    if(nx){const r=nx.getBoundingClientRect(); if(e.clientY>r.top+r.height/2){ list.insertBefore(nx,tile); startY+=r.height+10; }}
    if(pv&&[...list.children].indexOf(pv)>=minIdx){const r=pv.getBoundingClientRect(); if(e.clientY<r.top+r.height/2){ list.insertBefore(tile,pv); startY-=r.height+10; }}
    tile.style.transform=`translateY(${e.clientY-startY}px)`;
    const lr=list.getBoundingClientRect();
    if(e.clientY<lr.top+40) list.scrollTop-=12; else if(e.clientY>lr.bottom-40) list.scrollTop+=12;
  });
  const end=e=>{
    if(e.pointerId!==pid) return; pid=null;
    if(!dragging) return; dragging=false;
    tile.classList.remove('dragging'); tile.style.transform='';
    order=[...list.children].map(t=>+t.dataset.li); clearMarks(); drawList();
  };
  tile.addEventListener('pointerup',end); tile.addEventListener('pointercancel',end);
}

/* ── Έλεγχος / λύση ── */
function check(){
  const p=curP(), n=order.length; tries++;
  let ok=0; const tiles=[...$('exList').children];
  order.forEach((li,pos)=>{ const good=li===pos; if(good) ok++; tiles[pos].classList.toggle('ok',good); tiles[pos].classList.toggle('ko',!good); });
  const all=ok===n;
  if(all){
    if(tries===1) score.c++;
    finishEx(true);
  } else {
    $('exLeft').className='ex-left ko';
    $('exResult').textContent=`${ok} από ${n} περιόδους στη σωστή θέση. Δοκίμασε ξανά!`;
    if(tries===1){ score.w++; updateBar(); levSend({ qid:'P'+(curDk+1)+'-'+(curPi+1), qtext:p.title||cleanLines(p)[0], cat:'Αναδιάταξη παραγράφου', choice:`${ok}/${n}`, ok:false }); }
    toast(`${ok}/${n} στη σωστή θέση — οι πράσινες είναι σωστές`);
  }
}
function finishEx(byStudent){
  const p=curP(); solved=true;
  if(byStudent&&tries===1) levSend({ qid:'P'+(curDk+1)+'-'+(curPi+1), qtext:p.title||cleanLines(p)[0], cat:'Αναδιάταξη παραγράφου', choice:'✓', ok:true });
  $('exLeft').className='ex-left '+(byStudent?'ok':'ko');
  $('exResult').textContent=byStudent?(tries===1?'✓ Σωστά με την πρώτη!':'✓ Σωστά!'):'Η σωστή σειρά:';
  drawList();
  [...$('exList').children].forEach(t=>t.classList.add(byStudent?'ok':'locked'));
  if(p.fb){ const fb=$('exFb'); fb.innerHTML=fmt(p.fb); fb.className='ex-fb show'+(byStudent?'':' ko'); }
  $('btnCheck').hidden=true; $('btnSol').hidden=true; $('btnNext').hidden=false;
  $('btnNext').textContent=curPi<DECKS[curDk].ps.length-1?'Επόμενη →':'Αποτελέσματα →';
  updateBar();
}
function showSolution(){
  if(!confirm('Να εμφανιστεί η σωστή σειρά;')) return;
  if(tries===0){ score.w++; const p=curP(); levSend({ qid:'P'+(curDk+1)+'-'+(curPi+1), qtext:p.title||cleanLines(p)[0], cat:'Αναδιάταξη παραγράφου', choice:'λύση', ok:false }); }
  order=[...Array(order.length).keys()]; finishEx(false);
}
let toastT=null;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
function closeModal(id){$(id).classList.remove('show');}

/* ═════════════════════════════════════
   ΕΚΤΥΠΩΣΗ / PDF — φύλλο εργασίας της ενότητας
   ═════════════════════════════════════ */
function openPrint(){ $('printModal').classList.add('show'); }
function sheet(withSol){
  const d=DECKS[curDk];
  let h=`<div class="pa-page"><div class="pa-head"><div class="pa-eyebrow">${esc(QUIZ.eyebrow||'Αναδιάταξη παραγράφου')}${withSol?' · Λύσεις':''}</div>`+
    `<div class="pa-title">${fmt(QUIZ.title||'')}</div><div class="pa-meta">${esc(d.label||'')}${d.ktitle?' — '+fmt(d.ktitle):''}</div></div>`;
  if(!withSol) h+='<div class="pa-name">Ονοματεπώνυμο: ____________________________ &nbsp; Τμήμα: ________ &nbsp; Ημερομηνία: ___________</div>'+
    '<div class="pa-instr">Βάλε τις περιόδους κάθε παραγράφου στη σωστή σειρά. Γράψε τα γράμματα με τη σειρά που πρέπει, στα κουτάκια.</div>';
  d.ps.forEach((p,i)=>{
    const lines=cleanLines(p), n=lines.length;
    // σταθερό «ανακάτεμα» για το χαρτί (ίδιο στο φύλλο και στις λύσεις)
    const idx=[...Array(n).keys()]; const perm=p.fixFirst?[0].concat(idx.slice(1).reverse()):[...idx.slice(1).filter((_,k)=>k%2===0),0,...idx.slice(1).filter((_,k)=>k%2===1)];
    h+=`<div class="pa-ex"><h3>${i+1}. ${fmt(p.title||'Παράγραφος')}</h3>`+(p.src?`<div class="src">${fmt(p.src)}</div>`:'');
    if(!withSol){
      h+='<ol>'+perm.map((li,k)=>`<li><b>${LETTERS[k]}.</b><span>${fmt(lines[li])}</span></li>`).join('')+'</ol>';
      h+=`<div class="pa-order">Σωστή σειρά: ${perm.map(()=>'<span class="pa-box"></span>').join('')}</div>`;
    } else {
      const key=idx.map(li=>LETTERS[perm.indexOf(li)]).join(' – ');
      h+=`<div class="pa-key">Σωστή σειρά: ${key}</div><div class="pa-sol">${lines.map(fmt).join(' ')}</div>`+(p.fb?`<div class="src" style="margin-top:3px">${fmt(p.fb)}</div>`:'');
    }
    h+='</div>';
  });
  return h+`<div class="pa-foot">© ${esc(LEV_COPY)}</div>`+'</div>';
}
function doPrint(withSol){
  closeModal('printModal');
  $('printArea').innerHTML=sheet(false)+(withSol?sheet(true):'');
  setTimeout(()=>window.print(),80);
}

/* ═════════════════════════════════════
   ΠΡΟΕΠΙΣΚΟΠΗΣΗ (μόνο μέσα στον Δημιουργό)
   ═════════════════════════════════════ */
if(window.LEV_PREVIEW && DECKS.length){
  const P=window.LEV_PREVIEW, d=Math.min(Math.max(P.d|0,0),DECKS.length-1);
  if(P.q>=0){ curDk=d; startDeck(d); curPi=Math.min(P.q,DECKS[d].ps.length-1); render(); }
}
</script>
</body>
</html>
