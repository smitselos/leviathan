const LS_TONES = ['#F7F3E8','#FAE0CC','#F0E4A8'];
const lsEsc = t => String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function levSideUpdate() {
  const nav = document.getElementById('lsNav'); if (!nav) return;
  const inRun = ['adaptive','cat_transition','theory_wall'].includes(screen);
  const inAdp = ['adp_start','adp_results'].includes(screen);
  const inSel = screen.startsWith('sel'), inPres = screen.startsWith('pres');
  const item = (attrs, ic, tx, on) =>
    `<button class="ls-item${on?' on':''}" type="button" ${attrs} title="${lsEsc(tx)}"><span class="ls-ic">${ic}</span><span class="ls-tx">${tx}</span></button>`;
  let h = item('data-go="home"', '⌂', 'Αρχική', screen==='home')
        + '<div class="ls-div"></div>'
        + item('data-go="adp"', '🎯', 'Βήμα-Βήμα', inAdp)
        + item('data-go="sel"', '⚡', 'Εξάσκηση', inSel)
        + item('data-go="pres"', '📋', 'Παρουσίαση', inPres);
  if (catOrder.length) {
    h += '<div class="ls-div"></div><p class="ls-sec">Βήματα</p>';
    catOrder.forEach((k, i) => {
      const on = inRun && i === adp.catIdx;
      const done = adp.catLog && adp.catLog[k] === 'pass';
      const name = getCatDisplayName(k);
      h += `<button class="ls-item${on?' on':''}${done?' done':''}" type="button" data-cat="${i}" title="${lsEsc(name)}">`
         + `<span class="ls-ic ls-num" style="background:${LS_TONES[i%3]}">${done?'✓':String(i+1).padStart(2,'0')}</span>`
         + `<span class="ls-tx">${lsEsc(name)}</span></button>`;
    });
  }
  nav.innerHTML = h;
  levToolsUpdate();
}
(function initLevSide(){
  const side = document.getElementById('levSide'); if (!side) return;
  let open = false; try { open = localStorage.getItem('lev_side_open') === '1'; } catch(_) {}
  const tg = document.getElementById('lsToggle');
  const apply = () => { document.body.classList.toggle('ls-open', open); tg.textContent = open ? '‹' : '›'; };
  apply();
  tg.addEventListener('click', () => { open = !open; apply(); try { localStorage.setItem('lev_side_open', open?'1':'0'); } catch(_) {} });
  document.getElementById('lsNav').addEventListener('click', e => {
    const b = e.target.closest('.ls-item'); if (!b || screen === 'loading') return;
    if (b.dataset.go === 'home') screen = 'home';
    else if (b.dataset.go === 'adp') screen = 'adp_start';
    else if (b.dataset.go === 'sel') screen = 'sel_setup';
    else if (b.dataset.go === 'pres') screen = 'pres_setup';
    else if (b.dataset.cat !== undefined) { startAdaptive(parseInt(b.dataset.cat)); return; }
    render();
  });
})();

// ── Εργαλεία στην πλευρική μπάρα: ήχος, μέγεθος, εκτύπωση, έξοδος ──
function levToolsUpdate() {
  const t = document.getElementById('lsTools'); if (!t) return;
  try { currentZoom; soundEnabled; } catch (_) { return; }
  t.innerHTML =
      `<button class="ls-item${soundEnabled?'':' muted'}" type="button" data-tool="sound" title="${soundEnabled?'Απενεργοποίηση ήχου':'Ενεργοποίηση ήχου'}"><span class="ls-ic">${soundEnabled?'🔊':'🔇'}</span><span class="ls-tx">Ήχος: ${soundEnabled?'ενεργός':'ανενεργός'}</span></button>`
    + `<div class="ls-zoom"><span class="ls-ic">🔍</span><span class="ls-tx">Μέγεθος</span>`
    + `<button class="ls-zbtn" type="button" data-tool="zout" title="Σμίκρυνση" ${currentZoom<=50?'disabled':''}>−</button>`
    + `<button class="ls-zval" type="button" data-tool="zreset" title="Επαναφορά στο 100%">${currentZoom}%</button>`
    + `<button class="ls-zbtn" type="button" data-tool="zin" title="Μεγέθυνση" ${currentZoom>=300?'disabled':''}>+</button></div>`
    + `<button class="ls-item" type="button" data-tool="print" title="Εκτύπωση φύλλου εργασίας"><span class="ls-ic">🖨️</span><span class="ls-tx">Εκτύπωση</span></button>`
    + `<button class="ls-item exit" type="button" data-tool="exit" title="Κλείσιμο εφαρμογής"><span class="ls-ic">⏻</span><span class="ls-tx">Έξοδος</span></button>`;
  const bt = document.getElementById('levBot');
  if (bt) bt.innerHTML =
      `<button type="button" class="lb-item${screen==='home'?' on':''}" data-tool="home"><span class="lb-ic">⌂</span><span class="lb-tx">Αρχική</span></button>`
    + `<button type="button" class="lb-item${soundEnabled?'':' muted'}" data-tool="sound"><span class="lb-ic">${soundEnabled?'🔊':'🔇'}</span><span class="lb-tx">Ήχος</span></button>`
    + `<button type="button" class="lb-item" data-tool="print"><span class="lb-ic">🖨️</span><span class="lb-tx">Εκτύπωση</span></button>`
    + `<button type="button" class="lb-item exit" data-tool="exit"><span class="lb-ic">⏻</span><span class="lb-tx">Έξοδος</span></button>`;
}
// Πλαίσιο εκτύπωσης: επιλογή βημάτων και πλήθους → «Ρυθμίσεις Εκτύπωσης»
function levOpenPrint() {
  if (!allQ.length) return;
  let cats = sel.filterCats.filter(k => catOrder.includes(k));
  let count = sel.filterCount;
  let ov = document.getElementById('levPrint');
  if (!ov) { ov = document.createElement('div'); ov.id = 'levPrint'; ov.className = 'lev-pp-ov'; document.body.appendChild(ov); }
  const pool = () => allQ.filter(q => !cats.length || cats.includes(q.catKey)).length;
  const draw = () => {
    const n = pool(), k = count === 0 ? n : Math.min(count, n);
    ov.innerHTML = `<div class="lev-pp" role="dialog" aria-label="Εκτύπωση">
      <div class="lev-pp-head"><p class="lev-pp-eye">Φύλλο εργασίας</p><h3>🖨️ Εκτύπωση</h3><button class="lev-pp-x" type="button" data-a="close" title="Κλείσιμο">✕</button></div>
      <p class="lev-pp-lbl">Βήματα</p>
      <div class="lev-pp-cats">
        <button type="button" class="lev-pp-chip all${cats.length?'':' on'}" data-cat="">Όλα τα βήματα</button>
        ${catOrder.map((c, i) => `<button type="button" class="lev-pp-chip${cats.includes(c)?' on':''}" data-cat="${c}"><span class="lev-pp-n" style="background:${LS_TONES[i%3]}">${String(i+1).padStart(2,'0')}</span>${lsEsc(getCatDisplayName(c))}</button>`).join('')}
      </div>
      <p class="lev-pp-lbl">Πλήθος ερωτήσεων</p>
      <div class="lev-pp-counts">${[10,20,30,0].map(v => `<button type="button" class="lev-pp-cnt${count===v?' on':''}" data-cnt="${v}">${v||'Όλες'}</button>`).join('')}</div>
      <p class="lev-pp-info">Θα εκτυπωθούν <b>${k}</b> από ${n} διαθέσιμες ερωτήσεις.</p>
      <div class="lev-pp-foot"><button type="button" class="lev-pp-btn sec" data-a="close">Άκυρο</button><button type="button" class="lev-pp-btn" data-a="go" ${n?'':'disabled'}>Ρυθμίσεις εκτύπωσης →</button></div>
    </div>`;
  };
  ov.onclick = e => {
    if (e.target === ov) { ov.classList.remove('on'); return; }
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'close') { ov.classList.remove('on'); return; }
    if (b.dataset.a === 'go') {
      ov.classList.remove('on');
      sel.filterTypes = []; sel.filterDiffs = []; sel.filterCats = cats.slice(); sel.filterCount = count;
      if (screen === 'sel_setup') render();
      printSelSetup(); return;
    }
    if (b.dataset.cat !== undefined) {
      const c = b.dataset.cat;
      if (!c) cats = []; else cats = cats.includes(c) ? cats.filter(x => x !== c) : cats.concat(c);
    }
    if (b.dataset.cnt !== undefined) count = parseInt(b.dataset.cnt);
    draw();
  };
  draw(); ov.classList.add('on');
}
(function initLevTools(){
  const t = document.getElementById('lsTools'); if (!t) return;
  setTimeout(levToolsUpdate, 0);   // μετά τη δήλωση currentZoom/soundEnabled
  const onTool = e => {
    const b = e.target.closest('[data-tool]'); if (!b || b.disabled) return;
    const a = b.dataset.tool;
    if (a === 'home') { if (screen !== 'loading') { screen = 'home'; render(); } }
    else if (a === 'sound') toggleSound();
    else if (a === 'zin') zoomIn();
    else if (a === 'zout') zoomOut();
    else if (a === 'zreset') setZoom(100);
    else if (a === 'print') levOpenPrint();
    else if (a === 'exit') closeApp();
  };
  t.addEventListener('click', onTool);
  const bt = document.getElementById('levBot'); if (bt) bt.addEventListener('click', onTool);
})();
// ══════════════════════════════════════════════
// ADAPTIVE QUIZ SCREEN
// ══════════════════════════════════════════════
function renderAdaptive() {
  const catKey = catOrder[adp.catIdx];
  const q = adp.queue[adp.qIdx];
  if (!q) return '<div class="card"><p>Σφάλμα: δεν βρέθηκε ερώτηση.</p></div>';
  prepAnswer(q, adp);

  const totalInRound = adp.queue.length;
  const isOk = adp.answered ? checkAnswer(q, adp.answer) : false;
  const stepNum = adp.catIdx + 1;

  // Step dots
  let stepDots = '<div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">';
  catOrder.forEach((key, i) => {
    const status = adp.catLog[key];
    const isActive = i === adp.catIdx;
    let bg, border, color;
    if (status === 'pass' || i < adp.catIdx) { bg='rgba(255,255,255,.2)'; border='rgba(255,255,255,.7)'; color='#fff'; }
    else if (status === 'skip') { bg='rgba(251,191,36,.3)'; border='rgba(251,191,36,.8)'; color='#fff'; }
    else if (isActive) { bg='rgba(255,255,255,.95)'; border='#fff'; color='var(--indigo-d)'; }
    else { bg='rgba(255,255,255,.07)'; border='rgba(255,255,255,.2)'; color='rgba(255,255,255,.3)'; }
    const label = (status === 'pass' || i < adp.catIdx) ? '✓' : (i+1);
    stepDots += `<div style="width:24px;height:24px;border-radius:50%;background:${bg};border:2px solid ${border};color:${color};display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700">${label}</div>`;
  });
  stepDots += '</div>';

  // Question dots
  let dots = '<div style="display:flex;gap:5px;align-items:center">';
  for (let i=0; i<totalInRound; i++) {
    let bg, border;
    if (i < adp.roundResults.length) {
      if (adp.roundResults[i]) { bg='rgba(255,255,255,.9)'; border='rgba(255,255,255,.9)'; }
      else { bg='rgba(254,202,202,.8)'; border='rgba(254,202,202,.8)'; }
    } else if (i === adp.qIdx) { bg='rgba(255,255,255,.95)'; border='#fff'; }
    else { bg='rgba(255,255,255,.15)'; border='rgba(255,255,255,.2)'; }
    dots += `<div style="width:9px;height:9px;border-radius:50%;background:${bg};border:2px solid ${border}"></div>`;
  }
  dots += `<span style="color:rgba(255,255,255,.8);font-size:.75rem;font-weight:600;margin-left:5px">${adp.qIdx+1}/${totalInRound}</span></div>`;

  // Το κουμπί θεωρίας προσφέρεται από την ανατροφοδότηση (λάθος: 2η κάρτα · σωστό: μετά το «Ανατροφοδότηση»)
  let theoryHtml = '';

  // Fullscreen theory overlay
  let theoryOverlay = '';
  if (adp.showTheory) {
    const tKey = getTheoryForQuestion(adp.penaltyOrigQ || q);
    if (tKey && THEORY_CARDS[tKey]) {
      const card = THEORY_CARDS[tKey];
      let pts = '';
      card.points.forEach(t => { pts += `<li style="margin-bottom:14px;line-height:1.65">${t}</li>`; });
      theoryOverlay = `
      <div id="theoryOverlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:999;overflow-y:auto;padding:64px 16px 48px">
        <div style="max-width:860px;margin:0 auto">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
            <h2 style="font-family:'IBM Plex Serif',serif;font-size:1.2rem;color:var(--ink)">📚 ${card.title}</h2>
            <button id="btnTheoryBack" style="padding:9px 18px;background:var(--accent);color:#fff;border:none;border-radius:999px;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer">← Επιστροφή</button>
          </div>
          <div class="card" style="border-left:5px solid var(--peach-deep)">
            <ul style="margin:0;padding-left:20px;list-style:none">${pts}</ul>
          </div>
        </div>
      </div>`;
    }
  }

  let html = `
  ${theoryOverlay}
  <div class="adp-header">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="font-size:.95rem;font-weight:300;color:rgba(255,255,255,.9)">Βήμα ${stepNum}: ${getCatDisplayName(catKey)}</span>
      <button onclick="screen='home';render();" class="hbtn">🏠<span class="hbtn-lbl">Αρχική</span></button>
      <button id="btnAdpRestart" class="hbtn" style="margin-left:6px">⏮<span class="hbtn-lbl">Έναρξη</span></button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      ${stepDots} ${dots}
    </div>
  </div>
  ${theoryHtml}
  ${(q.excerpt && !(q.type==='GAP' && (q.excerpt.includes('__________') || q.excerpt.includes('_____')))) ? `<div class="card" style="margin-bottom:14px">${renderExcerpt(q, 'adp')}</div>` : ''}
  <div class="${'answers-card' + (adp.answered ? (isOk ? ' answered-ok' : ' answered-ko') : '')}" id="answersCard">
    <p class="q-lbl">${qTypeLabel(q.type)}</p>
    ${q.type==='GAP' && (q.q.includes('__________') || q.q.includes('_____')) ? '' : `<p class="q-txt">${isCombo(q) ? '<span class="q-step-n">1</span>' : ''}${q.q}</p>`}`;

  html += renderQuestionBody(q, 'adp');

  const tKeyQ = getTheoryForQuestion(q);
  const hasTheory = !!(tKeyQ && THEORY_CARDS[tKeyQ]);
  if (adp.answered) {
    // Κάτω από τις ερωτήσεις: μόνο η ένδειξη «Σωστά» (το «Λάθος» εμφανίζεται στην κάρτα διόρθωσης)
    if (isOk) {
      html += `<div class="fb-box ok" style="margin-top:14px">
        <p class="fb-title" style="margin-bottom:0">✅ Σωστά!</p>
      </div>`;
      // Σωστό → αμέσως: κουμπί «Ανατροφοδότηση» (προαιρετικό) και από κάτω «Επόμενο»
      if (adp.showFbText) {
        const fbTextOk = getFeedback(q, adp.answer) || '';
        if (fbTextOk) html += `<p class="fb-card-2-text" style="margin-top:14px">${fbTextOk}</p>`;
        if (hasTheory) html += `<button class="btn-theory-2" id="btnTheory">📖 Οδηγίες θεωρίας →</button>`;
      } else {
        html += `<button class="btn-fb-reveal" id="btnFbReveal">💡 Ανατροφοδότηση</button>`;
      }
      html += `<button class="btn-next quiz-btn-full" id="btnNext">Επόμενο →</button>`;
    }
  } else if (!isAutoCheckType(q)) {
    html += `<button class="btn-check quiz-btn-full" id="btnCheck" ${canCheckAdp(q)?'':'disabled'}>Έλεγξε</button>`;
  }
  html += '</div>';

  // ΔΕΥΤΕΡΗ ΚΑΡΤΑ — μόνο στο λάθος (εμφανίζεται 1 δευτ. μετά την απάντηση)
  if (adp.answered && !isOk && adp.showFbCard) {
    const fbText = getFeedback(q, adp.answer) || '';
    html += `<div class="fb-card-2 ko" id="fbCard2">
      <p class="fb-card-2-title ko">❌ Λάθος</p>
      ${fbText ? `<p class="fb-card-2-text">${fbText}</p>` : ''}
      ${hasTheory ? `<button class="btn-theory-2" id="btnTheory">📖 Οδηγίες θεωρίας →</button>` : ''}
      <button class="btn-next quiz-btn-full" id="btnNext" style="margin-top:14px">Επόμενο →</button>
    </div>`;
  }
  // FAB action button (mobile only) — outside the answers-card
  if (adp.answered && (isOk || adp.showFbCard)) {
    html += `<div class="fab-action"><button class="fab-btn next" id="btnNextFab" title="Επόμενο">→</button></div>`;
  } else if (!adp.answered && !isAutoCheckType(q)) {
    html += `<div class="fab-action"><button class="fab-btn check" id="btnCheckFab" ${canCheckAdp(q)?'':'disabled'} title="Έλεγχος">✓</button></div>`;
  }
  return html;
}

  const catKey = catOrder[adp.catIdx];

  let theoryItems = '';
  theoryKeys.forEach(k => {
    if (THEORY_CARDS[k]) {
      theoryItems += `<p style="font-weight:700;margin-bottom:6px;color:var(--ko)">${THEORY_CARDS[k].title||''}</p>`;

  return `

      ${theoryItems ? `<div style="margin:10px 0 14px">${theoryItems}</div>` : ''}
      <p style="font-weight:700;margin-bottom:14px;color:var(--ko)">Θέλεις να επαναλάβεις την προσπάθεια ή να συνεχίσεις στο επόμενο βήμα;</p>
      <div class="tn-choices">
        <button class="tn-btn retry" id="btnRetryAgain">🔄 Επανάληψη</button>
        <button class="tn-btn skip" id="btnSkipToNext">${adp.catIdx < catOrder.length-1 ? '⏭ Επόμενο βήμα' : '🏁 Ολοκλήρωση'}</button>
      </div>
    </div>
  </div>`;
}

function renderAdpResults() {
  const passed = Object.values(adp.catLog).filter(v=>v==='pass').length;
  const skipped = Object.values(adp.catLog).filter(v=>v==='skip').length;
  const total = catOrder.length;
  const pct = Math.round((passed/total)*100);
  const emoji = pct>=80?'🎉':pct>=60?'👍':'📚';
  let catRows = catOrder.map((key, i) => {
    const status = adp.catLog[key] || 'incomplete';
    const cls = status==='pass' ? 'pass' : 'skip';
    const badge = status==='pass' ? '✅ Επιτυχία' : '⚠️ Χρειάζεται μελέτη';
    return `<div class="cat-summary-row ${cls}"><span class="cs-name">Βήμα ${i+1} — ${getCatDisplayName(key)}</span><span class="cs-badge">${badge}</span></div>`;
  }).join('');
  return `
  <div class="card" style="text-align:center;padding:28px 22px">
    <div style="font-size:2.8rem;margin-bottom:10px">${emoji}</div>
    <h2 style="font-family:'IBM Plex Serif',serif;font-size:1.4rem;margin-bottom:16px">Ολοκλήρωσες το Βήμα-Βήμα!</h2>
    <div class="score-box"><p class="score-big">${passed} / ${total}</p><p class="score-pct">βήματα με επιτυχία (${pct}%)</p></div>
    <div class="score-grid" style="margin:14px 0">
      <div class="sc g"><p>Επιτυχία</p><p>${passed}</p></div>
      <div class="sc r"><p>Χρειάζεται μελέτη</p><p>${skipped}</p></div>
      <div class="sc a"><p>Σύνολο</p><p>${total}</p></div>
    </div>
  </div>
  <div class="card"><p style="font-weight:700;margin-bottom:12px">Ανά βήμα:</p>${catRows}</div>
  <button class="btn-sec" id="btnNewAdp" style="margin-top:4px">🔄 Νέα προσπάθεια</button>
  <button class="btn-sec" id="btnHomeFromRes">↩ Αρχική</button>`;
}

// ══════════════════════════════════════════════
// ΓΡΗΓΟΡΗ ΕΞΑΣΚΗΣΗ — SETUP
// ══════════════════════════════════════════════
function getSelPool() {
  return allQ.filter(q => {
    if (sel.filterTypes.length && !sel.filterTypes.includes(q.type)) return false;
    if (sel.filterDiffs.length && !sel.filterDiffs.includes(q.diff)) return false;
    if (sel.filterCats.length) {
      if (!q.catKey) return false;
      // Κάθε επιλεγμένη κατηγορία: ακέραιος = βήμα (n.*) · πλήρες catKey = ακριβής
      const ok = sel.filterCats.some(fc => {
        const isStep = /^\d+$/.test(fc);
        return isStep ? q.catKey.startsWith(fc + '.') : q.catKey === fc;
      });
      if (!ok) return false;
    }
    return true;
  });
}

function renderSelSetup() {
  const pool = getSelPool();
  const typeMap = typeChipList();
  const typeChips = typeMap.map(({v, lbl}) => {
    const cnt = v==='all' ? allQ.length : allQ.filter(q=>q.type===v).length;
    return `<button class="fchip ${(v==='all'?sel.filterTypes.length===0:sel.filterTypes.includes(v))?'active':''}" data-sel-type="${v}">${lbl} <span class="fchip-count">(${cnt})</span></button>`;
  }).join('');

  // Βήματα: ομαδοποίηση ανά πρώτο ψηφίο του catKey
  // ΣΗΜΕΙΩΣΗ: Τα "Βήμα 1" και "Βήμα 2" αφαιρούνται — εμφανίζονται μόνο υποκατηγορίες
  const catMap = [{v:'all',lbl:'Όλα'}];
  // Επίσης υποκατηγορίες
  catOrder.forEach(k => {
    const cnt = (catsByKey[k]||[]).length;
    catMap.push({v:k, lbl:`${getCatDisplayName(k)}`, cnt, sub:false});
  });
  const catChips = catMap.map(({v, lbl, sub}) => {
    const cnt = v==='all' ? allQ.length : allQ.filter(q=>q.catKey && (q.catKey===v || q.catKey.startsWith(v+'.'))).length;
    const style = sub ? 'font-size:.8rem;padding:6px 12px;' : '';
    return `<button class="fchip ${(v==='all'?sel.filterCats.length===0:sel.filterCats.includes(v))?'active':''}" data-sel-cat="${v}" style="${style}">${lbl.trim()} <span class="fchip-count">(${cnt})</span></button>`;
  }).join('');

  const diffMap = [{v:'all',lbl:'Όλοι'},{v:1,lbl:'1 — Εύκολος'},{v:2,lbl:'2 — Μέτριος'},{v:3,lbl:'3 — Δύσκολος'}];
  const diffChips = diffMap.map(({v, lbl}) => {
    const cnt = v==='all' ? allQ.length : allQ.filter(q=>q.diff===v).length;
    return `<button class="fchip ${(v==='all'?sel.filterDiffs.length===0:sel.filterDiffs.includes(v))?'active':''}" data-sel-diff="${v}">${lbl} <span class="fchip-count">(${cnt})</span></button>`;
  }).join('');

  const countMap = [{n:10,lbl:'10'},{n:20,lbl:'20'},{n:0,lbl:'Όλες'}];
  const countChips = countMap.map(({n,lbl}) =>
    `<button class="fchip ${sel.filterCount===n?'active':''}" data-sel-count="${n}">${lbl}</button>`
  ).join('');

  const canStart = pool.length > 0;
  const actualCount = sel.filterCount === 0 ? pool.length : Math.min(sel.filterCount, pool.length);

  return `
  <div class="setup-screen">
  <div class="drll-header" style="display:flex;justify-content:space-between;align-items:center">
    <div><h2>⚡ Εξάσκηση</h2><p>Επίλεξε φίλτρα και ξεκίνα</p></div>
    <button id="btnSelHome" class="hbtn">🏠<span class="hbtn-lbl">Αρχική</span></button>
  </div>
  <div class="card setup-card">
    <div class="setup-sections">
      <div class="drll-setup-section"><h3>📂 Κατηγορία</h3><div class="filter-chips">${catChips}</div></div>
      <div class="drll-setup-section"><h3>❓ Τύπος Ερώτησης</h3><div class="filter-chips">${typeChips}</div></div>
      <div class="drll-setup-section"><h3>🔢 Αριθμός Ερωτήσεων</h3><div class="filter-chips">${countChips}</div></div>
    </div>
    <div>
      <div class="info ${canStart?'success':'warn'}" style="margin-top:4px">
        ${canStart ? `✅ Βρέθηκαν <strong>${pool.length}</strong> ερωτήσεις (θα εμφανιστούν <strong>${actualCount}</strong>)` : '⚠️ Δεν βρέθηκαν ερωτήσεις με αυτά τα φίλτρα'}
      </div>
      <button class="btn-go" id="btnSelStart" ${canStart?'':'disabled'} style="margin-top:6px">Ξεκινήστε →</button>
      <button class="btn-sec" id="btnSelPrint" ${canStart?'':'disabled'} style="margin-top:6px">🖨️ Εκτύπωση</button>
    </div>
  </div>
  </div>`;
}

// ══════════════════════════════════════════════
// ΓΡΗΓΟΡΗ ΕΞΑΣΚΗΣΗ — QUIZ
// ══════════════════════════════════════════════
function renderSel() {
  const q = sel.queue[sel.qIdx];
  prepAnswer(q, sel);
  const total = sel.queue.length;
  const isOk = sel.answered ? checkAnswer(q, sel.answer) : false;
  const scoreDisplay = sel.total > 0 ? `${sel.correct} / ${sel.total}` : `0 / ${total}`;
  const stepLabel = q.catKey ? `Βήμα ${q.catKey.split('.')[0]} — ${getCatDisplayName(q.catKey)}` : '—';

  let html = `
  <div class="drll-header" style="display:flex;justify-content:space-between;align-items:center">
    <div style="display:flex;flex-direction:column;gap:2px">
      <h2 style="margin:0">⚡ Εξάσκηση</h2>
      <span style="font-size:.8rem;opacity:.88">${scoreDisplay} &nbsp;·&nbsp; ${stepLabel}</span>
    </div>
    <div style="display:flex;gap:6px">
      ${setLockMode
        ? `<span class="hbtn" style="opacity:.7;cursor:default;pointer-events:none">🔒<span class="hbtn-lbl">Σετ ασκήσεων</span></span>`
        : `<button onclick="screen='home';render();" class="hbtn">🏠<span class="hbtn-lbl">Αρχική</span></button>
      <button onclick="screen='sel_setup';render();" class="hbtn">⏮<span class="hbtn-lbl">Έναρξη</span></button>`}
    </div>
  </div>
  `;

  if (q.excerpt && !(q.type==='GAP' && (q.excerpt.includes('__________') || q.excerpt.includes('_____')))) {
    html += `<div class="card" style="margin-bottom:14px">${renderExcerpt(q, 'sel')}</div>`;
  }

  html += `<div class="answers-card ${sel.answered ? (isOk ? 'answered-ok' : 'answered-ko') : ''}">
    <p class="q-lbl">Ερώτηση</p>
    ${q.type==='GAP' && (q.q.includes('__________') || q.q.includes('_____')) ? '' : `<p class="q-txt">${isCombo(q) ? '<span class="q-step-n">1</span>' : ''}${q.q}</p>`}
    ${renderSelQuestionBody(q)}
  </div>`;

  if (!sel.answered && !isAutoCheckType(q)) {
    html += `<button class="btn-check quiz-btn-full" id="btnSelCheck" ${canSelCheck()?'':'disabled'} style="margin-top:10px">Έλεγξε</button>`;
    html += `<div class="fab-action"><button class="fab-btn check" id="btnSelCheckFab" ${canSelCheck()?'':'disabled'} title="Έλεγχος">✓</button></div>`;
  } else if (sel.answered) {
    const last = sel.qIdx >= sel.queue.length - 1;
    html += `<button class="btn-next quiz-btn-full" id="btnSelNext">${last ? 'Αποτελέσματα →' : 'Επόμενο →'}</button>`;
    html += `<div class="fab-action"><button class="fab-btn next" id="btnSelNextFab" title="${last ? 'Αποτελέσματα' : 'Επόμενο'}">→</button></div>`;
  }

  return html;
}

function renderSelResults() {
  const total = sel.queue.length;
  const pct = total>0 ? Math.round((sel.correct/total)*100) : 0;
  const emoji = pct>=80?'🎉':pct>=60?'👍':'📚';
  return `
  <div class="card" style="text-align:center;padding:28px 22px">
    <div style="font-size:2.8rem;margin-bottom:10px">${emoji}</div>
    <h2 style="font-family:'IBM Plex Serif',serif;font-size:1.4rem;margin-bottom:16px">Τέλος Εξάσκησης!</h2>
    <div class="drll-results-score"><p class="drll-results-big">${sel.correct} / ${total}</p><p class="drll-results-sub">σωστές (${pct}%)</p></div>
    <div class="score-grid" style="margin:14px 0">
      <div class="sc g"><p>Σωστές</p><p>${sel.correct}</p></div>
      <div class="sc r"><p>Λάθος</p><p>${total - sel.correct}</p></div>
      <div class="sc a"><p>Σύνολο</p><p>${total}</p></div>
    </div>
  </div>
  ${setLockMode
    ? `<button class="btn-go" id="btnSelReplay" style="margin-top:4px">🔄 Ξανά το ίδιο σετ</button>`
    : `<button class="btn-go" id="btnSelAgain" style="margin-top:4px">🔄 Νέα εξάσκηση</button>
  <button class="btn-sec" id="btnSelHome2" style="margin-top:8px">↩ Αρχική</button>`}`;
}

// ══════════════════════════════════════════════
// QUESTION RENDERERS (shared)
// ══════════════════════════════════════════════
function renderExcerpt(q, mode) {
  if (q.type==='GAP') return renderExcerptGAP(q, mode);
  if (q.type==='CLK' || isCombo(q)) return renderExcerptCLK(q, mode);
  return `<div class="exc">${q.excerpt}</div>`;
}

function renderMC(q, mode, stO) {
  const st = stO || (mode==='adp' ? adp : sel);
  const keys = ['Α','Β','Γ','Δ'];
  const vals = [q.optA,q.optB,q.optC,q.optD].filter(Boolean);
  let html = '<div class="opts">';
  vals.forEach((v,i) => {
    const k = keys[i];
    let cls = 'opt'; let badge = '';
    if (st.answered) {
      const isCorrect = k===q.correct.trim().toUpperCase();
      const isSelected = k===st.answer;
      if (isSelected && isCorrect) { cls+=' ok'; badge='<span class="opt-badge">✓</span>'; }
      else if (isSelected && !isCorrect) { cls+=' ko'; badge='<span class="opt-badge">✕</span>'; }
      else if (isCorrect && st.answer!==q.correct.trim().toUpperCase()) cls+=' neutral-ok';
    } else {
      if (st.answer===k) cls+=' sel';
    }
    html += `<button class="${cls}" data-opt="${k}" data-mode="${mode}" ${st.answered?'disabled':''}><span class="opt-k">${k}</span>${v}${badge}</button>`;
  });
  html += '</div>';
  return html;
}

function renderGAPInput(q, mode, stO) {
  const st = stO || (mode==='adp' ? adp : sel);
  if (!stO && q.excerpt && (q.excerpt.includes('__________') || q.excerpt.includes('_____'))) return renderExcerptGAP(q, mode, q.excerpt);
  if (!stO && q.q && (q.q.includes('__________') || q.q.includes('_____'))) return renderExcerptGAP(q, mode, q.q);
  // Fallback: standalone large input
  if (!Array.isArray(st.answer)) st.answer = [''];
  const val = Array.isArray(st.answer) ? (st.answer[0]||'') : st.answer;
  const corrects = q.correct ? q.correct.split('|').map(s=>s.trim()).filter(Boolean) : [];
  let cls = 'gap-inp-large';
  let correctShow = '';
  if (st.answered) {
    const norm = s=>s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const alts = (corrects[0]||'').split('/').map(a=>norm(a));
    const ok = norm(val) && alts.some(a=>a===norm(val)||a.includes(norm(val))||norm(val).includes(a));
    cls += ok ? ' ok' : ' ko';
    if (!ok && corrects[0]) correctShow = `<div style="margin-top:8px;font-size:.88rem;color:var(--ok);font-weight:600">✓ ${corrects[0].split('/')[0]}</div>`;
  }
  return `<div class="gap-panel"><p class="gap-panel-lbl">Απάντησε</p><input class="${cls}" id="gapInp-0" data-gap-idx="0" data-mode="${mode}" type="text" placeholder="Γράψε εδώ…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text" value="${val.replace(/"/g,'&quot;')}" ${st.answered?'disabled':''}>${correctShow}</div>`;
}

function renderExcerptGAP(q, mode, textSource, stO) {
  const st = stO || (mode==='adp' ? adp : sel);
  const text = textSource || q.excerpt || '';
  if (!text) return '';
  const GAP_MARKER = '__________';
  let parts = text.split(GAP_MARKER);
  if (parts.length < 2) parts = text.split('_____');
  if (parts.length < 2) return `<div class="exc">${text}</div>`;
  const numGaps = parts.length - 1;

  if (!Array.isArray(st.answer) || st.answer.length !== numGaps) {
    st.answer = new Array(numGaps).fill('');
  }
  const corrects = q.correct ? q.correct.split('|').map(s=>s.trim()).filter(Boolean) : [];
  const norm = s=>s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

  // Κείμενο με placeholders (όχι inputs inline — αποφεύγουμε iOS zoom)
  let textHtml = '<div class="exc-gap">';
  for (let i = 0; i < parts.length; i++) {
    textHtml += parts[i];
    if (i < numGaps) {
      const val = st.answer[i] || '';
      if (st.answered) {
        const expected = corrects[i] || '';
        const alts = expected.split('/').map(a=>norm(a));
        const ok = norm(val) && alts.some(a=>a===norm(val)||a.includes(norm(val))||norm(val).includes(a));
        if (ok) {
          textHtml += `<span style="display:inline-block;background:var(--ok-bg);border:2px solid var(--ok);border-radius:8px;padding:1px 10px;font-weight:700;color:var(--ok)">${val}</span>`;
        } else {
          textHtml += `<span style="display:inline-block;background:var(--ko-bg);border:2px dashed var(--ko);border-radius:8px;padding:1px 8px;color:var(--ko);text-decoration:line-through">${val||'—'}</span>`;
          if (expected) textHtml += `<span style="display:inline-block;background:var(--ok-bg);border:2px solid var(--ok);border-radius:8px;padding:1px 10px;font-weight:700;color:var(--ok);margin-left:3px">✓ ${expected.split('/')[0]}</span>`;
        }
      } else {
        // Placeholder box — δείχνει τον αριθμό κενού
        const filled = val ? `<span style="display:inline-block;background:var(--accent);color:#fff;border-radius:8px;padding:1px 10px;font-weight:700">${val}</span>` : `<span style="display:inline-block;min-width:64px;border-bottom:2px solid var(--accent);color:var(--muted);font-size:.88rem;text-align:center">${numGaps>1?'('+String.fromCharCode(945+i)+')':'…'}</span>`;
        textHtml += filled;
      }
    }
  }
  textHtml += '</div>';

  // Input panels κάτω — ένα μεγάλο input ανά κενό
  let inputHtml = '';
  if (!st.answered) {
    for (let i = 0; i < numGaps; i++) {
      const val = st.answer[i] || '';
      const lbl = numGaps > 1 ? `Κενό ${String.fromCharCode(945+i)}` : 'Απάντησε';
      inputHtml += `<div class="gap-panel" style="${i>0?'margin-top:8px':''}">
        <p class="gap-panel-lbl">${lbl}</p>
        <input class="gap-inp-large" id="gapInp-${i}" data-gap-idx="${i}" data-mode="${mode}" type="text" placeholder="Γράψε εδώ…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text" value="${val.replace(/"/g,'&quot;')}">
      </div>`;
    }
  }

  return textHtml + inputHtml;
}

function renderExcerptCLK(q, mode) {
  const st = mode==='adp' ? adp : sel;
  const targets = q.targets.map(t=>t.trim().toLowerCase());
  const tokens = q.excerpt.split(/(\s+)/);
  const words = tokens.map(t => /^\s+$/.test(t) ? null : clkClean(t));
  const wordPhraseMap = {};
  const wordOnlyIdxs = tokens.reduce((acc,t,i)=>{if(!/^\s+$/.test(t))acc.push(i);return acc;},[]);
  targets.forEach(target=>{
    const parts=target.split(' ').filter(Boolean);
    if(parts.length<=1)return;
    for(let wi=0;wi<=wordOnlyIdxs.length-parts.length;wi++){
      const match=parts.every((p,pi)=>words[wordOnlyIdxs[wi+pi]]===p);
      if(match){for(let pi=0;pi<parts.length;pi++)wordPhraseMap[wordOnlyIdxs[wi+pi]]=target;}
    }
  });
  let html = `<div class="exc clk" id="excClk">`;
  tokens.forEach((tok,ti)=>{
    if(/^\s+$/.test(tok)){html+=tok;return;}
    const clean=words[ti];
    const phraseTarget=wordPhraseMap[ti];
    const isSingleTarget=targets.includes(clean)&&!phraseTarget;
    const isAnyTarget=!!(phraseTarget||isSingleTarget);
    const isSelPhrase=phraseTarget&&st.clkSelected.includes(phraseTarget);
    const isSelWord=!phraseTarget&&st.clkSelected.some(s=>s.toLowerCase()===clean);
    const isSelected=isSelPhrase||isSelWord;
    let cls='tok';
    if(st.answered){if(isAnyTarget)cls+=' hit';else if(isSelected&&!isAnyTarget)cls+=' miss';}
    else{if(isSelected)cls+=' sel';}
    const dataAttr=phraseTarget?`data-phrase="${phraseTarget.replace(/"/g,'&quot;')}" data-word="${tok.replace(/"/g,'&quot;')}" data-mode="${mode}"`:`data-word="${tok.replace(/"/g,'&quot;')}" data-mode="${mode}"`;
    html+=`<span class="${cls}" ${dataAttr}>${tok}</span>`;
  });
  html+='</div>';
  return html;
}

function renderDD(q, mode) {
  const st = mode==='adp' ? adp : sel;
  if (!q._shuffledRight) q._shuffledRight = shuffle(q.rightItems.map((r,i)=>({r,i})));
  const shuffledRight = q._shuffledRight;
  let html = '<div class="dd-wrap">';
  if (st.answered) {
    const correctPairs = parseCorrectDD(q.correct, q.leftItems, q.rightItems);
    html += '<div class="dd-slots">';
    shuffledRight.forEach(({r,i}) => {
      const usedByLeft = Object.entries(st.ddPairs).find(([,ri])=>ri===i);
      const li = usedByLeft ? parseInt(usedByLeft[0]) : null;
      const filledText = li !== null ? q.leftItems[li] : '—';
      const correctRi = li !== null ? correctPairs?.[li] : null;
      const isOk = correctRi === i;
      html += `<div class="dd-slot-row"><span class="dd-slot-lbl">${r}</span><div class="dd-slot ${isOk?'ok':'ko'}">${filledText}</div></div>`;
    });
    html += '</div>';
    const allOk = q.leftItems.every((_,li)=>st.ddPairs[li]===correctPairs?.[li]);
    if (!allOk && correctPairs) {
      html += '<div class="dd-correct-show"><p>✅ Σωστές αντιστοιχίσεις:</p>';
      q.leftItems.forEach((l,li)=>{ const ri=correctPairs[li]; html+=`<div class="dd-correct-row"><div class="dl">${l}</div><div class="da">→</div><div class="dr">${q.rightItems[ri]||'—'}</div></div>`; });
      html += '</div>';
    }
  } else {
    html += `<p class="dd-hint">🖱️ Σύρε chip στη σωστή θέση · Κινητό: πάτα chip → πάτα θέση</p>`;
    html += '<div class="dd-chips">';
    q.leftItems.forEach((l,li)=>{ const used=st.ddPairs[li]!==undefined; html+=`<div class="dd-chip ${used?'used':''}" draggable="${!used}" data-dd-li="${li}" data-mode="${mode}">${l}</div>`; });
    html += '</div><div class="dd-slots">';
    shuffledRight.forEach(({r,i})=>{
      const usedByLeft=Object.entries(st.ddPairs).find(([,ri])=>ri===i);
      const isFilled=usedByLeft!==undefined;
      const filledLi=isFilled?parseInt(usedByLeft[0]):null;
      const filledText=isFilled?q.leftItems[filledLi]:'↓ τοποθέτησε εδώ';
      html+=`<div class="dd-slot-row"><span class="dd-slot-lbl">${r}</span><div class="dd-slot ${isFilled?'filled':''}" data-dd-ri="${i}" data-mode="${mode}">${filledText}</div></div>`;
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

// ── Σώμα ερώτησης (κοινό για Βήμα-Βήμα και Εξάσκηση) ──
function renderQuestionBody(q, mode) {
  if (q.type==='MC'||q.type==='YN') return renderMC(q, mode);
  if (q.type==='DD') return renderDD(q, mode);
  if (q.type==='GAP') return renderGAPInput(q, mode);
  if (isCombo(q)) return renderComboSub(q, mode);
  if (q.type==='CAT') return renderCAT(q, mode);
  if (q.type==='ORD') return renderORD(q, mode);
  return '';
}

// 2ο σκέλος συνδυασμένων τύπων (CLKMC / CLKYN / CLKGAP) — ο εντοπισμός γίνεται στο απόσπασμα από πάνω
function renderComboSub(q, mode) {
  const st = mode==='adp' ? adp : sel;
  const v = subView(st);
  const hasGapMarks = q.sub==='GAP' && q.q2 && (q.q2.includes('__________') || q.q2.includes('_____'));
  const dflt = q.sub==='GAP' ? 'Συμπλήρωσε.' : 'Διάλεξε τη σωστή απάντηση.';
  let html = `<p class="q-step2"><span class="q-step-n">2</span>${hasGapMarks ? 'Συμπλήρωσε το κενό.' : (q.q2 || dflt)}</p>`;
  if (q.sub==='GAP') html += hasGapMarks ? renderExcerptGAP(q, mode, q.q2, v) : renderGAPInput(q, mode, v);
  else html += renderMC(q, mode, v);
  return html;
}

// Ταξινόμηση σε κατηγορίες (CAT): πάτα στοιχείο → πάτα κατηγορία
function renderCAT(q, mode) {
  const st = mode==='adp' ? adp : sel;
  const A = st.answer;
  if (!q._catShuffle) q._catShuffle = shuffle(q.catItems.map((_,i)=>i));
  const order = q._catShuffle;
  const chip = (i, extra='') => `<button type="button" class="chip ${extra}" data-cat-item="${i}" data-mode="${mode}" ${st.answered?'disabled':''}>${q.catItems[i].t}</button>`;
  let html = '';
  if (!st.answered) {
    html += `<p class="dd-hint">👆 Πάτα ένα στοιχείο και μετά την κατηγορία όπου ανήκει. Πάτα ένα τοποθετημένο στοιχείο για να το επιστρέψεις.</p>`;
    html += `<div class="cat-pool">${order.filter(i => A.a[i]===null).map(i => chip(i, A.pick===i?'picked':'')).join('')}</div>`;
  }
  html += '<div class="cat-buckets">';
  q.catNames.forEach((name, ci) => {
    const items = order.filter(i => A.a[i]===ci).map(i => {
      if (!st.answered) return chip(i);
      const ok = q.catItems[i].c === ci;
      return `<span class="chip ${ok?'ok':'ko'}">${ok?'✓ ':'✕ '}${q.catItems[i].t}${ok?'':`<span class="chip-fix">→ ${q.catNames[q.catItems[i].c]}</span>`}</span>`;
    }).join('');
    html += `<div class="cat-bucket ${(!st.answered && A.pick!==null)?'armed':''}" data-cat-bucket="${ci}" data-mode="${mode}">
      <p class="cat-bucket-h">${OPT_KEYS[ci]}. ${name}</p><div class="cat-bucket-items">${items}</div></div>`;
  });
  html += '</div>';
  return html;
}

// Βάλε σε σειρά (ORD): πάτα τα στοιχεία με τη σωστή σειρά
function renderORD(q, mode) {
  const st = mode==='adp' ? adp : sel;
  const A = st.answer;
  const n = q.ordItems.length;
  if (!q._ordShuffle) {
    let sh; let tries = 0;
    do { sh = shuffle(q.ordItems.map((_,i)=>i)); tries++; } while (tries < 10 && sh.every((v,i)=>q.ordItems[v]===q.ordItems[i]));
    q._ordShuffle = sh;
  }
  let html = '';
  if (!st.answered) html += `<p class="dd-hint">👆 Πάτα τα στοιχεία με τη σωστή σειρά. Πάτα ένα στοιχείο της σειράς σου για να το αφαιρέσεις.</p>`;
  html += '<ol class="ord-seq">';
  for (let pos = 0; pos < n; pos++) {
    const idx = A.seq[pos];
    if (idx === undefined) { html += `<li class="ord-slot"><span class="ord-n">${pos+1}</span></li>`; continue; }
    let cls = 'ord-slot filled';
    if (st.answered) cls = 'ord-slot ' + (q.ordItems[idx]===q.ordItems[pos] ? 'ok' : 'ko');
    html += `<li class="${cls}" ${st.answered?'':`data-ord-rm="${pos}" data-mode="${mode}"`}><span class="ord-n">${pos+1}</span><span>${q.ordItems[idx]}</span></li>`;
  }
  html += '</ol>';
  if (!st.answered) {
    html += `<div class="ord-pool">${q._ordShuffle.filter(i => !A.seq.includes(i)).map(i => `<button type="button" class="chip" data-ord-add="${i}" data-mode="${mode}">${q.ordItems[i]}</button>`).join('')}</div>`;
  } else if (!checkAnswer(q, A)) {
    html += `<div class="ord-correct"><p>✅ Σωστή σειρά:</p><ol>${q.ordItems.map(t=>`<li>${t}</li>`).join('')}</ol></div>`;
  }
  return html;
}

function renderSelQuestionBody(q) {
  return renderQuestionBody(q, 'sel');
}

function canSelCheck() {
  const q = sel.queue[sel.qIdx];
  if (!q || sel.answered) return false;
  return canCheckState(q, sel);
}

// ══════════════════════════════════════════════
// EVENTS
// ══════════════════════════════════════════════
function attachEvents() {
  // Home
  const btnAdp = document.getElementById('btnStartAdp');
  if (btnAdp) btnAdp.addEventListener('click', ()=>{ screen='adp_start'; render(); });

  const btnAdpFromBeginning = document.getElementById('btnAdpFromBeginning');
  if (btnAdpFromBeginning) btnAdpFromBeginning.addEventListener('click', ()=>startAdaptive(0));
  const btnAdpStartBack = document.getElementById('btnAdpStartBack');
  if (btnAdpStartBack) btnAdpStartBack.addEventListener('click', ()=>{ screen='home'; render(); });
  document.querySelectorAll('[data-adp-start-cat]').forEach(b=>b.addEventListener('click',()=>{
    startAdaptive(parseInt(b.dataset.adpStartCat));
  }));
  const btnSel = document.getElementById('btnStartSel');
  if (btnSel) btnSel.addEventListener('click', ()=>{ screen='sel_setup'; render(); });

  // Sel setup filters
  document.querySelectorAll('[data-sel-type]').forEach(b=>b.addEventListener('click',()=>{toggleSelFilter('filterTypes', b.dataset.selType);render();}));
  document.querySelectorAll('[data-sel-cat]').forEach(b=>b.addEventListener('click',()=>{toggleSelFilter('filterCats', b.dataset.selCat);render();}));
  document.querySelectorAll('[data-sel-diff]').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.selDiff;toggleSelFilter('filterDiffs', v==='all'?'all':parseInt(v));render();}));
  document.querySelectorAll('[data-sel-count]').forEach(b=>b.addEventListener('click',()=>{sel.filterCount=parseInt(b.dataset.selCount);render();}));
  const btnSelStart = document.getElementById('btnSelStart');
  if (btnSelStart) btnSelStart.addEventListener('click', startSelSession);
  const btnSelPrint = document.getElementById('btnSelPrint');
  if (btnSelPrint) btnSelPrint.addEventListener('click', printSelSetup);
  const btnSelHome = document.getElementById('btnSelHome');
  if (btnSelHome) btnSelHome.addEventListener('click', ()=>{ screen='home'; render(); });
  const btnSelCheck = document.getElementById('btnSelCheck');
  if (btnSelCheck) btnSelCheck.addEventListener('click', doSelCheck);
  const btnSelCheckFab = document.getElementById('btnSelCheckFab');
  if (btnSelCheckFab) btnSelCheckFab.addEventListener('click', doSelCheck);
  const btnSelNext = document.getElementById('btnSelNext');
  if (btnSelNext) btnSelNext.addEventListener('click', doSelNext);
  const btnSelNextFab = document.getElementById('btnSelNextFab');
  if (btnSelNextFab) btnSelNextFab.addEventListener('click', doSelNext);
  const btnSelAgain = document.getElementById('btnSelAgain');
  if (btnSelAgain) btnSelAgain.addEventListener('click', ()=>{ screen='sel_setup'; render(); });
  const btnSelReplay = document.getElementById('btnSelReplay');
  if (btnSelReplay) btnSelReplay.addEventListener('click', ()=>{
    sel.qIdx=0; sel.answer=null; sel.answered=false;
    sel.ddPairs={}; sel.clkSelected=[];
    sel.correct=0; sel.total=0; sel.results=[];
    if (sel._autoTimer){ clearTimeout(sel._autoTimer); sel._autoTimer=null; }
    screen='sel'; render();
  });
  const btnSelHome2 = document.getElementById('btnSelHome2');
  if (btnSelHome2) btnSelHome2.addEventListener('click', ()=>{ screen='home'; render(); });

  // MC/YN options (both modes)
  document.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', ()=>{
    const mode = b.dataset.mode;
    const st = mode==='adp' ? adp : sel;
    if (st.answered) return;
    if (st.answer && st.answer.__combo) st.answer.sub = b.dataset.opt; else st.answer = b.dataset.opt;
    render();
  }));

  // Ταξινόμηση σε κατηγορίες (CAT)
  document.querySelectorAll('[data-cat-item]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const st = b.dataset.mode==='adp' ? adp : sel;
    if (st.answered || !st.answer || !st.answer.__cat) return;
    const i = parseInt(b.dataset.catItem);
    if (st.answer.a[i] !== null) { st.answer.a[i] = null; st.answer.pick = null; }   // επιστροφή στη «δεξαμενή»
    else st.answer.pick = (st.answer.pick === i) ? null : i;
    render();
  }));
  document.querySelectorAll('[data-cat-bucket]').forEach(b => b.addEventListener('click', () => {
    const st = b.dataset.mode==='adp' ? adp : sel;
    if (st.answered || !st.answer || !st.answer.__cat || st.answer.pick === null) return;
    st.answer.a[st.answer.pick] = parseInt(b.dataset.catBucket);
    st.answer.pick = null;
    render();
  }));
  // Βάλε σε σειρά (ORD)
  document.querySelectorAll('[data-ord-add]').forEach(b => b.addEventListener('click', () => {
    const st = b.dataset.mode==='adp' ? adp : sel;
    if (st.answered || !st.answer || !st.answer.__ord) return;
    st.answer.seq.push(parseInt(b.dataset.ordAdd)); render();
  }));
  document.querySelectorAll('[data-ord-rm]').forEach(b => b.addEventListener('click', () => {
    const st = b.dataset.mode==='adp' ? adp : sel;
    if (st.answered || !st.answer || !st.answer.__ord) return;
    st.answer.seq.splice(parseInt(b.dataset.ordRm), 1); render();
  }));

  // CLK tokens
  document.querySelectorAll('[data-word]').forEach(b => b.addEventListener('click', ()=>{
    const mode = b.dataset.mode;
    const st = mode==='adp' ? adp : sel;
    if (st.answered) return;
    if (b.dataset.phrase) {
      const phrase = b.dataset.phrase;
      const idx = st.clkSelected.indexOf(phrase);
      if (idx!==-1) st.clkSelected.splice(idx,1); else st.clkSelected.push(phrase);
    } else {
      const w = String(b.dataset.word||'').replace(/[.;:!?«»"'()\[\]…·]/g,'').replace(/^,+|,+$/g,'').trim();
      const idx = st.clkSelected.indexOf(w);
      if (idx!==-1) st.clkSelected.splice(idx,1); else st.clkSelected.push(w);
    }
    render();
  }));

  // DD drag & drop
  let _ddDrag = null, _ddChip = null;
  document.querySelectorAll('[data-dd-li]').forEach(el => {
    const li = parseInt(el.dataset.ddLi);
    const mode = el.dataset.mode;
    const st = mode==='adp' ? adp : sel;
    if (el.classList.contains('used')) return;
    el.addEventListener('dragstart', e=>{ _ddDrag={li,mode}; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(li)); });
    el.addEventListener('dragend', ()=>el.classList.remove('dragging'));
    el.addEventListener('click', ()=>{
      if (st.answered) return;
      if (_ddChip && _ddChip.li===li && _ddChip.mode===mode) { _ddChip=null; document.querySelectorAll('[data-dd-li]').forEach(c=>c.classList.remove('dragging')); }
      else { _ddChip={li,mode}; document.querySelectorAll('[data-dd-li]').forEach(c=>c.classList.remove('dragging')); el.classList.add('dragging'); }
    });
  });
  document.querySelectorAll('[data-dd-ri]').forEach(slot => {
    const ri = parseInt(slot.dataset.ddRi);
    const mode = slot.dataset.mode;
    const st = mode==='adp' ? adp : sel;
    slot.addEventListener('dragover', e=>{ e.preventDefault(); slot.classList.add('over'); });
    slot.addEventListener('dragleave', ()=>slot.classList.remove('over'));
    slot.addEventListener('drop', e=>{
      e.preventDefault(); slot.classList.remove('over');
      if (!_ddDrag || _ddDrag.mode!==mode) return;
      Object.keys(st.ddPairs).forEach(k=>{ if(st.ddPairs[k]===ri) delete st.ddPairs[k]; });
      st.ddPairs[_ddDrag.li]=ri; _ddDrag=null; render();
    });
    slot.addEventListener('click', ()=>{
      if (st.answered) return;
      if (_ddChip && _ddChip.mode===mode) {
        Object.keys(st.ddPairs).forEach(k=>{ if(st.ddPairs[k]===ri) delete st.ddPairs[k]; });
        st.ddPairs[_ddChip.li]=ri; _ddChip=null;
        document.querySelectorAll('[data-dd-li]').forEach(c=>c.classList.remove('dragging'));
        render();
      } else {
        const ub = Object.entries(st.ddPairs).find(([,v])=>v===ri);
        if (ub) { delete st.ddPairs[parseInt(ub[0])]; render(); }
      }
    });
  });

  // GAP inputs (multi-gap support)
  document.querySelectorAll('[data-gap-idx]').forEach(inp => {
    const idx = parseInt(inp.dataset.gapIdx);
    const mode = inp.dataset.mode;
    const st = mode==='adp' ? adp : sel;
    inp.addEventListener('input', ()=>{
      if (st.answer && st.answer.__combo) {
        if (!Array.isArray(st.answer.sub)) st.answer.sub = [];
        st.answer.sub[idx] = inp.value;
      }
      else if (Array.isArray(st.answer)) { st.answer[idx] = inp.value; }
      else { st.answer = inp.value; }
      if (mode==='adp') { const d=!canCheckAdp(adp.queue[adp.qIdx]); const btn=document.getElementById('btnCheck'); if(btn) btn.disabled=d; const fab=document.getElementById('btnCheckFab'); if(fab) fab.disabled=d; }
      else { const d=!canSelCheck(); const btn=document.getElementById('btnSelCheck'); if(btn) btn.disabled=d; const fab=document.getElementById('btnSelCheckFab'); if(fab) fab.disabled=d; }
    });
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter') {
        const ready = mode==='adp' ? canCheckAdp(adp.queue[adp.qIdx]) : canSelCheck();
        if(ready) { mode==='adp' ? doCheck() : doSelCheck(); }
        else {
          // Focus next empty gap
          const next = document.getElementById('gapInp-'+(idx+1));
          if(next) next.focus();
        }
      }
    });
  });

  // Adaptive check/next
  const btnCheck = document.getElementById('btnCheck');
  if (btnCheck) btnCheck.addEventListener('click', doCheck);
  const btnCheckFab = document.getElementById('btnCheckFab');
  if (btnCheckFab) btnCheckFab.addEventListener('click', doCheck);
  const btnNext = document.getElementById('btnNext');
  if (btnNext) btnNext.addEventListener('click', doNext);
  const btnNextFab = document.getElementById('btnNextFab');
  if (btnNextFab) btnNextFab.addEventListener('click', doNext);

  // Προαιρετική αποκάλυψη ανατροφοδότησης στη σωστή απάντηση
  const btnFbReveal = document.getElementById('btnFbReveal');
  if (btnFbReveal) btnFbReveal.addEventListener('click', ()=>{ adp.showFbText=true; render(); });

  // Theory toggle — opens fullscreen overlay
  const btnTh = document.getElementById('btnTheory');
  if (btnTh) btnTh.addEventListener('click', ()=>{ adp.showTheory=true; render(); });
  const btnThBack = document.getElementById('btnTheoryBack');
  if (btnThBack) btnThBack.addEventListener('click', ()=>{ adp.showTheory=false; render(); });

  // Transitions
  const btnNextCat = document.getElementById('btnNextCat');
  if (btnNextCat) btnNextCat.addEventListener('click', startCatMain);
  const btnAdpRestart = document.getElementById('btnAdpRestart');
  if (btnAdpRestart) btnAdpRestart.addEventListener('click', ()=>{ screen='adp_start'; render(); });

  const btnPresRestartFromQ = document.getElementById('btnPresRestartFromQ');
  if (btnPresRestartFromQ) btnPresRestartFromQ.addEventListener('click', ()=>{ screen='pres_setup'; render(); });

  const btnHomeFromAdp = document.getElementById('btnHomeFromAdp');
  if (btnHomeFromAdp) btnHomeFromAdp.addEventListener('click', ()=>{ screen='home'; render(); });

  // Theory wall
  const btnRetry = document.getElementById('btnRetryAgain');
  if (btnRetry) btnRetry.addEventListener('click', ()=>{
    const catKey=catOrder[adp.catIdx]; adp.usedIds[catKey]=new Set(); delete adp.catLog[catKey]; mainQueueLog[catKey]=null;
    adp.penaltyMode=false; adp.penaltyOrigQ=null; adp.penaltyExtraQ=null; adp.penaltyStep=0;
    startCatMain();
  });
  const btnSkip = document.getElementById('btnSkipToNext');
  if (btnSkip) btnSkip.addEventListener('click', ()=>{
    if (adp.catIdx < catOrder.length-1) { adp.catIdx++; screen='cat_transition'; } else { screen='adp_results'; }
    render();
  });

  // Results
  const btnNewAdp = document.getElementById('btnNewAdp');
  if (btnNewAdp) btnNewAdp.addEventListener('click', startAdaptive);
  const btnHomeFromRes = document.getElementById('btnHomeFromRes');
  if (btnHomeFromRes) btnHomeFromRes.addEventListener('click', ()=>{ screen='home'; render(); });

  // Παρουσίαση — Home button
  const btnPres = document.getElementById('btnStartPres');
  if (btnPres) btnPres.addEventListener('click', ()=>{ screen='pres_setup'; render(); });
  const btnPresHome = document.getElementById('btnPresHome');
  if (btnPresHome) btnPresHome.addEventListener('click', ()=>{ screen='home'; render(); });
  const btnPresHomeFromQ = document.getElementById('btnPresHomeFromQ');
  if (btnPresHomeFromQ) btnPresHomeFromQ.addEventListener('click', ()=>{ screen='home'; render(); });
  const btnPresTheoryHome = document.getElementById('btnPresTheoryHome');
  if (btnPresTheoryHome) btnPresTheoryHome.addEventListener('click', ()=>{ screen='home'; render(); });

  // Παρουσίαση — Setup filters
  document.querySelectorAll('[data-pres-theory]').forEach(b=>b.addEventListener('click',()=>{
    const v = b.dataset.presTheory;
    togglePresFilter('filterTheories', v === 'all' ? 'all' : parseInt(v));
    render();
  }));
  document.querySelectorAll('[data-pres-type]').forEach(b=>b.addEventListener('click',()=>{
    const v = b.dataset.presType;
    togglePresFilter('filterTypes', v === 'all' ? 'all' : v);
    render();
  }));
  document.querySelectorAll('[data-pres-count]').forEach(b=>b.addEventListener('click',()=>{
    pres.filterCount = parseInt(b.dataset.presCount);
    render();
  }));
  const btnPresStart = document.getElementById('btnPresStart');
  if (btnPresStart) btnPresStart.addEventListener('click', startPresSession);
  const btnPresPrint = document.getElementById('btnPresPrint');
  if (btnPresPrint) btnPresPrint.addEventListener('click', printPresSetup);

  // Παρουσίαση — Θεωρία → Παραδείγματα
  const btnPresGoToExamples = document.getElementById('btnPresGoToExamples');
  if (btnPresGoToExamples) btnPresGoToExamples.addEventListener('click', ()=>{ screen='pres'; render(); });

  // Παρουσίαση — Παραδείγματα → Θεωρία
  const btnPresShowTheory = document.getElementById('btnPresShowTheory');
  if (btnPresShowTheory) btnPresShowTheory.addEventListener('click', ()=>{
    // Αλλάζουμε τη θεωρία στην τρέχουσα ερώτηση
    const q = pres.queue[pres.qIdx];
    if (q && q.theory) pres.theoryKey = q.theory;
    screen='pres_theory'; render();
  });

  // Παρουσίαση — Quiz controls
  const btnPresReveal = document.getElementById('btnPresReveal');
  if (btnPresReveal) btnPresReveal.addEventListener('click', ()=>{ pres.showAnswer=true; render(); });
  const btnPresNext = document.getElementById('btnPresNext');
  if (btnPresNext) btnPresNext.addEventListener('click', ()=>{
    pres.qIdx++; pres.showAnswer=false; render();
  });
  const btnPresFinish = document.getElementById('btnPresFinish');
  if (btnPresFinish) btnPresFinish.addEventListener('click', ()=>{ screen='home'; render(); });
}

// ══════════════════════════════════════════════
// CHECK / NEXT — ADAPTIVE
// ══════════════════════════════════════════════
// Συλλογή της τελικής απάντησης από την κατάσταση/τα πεδία πριν από τον έλεγχο
function collectAnswer(q, st) {
  if (q.type==='GAP' || q.sub==='GAP') {
    const gaps = Array.from(document.querySelectorAll('[data-gap-idx]')).map(inp=>inp.value.trim());
    if (gaps.length) { if (q.sub) st.answer.sub = gaps; else st.answer = gaps; }
  }
  if (q.type==='CLK') st.answer=[...st.clkSelected];
  if (isCombo(q)) st.answer.clk = [...st.clkSelected];
  if (q.type==='DD') st.answer={...st.ddPairs};
}

function doCheck() {
  const q = adp.queue[adp.qIdx];
  if (adp.answered) return;
  collectAnswer(q, adp);
  adp.answered = true;
  adp.showFbCard = false; adp.showFbText = false;
  const ok = checkAnswer(q, adp.answer);
  adp.roundResults.push(ok);
  adp.totalAnswered++; if (ok) adp.totalCorrect++;
  playSound(ok ? 'correct' : 'wrong');
  render();
  // Λάθος: η κάρτα ανατροφοδότησης εμφανίζεται μετά από 1 δευτ. · Σωστό: τα κουμπιά εμφανίζονται αμέσως
  if (adp._fbTimer) { clearTimeout(adp._fbTimer); adp._fbTimer=null; }
  if (!ok) {
    adp._fbTimer = setTimeout(()=>{
      adp._fbTimer = null;
      if (screen==='adaptive' && adp.answered) { adp.showFbCard = true; render(); }
    }, 1000);
  }
  // Βήμα-Βήμα: πάντα χειροκίνητα «Επόμενο» (χωρίς auto-advance)
}

function doNext() {
  if (adp._autoTimer) { clearTimeout(adp._autoTimer); adp._autoTimer=null; }
  if (adp._fbTimer) { clearTimeout(adp._fbTimer); adp._fbTimer=null; }
  adp.showFbCard = false; adp.showFbText = false;
  const catKey = catOrder[adp.catIdx];
  const wasOk = adp.roundResults[adp.roundResults.length - 1];
  const currentQ = adp.queue[adp.qIdx];

  // === ΚΑΤΑΣΤΑΣΗ «ΤΙΜΩΡΙΑ» (penaltyMode) ===
  if (adp.penaltyMode) {
    if (!wasOk) {
      // Λάθος μέσα στην τιμωρία → θεωρία + δίλημμα
      adp.penaltyMode = false;
      adp.catLog[catKey] = 'skip';
      screen = 'theory_wall'; render();
      return;
    }
    // Σωστό στην τιμωρία
    if (adp.penaltyStep === 0) {
      // Μόλις απάντησε σωστά την extra ερώτηση → τώρα ξαναβάζουμε την αρχική
      adp.penaltyStep = 1;
      // Εισάγουμε την αρχική ερώτηση (penaltyOrigQ) αμέσως μετά
      adp.queue.splice(adp.qIdx + 1, 0, adp.penaltyOrigQ);
      adp.qIdx++; resetQState(); render();
      return;
    } else {
      // Απάντησε σωστά και την αρχική → βγαίνουμε από τιμωρία, συνεχίζουμε
      adp.penaltyMode = false;
      adp.penaltyOrigQ = null;
      adp.penaltyExtraQ = null;
      adp.penaltyStep = 0;
      // Συνέχεια κανονικά στην επόμενη ερώτηση
      if (adp.qIdx < adp.queue.length - 1) {
        adp.qIdx++; resetQState(); render();
      } else {
        finishRound();
      }
      return;
    }
  }

  // === ΚΑΝΟΝΙΚΗ ΡΟΗSH ===
  if (!wasOk) {
    // Λάθος σε κανονική ερώτηση → ενεργοποίηση «τιμωρίας»
    const diff = currentQ.diff;
    const extraQ = getOneQuestionByDiff(catKey, diff, [...adp.usedIds[catKey]]);
    adp.penaltyMode = true;
    adp.penaltyOrigQ = currentQ;
    adp.penaltyStep = 0;
    if (extraQ) {
      adp.usedIds[catKey].add(extraQ.id);
      adp.penaltyExtraQ = extraQ;
      // Εισάγουμε την extra ερώτηση αμέσως μετά
      adp.queue.splice(adp.qIdx + 1, 0, extraQ);
      adp.qIdx++; resetQState(); render();
    } else {
      // Δεν υπάρχει extra ερώτηση ίδιας δυσκολίας → ξαναβάζουμε μόνο την αρχική
      adp.penaltyStep = 1; // πηγαίνουμε κατευθείαν στη retry original
      adp.queue.splice(adp.qIdx + 1, 0, currentQ);
      adp.qIdx++; resetQState(); render();
    }
    return;
  }

  // Σωστή κανονικά → επόμενη ερώτηση
  if (adp.qIdx < adp.queue.length - 1) {
    adp.qIdx++; resetQState(); render();
  } else {
    finishRound();
  }
}

function resetQState() {
  adp.answer = null; adp.answered = false;
  adp.ddPairs = {}; adp.ddSelected = null; adp.clkSelected = [];
  adp.showTheory = false;
  adp.showFbCard = false; adp.showFbText = false;
  if (adp._fbTimer) { clearTimeout(adp._fbTimer); adp._fbTimer=null; }
}

// ══════════════════════════════════════════════
// CHECK / NEXT — ΓΡΗΓΟΡΗ ΕΞΑΣΚΗΣΗ
// ══════════════════════════════════════════════
function buildInterleavedQueue(pool, count) {
  const bycat = {};
  pool.forEach(q => { const k=q.catKey||'_'; if(!bycat[k])bycat[k]=[]; bycat[k].push(q); });
  Object.keys(bycat).forEach(k=>{ bycat[k]=shuffle(bycat[k]); });

  const result = [];

  // 1η ερώτηση: από τα δύο πρώτα βήματα
  const firstCats = catOrder.slice(0,2).filter(k=>bycat[k]&&bycat[k].length);
  if (firstCats.length) {
    const fc = firstCats[Math.floor(Math.random()*firstCats.length)];
    result.push(bycat[fc].pop());
  }

  let remaining = count - result.length;
  let attempts = 0;
  while (remaining > 0 && attempts < 2000) {
    attempts++;
    const available = Object.keys(bycat).filter(k=>bycat[k].length>0);
    if (!available.length) break;

    const lastCat = result.length ? result[result.length-1].catKey||'_' : null;

    // No-3-consecutive-type
    let blockedType = null;
    if (result.length >= 2) {
      const t1 = result[result.length-1].type;
      const t2 = result[result.length-2].type;
      if (t1===t2) blockedType = t1;
    }

    const candidates = available.filter(k => {
      if (k===lastCat) return false;
      if (blockedType && !bycat[k].some(q=>q.type!==blockedType)) return false;
      return true;
    });
    const pickFrom = candidates.length ? candidates
      : available.filter(k=>k!==lastCat).length ? available.filter(k=>k!==lastCat)
      : available;

    const totalW = pickFrom.reduce((s,k)=>s+bycat[k].length,0);
    let r = Math.random()*totalW, chosen = pickFrom[0];
    for (const k of pickFrom) { r-=bycat[k].length; if(r<=0){chosen=k;break;} }

    // Αν blockedType, προτιμάμε ερώτηση διαφορετικού τύπου από το chosen
    let picked;
    if (blockedType) {
      const otherType = bycat[chosen].filter(q=>q.type!==blockedType);
      if (otherType.length) {
        const idx = bycat[chosen].indexOf(otherType[Math.floor(Math.random()*otherType.length)]);
        picked = bycat[chosen].splice(idx,1)[0];
      } else { picked = bycat[chosen].pop(); }
    } else { picked = bycat[chosen].pop(); }

    result.push(picked);
    remaining--;
  }
  return result;
}

function printSelSetup() {
  const pool = getSelPool();
  const count = sel.filterCount===0 ? pool.length : Math.min(sel.filterCount, pool.length);
  const queueToPrint = buildInterleavedQueue(pool, count);
  _printedQueue = queueToPrint;
  _printedSig = selFilterSig();
  showPrintModal(queueToPrint);
}

function startSelSession() {
  const pool = getSelPool();
  const count = sel.filterCount===0 ? pool.length : Math.min(sel.filterCount, pool.length);
  if (_printedQueue && _printedQueue.length && _printedSig === selFilterSig()) {
    sel.queue = _printedQueue.slice();   // ίδιο ακριβώς σετ με την εκτύπωση
  } else {
    sel.queue = buildInterleavedQueue(pool, count);
  }
  sel.qIdx=0; sel.answer=null; sel.answered=false;
  sel.ddPairs={}; sel.clkSelected=[];
  sel.correct=0; sel.total=0; sel.results=[];
  if (sel._autoTimer) clearTimeout(sel._autoTimer);
  screen='sel'; render();
}

function doSelCheck() {
  if (sel.answered) return;
  const q = sel.queue[sel.qIdx];
  collectAnswer(q, sel);
  const ok = checkAnswer(q, sel.answer);
  sel.answered = true; sel.results.push({ok}); sel.total++;
  if (ok) sel.correct++;
  playSound(ok ? 'correct' : 'wrong');
  render();
  // Χωρίς αυτόματη μετάβαση: ο χρήστης προχωρά με το κουμπί «Επόμενο».
  if (sel._autoTimer) { clearTimeout(sel._autoTimer); sel._autoTimer = null; }
}

function doSelNext() {
  if (sel._autoTimer) { clearTimeout(sel._autoTimer); sel._autoTimer=null; }
  if (screen!=='sel') return; // ο χρήστης έφυγε από την εξάσκηση εν τω μεταξύ
  if (sel.qIdx < sel.queue.length-1) {
    sel.qIdx++; sel.answer=null; sel.answered=false;
    sel.ddPairs={}; sel.clkSelected=[];
    render();
  } else { screen='sel_results'; render(); }
}

// ══════════════════════════════════════════════
// ΠΑΡΟΥΣΙΑΣΗ — State & Logic
// ══════════════════════════════════════════════
let pres = {
  filterTheories: [],    // αριθμοί θεωρίας (κενό = όλες) — πολλαπλή επιλογή
  filterTypes: [],       // τύποι ερώτησης (κενό = όλοι) — πολλαπλή επιλογή
  filterCount: 0,        // 0=Όλες, 10, 20
  queue: [],
  qIdx: 0,
  showAnswer: false,
  theoryKey: null,        // ποια θεωρία εμφανίζεται
};

// Εναλλαγή φίλτρου πολλαπλής επιλογής (όπως στην Εξάσκηση)
function togglePresFilter(key, val) {
  if (val === 'all') { pres[key] = []; return; }
  const arr = pres[key];
  const i = arr.indexOf(val);
  if (i === -1) arr.push(val); else arr.splice(i, 1);
}

function getPresPool() {
  let pool = [...allQ];
  if (pres.filterTheories.length) {
    const ts = pres.filterTheories.map(String);
    pool = pool.filter(q => ts.includes(String(q.theory)));
  }
  if (pres.filterTypes.length) pool = pool.filter(q => pres.filterTypes.includes(q.type));
  return pool;
}

// Υπογραφή φίλτρων Παρουσίασης — ώστε το «Ξεκίνα» να ακολουθεί το τυπωμένο σετ
function presFilterSig() {
  return [
    'pres',
    pres.filterTheories.slice().sort().join(','),
    pres.filterTypes.slice().sort().join(','),
    pres.filterCount
  ].join('|');
}

function printPresSetup() {
  const pool = getPresPool();
  const count = pres.filterCount === 0 ? pool.length : Math.min(pres.filterCount, pool.length);
  // Ίδια λογική με την Εξάσκηση: ανάμεικτο σετ (τυχαία σειρά, χωρίς συνεχόμενες
  // ίδιες κατηγορίες / τρεις ίδιους τύπους) + αποθήκευση για ταύτιση με το «Ξεκίνα»
  const queueToPrint = buildInterleavedQueue(pool, count);
  _printedQueue = queueToPrint;
  _printedSig = presFilterSig();
  showPrintModal(queueToPrint);
}

function startPresSession() {
  const pool = getPresPool();
  const count = pres.filterCount === 0 ? pool.length : Math.min(pres.filterCount, pool.length);
  if (_printedQueue && _printedQueue.length && _printedSig === presFilterSig()) {
    pres.queue = _printedQueue.slice();   // ίδιο ακριβώς σετ με την εκτύπωση
  } else {
    pres.queue = pool.slice(0, count);
  }
  pres.qIdx = 0;
  pres.showAnswer = false;
  // Με μία μόνο επιλεγμένη ενότητα εμφανίζεται η θεωρία της· αλλιώς η θεωρία της 1ης ερώτησης
  pres.theoryKey = pres.filterTheories.length === 1 ? parseInt(pres.filterTheories[0]) : (pres.queue[0] ? pres.queue[0].theory : null);
  // Πάμε πρώτα στη θεωρία
  if (pres.theoryKey && THEORY_CARDS[pres.theoryKey]) {
    screen = 'pres_theory';
  } else {
    screen = 'pres';
  }
  render();
}

function renderPresTheory() {
  const tKey = pres.theoryKey;
  if (!tKey || !THEORY_CARDS[tKey]) {
    screen = 'pres'; render(); return '';
  }
  const card = THEORY_CARDS[tKey];
  const totalQ = pres.queue.length;

  return `
  <div class="drll-header" style="display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,var(--peach-deep),#a0573a)">
    <div><h2 style="color:#fff">📚 Θεωρία ${tKey}</h2><p style="color:rgba(255,255,255,.85)">${card.title}</p></div>
    <button id="btnPresTheoryHome" class="hbtn">🏠<span class="hbtn-lbl">Αρχική</span></button>
  </div>
  <div class="card" style="border-left:5px solid var(--peach-deep)">
    <ul style="margin:0;padding-left:20px;list-style:none">
      ${card.points.map(p => `<li style="margin-bottom:12px;line-height:1.6">${p}</li>`).join('')}
    </ul>
  </div>
  <div style="display:flex;gap:10px;margin-top:4px">
    <button class="btn-go" id="btnPresGoToExamples" style="flex:1;background:var(--peach-deep)">📝 Παραδείγματα (${totalQ}) →</button>
  </div>`;
}

function renderPresSetup() {
  // Θεωρία chips
  const theoryChips = [{v:'all', lbl:'Όλα'}];
  const _theoryMax = Math.max(0, ...Object.keys(THEORY_CARDS).map(Number).filter(n=>!isNaN(n)));
  for (let i = 1; i <= _theoryMax; i++) {
    if (THEORY_CARDS[i]) {
      const cnt = allQ.filter(q => String(q.theory) === String(i)).length;
      theoryChips.push({v: i, lbl: `${i}) ${THEORY_CARDS[i].title.substring(0,30)}…`, cnt});
    }
  }
  const tChips = theoryChips.map(({v, lbl, cnt}) => {
    const c = v === 'all' ? allQ.length : cnt;
    const active = v === 'all' ? pres.filterTheories.length === 0 : pres.filterTheories.includes(v);
    return `<button class="fchip ${active?'active':''}" data-pres-theory="${v}">${lbl} <span class="fchip-count">(${c||0})</span></button>`;
  }).join('');

  // Τύπος chips
  const typeMap = typeChipList();
  const typeChips = typeMap.map(({v,lbl}) => {
    const ts = pres.filterTheories.map(String);
    const pool2 = ts.length === 0 ? allQ : allQ.filter(q=>ts.includes(String(q.theory)));
    const cnt = v==='all' ? pool2.length : pool2.filter(q=>q.type===v).length;
    const active = v === 'all' ? pres.filterTypes.length === 0 : pres.filterTypes.includes(v);
    return `<button class="fchip ${active?'active':''}" data-pres-type="${v}">${lbl} <span class="fchip-count">(${cnt})</span></button>`;
  }).join('');

  // Αριθμός chips
  const countMap = [{n:10,lbl:'10'},{n:20,lbl:'20'},{n:0,lbl:'Όλες'}];
  const countChips = countMap.map(({n,lbl}) =>
    `<button class="fchip ${pres.filterCount===n?'active':''}" data-pres-count="${n}">${lbl}</button>`
  ).join('');

  const pool = getPresPool();
  const canStart = pool.length > 0;
  const actualCount = pres.filterCount === 0 ? pool.length : Math.min(pres.filterCount, pool.length);

  return `
  <div class="setup-screen">
  <div class="drll-header" style="display:flex;justify-content:space-between;align-items:center">
    <div><h2>📋 Παρουσίαση</h2><p>Θεωρία &amp; παραδείγματα — επιλέξτε κεφάλαιο</p></div>
    <button id="btnPresHome" class="hbtn">🏠<span class="hbtn-lbl">Αρχική</span></button>
  </div>
  <div class="card setup-card">
    <div class="setup-sections">
      <div class="drll-setup-section"><h3>📚 Θεωρία / Κεφάλαιο</h3><div class="filter-chips">${tChips}</div></div>
      <div class="drll-setup-section"><h3>❓ Τύπος Ερώτησης</h3><div class="filter-chips">${typeChips}</div></div>
      <div class="drll-setup-section"><h3>🔢 Αριθμός Παραδειγμάτων</h3><div class="filter-chips">${countChips}</div></div>
    </div>
    <div>
      <div class="info ${canStart?'success':'warn'}" style="margin-top:4px">
        ${canStart ? `✅ Βρέθηκαν <strong>${pool.length}</strong> παραδείγματα (θα εμφανιστούν <strong>${actualCount}</strong>)` : '⚠️ Δεν βρέθηκαν ερωτήσεις με αυτά τα φίλτρα'}
      </div>
      <button class="btn-go" id="btnPresStart" ${canStart?'':'disabled'} style="margin-top:6px">Ξεκινήστε →</button>
      <button class="btn-sec" id="btnPresPrint" ${canStart?'':'disabled'} style="margin-top:6px">🖨️ Εκτύπωση</button>
    </div>
  </div>
  </div>`;
}

// Παρουσίαση: απόσπασμα εντοπισμού με (προαιρετική) επισήμανση των στόχων — λέξεων και φράσεων
function presClkHtml(q, show) {
  const targets = q.targets.map(t=>t.trim().toLowerCase());
  const tokens = String(q.excerpt||'').split(/(\s+)/);
  const words = tokens.map(t => /^\s+$/.test(t) ? null : clkClean(t));
  const wordIdx = tokens.reduce((acc,t,i)=>{ if(!/^\s+$/.test(t)) acc.push(i); return acc; },[]);
  const hit = new Set();
  targets.forEach(target => {
    const parts = target.split(' ').filter(Boolean);
    for (let wi=0; wi<=wordIdx.length-parts.length; wi++) {
      if (parts.every((p,pi)=>words[wordIdx[wi+pi]]===p)) for (let pi=0; pi<parts.length; pi++) hit.add(wordIdx[wi+pi]);
    }
  });
  let html = '<div class="exc" style="opacity:.9">';
  tokens.forEach((tok,i) => {
    html += (show && hit.has(i)) ? `<span style="background:var(--ok-bg);border-bottom:3px solid var(--ok);padding:2px 4px;font-weight:700">${tok}</span>` : tok;
  });
  return html + '</div>';
}
function presOptsHtml(q) {
  const vals = [q.optA,q.optB,q.optC,q.optD].filter(Boolean);
  let html = '<div class="opts">';
  vals.forEach((v,i) => {
    const k = OPT_KEYS[i]; const ok = pres.showAnswer && k===q.correct.trim().toUpperCase();
    html += `<button class="opt${ok?' ok':''}" disabled style="cursor:default;opacity:.85"><span class="opt-k">${k}</span>${v}${ok?'<span class="opt-badge">✓</span>':''}</button>`;
  });
  return html + '</div>';
}

function renderPresQuestionBody(q) {
  // Ίδιο rendering αλλά πάντα disabled — χωρίς δυνατότητα αλληλεπίδρασης
  if (q.type==='MC'||q.type==='YN') {
    const keys = ['Α','Β','Γ','Δ'];
    const vals = [q.optA,q.optB,q.optC,q.optD].filter(Boolean);
    let html = '<div class="opts">';
    vals.forEach((v,i) => {
      const k = keys[i];
      let cls = 'opt';
      if (pres.showAnswer) {
        const isCorrect = k===q.correct.trim().toUpperCase();
        if (isCorrect) { cls += ' ok'; }
      }
      html += `<button class="${cls}" disabled style="cursor:default;opacity:.85"><span class="opt-k">${k}</span>${v}${pres.showAnswer && k===q.correct.trim().toUpperCase() ? '<span class="opt-badge">✓</span>' : ''}</button>`;
    });
    html += '</div>';
    return html;
  }
  if (q.type==='DD') {
    // Εμφανίζουμε τα στοιχεία αντιστοίχισης χωρίς drag
    let html = '<div class="dd-container" style="opacity:.85">';
    html += '<div class="dd-left">';
    q.leftItems.forEach((l,i) => {
      html += `<div class="dd-chip used" style="cursor:default">${l}</div>`;
    });
    html += '</div>';
    if (pres.showAnswer) {
      html += '<div class="dd-right">';
      const correct = parseCorrectDD(q.correct, q.leftItems, q.rightItems);
      q.leftItems.forEach((l,li) => {
        const ri = correct ? correct[li] : li;
        const rText = q.rightItems[ri] || '?';
        html += `<div class="dd-slot-row"><span class="dd-slot-lbl">${l}</span><div class="dd-slot filled" style="border-color:var(--ok)">${rText}</div></div>`;
      });
      html += '</div>';
    } else {
      html += '<div class="dd-right">';
      q.rightItems.forEach(r => {
        html += `<div class="dd-slot-row"><span class="dd-slot-lbl">${r}</span><div class="dd-slot">—</div></div>`;
      });
      html += '</div>';
    }
    html += '</div>';
    return html;
  }
  if (q.type==='GAP') {
    const text = q.excerpt || q.q || '';
    const GAP_MARKER = '__________';
    let parts = text.split(GAP_MARKER);
    if (parts.length < 2) parts = text.split('_____');
    if (parts.length < 2) return `<div class="exc">${text}</div>`;
    const corrects = q.correct ? q.correct.split('|').map(s=>s.trim()).filter(Boolean) : [];
    let html = '<div class="exc-gap" style="opacity:.85">';
    for (let i = 0; i < parts.length; i++) {
      html += parts[i];
      if (i < parts.length - 1) {
        if (pres.showAnswer && corrects[i]) {
          html += `<span style="background:var(--ok-bg);border:2px solid var(--ok);border-radius:6px;padding:2px 10px;font-weight:700;color:var(--ok)">${corrects[i].split('/')[0]}</span>`;
        } else {
          html += `<input class="gap-inp" disabled placeholder="…" style="cursor:default">`;
        }
      }
    }
    html += '</div>';
    return html;
  }
  if (q.type==='CLK') return presClkHtml(q, pres.showAnswer);
  if (isCombo(q)) {
    let html = presClkHtml(q, pres.showAnswer);
    html += `<p class="q-step2"><span class="q-step-n">2</span>${q.q2 || (q.sub==='GAP' ? 'Συμπλήρωσε.' : 'Διάλεξε τη σωστή απάντηση.')}</p>`;
    if (q.sub==='GAP') {
      const ans = q.correct.split('|').map(x=>x.trim().split('/')[0]).filter(Boolean).join(' · ');
      html += pres.showAnswer ? `<div class="exc" style="border-left-color:var(--ok)"><b style="color:var(--ok)">✓ ${ans}</b></div>` : `<input class="gap-inp" disabled placeholder="…" style="cursor:default">`;
    } else html += presOptsHtml(q);
    return html;
  }
  if (q.type==='CAT') {
    let html = '';
    if (!pres.showAnswer) html += `<div class="cat-pool">${q.catItems.map(it=>`<span class="chip" style="cursor:default">${it.t}</span>`).join('')}</div>`;
    html += '<div class="cat-buckets">' + q.catNames.map((n,ci)=>`<div class="cat-bucket" style="cursor:default"><p class="cat-bucket-h">${OPT_KEYS[ci]}. ${n}</p><div class="cat-bucket-items">${pres.showAnswer ? q.catItems.filter(it=>it.c===ci).map(it=>`<span class="chip ok">${it.t}</span>`).join('') : ''}</div></div>`).join('') + '</div>';
    return html;
  }
  if (q.type==='ORD') {
    if (pres.showAnswer) return `<ol class="ord-seq">${q.ordItems.map((t,i)=>`<li class="ord-slot ok"><span class="ord-n">${i+1}</span><span>${t}</span></li>`).join('')}</ol>`;
    if (!q._ordShuffle) q._ordShuffle = shuffle(q.ordItems.map((_,i)=>i));
    return `<div class="ord-pool">${q._ordShuffle.map(i=>`<span class="chip" style="cursor:default">${q.ordItems[i]}</span>`).join('')}</div>`;
  }
  return '';
}

function renderPres() {
  if (!pres.queue.length) return '<div class="card"><p>Δεν βρέθηκαν παραδείγματα.</p></div>';
  const q = pres.queue[pres.qIdx];
  const total = pres.queue.length;
  const currentTheory = q.theory || pres.theoryKey;
  const theoryCard = currentTheory && THEORY_CARDS[currentTheory] ? THEORY_CARDS[currentTheory] : null;

  // Έλεγχος αν έχει αλλάξει το κεφάλαιο ή αν είναι η πρώτη ερώτηση
  const prevQ = pres.qIdx > 0 ? pres.queue[pres.qIdx - 1] : null;
  const prevTheory = prevQ ? (prevQ.theory || pres.theoryKey) : null;
  const chapterChanged = !prevQ || prevTheory !== currentTheory;

  let html = `
  <div class="drll-header" style="display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,var(--peach-deep),#a0573a)">
    <div style="display:flex;flex-direction:column;gap:2px">
      <h2 style="color:#fff;margin:0">📋 Παρουσίαση</h2>
      <span style="font-size:.8rem;color:rgba(255,255,255,.88)">${pres.qIdx+1} / ${total}</span>
    </div>
    <div style="display:flex;gap:6px">
      <button id="btnPresHomeFromQ" class="hbtn">🏠<span class="hbtn-lbl">Αρχική</span></button>
      <button id="btnPresRestartFromQ" class="hbtn">⏮<span class="hbtn-lbl">Έναρξη</span></button>
    </div>
  </div>
  `;

  // Εμφάνιση θεωρίας ΜΟΝΟ όταν αλλάζει κεφάλαιο (ξεχωριστή κάρτα)
  if (chapterChanged && theoryCard) {
    html += `<div class="card" style="background:linear-gradient(135deg,var(--amber-l),#fff);border-left:4px solid #d97706;margin-bottom:14px">
      <h3 style="font-family:'IBM Plex Serif',serif;font-size:1.1rem;color:#92400e;margin-bottom:8px">📚 ${theoryCard.title}</h3>
      <div style="color:#78350f;font-size:.9rem;line-height:1.6">${theoryCard.content}</div>
    </div>`;
  }

  // Κουμπί θεωρίας
  if (theoryCard) {
    html += `<button id="btnPresShowTheory" style="width:100%;text-align:left;padding:12px 16px;margin-bottom:12px;background:var(--cream);border:1.5px solid var(--cream-accent);border-radius:var(--r-sm);font-family:inherit;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--cream-text)">📖 ${theoryCard.title}</button>`;
  }

  // Αριθμός ερώτησης
  html += `<div class="card" style="margin-bottom:14px;padding:12px 22px"><p style="font-size:.85rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Ερώτηση ${pres.qIdx+1}</p>`;

  // Απόσπασμα (μόνο για MC, YN, DD — GAP/CLK το εμφανίζουν μέσα στο renderPresQuestionBody)
  if (q.excerpt && (q.type === 'MC' || q.type === 'YN' || q.type === 'DD' || q.type === 'CAT' || q.type === 'ORD')) {
    html += `<div class="exc" style="margin-bottom:14px">${q.excerpt}</div>`;
  }

  // Ερώτηση και επιλογές
  html += `<p class="q-txt">${q.q}</p>`;
  html += renderPresQuestionBody(q);
  html += `</div>`;

  // Κουμπιά
  if (!pres.showAnswer) {
    html += `<button class="btn-check" id="btnPresReveal" style="width:100%;margin-bottom:8px">💡 Βοηθός</button>`;
  }

  if (pres.qIdx < total - 1) {
    html += `<button class="btn-next" id="btnPresNext" style="width:100%">Επόμενο →</button>`;
  } else {
    html += `<button class="btn-next" id="btnPresFinish" style="width:100%">🏠 Τέλος</button>`;
  }

  if (pres.showAnswer) {
    const fb = q.fb && q.fb.find(f=>f);
    html += `<div class="fb-box ok" style="margin-top:12px"><p class="fb-title">💡 Βοηθός</p>${fb ? `<p>${fb}</p>` : `<p>${q.correct || ''}</p>`}</div>`;
  }

  return html;
}

// ZOOM CONTROL — CSS zoom (ακριβώς σαν browser zoom)
// ══════════════════════════════════════════════
let currentZoom = 100;

function updateZoomUI() {
  const m = document.getElementById('zoomMinus');
  const p = document.getElementById('zoomPlus');
  if (m) m.disabled = currentZoom <= 50;
  if (p) p.disabled = currentZoom >= 300;
  levToolsUpdate();
}

function setZoom(percent) {
  currentZoom = Math.max(50, Math.min(300, percent));
  document.body.style.zoom = String(currentZoom / 100);
  document.body.style.setProperty('--z', String(currentZoom / 100));
  ['levSide','levBot'].forEach(function(i){ const el = document.getElementById(i); if (el) el.style.zoom = String(100 / currentZoom); });
  // Τα fixed buttons (ήχος, zoom) πρέπει να αντισταθμίσουν το zoom
  const inv = 1 / (currentZoom / 100);
  document.querySelectorAll('.sound-toggle, .close-app-btn, .zoom-controls').forEach(el => {
    el.style.transform = 'scale(' + inv + ')';
    el.style.transformOrigin = el.classList.contains('zoom-controls') ? 'top left' : 'top right';
  });
  updateZoomUI();
  try { localStorage.setItem('syntaxi_zoom', currentZoom); } catch(e) {}
}

function zoomIn() { setZoom(currentZoom + 10); }
function zoomOut() { setZoom(currentZoom - 10); }

// Keyboard shortcuts (Cmd/Ctrl + Plus/Minus/0)
window.addEventListener('keydown', function(e) {
  if ((e.metaKey || e.ctrlKey) && (e.key === '+' || e.key === '=')) {
    e.preventDefault(); zoomIn(); return false;
  }
  if ((e.metaKey || e.ctrlKey) && e.key === '-') {
    e.preventDefault(); zoomOut(); return false;
  }
  if ((e.metaKey || e.ctrlKey) && e.key === '0') {
    e.preventDefault(); setZoom(100); return false;
  }
});
