<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - Αναφορικές προτάσεις</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Ink & neutrals */
  --ink:#2a2420; --ink2:#4a3f38; --muted:#8a7d73; --border:#e8e1d6;
  --bg:#f7f2e8; --white:#fff;

  /* Energy Insights palette */
  --cream:#f5f0e1; --cream-soft:#faf6ea; --cream-accent:#e8dfc4; --cream-text:#3d3a2e; --cream-deep:#8a7d4a;
  --peach:#f9e4d4; --peach-soft:#fcf0e5; --peach-accent:#f0c9a8; --peach-text:#5c3826; --peach-deep:#c97b5a;
  --mustard:#efe5b8; --mustard-soft:#f7f0d0; --mustard-accent:#d4b348; --mustard-text:#4a3f1a; --mustard-deep:#a68a2e;

  /* Semantic aliases — Energy Insights */
  --accent:#a68a2e;            /* Ώχρα deep — κύριο accent */
  --accent-l:#f7f0d0;          /* mustard-soft */
  --accent-d:#7d6820;          /* darker mustard */

  --ok:#7d6f1e;                /* Ήπιο σκούρο ώχρα/λαδί */
  --ok-l:#efe5b8;
  --ok-bg:#f7f0d0;

  --ko:#b54a2a;                /* Terracotta */
  --ko-l:#f9e4d4;
  --ko-bg:#fcf0e5;

  --warn:#c97b5a;              /* peach-deep */
  --warn-l:#fcf0e5;

  /* Legacy aliases — διατηρούνται για συμβατότητα με υπολειπόμενα inline styles του JS */
  --indigo:var(--accent); --indigo-l:var(--accent-l); --indigo-d:var(--accent-d);
  --green:var(--ok); --green-l:var(--ok-bg);
  --red:var(--ko); --red-l:var(--ko-bg);
  --amber:var(--warn); --amber-l:var(--warn-l);
  --teal:var(--accent); --teal-l:var(--accent-l);

  --r:18px;
  --r-sm:12px;
  --sh:0 2px 12px rgba(166,138,46,.06);
  --sh-h:0 4px 18px rgba(166,138,46,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden;width:100%;scroll-behavior:auto}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:20px 16px 48px;line-height:1.6;overflow-x:hidden;width:100%;max-width:100vw}
.wrap{max-width:860px;margin:0 auto}
.setup-screen{display:flex;flex-direction:column;min-height:calc(100vh - 68px)}
.setup-card{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.setup-sections{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:0}

/* card */
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);padding:24px;margin-bottom:14px}

/* loading */
.loading{text-align:center;padding:60px 20px}
.spin{width:42px;height:42px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ HOME ══ */
.home-title{font-family:'IBM Plex Serif',serif;font-size:1.7rem;font-weight:700;margin-bottom:6px;letter-spacing:-.015em}
.home-sub{color:var(--muted);font-size:.92rem;margin-bottom:28px}
.home-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:8px}
@media(max-width:540px){.home-cards{grid-template-columns:1fr}}
.home-card{border-radius:var(--r);padding:26px 22px;cursor:pointer;border:none;transition:all .2s;text-align:left;font-family:inherit;box-shadow:var(--sh);min-height:200px;display:flex;flex-direction:column}
@media(hover:hover) and (pointer:fine){
  .home-card:hover{transform:translateY(-2px);box-shadow:var(--sh-h)}
}
.home-card .hc-icon-wrap{border-radius:14px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:1.4rem}
.home-card .hc-title{font-family:'IBM Plex Serif',serif;font-size:1.15rem;font-weight:700;margin-bottom:6px;letter-spacing:-.01em}
.home-card .hc-desc{font-size:.84rem;line-height:1.55;flex:1}
.home-card .hc-arrow{display:inline-block;margin-top:16px;font-size:.82rem;font-weight:700}

/* c1 — Βήμα-Βήμα: ώχρα (πρωταρχικό) */
.home-card.c1{background:var(--mustard)}
.home-card.c1 .hc-icon-wrap{background:var(--mustard-accent);color:var(--mustard-text)}
.home-card.c1 .hc-title{color:var(--mustard-text)}
.home-card.c1 .hc-desc{color:var(--mustard-text);opacity:.72}
.home-card.c1 .hc-arrow{color:var(--mustard-deep)}

/* c4 — Γρήγορη Εξάσκηση: κρεμ (αντιστοιχεί στο "Επιλογή" του index) */
.home-card.c4{background:var(--cream)}
.home-card.c4 .hc-icon-wrap{background:var(--cream-accent);color:var(--cream-deep)}
.home-card.c4 .hc-title{color:var(--cream-text)}
.home-card.c4 .hc-desc{color:var(--cream-text);opacity:.72}
.home-card.c4 .hc-arrow{color:var(--cream-deep)}

/* c3 — Παρουσίαση: peach */
.home-card.c3{background:var(--peach)}
.home-card.c3 .hc-icon-wrap{background:var(--peach-accent);color:var(--peach-text)}
.home-card.c3 .hc-title{color:var(--peach-text)}
.home-card.c3 .hc-desc{color:var(--peach-text);opacity:.72}
.home-card.c3 .hc-arrow{color:var(--peach-deep)}

/* ══ ADAPTIVE LEARNING SCREEN ══ */
.adp-header{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;border-radius:var(--r);padding:18px 22px;margin-bottom:14px;box-shadow:var(--sh)}
.adp-header h2{font-family:'IBM Plex Serif',serif;font-size:1.25rem;font-weight:700;margin-bottom:4px;letter-spacing:-.01em}
.adp-header p{font-size:.84rem;opacity:.88}

/* phase badge */
.ph{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.ph.main{background:var(--accent-l);color:var(--accent)}
.ph.retry{background:var(--warn-l);color:var(--warn)}
.ph.fb{background:var(--ko-bg);color:var(--ko)}

/* progress dots */
.prog-dots{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.prog-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);background:var(--white);transition:all .2s;display:flex;align-items:center;justify-content:center;font-size:.6rem}
.prog-dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.prog-dot.ko{background:var(--ko);border-color:var(--ko);color:#fff}
.prog-dot.cur{border-color:var(--accent);background:var(--accent-l)}

/* answers card */
.answers-card{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);padding:24px;margin-bottom:14px;border-top:3px solid var(--border);transition:border-color .3s}
.answers-card.answered-ok{border-top-color:var(--ok);background:linear-gradient(to bottom,var(--ok-bg),var(--white))}
.answers-card.answered-ko{border-top-color:var(--ko);background:linear-gradient(to bottom,var(--ko-bg),var(--white))}

/* excerpt */
.exc-lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-bottom:8px}
.exc{font-family:'IBM Plex Serif',serif;background:var(--cream-soft);border-left:3px solid var(--accent);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:18px 22px;line-height:1.85;letter-spacing:.005em;font-size:1rem;color:var(--ink);text-align:justify;margin-bottom:0}
.exc.clk{cursor:default}
.tok{cursor:pointer;padding:1px 3px;border-radius:4px;transition:background .12s}
.tok:hover{background:var(--accent-l)}
.tok.sel{background:var(--accent);color:#fff}
.tok.hit{background:var(--ok);color:#fff}
.tok.miss{background:var(--ko);color:#fff}

/* question */
.q-lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.q-txt{font-size:1rem;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.5;letter-spacing:-.005em}

/* MC/YN */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{padding:22px 18px;border:2px solid var(--border);border-radius:var(--r-sm);background:var(--white);text-align:left;cursor:pointer;font-size:1rem;font-family:inherit;color:var(--ink);transition:all .2s;display:flex;align-items:center;gap:10px;position:relative;min-height:62px}
@media(hover:hover) and (pointer:fine){
  .opt:hover:not(:disabled){border-color:var(--mustard-accent);transform:translateX(2px)}
}
.opt.sel{border-color:var(--accent);background:var(--accent-l)}
.opt.ok{border-color:var(--ok);background:var(--ok);color:#fff;font-weight:600;transform:none}
.opt.ko{border-color:var(--ko);background:var(--ko);color:#fff;font-weight:600;transform:none}
.opt.neutral-ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.opt:disabled{cursor:default}
.opt-k{min-width:24px;height:24px;border-radius:50%;background:var(--border);color:var(--ink2);font-size:.72rem;font-weight:700;text-align:center;line-height:24px;flex-shrink:0}
.opt.ok .opt-k,.opt.ko .opt-k{background:rgba(255,255,255,.3);color:#fff}
.opt.neutral-ok .opt-k{background:rgba(125,111,30,.2);color:var(--ok)}
.opt-badge{position:absolute;top:6px;right:8px;font-size:.8rem;font-weight:700;line-height:1}

/* GAP */
.exc-gap{font-family:'IBM Plex Serif',serif;background:var(--cream-soft);border-left:3px solid var(--accent);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:18px 22px;line-height:2.1;letter-spacing:.005em;font-size:1rem;color:var(--ink);text-align:justify;margin-bottom:14px}
.gap-inp{display:inline-block;border:none;border-bottom:2px solid var(--accent);background:transparent;font-family:'IBM Plex Serif',serif;font-size:1rem;color:var(--accent);outline:none;min-width:120px;max-width:100%;padding:0 4px;text-align:center;box-sizing:border-box}
.gap-inp:disabled{color:var(--ok);border-color:var(--ok)}
.gap-inp.ok{color:var(--ok);border-color:var(--ok)}
.gap-inp.ko{color:var(--ko);border-color:var(--ko)}

/* DD */
.dd-wrap{width:100%}
.dd-hint{font-size:.78rem;color:var(--muted);font-style:italic;margin-bottom:12px}
.dd-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;min-height:44px;padding:12px;background:var(--cream-soft);border-radius:var(--r-sm);border:2px dashed var(--cream-accent);overflow:hidden;width:100%;box-sizing:border-box}
.dd-chip{padding:8px 14px;border:2px solid var(--accent);border-radius:var(--r-sm);font-size:.84rem;background:var(--white);cursor:grab;font-family:inherit;color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transition:all .15s;white-space:normal;word-break:break-word;max-width:100%;box-sizing:border-box;line-height:1.4}
.dd-chip:hover{background:var(--accent-l)}
.dd-chip.dragging{opacity:.4;cursor:grabbing}
.dd-chip.used{opacity:.35;cursor:default;border-style:dashed}
.dd-slots{display:flex;flex-direction:column;gap:8px}
.dd-slot-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.dd-slot-lbl{font-size:.875rem;font-weight:600;color:var(--ink2);white-space:nowrap;min-width:100px}
.dd-slot{padding:10px 14px;border:2px dashed var(--border);border-radius:var(--r-sm);font-size:.875rem;background:var(--cream-soft);min-height:44px;display:flex;align-items:center;color:var(--muted);font-style:italic;transition:all .15s;user-select:none;-webkit-user-select:none;width:100%;box-sizing:border-box}
.dd-slot.over{border-color:var(--accent);background:var(--accent-l);border-style:solid}
.dd-slot.filled{border-color:var(--accent);border-style:solid;background:var(--accent-l);color:var(--ink);font-style:normal;font-weight:600;cursor:pointer}
.dd-slot.filled:hover{background:var(--mustard)}
.dd-slot.ok{border-color:var(--ok);border-style:solid;background:var(--ok-bg);color:var(--ok);font-style:normal;font-weight:600}
.dd-slot.ko{border-color:var(--ko);border-style:solid;background:var(--ko-bg);color:var(--ko);font-style:normal}
.dd-correct-show{margin-top:12px;padding:14px;background:var(--ok-bg);border-radius:var(--r-sm);border:1px solid var(--mustard-accent)}
.dd-correct-show p{font-size:.78rem;color:var(--ok);font-weight:700;margin-bottom:8px}
.dd-correct-row{display:grid;grid-template-columns:1fr 20px 1fr;gap:4px;align-items:center;margin-bottom:4px;font-size:.83rem}

/* ── Νέοι τύποι: δεύτερο σκέλος (CLKMC/CLKYN/CLKGAP), ταξινόμηση (CAT), σειρά (ORD) ── */
.q-step2{margin:18px 0 12px;padding-top:14px;border-top:1px dashed var(--border);font-size:1rem;font-weight:700;color:var(--ink);line-height:1.5}
.q-step-n{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:.78rem;margin-right:8px;vertical-align:1px}
.cat-pool,.ord-pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:10px;border:2px dashed var(--border);border-radius:var(--r-sm);margin-bottom:12px}
.cat-pool:empty::after,.ord-pool:empty::after{content:'✓';color:var(--muted);font-size:.85rem;align-self:center}
.chip{padding:9px 14px;border:2px solid var(--accent);border-radius:var(--r-sm);font-size:.95rem;background:var(--white);cursor:pointer;font-family:inherit;color:var(--ink);line-height:1.4;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transition:all .15s;text-align:left;max-width:100%}
.chip:hover{background:var(--accent-l)}
.chip.picked{background:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--accent-l)}
.chip.ok{border-color:var(--ok);background:var(--ok-bg);cursor:default}
.chip.ko{border-color:var(--ko);background:var(--ko-bg);cursor:default}
.chip .chip-fix{display:block;font-size:.78rem;font-weight:700;color:var(--ok);margin-top:3px}
.cat-buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cat-bucket{border:2px solid var(--border);border-radius:var(--r-sm);padding:10px;min-height:86px;background:var(--cream-soft);cursor:pointer;transition:all .15s}
.cat-bucket.armed{border-color:var(--accent);background:var(--accent-l)}
.cat-bucket-h{font-weight:700;font-size:.92rem;color:var(--ink);margin-bottom:8px}
.cat-bucket-items{display:flex;flex-wrap:wrap;gap:6px}
.ord-seq{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.ord-slot{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px dashed var(--border);border-radius:var(--r-sm);min-height:46px;color:var(--muted);font-size:.95rem}
.ord-slot.filled{border-style:solid;border-color:var(--accent);background:var(--white);color:var(--ink);cursor:pointer}
.ord-slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
.ord-slot.ko{border-style:solid;border-color:var(--ko);background:var(--ko-bg);color:var(--ink)}
.ord-n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--cream-accent);color:var(--cream-text);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem}
.ord-correct{margin-top:12px;padding:14px;background:var(--ok-bg);border-radius:var(--r-sm);border:1px solid var(--ok)}
.ord-correct p{font-size:.8rem;color:var(--ok);font-weight:700;margin-bottom:6px}
.ord-correct ol{margin:0;padding-left:22px;line-height:1.7}

/* ── Δεύτερη κάρτα ανατροφοδότησης (λάθος, μετά από 1 δευτ.) & προαιρετική ανατροφοδότηση (σωστό) ── */
.fb-card-2{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);padding:22px 24px;margin-bottom:14px;border-top:3px solid var(--border);animation:fbIn .35s ease both}
.fb-card-2.ok{border-top-color:var(--ok);background:linear-gradient(to bottom,var(--ok-bg),var(--white))}
.fb-card-2.ko{border-top-color:var(--ko);background:linear-gradient(to bottom,var(--ko-bg),var(--white))}
@keyframes fbIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fb-card-2-title{font-family:'IBM Plex Serif',serif;font-weight:700;font-size:1.15rem;margin-bottom:10px;letter-spacing:-.01em}
.fb-card-2-title.ok{color:var(--ok)}
.fb-card-2-title.ko{color:var(--ko)}
.fb-card-2-text{color:var(--ink);font-size:1rem;line-height:1.7}
.btn-fb-reveal{display:block;width:100%;margin-top:10px;padding:14px;border:2px solid var(--accent);background:var(--white);color:var(--accent-d);border-radius:var(--r-sm);font-size:1rem;font-weight:700;font-family:inherit;cursor:pointer;transition:all .15s}
.btn-fb-reveal:hover{background:var(--accent-l)}
.btn-theory-2{display:block;width:100%;box-sizing:border-box;text-align:center;margin-top:14px;padding:14px;border:2px solid var(--peach-deep);background:var(--peach-soft);color:var(--peach-text);border-radius:var(--r-sm);font-size:1rem;font-weight:700;font-family:inherit;cursor:pointer;transition:all .15s}
.btn-theory-2:hover{background:var(--peach)}
.dd-correct-row .dl{padding:6px 10px;background:var(--mustard-soft);border-radius:8px;color:var(--ok)}
.dd-correct-row .dr{padding:6px 10px;background:var(--mustard-soft);border-radius:8px;color:var(--ok)}
.dd-correct-row .da{text-align:center;color:var(--muted)}
@media(max-width:480px){.dd-slot-row{grid-template-columns:1fr}.dd-slot-lbl{font-size:.8rem}}

/* feedback */
.fb-box{border-radius:var(--r-sm);padding:14px 16px;margin-top:14px;font-size:.89rem;line-height:1.65}
.fb-box.ok{background:var(--ok-bg);border-left:3px solid var(--ok)}
.fb-box.ko{background:var(--ko-bg);border-left:3px solid var(--ko)}
.fb-title{font-weight:700;margin-bottom:5px;font-size:.92rem}
.fb-box.ok .fb-title{color:var(--ok)}
.fb-box.ko .fb-title{color:var(--ko)}
.fb-box p{color:var(--ink2)}

/* theory box */
.theory-box{background:var(--cream);border:1px solid var(--cream-accent);border-radius:var(--r-sm);padding:14px 16px;margin-bottom:14px;font-size:.865rem}
.theory-box h4{color:var(--cream-deep);margin-bottom:8px;font-size:.9rem;font-weight:700}
.theory-box ul{margin-left:16px;color:var(--cream-text)}
.theory-box li{margin-bottom:3px}
.theory-toggle{background:none;border:none;color:var(--accent);cursor:pointer;font-size:.83rem;font-weight:600;padding:4px 0;margin-bottom:6px;font-family:inherit}

/* theory needed */
.theory-needed{background:var(--ko-bg);border:1px solid var(--peach-accent);border-radius:var(--r);padding:20px 22px;margin-top:14px}
.theory-needed h4{color:var(--ko);margin-bottom:10px;font-size:1rem;font-weight:700}
.theory-needed p{color:var(--peach-text);font-size:.875rem;margin-bottom:14px}
.theory-needed ul{margin:0 0 14px 16px;color:var(--peach-text)}
.theory-needed li{font-size:.835rem;margin-bottom:3px}
.tn-choices{display:flex;gap:10px;flex-wrap:wrap}
.tn-btn{flex:1;min-width:140px;padding:13px;border:none;border-radius:var(--r-sm);font-size:.92rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.tn-btn.retry{background:var(--warn);color:#fff}
.tn-btn.retry:hover{background:var(--ko)}
.tn-btn.skip{background:var(--accent);color:#fff}
.tn-btn.skip:hover{background:var(--accent-d)}

/* ══ HEADER NAV BUTTONS ══ */
.hbtn{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.4);border-radius:999px;color:#fff;font-family:inherit;font-weight:600;cursor:pointer;transition:background .15s;display:inline-flex;align-items:center;gap:5px;padding:7px 12px;font-size:1.1rem;line-height:1}
.hbtn:hover{background:rgba(255,255,255,.28)}
.hbtn .hbtn-lbl{display:none;font-size:.78rem}
@media(min-width:600px){
  .hbtn{font-size:1rem;padding:6px 14px}
  .hbtn .hbtn-lbl{display:inline}
}
.adp-start-header{background:linear-gradient(135deg,var(--mustard-deep),var(--accent-d));color:#fff;border-radius:var(--r);padding:18px 22px;margin-bottom:18px;box-shadow:var(--sh)}
.adp-start-header h2{font-family:'IBM Plex Serif',serif;font-size:1.2rem;font-weight:700;margin-bottom:3px}
.adp-start-header p{font-size:.84rem;opacity:.88}
.btn-adp-from-start{width:100%;padding:18px 20px;border:none;border-radius:var(--r-sm);background:var(--accent);color:#fff;font-size:1.12rem;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:-.01em;transition:background .15s;box-shadow:var(--sh);margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-adp-from-start:hover{background:var(--accent-d)}
.adp-steps-lbl{font-size:.73rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px}
.adp-steps-grid{display:flex;flex-direction:column;gap:8px}
.btn-adp-step{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:var(--r-sm);background:var(--white);color:var(--ink);font-size:.92rem;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .15s;text-align:left}
.btn-adp-step:hover{border-color:var(--mustard-accent);background:var(--mustard-soft)}
.btn-adp-step .step-num{min-width:28px;height:28px;border-radius:50%;background:var(--mustard);color:var(--mustard-text);font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-adp-step .step-name{font-weight:600;flex:1}
.btn-adp-step .step-count{font-size:.75rem;color:var(--muted)}

/* ══ GAP improved ══ */
.gap-panel{background:var(--cream-soft);border-radius:var(--r-sm);padding:16px;margin-top:14px}
.gap-panel-lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px}
.gap-inp-large{width:100%;padding:14px 16px;border:2px solid var(--accent);border-radius:var(--r-sm);background:var(--white);font-family:'IBM Plex Serif',serif;font-size:1.05rem;color:var(--ink);outline:none;box-sizing:border-box;transition:border-color .15s;-webkit-appearance:none}
.gap-inp-large:focus{border-color:var(--accent-d);box-shadow:0 0 0 3px rgba(166,138,46,.15)}
.gap-inp-large.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.gap-inp-large.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.cat-complete h3{color:var(--ok);font-family:'IBM Plex Serif',serif;font-size:1.1rem;margin-bottom:6px;font-weight:700}
.cat-complete p{color:var(--ok);font-size:.88rem}

/* buttons */
.btn-check{width:100%;padding:14px;border:none;border-radius:var(--r-sm);background:var(--accent);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px;transition:background .15s;letter-spacing:-.005em}
.btn-check:hover{background:var(--accent-d)}
.btn-check:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.btn-next{width:100%;padding:14px;border:none;border-radius:var(--r-sm);background:var(--ok);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px;transition:background .15s;letter-spacing:-.005em}
.btn-next:hover{background:var(--accent-d)}

/* FAB check/next icon — ΑΠΟΚΡΥΠΤΕΤΑΙ ΠΑΝΤΟΥ, κανονικά κουμπιά παντού */
.fab-action{display:none!important}
.fab-btn{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18);transition:all .2s;font-family:inherit;line-height:1}
.fab-btn.check{background:#2e8b57;color:#fff}
.fab-btn.check:hover{background:#247048;transform:scale(1.05)}
.fab-btn.check:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;box-shadow:none;transform:none}
.fab-btn.next{background:var(--accent);color:#fff}
.fab-btn.next:hover{background:var(--accent-d);transform:scale(1.05)}
/* Κανονικά κουμπιά — ορατά ΠΑΝΤΟΥ (desktop + mobile) */
.quiz-btn-full{display:block}
.btn-sec{width:100%;padding:12px;border:2px solid var(--border);border-radius:var(--r-sm);background:var(--white);color:var(--ink2);font-size:.92rem;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px;transition:all .15s}
.btn-sec:hover{border-color:var(--mustard-accent)}
.btn-go{width:100%;padding:15px;border:none;border-radius:var(--r-sm);background:var(--accent);color:#fff;font-size:1.02rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:6px;transition:background .15s;letter-spacing:-.005em}
.btn-go:hover{background:var(--accent-d)}
.btn-go:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}

/* final results */
.score-box{background:var(--accent-l);border-radius:var(--r);padding:20px;text-align:center;margin:14px 0}
.score-big{font-size:3rem;font-weight:700;color:var(--accent-d);line-height:1;letter-spacing:-.02em}
.score-pct{color:var(--muted);font-size:.95rem;margin-top:3px}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.sc{padding:14px;border-radius:var(--r-sm);text-align:center}
.sc p:first-child{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.sc p:last-child{font-size:1.5rem;font-weight:700;letter-spacing:-.015em}
.sc.g{background:var(--ok-bg)} .sc.g p{color:var(--ok)}
.sc.r{background:var(--ko-bg)} .sc.r p{color:var(--ko)}
.sc.a{background:var(--cream)} .sc.a p{color:var(--cream-deep)}

/* cat summary row */
.cat-summary-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:var(--r-sm);margin-bottom:7px;font-size:.89rem}
.cat-summary-row.pass{background:var(--ok-bg);border:1px solid var(--mustard-accent)}
.cat-summary-row.skip{background:var(--ko-bg);border:1px solid var(--peach-accent)}
.cat-summary-row .cs-name{font-weight:600}
.cat-summary-row.pass .cs-name{color:var(--ok)}
.cat-summary-row.skip .cs-name{color:var(--ko)}
.cat-summary-row .cs-badge{font-size:.75rem;padding:3px 10px;border-radius:999px;font-weight:700}
.cat-summary-row.pass .cs-badge{background:var(--mustard-accent);color:var(--ok)}
.cat-summary-row.skip .cs-badge{background:var(--peach-accent);color:var(--ko)}

/* info */
.info{background:var(--accent-l);border-radius:var(--r-sm);padding:12px 16px;font-size:.89rem;color:var(--accent-d);margin:14px 0;font-weight:500}
.info.warn{background:var(--warn-l);color:var(--ko)}
.info.success{background:var(--ok-bg);color:var(--ok)}

/* ══ ΓΡΗΓΟΡΗ ΕΞΑΣΚΗΣΗ — αντιστοιχεί στο "Επιλογή" του index, ώχρα accent ══ */
.drll-header{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;border-radius:var(--r);padding:18px 22px;margin-bottom:14px;box-shadow:var(--sh)}
.drll-header h2{font-family:'IBM Plex Serif',serif;font-size:1.25rem;font-weight:700;margin-bottom:4px;letter-spacing:-.01em}
.drll-header p{font-size:.84rem;opacity:.88}

/* setup filters */
.drll-setup-section{margin-bottom:22px}
.drll-setup-section h3{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px}
.filter-chips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{padding:8px 16px;border:2px solid var(--border);border-radius:999px;background:var(--white);font-size:.84rem;font-family:inherit;color:var(--ink2);cursor:pointer;transition:all .15s;font-weight:500}
.fchip:hover{border-color:var(--mustard-accent)}
.fchip.active{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:700}
.fchip-count{font-size:.72rem;opacity:.75;margin-left:3px}

/* drill score bar */
.drll-score-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--white);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px}
.drll-score-pts{font-size:1.2rem;font-weight:700;color:var(--accent);letter-spacing:-.015em}
.drll-score-lbl{font-size:.78rem;color:var(--muted);font-weight:500}
.drll-prog{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.drll-pd{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:var(--white)}
.drll-pd.ok{background:var(--ok);border-color:var(--ok)}
.drll-pd.ko{background:var(--ko);border-color:var(--ko)}
.drll-pd.cur{background:var(--accent-l);border-color:var(--accent)}

/* drill results */
.drll-results-score{background:linear-gradient(135deg,var(--mustard),var(--mustard-soft));border-radius:var(--r);padding:26px;text-align:center;margin:14px 0;border:2px solid var(--accent)}
.drll-results-big{font-size:3.2rem;font-weight:700;color:var(--accent-d);line-height:1;letter-spacing:-.02em}
.drll-results-sub{color:var(--muted);font-size:.92rem;margin-top:4px}

/* ══ Sound toggle (fixed top-right) ══ */
.sound-toggle{position:fixed;top:20px;right:20px;background:var(--white);border:2px solid var(--border);border-radius:50%;width:46px;height:46px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;box-shadow:var(--sh);z-index:1000;padding:0}
@media(hover:hover) and (pointer:fine){
  .sound-toggle:hover{border-color:var(--accent);transform:scale(1.05);box-shadow:var(--sh-h)}
}
.sound-toggle svg{width:22px;height:22px;color:var(--accent)}
.sound-toggle.muted{background:var(--ko-bg);border-color:var(--ko)}
.sound-toggle.muted svg{color:var(--ko)}
@media(max-width:600px){
  .sound-toggle{top:14px;right:14px;width:40px;height:40px}
  .sound-toggle svg{width:18px;height:18px}
}

/* ══ Close app button (fixed top-right, αριστερά του ήχου) ══ */
.close-app-btn{position:fixed;top:20px;right:78px;background:var(--white);border:2px solid var(--border);border-radius:50%;width:46px;height:46px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;box-shadow:var(--sh);z-index:1000;padding:0;color:var(--ko)}
.close-app-btn svg{width:20px;height:20px}
@media(hover:hover) and (pointer:fine){
  .close-app-btn:hover{border-color:var(--ko);background:var(--ko-bg);transform:scale(1.05);box-shadow:var(--sh-h)}
}
.close-app-btn:active{transform:scale(0.95)}
@media(max-width:600px){
  .close-app-btn{top:14px;right:64px;width:40px;height:40px}
  .close-app-btn svg{width:17px;height:17px}
}

/* ══ Zoom controls (fixed top-left, ίδιο στυλ με sound-toggle) ══ */
.zoom-controls{position:fixed;top:20px;left:20px;display:flex;gap:6px;z-index:1000}
.zoom-btn{background:var(--white);border:2px solid var(--border);border-radius:var(--r-sm);width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;box-shadow:var(--sh);padding:0;font-size:1.2rem;font-weight:700;color:var(--accent);font-family:inherit;line-height:1}
@media(hover:hover) and (pointer:fine){
  .zoom-btn:hover{border-color:var(--accent);background:var(--accent-l);box-shadow:var(--sh-h)}
}
.zoom-btn:active{transform:scale(0.95)}
.zoom-btn:disabled{opacity:.35;cursor:not-allowed}
@media(max-width:600px){
  .zoom-controls{display:none!important}
  .zoom-btn{width:36px;height:36px;font-size:1rem}
}

@media(max-width:600px){
  .score-grid{grid-template-columns:1fr}
  .home-cards{grid-template-columns:1fr}
  .exc{font-size:.93rem;line-height:1.6;letter-spacing:-.005em;padding:13px 16px}
  .exc-gap{font-size:.93rem;line-height:1.85;letter-spacing:-.005em;padding:13px 16px}
  /* iOS Safari auto-zoom εμφανίζεται όταν το font-size του input είναι <16px.
     Κρατάμε το input στα 16px για να αποφύγουμε το zoom-on-focus που προκαλεί
     την οριζόντια μετατόπιση της σελίδας. */
  .gap-inp{font-size:16px}
  .tn-choices{flex-direction:column}
  .dd-slot-row{grid-template-columns:1fr}
  .dd-slot-lbl{white-space:normal}
}

/* Αποτροπή iOS auto-zoom σε όλα τα text inputs + απενεργοποίηση double-tap zoom */
input[type="text"],input[type="search"],input[type="email"],input[type="number"],input[type="tel"],input[type="password"],textarea{font-size:16px;touch-action:manipulation}

/* ══ PRINT MODAL STYLES ══ */
.print-modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:2000;opacity:0;pointer-events:none;transition:opacity .3s}
.print-modal-overlay.active{opacity:1;pointer-events:auto}
.print-modal{background:var(--white);border-radius:var(--r);box-shadow:0 10px 40px rgba(0,0,0,.2);max-width:500px;width:90%;max-height:85vh;overflow-y:auto;padding:0}
.pm-hdr{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--white)}
.pm-hdr h2{font-family:'IBM Plex Serif',serif;font-size:1.1rem;font-weight:700;color:var(--ink);margin:0}
.pm-close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--muted);padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.pm-close:hover{color:var(--ink)}
.pm-section{padding:18px 22px;border-bottom:1px solid var(--border)}
.pm-section h3{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:12px}
.pm-lbl{display:block;font-size:.8rem;font-weight:600;color:var(--ink2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.pm-input,.pm-textarea,.pm-select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-family:inherit;font-size:.9rem;color:var(--ink);background:var(--white);transition:border-color .2s}
.pm-input:focus,.pm-textarea:focus,.pm-select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(166,138,46,.1)}
.pm-textarea{min-height:60px;resize:vertical}
.pm-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pm-toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;margin:10px 0}
.pm-toggle-row label:first-child{font-size:.88rem;font-weight:600;color:var(--ink2)}
.pm-switch{position:relative;display:inline-block;width:48px;height:26px}
.pm-switch input{opacity:0;width:0;height:0}
.pm-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#ccc;transition:.4s;border-radius:26px}
.pm-slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background-color:#fff;transition:.4s;border-radius:50%}
.pm-switch input:checked+.pm-slider{background-color:var(--accent)}
.pm-switch input:checked+.pm-slider:before{transform:translateX(22px)}
.pm-footer{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap}
.pm-btn{flex:1 1 auto;min-width:0;padding:12px 16px;border:none;border-radius:var(--r-sm);font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap}
@media (max-width:600px){
  .pm-footer{gap:8px;padding:14px 16px}
  .pm-btn{flex:1 1 calc(50% - 4px);padding:11px 10px;font-size:.82rem}
}
.pm-btn-primary{background:var(--accent);color:#fff}
.pm-btn-primary:hover{background:var(--accent-d);transform:translateY(-1px)}
.pm-btn-secondary{background:var(--border);color:var(--ink)}
.pm-btn-secondary:hover{background:#d4d4d4}


/* ═══ ΑΡΧΙΚΗ ΣΕΛΙΔΑ στο ύφος του ΛΕΒΙΑΘΑΝ ═══ */
.lev-home{text-align:center;padding:28px 4px 8px}
.lev-logo{height:84px;width:auto;margin:0 auto 16px;display:block}
.lev-eyebrow{color:#8A7D4A;letter-spacing:2.5px;font-weight:700;font-size:.72rem;text-transform:uppercase;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;margin-bottom:8px}
.lev-title{color:#0F1E33;font-weight:800;letter-spacing:-.02em;font-size:clamp(1.9rem,5.2vw,2.9rem);line-height:1.12;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;margin:0 0 14px}
.lev-title em{font-style:normal;color:#8A7D4A}
.lev-accent{width:64px;height:4px;border-radius:4px;margin:0 auto 16px;background:linear-gradient(90deg,#00A9C2 0 50%,#F39200 50% 100%)}
.lev-sub{color:#6B6B80;font-size:.95rem;margin-bottom:28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif}
.lev-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;text-align:left}
@media(max-width:760px){.lev-cards{grid-template-columns:1fr;max-width:380px;margin:0 auto}}
.lev-card{position:relative;border:1px solid #E9E0C8;border-radius:18px;background:#F7F3E8;padding:22px 22px 18px;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;text-align:left;
  box-shadow:0 2px 6px rgba(26,26,26,.05),0 10px 30px rgba(26,26,26,.07);transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column;min-height:210px}
.lev-card:hover{transform:translateY(-3px);box-shadow:0 4px 10px rgba(26,26,26,.06),0 16px 36px rgba(26,26,26,.10)}
.lev-card.t2{background:#FAE0CC;border-color:#F0C4A0}
.lev-card.t3{background:#F0E4A8;border-color:#D9BE52}
.lev-card .lc-num{font-size:2.6rem;font-weight:800;line-height:1;color:#0F1E33;opacity:.14;margin-bottom:10px;letter-spacing:-.02em}
.lev-card .lc-eyebrow{font-size:.66rem;letter-spacing:2px;font-weight:700;text-transform:uppercase;color:#5C5330;margin-bottom:3px}
.lev-card .lc-title{font-size:1.08rem;font-weight:700;color:#1A1A1A;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid rgba(26,26,26,.1)}
.lev-card .lc-desc{font-size:.82rem;line-height:1.5;color:#3d3a2e;opacity:.8;flex:1}
.lev-card .lc-count{margin-top:12px;font-size:.76rem;font-weight:700;color:#5C5330}
.lev-credits{margin:30px auto 0;padding-top:10px;border-top:1px solid #E0D8C2;width:max-content;max-width:100%;font-size:.72rem;letter-spacing:1.5px;color:#6B6B80;text-transform:uppercase;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif}
.card.lev-home-card{background:transparent;box-shadow:none;padding:0}

/* ═══ Σκούρα πλευρική μπάρα που ανοιγοκλείνει (όπως στο ΛΕΒΙΑΘΑΝ) — μόνο σε μεγάλες οθόνες ═══ */
.lev-side{display:none}
@media(min-width:900px){
  .lev-side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:70px;background:#1a1a1a;z-index:100;transition:width .2s ease;border-right:1px solid rgba(255,255,255,.06);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif}
  body{padding-left:86px;transition:padding-left .2s ease}
  body.ls-open{padding-left:266px} body.ls-open .lev-side{width:250px}
  .ls-head{display:flex;align-items:center;gap:8px;padding:14px 12px;border-bottom:1px solid rgba(255,255,255,.06);min-height:66px}
  .ls-logo{height:52px;width:auto;display:none}
  body.ls-open .ls-logo{display:block}
  .ls-toggle{margin-left:auto;flex-shrink:0;background:transparent;border:1px solid rgba(255,255,255,.12);color:#8e8ea0;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
  .ls-toggle:hover{color:#ececec;border-color:rgba(255,255,255,.25)}
  body:not(.ls-open) .ls-toggle{margin:0 auto}
  .ls-nav{flex:1;padding:8px;overflow-y:auto}
  .ls-item{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;background:transparent;border:none;border-radius:8px;color:#8e8ea0;font-size:13px;cursor:pointer;margin-bottom:2px;text-align:left;font-family:inherit}
  .ls-item:hover{background:rgba(255,255,255,.05);color:#ececec}
  .ls-item.on{background:rgba(255,255,255,.09);color:#ececec}
  .ls-ic{flex-shrink:0;width:28px;height:24px;display:flex;align-items:center;justify-content:center;font-size:14px}
  .ls-num{border-radius:7px;color:#3d3a2e;font-size:11px;font-weight:800}
  .ls-item.done .ls-num{background:#16a34a!important;color:#fff}
  .ls-tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ls-sec{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#5f5f6e;padding:10px 10px 6px}
  body:not(.ls-open) .ls-tx,body:not(.ls-open) .ls-sec{display:none}
  body:not(.ls-open) .ls-item{justify-content:center;padding:8px 0}
  .ls-div{height:1px;background:rgba(255,255,255,.06);margin:8px 4px}
  .ls-foot{padding:10px 12px;border-top:1px solid rgba(255,255,255,.06);color:#5f5f6e;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body:not(.ls-open) .ls-foot{font-size:0}
  body:not(.ls-open) .ls-foot::before{content:'©';font-size:12px;display:block;text-align:center}
}
/* Σε υπολογιστή, τα πάνω κουμπιά (−/+, ✕, ήχος) μεταφέρονται στην πλευρική μπάρα */
@media(min-width:900px){
  .zoom-controls,.close-app-btn,.sound-toggle{display:none!important}
  /* το zoom της σελίδας δεν μεγαλώνει το περιθώριο της μπάρας */
  body{padding-left:calc(86px / var(--z,1))}
  body.ls-open{padding-left:calc(266px / var(--z,1))}
  .ls-tools{padding:6px 8px;border-top:1px solid rgba(255,255,255,.06)}
  .ls-item.muted .ls-ic{opacity:.55}
  .ls-item.exit:hover{color:#fca5a5;background:rgba(248,113,113,.10)}
  .ls-zoom{display:flex;align-items:center;gap:6px;padding:5px 10px;color:#8e8ea0;font-size:13px;margin-bottom:2px}
  .ls-zbtn,.ls-zval{height:26px;border-radius:6px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#ececec;cursor:pointer;font-family:inherit;flex-shrink:0}
  .ls-zbtn{width:26px;font-size:15px;line-height:1;padding:0}
  .ls-zval{min-width:48px;font-size:11.5px;color:#b4b4c0;padding:0 4px}
  .ls-zbtn:hover:not(:disabled),.ls-zval:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.05)}
  .ls-zbtn:disabled{opacity:.3;cursor:not-allowed}
  body:not(.ls-open) .ls-zoom{flex-direction:column;padding:4px 0;gap:4px}
  body:not(.ls-open) .ls-zoom .ls-ic,body:not(.ls-open) .ls-zval{display:none}
}
/* ═══ Πλαίσιο εκτύπωσης ═══ */
.lev-pp-ov{position:fixed;inset:0;background:rgba(15,30,51,.45);display:flex;align-items:center;justify-content:center;z-index:1900;opacity:0;pointer-events:none;transition:opacity .2s;padding:16px}
.lev-pp-ov.on{opacity:1;pointer-events:auto}
.lev-pp{background:#FBF8F0;border:1px solid #E9E0C8;border-radius:18px;box-shadow:0 20px 50px rgba(15,30,51,.25);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:22px 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;color:#1A1A1A}
.lev-pp-head{position:relative;margin-bottom:6px}
.lev-pp-eye{color:#8A7D4A;letter-spacing:2px;font-weight:700;font-size:.66rem;text-transform:uppercase;margin:0 0 2px}
.lev-pp h3{font-size:1.25rem;font-weight:800;color:#0F1E33;margin:0}
.lev-pp-x{position:absolute;top:0;right:0;width:32px;height:32px;border-radius:8px;border:1px solid #E0D8C2;background:#fff;cursor:pointer;color:#6B6B80}
.lev-pp-lbl{font-size:.72rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#5C5330;margin:18px 0 8px}
.lev-pp-cats{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow-y:auto;padding-right:2px}
.lev-pp-chip{display:flex;align-items:center;gap:10px;text-align:left;padding:7px 10px;border:1px solid #E9E0C8;border-radius:10px;background:#fff;cursor:pointer;font-size:.86rem;color:#3d3a2e;font-family:inherit}
.lev-pp-chip.all{font-weight:700;justify-content:center}
.lev-pp-chip.on{border-color:#0F1E33;background:#0F1E33;color:#fff}
.lev-pp-n{flex-shrink:0;width:28px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#3d3a2e}
.lev-pp-counts{display:flex;gap:8px}
.lev-pp-cnt{flex:1;padding:9px 0;border:1px solid #E9E0C8;border-radius:10px;background:#fff;cursor:pointer;font-weight:700;color:#3d3a2e;font-family:inherit}
.lev-pp-cnt.on{border-color:#0F1E33;background:#0F1E33;color:#fff}
.lev-pp-info{margin:14px 0 0;font-size:.86rem;color:#6B6B80}
.lev-pp-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.lev-pp-btn{padding:10px 18px;border-radius:10px;border:none;background:#0F1E33;color:#fff;font-weight:700;cursor:pointer;font-family:inherit}
.lev-pp-btn.sec{background:transparent;border:1px solid #E0D8C2;color:#3d3a2e}
.lev-pp-btn:disabled{opacity:.4;cursor:not-allowed}

/* ═══ Λεπτή σκούρα κάτω μπάρα για κινητά/tablet (όπως στο ΛΕΒΙΑΘΑΝ) ═══ */
.lev-bot{display:none}
@media(max-width:899px){
  .lev-bot{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:900;background:#1a1a1a;border-top:1px solid rgba(255,255,255,.08);
    padding:4px 6px calc(4px + env(safe-area-inset-bottom));justify-content:space-around;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif}
  .lb-item{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;background:transparent;border:none;border-radius:8px;color:#8e8ea0;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
  .lb-ic{font-size:17px;line-height:22px;height:22px}
  .lb-tx{font-size:10.5px;letter-spacing:.2px}
  .lb-item.on{color:#ececec;background:rgba(255,255,255,.08)}
  .lb-item.muted .lb-ic{opacity:.55}
  .lb-item:active{background:rgba(255,255,255,.1)}
  .lb-item.exit:active{color:#fca5a5}
  /* ήχος και έξοδος μεταφέρονται στην κάτω μπάρα */
  .close-app-btn,.sound-toggle{display:none!important}
  body{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
}
</style>

// Η εφαρμογή κατεβάζει όλο το έγγραφο και βρίσκει μόνη της τα φύλλα με το ΟΝΟΜΑ τους:

// Μορφοποίηση κειμένου στο xlsx (στις κάρτες θεωρίας και στις στήλες «Διόρθωση»):
//   ***κείμενο***   → έντονα και πλάγια          **κείμενο** → έντονα          *κείμενο* → πλάγια
//   __κείμενο__     → υπογράμμιση
//   αλλαγή γραμμής μέσα στο κελί (Ctrl+Enter / Alt+Enter) → αλλαγή γραμμής
//   γραμμή που αρχίζει με «- » ή «• »                      → κουκκίδα
//   κενή γραμμή (στη Σύνοψη)                               → νέο σημείο της κάρτας
//   δεκτές και ετικέτες HTML (<b>, <i>, <u>, <br>) και εικονίδια (📌 ⚠️ 💡)
//
// Τύποι ερωτήσεων (στήλη «Τύπος»):
//   MC     Πολλαπλή επιλογή       Επιλογή Α–Δ · Σωστή: Α/Β/Γ/Δ
//   YN     Ναι / Όχι              Επιλογή Α, Β (κενές = Ναι, Όχι) · Σωστή: Α/Β
//   GAP    Συμπλήρωση κενού       __________ στο Απόσπασμα ή στην Ερώτηση · Σωστή: κενό1|κενό2 (εναλλακτικές με /)
//   CLK    Εντοπισμός             Απόσπασμα · Λέξη-Στόχος: λέξη|φράση
//   DD     Αντιστοίχιση           Αριστερά 1–4, Δεξιά 1–4 · Σωστή: αριστερό→δεξί|…
//   CLKMC  Εντοπισμός + Πολλαπλή  Λέξη-Στόχος + Επιλογή Α–Δ · Σωστή: Α/Β/Γ/Δ
//   CLKYN  Εντοπισμός + Ναι/Όχι   Λέξη-Στόχος + Επιλογή Α, Β · Σωστή: Α/Β
//   CLKGAP Εντοπισμός + Κενό      Λέξη-Στόχος · Σωστή: απάντηση κενού (όπως GAP)
//   CAT    Ταξινόμηση             Επιλογή Α–Δ = ονόματα κατηγοριών · Σωστή: στοιχείο→Α|στοιχείο→Β|…

//   π.χ. «Εντόπισε τις αναφορικές προτάσεις || Ποιο είναι το είδος τους;». Ο έλεγχος γίνεται στο τέλος

// AUDIO — ηχητικά εφέ σωστής/λάθους απάντησης
// ══════════════════════════════════════════════
let soundEnabled = (function(){
  try { const v = localStorage.getItem('syntaxi_sound'); return v === null ? true : v === '1'; }
  catch(e) { return true; }
})();

function playCorrectSound() {
  if (!soundEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 800;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.3);
  } catch(e) { /* silent fail */ }
}

function playWrongSound() {
  if (!soundEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 200;
    osc.type = 'sawtooth';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.3);
  } catch(e) { /* silent fail */ }
}

function playSound(type) {
  if (type === 'correct') playCorrectSound();
  else if (type === 'wrong') playWrongSound();
}

const SOUND_ICON_ON = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11 5L6 9H2V15H6L11 19V5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.54 8.46C16.4774 9.39764 17.0039 10.6692 17.0039 11.995C17.0039 13.3208 16.4774 14.5924 15.54 15.53" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.07 4.93C20.9447 6.80528 21.9979 9.34836 21.9979 12C21.9979 14.6516 20.9447 17.1947 19.07 19.07" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const SOUND_ICON_OFF = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11 5L6 9H2V15H6L11 19V5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="23" y1="9" x2="17" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="17" y1="9" x2="23" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function updateSoundButton() {
  const btn = document.getElementById('soundToggle');
  if (!btn) return;
  if (soundEnabled) {
    btn.classList.remove('muted');
    btn.innerHTML = SOUND_ICON_ON;
    btn.title = 'Απενεργοποίηση ήχου';
    btn.setAttribute('aria-label', 'Απενεργοποίηση ήχου');
  } else {
    btn.classList.add('muted');
    btn.innerHTML = SOUND_ICON_OFF;
    btn.title = 'Ενεργοποίηση ήχου';
    btn.setAttribute('aria-label', 'Ενεργοποίηση ήχου');
  }
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  try { localStorage.setItem('syntaxi_sound', soundEnabled ? '1' : '0'); } catch(e) {}
  updateSoundButton();
  levToolsUpdate();
}

// ══ Κλείσιμο εφαρμογής ══
function closeApp() {
  if (!confirm('Κλείσιμο εφαρμογής;')) return;
  // 1η προσπάθεια: άμεσο κλείσιμο (λειτουργεί σε PWA standalone ή σε παράθυρα που άνοιξαν με script)
  try { window.close(); } catch(e) {}
  // 2η προσπάθεια: κόλπο για καρτέλες που δεν άνοιξαν με script
  try { window.open('', '_self'); window.close(); } catch(e) {}
  // Fallback: αν το πρόγραμμα περιήγησης δεν επιτρέψει το κλείσιμο, εμφανίζουμε οθόνη αποχαιρετισμού
  setTimeout(function(){ if (!window.closed) showCloseFallback(); }, 250);
}

function showCloseFallback() {
  if (document.getElementById('closeFallback')) return;
  const ov = document.createElement('div');
  ov.id = 'closeFallback';
  ov.style.cssText = 'position:fixed;inset:0;background:var(--bg);z-index:3000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px';
  ov.innerHTML =
    '<div style="font-size:2.6rem;margin-bottom:14px">👋</div>' +
    '<p style="font-family:\'IBM Plex Serif\',serif;font-size:1.3rem;font-weight:700;color:var(--ink);margin-bottom:10px">Η εφαρμογή έκλεισε</p>' +
    '<p style="color:var(--muted);font-size:.9rem;max-width:340px;line-height:1.55">Το πρόγραμμα περιήγησης δεν επιτρέπει το αυτόματο κλείσιμο αυτής της καρτέλας. Μπορείτε να κλείσετε την καρτέλα ή να επιστρέψετε στην εφαρμογή.</p>' +
    '<button type="button" onclick="var e=document.getElementById(\'closeFallback\');if(e)e.remove()" style="margin-top:22px;padding:11px 28px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);cursor:pointer;font-size:.92rem;font-weight:700;font-family:inherit">Επιστροφή στην εφαρμογή</button>';
  document.body.appendChild(ov);
}

function ensureSoundButton() {
  if (document.getElementById('soundToggle')) return;
  const btn = document.createElement('button');
  btn.id = 'soundToggle';
  btn.className = 'sound-toggle';
  btn.type = 'button';
  document.body.appendChild(btn);
  btn.addEventListener('click', toggleSound);
  updateSoundButton();
}

// αλλαγή γραμμής → <br>, γραμμή που αρχίζει με «- » ή «• » → κουκκίδα
function fmtRich(s) {
  if (s == null) return s;
  let t = String(s).replace(/\r/g, '');
  t = t.replace(/\*\*\*([^*\n]+?)\*\*\*/g, '<b><i>$1</i></b>')
       .replace(/\*\*([^*\n]+?)\*\*/g, '<b>$1</b>')
       .replace(/(^|[^*])\*(?!\s)([^*\n]+?)\*(?!\*)/g, '$1<i>$2</i>')
       .replace(/__([^_\n]+?)__/g, '<u>$1</u>');
  return t.split('\n').map(l => /^\s*[-•]\s+/.test(l) ? '• ' + l.replace(/^\s*[-•]\s+/, '') : l).join('<br>');
}

function buildTheoryContent() {
  Object.values(THEORY_CARDS).forEach(card => {
    if (card.points) card.points = card.points.map(fmtRich);
    if (card.points) card.content = card.points.map(p => `<p style="margin-bottom:8px">${p}</p>`).join('');
  });
}

// Πλήρης αναλυτής CSV (RFC 4180): υποστηρίζει εισαγωγικά, "" και αλλαγές γραμμής μέσα σε κελιά
function parseCSVRows(text) {
  const rows = []; let row = []; let cur = ''; let inQ = false;
  text = String(text || '').replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(cur); cur = '';
      if (row.some(v => v.trim() !== '')) rows.push(row);
      row = [];
    } else cur += c;
  }
  row.push(cur);
  if (row.some(v => v.trim() !== '')) rows.push(row);
  return rows;
}

function parseCatKey(raw) {
  if (!raw) return null;
  const m = String(raw).match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if (m) return `${parseInt(m[2])}.${parseInt(m[3])}`;
  return String(raw).trim();
}

// Τύπος ερώτησης: κεφαλαία, ελληνικά «όμοια» γράμματα → λατινικά (π.χ. «ΥΝ» → YN), χωρίς κενά/+/-
const GREEK_LOOKALIKE = {'Α':'A','Β':'B','Ε':'E','Ζ':'Z','Η':'H','Ι':'I','Κ':'K','Μ':'M','Ν':'N','Ο':'O','Ρ':'P','Τ':'T','Υ':'Y','Χ':'X'};
const TYPE_ALIASES = {CLKTF:'CLKYN', CLASS:'CAT', SORT:'CAT', ORDER:'ORD', SEQ:'ORD'};
function normType(raw) {
  let t = String(raw || '').toUpperCase().replace(/[\s+\-_\/&]/g, '');
  t = t.replace(/[ΑΒΕΖΗΙΚΜΝΟΡΤΥΧ]/g, ch => GREEK_LOOKALIKE[ch]);
  return TYPE_ALIASES[t] || t;
}
// Συνδυασμένοι τύποι: εντοπισμός (CLK) + δεύτερο σκέλος
const COMBO_SUB = {CLKMC:'MC', CLKYN:'YN', CLKGAP:'GAP'};
const KNOWN_TYPES = ['MC','YN','GAP','CLK','DD','CLKMC','CLKYN','CLKGAP','CAT','ORD'];
const OPT_KEYS = ['Α','Β','Γ','Δ'];

// Μετατροπή γραμμών πίνακα (κεφαλίδες + γραμμές) σε ερωτήσεις
function rowsToQuestions(hdrs, rows) {
  hdrs = hdrs.map(h => String(h || '').trim());
  const data = [];
  for (const vals of rows) {
    const obj = {};
    hdrs.forEach((h, idx) => {
      if (!h) return;
      const v = String(vals[idx] == null ? '' : vals[idx]).trim();
      obj[h] = (v === '' || v.toLowerCase() === 'null' || v.toLowerCase() === 'false') ? null : v;
    });
    if (!obj['Ενεργό'] || obj['Ενεργό'].toUpperCase() === 'FALSE' || obj['Ενεργό'] === '0') continue;
    if (!obj['Τύπος'] || !obj['Κατηγορία'] || !obj['Κείμενο Ερώτησης']) continue;
    const q = buildQuestion(obj);
    if (q) data.push(q);
  }
  return data;
}

function buildQuestion(obj) {
  obj.type = normType(obj['Τύπος']);
  if (!KNOWN_TYPES.includes(obj.type)) { console.warn('Άγνωστος τύπος ερώτησης', obj['ID'], obj['Τύπος']); return null; }
  obj.sub = COMBO_SUB[obj.type] || null;
  obj.catKey = parseCatKey(obj['Κατηγορία']);
  obj.diff = parseInt(obj['Δυσκολία']) || 1;
  obj.theoryKeys = obj['Θεωρία'] ? obj['Θεωρία'].split(',').map(s=>parseInt(s.trim())).filter(n=>!isNaN(n)) : null;
  obj.theory = obj.theoryKeys && obj.theoryKeys.length ? obj.theoryKeys[0] : null;
  obj.id = obj['ID'];
  // «Κείμενο Ερώτησης»: οδηγία 1ου σκέλους || οδηγία 2ου σκέλους (για CLKMC/CLKYN/CLKGAP)
  const qParts = String(obj['Κείμενο Ερώτησης']).split('||');
  obj.q = qParts[0].trim();
  obj.q2 = qParts.length > 1 ? qParts.slice(1).join('||').trim() : null;
  obj.excerpt = obj['Απόσπασμα'] || null;
  obj.optA = obj['Επιλογή Α'] || null;
  obj.optB = obj['Επιλογή Β'] || null;
  obj.optC = obj['Επιλογή Γ'] || null;
  obj.optD = obj['Επιλογή Δ'] || null;
  if (obj.type === 'YN' || obj.type === 'CLKYN') { obj.optA = obj.optA || 'Ναι'; obj.optB = obj.optB || 'Όχι'; }
  obj.leftItems  = [obj['Αριστερά 1'],obj['Αριστερά 2'],obj['Αριστερά 3'],obj['Αριστερά 4']].filter(Boolean);
  obj.rightItems = [obj['Δεξιά 1'],obj['Δεξιά 2'],obj['Δεξιά 3'],obj['Δεξιά 4']].filter(Boolean);
  obj.targets = obj['Λέξη-Στόχος'] ? obj['Λέξη-Στόχος'].split('|').map(t=>t.trim()).filter(Boolean) : [];
  if ((obj.type === 'CLK' || obj.sub) && (!obj.excerpt || !obj.targets.length)) { console.warn('Εντοπισμός χωρίς Απόσπασμα ή Λέξη-Στόχο', obj.id); return null; }
  obj.correct = (obj['Σωστή Απάντηση']||'').trim();
  if (['MC','YN','CLKMC','CLKYN'].includes(obj.type)) obj.correct = normLetter(obj.correct);
  obj.fb = [obj['Διόρθωση 1'],obj['Διόρθωση 2'],obj['Διόρθωση 3'],obj['Διόρθωση 4']].map(fmtRich);
  if (obj.type === 'CAT') {
    // Κατηγορίες = Επιλογή Α–Δ · Σωστή: στοιχείο→Α|στοιχείο→Β (δεκτό και το όνομα της κατηγορίας)
    obj.catNames = [obj.optA,obj.optB,obj.optC,obj.optD].filter(Boolean);
    obj.catItems = obj.correct.split('|').map(s=>s.trim()).filter(Boolean).map(p => {
      const [t, c] = p.split(/→|->/).map(s => (s||'').trim());
      let ci = OPT_KEYS.indexOf(normLetter(c));
      if (ci < 0) ci = obj.catNames.findIndex(n => n.trim().toLowerCase() === (c||'').toLowerCase());
      return { t, c: ci };
    }).filter(it => it.t && it.c >= 0 && it.c < obj.catNames.length);
    if (!obj.catNames.length || !obj.catItems.length) { console.warn('CAT χωρίς κατηγορίες/στοιχεία', obj.id); return null; }
  }
  if (obj.type === 'ORD') {
    obj.ordItems = obj.correct.split('|').map(s=>s.trim()).filter(Boolean);
    if (obj.ordItems.length < 2) { console.warn('ORD με λιγότερα από 2 στοιχεία', obj.id); return null; }
  }
  return obj;
}

// Γράμμα απάντησης: δέχεται και λατινικά A/B/C/D
function normLetter(s) {
  const t = String(s||'').trim().toUpperCase();
  return ({A:'Α',B:'Β',C:'Γ',D:'Δ'})[t] || t;
}

// Βάση δημοσιευμένου εγγράφου: …/pub (χωρίς παραμέτρους)
function sheetBaseUrl(u) {
  return String(u||'').trim().replace(/\/pub(html)?(\?.*)?(#.*)?$/, '/pub').replace(/\/edit.*$/, '/pub');
}

// ── Ανάγνωση xlsx χωρίς εξωτερική βιβλιοθήκη (zip + XML με τα εργαλεία του browser) ──
// Το xlsx είναι αρχείο zip με XML μέσα· αποσυμπίεση με DecompressionStream, ανάλυση με DOMParser.
function unzipIndex(u8) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) { if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
  if (eocd < 0) throw new Error('Μη έγκυρο xlsx');
  const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder('utf-8'); const out = {};
  for (let k = 0; k < n; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl));
    const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
    out[name.replace(/^\/+/, '')] = { method, data: u8.subarray(start, start + csize) };
    p += 46 + nl + el + cl;
  }
  return out;
}
async function unzipText(entries, name) {
  const e = entries[name]; if (!e) return null;
  let bytes = e.data;
  if (e.method === 8) {
    const stream = new Response(e.data).body.pipeThrough(new DecompressionStream('deflate-raw'));
    bytes = new Uint8Array(await new Response(stream).arrayBuffer());
  } else if (e.method !== 0) throw new Error('Μη υποστηριζόμενη συμπίεση');
  return new TextDecoder('utf-8').decode(bytes);
}
const xmlDoc = t => new DOMParser().parseFromString(t, 'application/xml');
const xEls = (node, tag) => Array.from(node.getElementsByTagNameNS('*', tag));
function colIndex(ref) { let n = 0; for (const ch of String(ref).replace(/\d+/g, '')) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; }
// Κείμενο κελιού/κοινόχρηστου κειμένου: όλα τα <t> (και τα «τρεξίματα» μορφοποίησης), χωρίς φωνητικά <rPh>
function xText(node) { return xEls(node, 't').filter(t => !(t.parentNode && t.parentNode.localName === 'rPh')).map(t => t.textContent).join(''); }

// Κατεβάζει ολόκληρο το έγγραφο ως xlsx → { όνομα φύλλου: γραμμές (πίνακες κειμένου) }
async function fetchWorkbook(url) {
  if (typeof DecompressionStream === 'undefined') throw new Error('Ο browser δεν υποστηρίζει αποσυμπίεση');
  const r = await fetch(sheetBaseUrl(url) + '?output=xlsx', { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const entries = unzipIndex(new Uint8Array(await r.arrayBuffer()));
  const wbXml = await unzipText(entries, 'xl/workbook.xml'); if (!wbXml) throw new Error('Λείπει το workbook.xml');
  const relsXml = await unzipText(entries, 'xl/_rels/workbook.xml.rels');
  const rels = {};
  if (relsXml) xEls(xmlDoc(relsXml), 'Relationship').forEach(rel => {
    let t = rel.getAttribute('Target') || ''; t = t.startsWith('/') ? t.slice(1) : 'xl/' + t;
    rels[rel.getAttribute('Id')] = t.replace(/\/\.\//g, '/');
  });
  const ssXml = await unzipText(entries, 'xl/sharedStrings.xml');
  const shared = ssXml ? xEls(xmlDoc(ssXml), 'si').map(xText) : [];
  const out = { __order: [] };
  for (const sh of xEls(xmlDoc(wbXml), 'sheet')) {
    const name = sh.getAttribute('name');
    const rid = sh.getAttribute('r:id') || Array.from(sh.attributes).find(a => a.localName === 'id' && a.name !== 'sheetId')?.value;
    const path = rels[rid]; const sx = path ? await unzipText(entries, path) : null;
    if (!sx) continue;
    const rows = [];
    xEls(xmlDoc(sx), 'row').forEach(rowEl => {
      const row = [];
      xEls(rowEl, 'c').forEach((c, i) => {
        const ci = c.getAttribute('r') ? colIndex(c.getAttribute('r')) : i;
        const t = c.getAttribute('t'); const vEl = xEls(c, 'v')[0]; const v = vEl ? vEl.textContent : '';
        let val = '';
        if (t === 's') val = shared[parseInt(v)] ?? '';
        else if (t === 'inlineStr') val = xText(c);
        else if (t === 'b') val = v === '1' ? 'TRUE' : 'FALSE';
        else val = v;
        row[ci] = val;
      });
      for (let i = 0; i < row.length; i++) if (row[i] === undefined) row[i] = '';
      if (row.some(x => String(x).trim() !== '')) rows.push(row);
    });
    out.__order.push(name); out[name] = rows;
  }
  if (!out.__order.length) throw new Error('Δεν βρέθηκαν φύλλα');
  return out;
}
const sheetKey = n => String(n||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function findSheet(book, name) {
  const k = sheetKey(name);
  const hit = book.__order.find(n => sheetKey(n) === k);
  return hit ? book[hit] : null;
}

async function fetchCsvRows(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return parseCSVRows(await r.text());
}

// Φύλλο «Κατηγορίες» → ονόματα βημάτων
function applyCategoriesRows(rows) {
  if (!rows || !rows.length) return;
  const h = rows[0].map(x => String(x).trim()); const ik = h.indexOf('Κατηγορία'); const iv = h.indexOf('Περιγραφή');
  if (ik < 0 || iv < 0) return;
  const m = {};
  rows.slice(1).forEach(r => { const k = parseCatKey(r[ik]); if (k && r[iv] && String(r[iv]).trim()) m[k] = String(r[iv]).trim(); });
  CAT_NAMES = Object.assign({}, m, APP_CAT_NAMES);   // προτεραιότητα στην εφαρμογή
}
// Φύλλο «Θεωρία» → κάρτες θεωρίας
function applyTheoryRows(rows) {
  if (!rows || !rows.length) return;
  const h = rows[0].map(x => String(x).trim()); const ik = h.indexOf('Θεωρία'); const it = h.indexOf('Τίτλος'); const is = h.indexOf('Σύνοψη');
  const ip = h.map((x,i) => /^Σημείο\s*\d+$/.test(x) ? i : -1).filter(i => i >= 0);
  if (ik < 0) return;
  const m = {};
  rows.slice(1).forEach(r => {
    const k = parseInt(r[ik]); if (isNaN(k)) return;
    let points = ip.map(i => String(r[i]||'').trim()).filter(Boolean);
    if (!points.length && is >= 0) points = String(r[is]||'').replace(/\r/g,'').split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
    m[k] = { title: it >= 0 ? fmtRich(String(r[it]||'').trim()) : `Θεωρία ${k}`, points };
  });
  THEORY_CARDS = Object.assign({}, m, APP_THEORY);  // προτεραιότητα στην εφαρμογή
  buildTheoryContent();
}

    if (!CONFIG.sheetUrl) throw new Error('Δεν έχει οριστεί σύνδεσμος Google Sheet (CONFIG.sheetUrl).');
    let qRows = null;
    try {
      // Ολόκληρο το έγγραφο: ερωτήσεις, κατηγορίες και θεωρία μαζί
      const book = await fetchWorkbook(CONFIG.sheetUrl);
      qRows = CONFIG.questionsSheet ? findSheet(book, CONFIG.questionsSheet) : book[book.__order[0]];
      applyCategoriesRows(findSheet(book, CONFIG.categoriesSheet));
      applyTheoryRows(findSheet(book, CONFIG.theorySheet));
      if (!Object.keys(THEORY_CARDS).length) console.warn('Δεν βρέθηκε φύλλο «' + CONFIG.theorySheet + '»');
    } catch (e) {
      // Εφεδρεία: μόνο το 1ο φύλλο ως CSV (χωρίς βήματα/θεωρία)
      console.warn('Ολόκληρο το έγγραφο δεν φορτώθηκε (' + e.message + ') — φόρτωση μόνο των ερωτήσεων.');
      qRows = await fetchCsvRows(sheetBaseUrl(CONFIG.sheetUrl) + '?output=csv');
    }
    allQ = rowsToQuestions((qRows && qRows[0]) || [], (qRows || []).slice(1));
    if (!allQ.length) throw new Error('Δεν βρέθηκαν ερωτήσεις');
    catsByKey = {};
    allQ.forEach(q => {
      if (!q.catKey) return;
      if (!catsByKey[q.catKey]) catsByKey[q.catKey] = [];
      catsByKey[q.catKey].push(q);
    });
    catOrder = Object.keys(catsByKey).sort((a,b) => {
      const [a1,a2] = a.split('.').map(Number);
      const [b1,b2] = b.split('.').map(Number);
      return a1!==b1 ? a1-b1 : a2-b2;
    });
    screen = loadSetFromHash() ? 'sel' : 'home';
  } catch(e) {
    document.getElementById('app').innerHTML = `
      <div class="card" style="text-align:center;padding:40px">
        <p style="color:var(--ko);font-size:1rem;margin-bottom:12px">⚠️ Αδυναμία φόρτωσης</p>
        <p style="color:var(--muted);font-size:.875rem;margin-bottom:20px">${e.message}</p>
        <button onclick="loadData()" style="padding:11px 26px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);cursor:pointer;font-size:.92rem;font-weight:700">Επανάληψη</button>
      </div>`;
    return;
  }
  render();
}

// HELPERS
// ══════════════════════════════════════════════
function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function getTheoryKeysForCat(catKey) {
  // Fallback: βρίσκουμε ποιες θεωρίες ανήκουν σε αυτή την κατηγορία
  // ψάχνοντας τις ερωτήσεις αυτής της κατηγορίας
  const pool = catsByKey[catKey] || [];
  const keys = new Set();
  pool.forEach(q => { if (q.theory) keys.add(q.theory); });
  return [...keys].sort((a,b)=>a-b);
}

function getTheoryForQuestion(q) {
  // Επιστρέφει τη θεωρία για τη συγκεκριμένη ερώτηση
  if (q && q.theory && THEORY_CARDS[q.theory]) return q.theory;
  return null;
}

function getCatDisplayName(catKey) {
  return CAT_NAMES[catKey] || `Θέμα ${catKey}`;
}

// Επιστρέφει 1 τυχαία ερώτηση ανά βαθμό δυσκολίας, ταξινομημένες αύξουσα (1→2→3→…)
function getQuestionsForCat(catKey, excludeIds=[]) {
  const pool = (catsByKey[catKey]||[]).filter(q => !excludeIds.includes(q.id));
  const byDiff = {};
  pool.forEach(q => { if (!byDiff[q.diff]) byDiff[q.diff] = []; byDiff[q.diff].push(q); });
  const diffs = Object.keys(byDiff).map(Number).sort((a,b)=>a-b);
  const picked = [];
  for (const d of diffs) {
    const arr = byDiff[d];
    if (!arr || !arr.length) continue;
    picked.push(shuffle(arr)[0]);
  }
  return picked; // σειρά: αύξουσα δυσκολία
}

// Επιστρέφει 1 τυχαία ερώτηση συγκεκριμένου βαθμού δυσκολίας (για «τιμωρία»)
function getOneQuestionByDiff(catKey, diff, excludeIds=[]) {
  const pool = (catsByKey[catKey]||[]).filter(q => !excludeIds.includes(q.id) && q.diff === diff);
  if (!pool.length) return null;
  return shuffle(pool)[0];
}

// ── Βοηθητικά απαντήσεων ──
const normGap = s => String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
// Καθαρισμός λέξης για τον εντοπισμό: αφαιρεί στίξη, κρατά την εσωτερική υποδιαστολή («ό,τι»)
function clkClean(tok) {
  return String(tok||'').replace(/[.;:!?«»"'()\[\]…·]/g,'').replace(/^,+|,+$/g,'').trim().toLowerCase();
}
function checkGapAnswer(q, answer) {
  const corrects = q.correct.split('|').map(s=>s.trim()).filter(Boolean);
  const okOne = (ans, exp) => {
    const nAns = normGap(ans);
    if (!nAns) return false;
    return String(exp||'').split('/').map(normGap).some(a => a===nAns || a.includes(nAns) || nAns.includes(a));
  };
  if (Array.isArray(answer)) {
    if (answer.length !== corrects.length) return false;
    return answer.every((ans, i) => okOne(ans, corrects[i]));
  }
  return corrects.some(c => okOne(answer, c));
}
function checkClkAnswer(q, sel) {
  const targets = q.targets.map(t=>t.trim().toLowerCase());
  const s = (sel||[]).map(x=>String(x).trim().toLowerCase());
  return targets.every(t=>s.includes(t)) && s.length===targets.length;
}
function isCombo(q) { return !!(q && q.sub); }
// Οι σύνθετοι τύποι κρατούν την απάντηση σε αντικείμενο· δημιουργείται στην πρώτη εμφάνιση της ερώτησης
function prepAnswer(q, st) {
  if (!q) return;
  const tag = q.id + '|' + q.type;
  if (isCombo(q)) {
    if (!st.answer || st.answer.__combo !== tag) st.answer = { __combo: tag, sub: null, clk: [] };
  } else if (q.type === 'CAT') {
    if (!st.answer || st.answer.__cat !== tag) st.answer = { __cat: tag, a: new Array(q.catItems.length).fill(null), pick: null };
  } else if (q.type === 'ORD') {
    if (!st.answer || st.answer.__ord !== tag) st.answer = { __ord: tag, seq: [] };
  }
}
// «Όψη» της κατάστασης για το 2ο σκέλος ενός συνδυασμένου τύπου (MC/YN/GAP renderers)
function subView(st) {
  return {
    get answer() { return st.answer && st.answer.__combo ? st.answer.sub : st.answer; },
    set answer(v) { if (st.answer && st.answer.__combo) st.answer.sub = v; else st.answer = v; },
    get answered() { return st.answered; }
  };
}
function subFilled(q, v) {
  if (q.sub === 'GAP') return Array.isArray(v) ? v.length > 0 && v.every(a=>a&&a.trim()) : !!(v && String(v).trim());
  return v !== null && v !== undefined && v !== '';
}

function checkAnswer(q, answer) {
  if (q.type==='MC' || q.type==='YN') {
    return q.correct.trim().toUpperCase() === (answer||'').trim().toUpperCase();
  }
  if (q.type==='GAP') return checkGapAnswer(q, answer);
  if (q.type==='CLK') return checkClkAnswer(q, answer);
  if (isCombo(q)) {
    // Έλεγχος στο τέλος: σωστή μόνο αν είναι σωστά ΚΑΙ τα δύο σκέλη
    if (!answer || !answer.__combo) return false;
    const clkOk = checkClkAnswer(q, answer.clk);
    const subOk = q.sub === 'GAP' ? checkGapAnswer(q, answer.sub)
      : q.correct.trim().toUpperCase() === String(answer.sub||'').trim().toUpperCase();
    return clkOk && subOk;
  }
  if (q.type==='CAT') {
    if (!answer || !answer.a) return false;
    return q.catItems.every((it, i) => answer.a[i] === it.c);
  }
  if (q.type==='ORD') {
    if (!answer || !answer.seq || answer.seq.length !== q.ordItems.length) return false;
    return answer.seq.every((idx, pos) => q.ordItems[idx] === q.ordItems[pos]);
  }
  if (q.type==='DD') {
    const correctPairs = parseCorrectDD(q.correct, q.leftItems, q.rightItems);
    if (!correctPairs) return false;
    for(const [li, ri] of Object.entries(answer||{})) {
      if(correctPairs[parseInt(li)] !== parseInt(ri)) return false;
    }
    return Object.keys(answer||{}).length === q.rightItems.length;
  }
  return false;
}

function parseCorrectDD(correctStr, lefts, rights) {
  if (!correctStr) return null;
  const result = {};
  const pairs = correctStr.split('|').map(s=>s.trim()).filter(Boolean);
  for(const p of pairs) {
    const [l,r] = p.split('→').map(s=>s.trim());
    const li = lefts.findIndex(x=>x && x.trim()===l);
    const ri = rights.findIndex(x=>x && x.trim()===r);
    if(li!==-1 && ri!==-1) result[li]=ri;
  }
  if(!Object.keys(result).length) {
    for(const p of pairs) {
      const m = p.match(/Αριστερά\s*(\d+)\s*→\s*Δεξιά\s*(\d+)/);
      if(m) result[parseInt(m[1])-1]=parseInt(m[2])-1;
    }
  }
  return result;
}

function getFeedback(q, answer) {
  if (q.type==='MC' || q.sub==='MC') {
    const map = {Α:0,Β:1,Γ:2,Δ:3};
    const letter = q.sub ? (answer && answer.sub) : answer;
    const idx = map[String(letter||'').toUpperCase()] ?? 0;
    return q.fb[idx] || q.fb.find(f=>f) || null;
  }
  return q.fb[0] || q.fb.find(f=>f) || null;
}

function canCheckAdp(q) {
  if (adp.answered) return false;
  return canCheckState(q, adp);
}
// Κοινός έλεγχος «είναι έτοιμη η απάντηση;» για Βήμα-Βήμα και Εξάσκηση
function canCheckState(q, st) {
  if (!q) return false;
  if (q.type==='MC'||q.type==='YN') return st.answer!==null;
  if (q.type==='CLK') return st.clkSelected.length>0;
  if (q.type==='DD') return Object.keys(st.ddPairs).length===q.rightItems.length;
  if (q.type==='GAP') {
    if (Array.isArray(st.answer)) return st.answer.every(a=>a&&a.trim());
    return !!(st.answer && String(st.answer).trim());
  }
  if (isCombo(q)) return st.clkSelected.length>0 && !!st.answer && !!st.answer.__combo && subFilled(q, st.answer.sub);
  if (q.type==='CAT') return !!(st.answer && st.answer.a && st.answer.a.every(c=>c!==null));
  if (q.type==='ORD') return !!(st.answer && st.answer.seq && st.answer.seq.length===q.ordItems.length);
  return false;
}

// Τύποι με αυτόματο έλεγχο (χωρίς κουμπί «Έλεγξε»): MC, YN, DD.
// Το κουμπί ελέγχου παραμένει μόνο σε GAP (συμπλήρωση κενού) και CLK (εντοπισμός).
function isAutoCheckType(q) {
  return q && (q.type==='MC' || q.type==='YN' || q.type==='DD');
}

// Προγραμματίζει αυτόματο έλεγχο 1 δευτ. μετά την ολοκλήρωση της απάντησης.
// Καλείται μετά από κάθε render(): αν ο χρήστης αλλάξει επιλογή, ο χρόνος μηδενίζεται.
function scheduleAutoCheck() {
  if (adp._chkTimer) { clearTimeout(adp._chkTimer); adp._chkTimer=null; }
  if (sel._chkTimer) { clearTimeout(sel._chkTimer); sel._chkTimer=null; }
  if (screen==='adaptive') {
    const q = adp.queue[adp.qIdx];
    if (q && isAutoCheckType(q) && !adp.answered && canCheckAdp(q)) {
      adp._chkTimer = setTimeout(()=>{ adp._chkTimer=null; doCheck(); }, 1000);
    }
  } else if (screen==='sel') {
    const q = sel.queue[sel.qIdx];
    if (q && isAutoCheckType(q) && !sel.answered && canSelCheck()) {
      sel._chkTimer = setTimeout(()=>{ sel._chkTimer=null; doSelCheck(); }, 1000);
    }
  }
}

const TYPE_LABELS = {
  MC:'Πολλαπλή επιλογή', YN:'Ναι / Όχι', GAP:'Συμπλήρωση κενού', CLK:'Εντοπισμός', DD:'Αντιστοίχιση',
  CLKMC:'Εντοπισμός + Πολλαπλή επιλογή', CLKYN:'Εντοπισμός + Ναι / Όχι', CLKGAP:'Εντοπισμός + Συμπλήρωση',
  CAT:'Ταξινόμηση σε κατηγορίες', ORD:'Βάλε σε σειρά'
};
const TYPE_SHORT = { MC:'Πολλ. Επιλογής', YN:'Ναι/Όχι', DD:'Αντιστοίχιση', GAP:'Συμπλήρωση', CLK:'Εντοπισμός',
  CLKMC:'Εντοπ.+Πολλαπλή', CLKYN:'Εντοπ.+Ναι/Όχι', CLKGAP:'Εντοπ.+Κενό', CAT:'Ταξινόμηση', ORD:'Σειρά' };
// Φίλτρα τύπων: μόνο οι τύποι που υπάρχουν στις ερωτήσεις
function typeChipList() {
  const present = KNOWN_TYPES.filter(t => allQ.some(q => q.type === t));
  return [{v:'all',lbl:'Όλοι'}, ...present.map(t => ({v:t, lbl:TYPE_SHORT[t]||t}))];
}
function qTypeLabel(type) {
  return TYPE_LABELS[type] || 'Πολλαπλή επιλογή';
}

// ══════════════════════════════════════════════
// ADAPTIVE LOGIC — Γραμμική πορεία με άμεση διόρθωση
// ══════════════════════════════════════════════
let mainQueueLog = {};

function startAdaptive(startCatIdx) {
  adp.catIdx = (typeof startCatIdx === 'number' && startCatIdx >= 0) ? startCatIdx : 0;
  adp.catLog = {}; adp.totalCorrect = 0; adp.totalAnswered = 0; adp.usedIds = {};
  startCatMain();
}

function startCatMain() {
  const catKey = catOrder[adp.catIdx];
  if (!adp.usedIds[catKey]) adp.usedIds[catKey] = new Set();
  const qs = getQuestionsForCat(catKey, [...adp.usedIds[catKey]]);
  if (!qs.length) { adp.catLog[catKey]='pass'; advanceToNextCat(); return; }
  qs.forEach(q => adp.usedIds[catKey].add(q.id));
  mainQueueLog[catKey] = [...qs];
  adp.queue = qs; adp.qIdx = 0;
  adp.answer = null; adp.answered = false;
  adp.ddPairs = {}; adp.ddSelected = null; adp.clkSelected = [];
  adp.roundResults = [];
  adp.phase = 'main';
  adp.showTheory = false;
  adp.showFbCard = false; adp.showFbText = false;
  if (adp._fbTimer) { clearTimeout(adp._fbTimer); adp._fbTimer=null; }
  // Νέα πεδία για γραμμική διόρθωση
  adp.penaltyMode = false;     // αν βρισκόμαστε σε «τιμωρία»
  adp.penaltyOrigQ = null;     // η αρχική ερώτηση που έγινε λάθος
  adp.penaltyExtraQ = null;    // η «τιμωρητική» ερώτηση ίδιας δυσκολίας
  adp.penaltyStep = 0;         // 0=extra, 1=retry original
  adp.penaltyStrikeCount = 0;  // πόσα λάθη στην τιμωρία (αν ≥1 → θεωρία)
  screen = 'adaptive'; render();
}

function finishRound() {
  // Στη νέα λογική, ολοκληρώθηκε η ουρά χωρίς εκκρεμή λάθη → pass
  const catKey = catOrder[adp.catIdx];
  adp.catLog[catKey] = 'pass';
  advanceToNextCat();
}

function advanceToNextCat() {
  if (adp.catIdx < catOrder.length - 1) { adp.catIdx++; screen = 'cat_transition'; }
  else { screen = 'adp_results'; }
  render();
}

// ══════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════
function render() {
  const app = document.getElementById('app');
  switch(screen) {
    case 'home':           app.innerHTML=renderHome(); break;
    case 'adp_start':      app.innerHTML=renderAdpStart(); break;
    case 'adaptive':       app.innerHTML=renderAdaptive(); break;
    case 'cat_transition': app.innerHTML=renderCatTransition(); break;
    case 'theory_wall':    app.innerHTML=renderTheoryWall(); break;
    case 'adp_results':    app.innerHTML=renderAdpResults(); break;
    case 'sel_setup':      app.innerHTML=renderSelSetup(); break;
    case 'sel':            app.innerHTML=renderSel(); break;
    case 'sel_results':    app.innerHTML=renderSelResults(); break;
    case 'pres_setup':     app.innerHTML=renderPresSetup(); break;
    case 'pres_theory':    app.innerHTML=renderPresTheory(); break;
    case 'pres':           app.innerHTML=renderPres(); break;
  }
  attachEvents();
  scheduleAutoCheck();
  ensureSoundButton();
  levSideUpdate();
  // Scroll to top on new question/screen (not after check).
  // Instant scroll + double-rAF ώστε να εκτελείται μετά την ολοκλήρωση του layout
  // — αποτρέπει το μικρό κενό που εμφάνιζε κάποτε ο iOS Safari στην κορυφή.
  const isNewQ = (screen==='adaptive' && !adp.answered) || (screen==='sel' && !sel.answered);
  const isNewScreen = ['home','adp_start','cat_transition','theory_wall','adp_results','sel_setup','sel_results','pres_setup','pres_theory'].includes(screen);
  if (isNewQ || isNewScreen) {
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
        // Autofocus GAP input — μόνο desktop (αποφεύγουμε virtual keyboard popup σε mobile)
        if (isNewQ && window.matchMedia('(hover:hover) and (pointer:fine)').matches) {
          const gi = document.getElementById('gapInp-0');
          if (gi) gi.focus();
        }
      });
    });
  }
}

// ══════════════════════════════════════════════
// ADP START — Επιλογή αφετηρίας
// ══════════════════════════════════════════════
function renderAdpStart() {
  let stepsHtml = '';
  catOrder.forEach((key, i) => {
    const name = getCatDisplayName(key);
    const count = (catsByKey[key]||[]).length;
    stepsHtml += `
      <button class="btn-adp-step" data-adp-start-cat="${i}">
        <div class="step-num">${i+1}</div>
        <span class="step-name">${name}</span>
        <span class="step-count">${count} ερ.</span>
      </button>`;
  });
  return `
  <div class="card">
    <div class="adp-start-header">
      <h2>🎯 Βήμα-Βήμα</h2>
      <p>Επίλεξε από πού θέλεις να ξεκινήσεις</p>
    </div>
    <button class="btn-adp-from-start" id="btnAdpFromBeginning">▶&nbsp; Από την αρχή</button>
    <p class="adp-steps-lbl">Ή επίλεξε συγκεκριμένο βήμα</p>
    <div class="adp-steps-grid">${stepsHtml}</div>
    <button class="btn-sec" id="btnAdpStartBack" style="margin-top:14px">← Πίσω</button>
  </div>`;
}

// Τίτλος με την τελευταία λέξη τονισμένη (όπως στην αρχική του ΛΕΒΙΑΘΑΝ)
function levTitleHTML(t) {
  const w = String(t).trim().split(/\s+/);
  if (w.length < 2) return t;
  const last = w.pop();
  return w.join(' ') + ' <em>' + last + '</em>';
}
