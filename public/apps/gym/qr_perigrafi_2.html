<style>
  :root{
    --ink:#2a211b; --ink-2:#3a2c22;
    --parchment:#f4ece1; --parchment-2:#ece0cf;
    --gold:#b4622f; --gold-soft:#d79d74;         /* terracotta accent */
    --page-bg:#d8cbb8;
    --ok:#4e7d3e; --ok-bg:#e5efd7; --ok-bd:#bcd3a3;
    --ko:#b54a2a; --ko-bg:#f6ded3; --ko-bd:#e8bda8;
    --shadow:rgba(42,33,27,.32);
    --sc:1;
  }
  :root:not([data-theme="light"]){}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#f0e7db; --ink-2:#e3d6c6;
      --parchment:#2c2620; --parchment-2:#241f1a;
      --gold:#e08a4f; --gold-soft:#a56438;
      --page-bg:#1a1611;
      --ok:#7fc069; --ok-bg:#23301c; --ok-bd:#3f5730;
      --ko:#e5836a; --ko-bg:#3a201a; --ko-bd:#6e3826;
      --shadow:rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --ink:#f0e7db; --ink-2:#e3d6c6;
    --parchment:#2c2620; --parchment-2:#241f1a;
    --gold:#e08a4f; --gold-soft:#a56438;
    --page-bg:#1a1611;
    --ok:#7fc069; --ok-bg:#23301c; --ok-bd:#3f5730;
    --ko:#e5836a; --ko-bg:#3a201a; --ko-bd:#6e3826;
    --shadow:rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--page-bg);color:var(--ink);
    font-family:"Alegreya Sans",-apple-system,system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }

  /* top bar */
  #topbar{position:fixed;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:flex;gap:8px;z-index:60;}
  .tb-btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(42,33,27,.18);background:rgba(255,255,255,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
  .tb-btn:hover{background:rgba(255,255,255,.85);}
  .tb-btn svg{width:20px;height:20px;}
  :root[data-theme="dark"] .tb-btn, :root:not([data-theme="light"]) .tb-btn{background:rgba(60,50,40,.55);}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tb-btn{background:rgba(60,50,40,.55);}}

  #copyright{position:fixed;left:calc(6vw + 4px);top:max(16px,env(safe-area-inset-top));z-index:15;pointer-events:none;font-family:"Alegreya Sans",sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.06em;color:var(--ink-2);opacity:.6;max-width:52vw;}

  /* slot / card host */
  #slot{flex:1 1 auto;min-width:0;position:relative;display:flex;--gutter:clamp(30px,7%,74px);}
  #cardhost{position:absolute;inset:0;display:flex;padding:clamp(56px,10vh,90px) clamp(12px,3vw,28px) clamp(46px,8vh,70px);}
  .zone{position:absolute;top:0;bottom:0;border:none;background:transparent;cursor:pointer;padding:0;z-index:5;}
  .zone.left{left:0;width:var(--gutter);}
  .zone.center{left:var(--gutter);right:var(--gutter);z-index:4;pointer-events:none;cursor:default;}
  .zone.right{right:0;width:var(--gutter);}
  .no-prev .zone.left{cursor:default;}
  .no-next .zone.right{cursor:default;}

  /* card */
  .card{--sc:1;width:100%;height:100%;position:relative;border-radius:18px;
    background:linear-gradient(150deg,var(--parchment) 0%,var(--parchment-2) 100%);
    border:1px solid rgba(42,33,27,.14);box-shadow:0 18px 40px var(--shadow);
    padding:clamp(20px,4.5vw,40px);overflow:auto;display:flex;flex-direction:column;}
  .card::-webkit-scrollbar{width:0;height:0;}
  .card{scrollbar-width:none;}

  .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;}
  .eyebrow{font-family:"Alegreya Sans",sans-serif;font-weight:700;font-size:calc(clamp(.8rem,1.8vw,.95rem) * var(--sc));letter-spacing:.18em;text-transform:uppercase;color:var(--gold);}
  .badge{font-family:"Alegreya Sans",sans-serif;font-weight:700;font-size:calc(.62rem * var(--sc));letter-spacing:.1em;text-transform:uppercase;color:#7a4a2c;background:rgba(180,98,47,.14);border:1px solid rgba(180,98,47,.3);border-radius:999px;padding:3px 10px;white-space:nowrap;}
  :root[data-theme="dark"] .badge,:root:not([data-theme="light"]) .badge{color:var(--gold-soft);}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge{color:var(--gold-soft);}}

  .prompt{font-family:"Alegreya Sans",sans-serif;font-weight:600;font-size:calc(clamp(1.1rem,3.4vw,1.3rem) * var(--sc));color:var(--ink-2);margin-bottom:calc(14px * var(--sc));line-height:1.4;}
  .prompt b,.prompt i{color:var(--ink);}

  .gapsrc{font-family:"Alegreya",serif;font-style:italic;opacity:.9;font-size:calc(clamp(1.05rem,3.6vw,1.3rem) * var(--sc));margin:calc(-2px * var(--sc)) 0 calc(13px * var(--sc));padding-left:.7em;border-left:3px solid rgba(180,98,47,.5);color:var(--ink);}

  .sentence{font-family:"GFS Didot","Alegreya",serif;font-size:calc(clamp(1.15rem,4vw,1.5rem) * var(--sc));line-height:1.4;color:var(--ink);background:rgba(180,98,47,.08);border:1px solid rgba(180,98,47,.34);border-radius:12px;padding:calc(12px * var(--sc)) calc(16px * var(--sc));margin-bottom:calc(16px * var(--sc));}
  .sentence .src{display:block;font-family:"Alegreya Sans",sans-serif;font-style:normal;font-size:calc(.8rem * var(--sc));color:var(--ink-2);opacity:.7;margin-top:.5em;text-align:right;}
  .sentence.gap{line-height:2.0;}
  .sentence.clk .tok{cursor:pointer;border-radius:5px;padding:0 2px;transition:background .15s;}

  /* options */
  .options{display:grid;gap:calc(10px * var(--sc));}
  .options.two{grid-template-columns:1fr 1fr;}
  .opt{font-family:"Alegreya Sans",sans-serif;font-weight:500;font-size:calc(clamp(1.02rem,3vw,1.18rem) * var(--sc));text-align:left;padding:calc(12px * var(--sc)) calc(16px * var(--sc));border-radius:12px;cursor:pointer;background:rgba(255,255,255,.4);border:1px solid rgba(42,33,27,.2);color:var(--ink);transition:border-color .15s,background .15s;position:relative;}
  :root[data-theme="dark"] .opt,:root:not([data-theme="light"]) .opt{background:rgba(255,255,255,.06);}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt{background:rgba(255,255,255,.06);}}
  .opt:hover:not(:disabled){border-color:var(--gold);background:rgba(255,255,255,.7);}
  :root[data-theme="dark"] .opt:hover:not(:disabled),:root:not([data-theme="light"]) .opt:hover:not(:disabled){background:rgba(255,255,255,.12);}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt:hover:not(:disabled){background:rgba(255,255,255,.12);}}
  .opt.correct{background:var(--ok-bg);border-color:var(--ok-bd);color:#2f5222;}
  .opt.wrong{background:var(--ko-bg);border-color:var(--ko-bd);color:#7a2f1a;}
  :root[data-theme="dark"] .opt.correct,:root:not([data-theme="light"]) .opt.correct{color:var(--ok);}
  :root[data-theme="dark"] .opt.wrong,:root:not([data-theme="light"]) .opt.wrong{color:var(--ko);}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt.correct{color:var(--ok);}:root:not([data-theme="light"]) .opt.wrong{color:var(--ko);}}
  .opt:disabled{cursor:default;}
  .mark{float:right;font-weight:800;margin-left:8px;}

  /* clk hint */
  .clk-hint{font-family:"Alegreya Sans",sans-serif;font-size:calc(clamp(.9rem,2.4vw,1rem) * var(--sc));color:var(--gold);opacity:.85;margin:calc(-4px * var(--sc)) 0 calc(14px * var(--sc));}
  .tok.correct{background:var(--ok-bg);box-shadow:inset 0 0 0 1px var(--ok-bd);color:#2f5222;}
  .tok.wrong{background:var(--ko-bg);box-shadow:inset 0 0 0 1px var(--ko-bd);color:#7a2f1a;}

  /* gap */
  .gapinput{font-family:"GFS Didot","Alegreya",serif;font-size:inherit;color:var(--ink);background:rgba(180,98,47,.07);border:none;border-bottom:2px solid var(--gold);border-radius:5px 5px 0 0;padding:1px 10px;min-width:6.5em;width:auto;text-align:center;}
  .gapinput:focus{outline:none;background:rgba(180,98,47,.16);}
  .gapinput.correct{border-color:var(--ok);background:var(--ok-bg);color:#2f5222;}
  .gapinput.wrong{border-color:var(--ko);background:var(--ko-bg);color:#7a2f1a;}
  .gaprow{margin-top:calc(12px * var(--sc));}
  .gapcheck{display:inline-block;width:auto;}

  /* match */
  .matchwrap{display:flex;flex-direction:column;gap:calc(12px * var(--sc));}
  .mpool{display:flex;flex-wrap:wrap;gap:calc(8px * var(--sc));min-height:calc(30px * var(--sc));padding:calc(8px * var(--sc));border:1px dashed rgba(42,33,27,.24);border-radius:12px;background:rgba(180,98,47,.05);}
  .mzones{display:grid;grid-template-columns:1fr 1fr;gap:calc(10px * var(--sc));}
  .mzone{min-height:calc(58px * var(--sc));border:1px solid rgba(180,98,47,.34);border-radius:12px;padding:calc(8px * var(--sc));display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.35);}
  :root[data-theme="dark"] .mzone,:root:not([data-theme="light"]) .mzone{background:rgba(255,255,255,.05);}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mzone{background:rgba(255,255,255,.05);}}
  .mzone.over{border-color:var(--gold);background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px var(--gold-soft);}
  .mzlabel{font-family:"Alegreya Sans",sans-serif;font-weight:700;font-size:calc(.82rem * var(--sc));text-transform:uppercase;letter-spacing:.05em;color:var(--gold);}
  .mitem{font-family:"GFS Didot","Alegreya",serif;font-size:calc(clamp(.98rem,3.1vw,1.15rem) * var(--sc));line-height:1.25;color:var(--ink);background:var(--parchment);border:1px solid rgba(42,33,27,.2);border-radius:10px;padding:calc(8px * var(--sc)) calc(12px * var(--sc));cursor:grab;touch-action:none;box-shadow:0 2px 6px rgba(42,33,27,.12);}
  .mitem.placed{cursor:default;}
  .mitem.mdragging{opacity:.35;}
  .mitem.correct{background:var(--ok-bg);border-color:var(--ok-bd);color:#2f5222;}
  .mitem.wrong{background:var(--ko-bg);border-color:var(--ko-bd);color:#7a2f1a;}
  .mitem.locked{cursor:default;}
  .mghost{position:fixed;z-index:99999;pointer-events:none;font-family:"GFS Didot","Alegreya",serif;font-size:calc(clamp(.98rem,3.1vw,1.15rem) * var(--sc));line-height:1.25;color:var(--ink);background:#fff;border:1px solid var(--gold);border-radius:10px;padding:calc(8px * var(--sc)) calc(12px * var(--sc));box-shadow:0 8px 22px rgba(42,33,27,.3);}

  /* feedback + checkbar */
  .feedback{margin-top:calc(14px * var(--sc));border-radius:12px;padding:calc(13px * var(--sc)) calc(16px * var(--sc));font-family:"Alegreya",serif;font-size:calc(clamp(.95rem,2.8vw,1.05rem) * var(--sc));line-height:1.45;display:none;}
  .feedback.show{display:block;}
  .feedback.ok{background:var(--ok-bg);border:1px solid var(--ok-bd);color:#2f5222;}
  .feedback.ko{background:var(--ko-bg);border:1px solid var(--ko-bd);color:#7a2f1a;}
  :root[data-theme="dark"] .feedback.ok,:root:not([data-theme="light"]) .feedback.ok{color:var(--ink);}
  :root[data-theme="dark"] .feedback.ko,:root:not([data-theme="light"]) .feedback.ko{color:var(--ink);}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .feedback.ok{color:var(--ink);}:root:not([data-theme="light"]) .feedback.ko{color:var(--ink);}}
  .checking .feedback{display:none;}
  .checkbar{margin-top:.85em;}
  .cb-label{font-family:"Alegreya Sans",sans-serif;font-size:calc(.85rem * var(--sc));color:var(--gold);margin-bottom:4px;}
  .cb-track{height:4px;background:rgba(180,98,47,.2);border-radius:2px;overflow:hidden;}
  .cb-fill{height:100%;width:0;border-radius:2px;background:var(--gold);opacity:.7;transition-property:width;transition-timing-function:linear;}

  /* intro / gate cards */
  .gate{align-items:flex-start;}
  .gate .title{font-family:"GFS Didot","Alegreya",serif;font-size:calc(clamp(1.7rem,6vw,2.5rem) * var(--sc));line-height:1.1;color:var(--ink);margin-bottom:calc(12px * var(--sc));}
  .gate .lead{font-family:"Alegreya",serif;font-size:calc(clamp(1rem,3vw,1.12rem) * var(--sc));line-height:1.5;color:var(--ink-2);margin-bottom:calc(16px * var(--sc));}
  .gate .initial{color:var(--gold);font-size:1.15em;font-weight:700;}
  .setup{margin:.7em 0;}
  .setup .h{font-family:"Alegreya Sans",sans-serif;font-weight:700;font-size:calc(clamp(.95rem,2.6vw,1.05rem) * var(--sc));color:var(--ink);margin-bottom:.5em;}
  .setup .h small{font-weight:500;opacity:.7;}
  .picks{display:flex;flex-wrap:wrap;gap:.45em;}
  .pick{font-family:"Alegreya Sans",sans-serif;font-weight:600;font-size:calc(.95rem * var(--sc));padding:calc(8px * var(--sc)) calc(15px * var(--sc));border-radius:999px;border:1.5px solid rgba(42,33,27,.2);background:rgba(255,255,255,.4);color:var(--ink);cursor:pointer;}
  :root[data-theme="dark"] .pick,:root:not([data-theme="light"]) .pick{background:rgba(255,255,255,.06);}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pick{background:rgba(255,255,255,.06);}}
  .pick.sel{background:var(--gold);color:#fff;border-color:var(--gold);}
  .actions{display:flex;gap:calc(10px * var(--sc));flex-wrap:wrap;margin-top:auto;padding-top:16px;}
  .reveal-btn{font-family:"Alegreya Sans",sans-serif;font-weight:700;font-size:calc(1rem * var(--sc));cursor:pointer;color:var(--parchment);background:var(--gold);border:none;border-radius:12px;padding:calc(12px * var(--sc)) calc(22px * var(--sc));}
  .reveal-btn:hover{filter:brightness(1.06);}
  .reveal-btn.btn-secondary{background:transparent;color:var(--gold);border:1.5px solid var(--gold);}
  .score{font-family:"GFS Didot","Alegreya",serif;font-size:calc(clamp(2.2rem,7vw,3rem) * var(--sc));color:var(--gold);line-height:1;margin:calc(6px * var(--sc)) 0 calc(18px * var(--sc));}
  .score small{font-size:.4em;color:var(--ink-2);}

  /* nav hint */
  .navhint{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:12px;align-items:center;pointer-events:none;z-index:20;font-family:"Alegreya Sans",sans-serif;font-size:.85rem;font-weight:600;color:var(--ink-2);}
  .cue{white-space:nowrap;opacity:.8;}
  .cue.dim{opacity:.25;pointer-events:none;}
  .sep{width:1px;height:14px;background:rgba(42,33,27,.3);}

  /* animations */
  @keyframes slideR{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:none;}}
  @keyframes slideL{from{opacity:0;transform:translateX(-40px);}to{opacity:1;transform:none;}}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .slideR{animation:slideR .5s cubic-bezier(.25,.8,.25,1);}
  .slideL{animation:slideL .5s cubic-bezier(.25,.8,.25,1);}
  .fadeIn{animation:fade .35s ease;}
  @media (prefers-reduced-motion: reduce){.slideR,.slideL,.fadeIn{animation:none;}}
</style>
</head>

<script type="text/csv" id="__EX_CSV__">
ID,Ενεργό,Κατηγορία,Δυσκολία,Τύπος,Απόσπασμα,Κείμενο Ερώτησης,Επιλογή Α,Επιλογή Β,Επιλογή Γ,Επιλογή Δ,Σωστή Απάντηση,Αριστερά 1,Αριστερά 2,Αριστερά 3,Αριστερά 4,Δεξιά 1,Δεξιά 2,Δεξιά 3,Δεξιά 4,Λέξη-Στόχος,Διόρθωση 1,Διόρθωση 2,Διόρθωση 3,Διόρθωση 4,Θεωρία
P001,True,1.1,1,YN,"Το λιμάνι ήταν έρημο, το νερό πράσινο, πηχτό από τ' ακάθαρτο πετρέλαιο.",Το απόσπασμα ανήκει στον κειμενικό τύπο της περιγραφής;,Ναι,Όχι,,,Α,,,,,,,,,,"Ναι· αποδίδει στατικά χαρακτηριστικά ενός χώρου (απαντά στο «πώς είναι κάτι;») με επίθετα και μετοχές, χωρίς εξέλιξη γεγονότων.",,,,1
P002,True,1.1,1,YN,Κατηφόρισε. Διέσχισε γρήγορα τον δρόμο με τα μαγαζιά και μπήκε στην πλατεία.,Το απόσπασμα ανήκει στον κειμενικό τύπο της περιγραφής;,Ναι,Όχι,,,Β,,,,,,,,,,"Όχι· είναι αφήγηση. Εξιστορεί μια ακολουθία γεγονότων στον άξονα του χρόνου (κατηφόρισε, διέσχισε, μπήκε) και απαντά στο «τι συνέβη;».",,,,1
P003,True,1.1,1,MC,"Χαμηλοί λόφοι περιβάλλουν με στοργή το τοπίο. Οι παραλίες, γραφικές, συνομιλούν με τις σιλουέτες των καραβιών.",Σε ποιο ερώτημα απαντά κυρίως το απόσπασμα;,«Πώς είναι κάτι;»,«Τι συνέβη;»,«Γιατί έγινε;»,«Πότε έγινε;»,Α,,,,,,,,,,"Απαντά στο «πώς είναι κάτι;»: περιγράφει τη μορφή ενός τοπίου με επίθετα (χαμηλοί, γραφικές) και ρήματα ενεστώτα (περιβάλλουν, συνομιλούν).",,,,1
P004,True,1.1,1,MC,,Ποιο από τα παρακάτω χαρακτηρίζει την περιγραφή (και όχι την αφήγηση);,Κινείται στον άξονα του χρόνου.,Ο χρόνος είναι «παγωμένος» και το αντικείμενο στατικό.,Χρησιμοποιεί κυρίως παρελθοντικά ρήματα δράσης.,Απαντά στο «τι συνέβη;».,Β,,,,,,,,,,Στην περιγραφή ο χρόνος είναι «παγωμένος» και το αντικείμενο παρουσιάζεται συνήθως στατικό· κινείται στον άξονα του χώρου. Οι υπόλοιπες επιλογές αφορούν την αφήγηση.,,,,1
P005,True,1.1,2,MC,"Τα μαλλιά της ήταν κατσαρά, τα μάτια της, μεγάλα και καστανά και τα χείλη της σαρκώδη. Το κορμί της ήταν γεροδεμένο..",Tο απόσπασμα είναι:,αφήγηση.,περιγραφή.,"Ξεκινά περιγραφικά (σκηνικό: τέλη Αυγούστου, ήλιος) και περνά σε αφήγηση (το χελωνάκι ξεμυτίζει, κάνει βήματα).",Δεν περιέχει κανένα περιγραφικό στοιχείο.,Β,,,,,,,,,,"Περιγράφονται τα χαρακτηριστικά ενός προσώπου/ανθρώπου (μαλλιά, μάτια, χείλη, κορμί) με επίθετα (κατσαρά, μεγάλα, καστανά, σαρκώδη, γεροδεμένο).",,,,1
P006,True,1.1,2,DD,,Αντιστοίχισε κάθε απόσπασμα με τον κειμενικό του τύπο:,,,,,Αριστερά 1→Δεξιά 1| Αριστερά 2→Δεξιά 2|,Τα χαράματα ο ψαράς έβαλε τη φώκια στη βάρκα και την ξεμπάρκαρε σ' ένα ξερονήσι.,Χαμηλοί λόφοι περιβάλλουν με στοργή το τοπίο· οι παραλίες συνομιλούν με τα καράβια.,,,Αφήγηση,Περιγραφή,,,,,,,,1
P007,True,1.1,2,CLK,Δεξιά από το ποτάμι οι ιτιές γερμένες σε καλούν να πλησιάσεις.,Κάνε κλικ στον τοπικό προσδιορισμό που δείχνει ότι πρόκειται για περιγραφή (κίνηση στον χώρο):,,,,,,,,,,,,,,δεξιά από το ποτάμι,Ο τοπικός προσδιορισμός «δεξιά» οργανώνει την περιγραφή στον άξονα του χώρου — τυπικό γνώρισμα της περιγραφής.  (Με το πάτημα μιας λέξης να αλλάζει χρώμα όλη η φράση (δεξιά από το ποτάμι),,,,1
P010,True,1.1,2,MC,"«Ο Γιάννης έχει στρογγυλό πρόσωπο, καθαρό, με μουστάκι και μούσια. Τα μαλλιά του είναι κατσαρά και περιποιημένα. Τα μάτια του είναι στρογγυλά και καστανά.»",Σε ποιον κειμενικό τύπο ανήκει το απόσπασμα και γιατί;,"Αφήγηση, γιατί εξιστορεί γεγονότα.","Περιγραφή, γιατί αποδίδει στατικά χαρακτηριστικά με επίθετα και συνδετικά ρήματα.","Επιχειρηματολογία, γιατί πείθει.","Οδηγίες, γιατί καθοδηγεί.",Β,,,,,,,,,,"Είναι περιγραφή: αποδίδει τη μορφή ενός προσώπου με επίθετα (στρογγυλό, κατσαρά) και συνδετικά ρήματα ενεστώτα (έχει, είναι).",,,,1
P011,True,1.1,2,YN,"«Τα αγάλματα, βυθισμένα ακόμη στη γης, φαινόντουσαν από τη μέση και πάνω γυμνά, φυτεμένα στην τύχη.»",Το απόσπασμα ανήκει στην περιγραφή;,Ναι,Όχι,,,Α,,,,,,,,,,"Ναι· αποδίδει την εικόνα των αγαλμάτων με μετοχές (βυθισμένα, φυτεμένα) και επίθετα, χωρίς εξέλιξη γεγονότων.",,,,1
P012,True,1.1,2,DD,,Αντιστοίχισε κάθε απόσπασμα με τον κειμενικό του τύπο:,,,,,Αριστερά 1→Δεξιά 1| Αριστερά 2→Δεξιά 2|,«Το τοπίο γίνεται ξαφνικά άγριο με έντονη και πυκνή βλάστηση· πλούσιος πευκώνας ξεδιπλώνεται δεξιά κι αριστερά.»,"«Μόλις έφτασε, άνοιξε την πόρτα, κατέβηκε βιαστικά και χάθηκε στο πλήθος.»",,,Περιγραφή,Αφήγηση,,,,,,,,1
P013,True,1.1,3,MC,"«Είναι τέλη Αυγούστου. Ο ήλιος έχει μόλις ξεπροβάλει. Ένα χελωνάκι ξεμυτίζει, σκάβει την άμμο και κατηφορίζει προς τη θάλασσα.»",Πώς διαπλέκονται οι κειμενικοί τύποι στο απόσπασμα;,Μόνο περιγραφή,Μόνο αφήγηση,"Περιγραφή στο σκηνικό (τέλη Αυγούστου, ήλιος) και αφήγηση στη δράση (ξεμυτίζει, σκάβει, κατηφορίζει)",Επιχειρηματολογία,Γ,,,,,,,,,,"Το σκηνικό αποδίδεται περιγραφικά, ενώ η αλληλουχία ενεργειών (ξεμυτίζει → σκάβει → κατηφορίζει) είναι αφήγηση.",,,,1
P101,True,2.1,1,MC,«Ένα ψηλό κορίτσι με ξανθά μαλλιά.»,Τι είδους είναι τα επίθετα «ψηλό» και «ξανθά»;,Περιγραφικά,Ταξινομικά,Αξιολογικά,Αριθμητικά,Α,,,,,,,,,,"Είναι περιγραφικά: αποδίδουν ιδιότητες και κάνουν την περιγραφή παραστατική, χωρίς να κρίνουν ή να κατατάσσουν.",,,,2
P102,True,2.1,1,MC,«Το πέτρινο αρχοντικό με την ξύλινη πόρτα.»,Τι είδους είναι τα επίθετα «πέτρινο» και «ξύλινη»;,Περιγραφικά,Ταξινομικά,Αξιολογικά,Συγκριτικά,Β,,,,,,,,,,"Είναι ταξινομικά: εντάσσουν σε κατηγορία με βάση το υλικό (πέτρα, ξύλο).",,,,2
P103,True,2.1,1,MC,«Ένας αξιόλογος και συνεπής συνεργάτης.»,Τι είδους είναι τα επίθετα «αξιόλογος» και «συνεπής»;,Περιγραφικά,Ταξινομικά,Αξιολογικά,Ουδέτερα,Γ,,,,,,,,,,Είναι αξιολογικά: δηλώνουν κρίση του συντάκτη (υποκειμενικότητα).,,,,2
P104,True,2.1,1,DD,,Αντιστοίχισε κάθε επίθετο με την κατηγορία του:,,,,,Αριστερά 1→Δεξιά 1| Αριστερά 2→Δεξιά 2| Αριστερά 3→Δεξιά 3|,«γαλάζιο» παράθυρο,«μεταλλικό» φινίρισμα,«υπέροχη» θέα,,Περιγραφικό,Ταξινομικό,Αξιολογικό,,,,,,,2
P105,True,2.1,2,YN,"Η λιθόσφαιρα χωρίζεται σε τμήματα, που λέγονται λιθοσφαιρικές πλάκες.","Στο απόσπασμα κυριαρχούν συνδετικά ρήματα σε ενεστώτα (χωρίζεται, λέγονται);",Ναι,Όχι,,,Α,,,,,,,,,,"Ναι· τα συνδετικά ρήματα ενεστώτα (χωρίζεται, λέγονται) βοηθούν στην ταξινόμηση και είναι τυπικά της αντικειμενικής περιγραφής.",,,,2
P106,True,2.1,2,CLK,Ένα βαθύ πηγάδι με φθαρμένα μάρμαρα σκεπασμένα από ξεραμένα φύλλα.,Κάνε κλικ στις μετοχές που χρησιμοποιούνται στην περιγραφή:,,,,,,,,,,,,,,φθαρμένα|σκεπασμένα|ξεραμένα,"Οι μετοχές «φθαρμένα», «σκεπασμένα», «ξεραμένα» αποδίδουν ιδιότητες, όπως τα επίθετα, και εμπλουτίζουν την περιγραφή.",,,,2
P107,True,2.1,2,CLK,Γύρω από την κεντρική αυλή αναπτύσσονται τέσσερις πτέρυγες.,Κάνε κλικ στον δείκτη τόπου που οργανώνει την περιγραφή στον χώρο:,,,,,,,,,,,,,,γύρω από,Ο δείκτης τόπου «γύρω από» οργανώνει περιφερειακά/κυκλικά την περιγραφή του χώρου.,,,,2
P108,True,2.1,2,GAP,Το τοπίο ___ άγριο με έντονη βλάστηση.,Συμπλήρωσε το κατάλληλο συνδετικό ρήμα ενεστώτα:,,,,,είναι,,,,,,,,,,Το συνδετικό ρήμα ενεστώτα «είναι» ταιριάζει· τα συνδετικά ρήματα παροντικού χρόνου είναι τυπικά γνωρίσματα της περιγραφής.,,,,2
P109,True,2.1,2,GAP,,"Συμπλήρωσε τη μετοχή του «απλώνω»: «Ο πλάτανος ορθωνόταν στη μέση της αυλής, ___ τα κλαδιά του».",,,,,απλώνοντας,,,,,,,,,,Η μετοχή ενεστώτα «απλώνοντας» αποδίδει ταυτόχρονη ενέργεια/ιδιότητα και εμπλουτίζει παραστατικά την περιγραφή.,,,,2
P110,True,2.1,3,MC,"«…στην ακρογιαλιά με την πανσέληνο που ανατέλλει. Αχ, πώς να περιγράψει αυτή την ασημένια γραμμή που σχίζει στα δυο την ασάλευτη θάλασσα!»",Ποια γλωσσική επιλογή κυριαρχεί εδώ;,Ουδέτερο/τεχνικό λεξιλόγιο,Λέξεις με μεταφορική & συναισθηματική σημασία,Αριθμητικά δεδομένα,Ταξινομικά επίθετα υλικού,Β,,,,,,,,,,Κυριαρχεί το μεταφορικό/συναισθηματικό λεξιλόγιο («ασημένια γραμμή που σχίζει τη θάλασσα») — γνώρισμα λογοτεχνικής περιγραφής.,,,,2
P111,True,2.1,2,CLK,Τα ολοστρόγγυλα λαμπερά μάτια του είναι πορτοκαλοκόκκινα.,Κάνε κλικ σε ένα περιγραφικό επίθετο που αποδίδει ιδιότητα:,,,,,,,,,,,,,,ολοστρόγγυλα|λαμπερά|πορτοκαλοκόκκινα,"Τα «ολοστρόγγυλα», «λαμπερά», «πορτοκαλοκόκκινα» είναι περιγραφικά επίθετα που αποδίδουν ιδιότητες (σχήμα, λάμψη, χρώμα).",,,,2
P112,True,2.1,2,CLK,"Αμφιθεατρικά χτισμένη πάνω σε δύο χαμηλούς λοφίσκους, η Πύλος ξεχωρίζει.",Κάνε κλικ στη μετοχή που αποδίδει ιδιότητα (λειτουργεί ως επιθετικός προσδιορισμός):,,,,,,,,,,,,,,χτισμένη,"Η μετοχή «χτισμένη» λειτουργεί ως επιθετικός προσδιορισμός και αποδίδει ιδιότητα, όπως ένα επίθετο.",,,,2
P113,True,2.1,2,DD,,Αντιστοίχισε κάθε λέξη του αποσπάσματος για την Πύλο με το γλωσσικό της μέσο:,,,,,Αριστερά 1→Δεξιά 1| Αριστερά 2→Δεξιά 2| Αριστερά 3→Δεξιά 3|,"«χτισμένη, ανθισμένες»",«στο νότιο άνοιγμα»,«λευκά»,,Μετοχή,Προσδιορισμός τόπου,Επίθετα,,,,,,,2
P114,True,2.1,2,CLK,"Το ανάκτορο της Κνωσού χωρίζεται σε διάφορα τμήματα, καθένα με ξεχωριστή χρήση.",Κάνε κλικ στο ρήμα ενεστώτα που βοηθά στην ταξινόμηση:,,,,,,,,,,,,,,χωρίζεται,Το «χωρίζεται» (ρήμα ενεστώτα) βοηθά στην ταξινόμηση — τυπικό γνώρισμα της αντικειμενικής περιγραφής.,,,,2
P115,True,2.1,3,MC,"«Αντικρίζοντας τα πορτραίτα Αρμενίων γυναικών, το πρώτο που διαπιστώνει κανείς είναι τα σφιγμένα τυραννισμένα χείλη και το «άδειο» παγωμένο βλέμμα. Μοιάζουν με τσακισμένες μαντόνες.»",Ποια γλωσσικά μέσα δείχνουν υποκειμενική/κατευθυντική περιγραφή;,Ουδέτερο τεχνικό λεξιλόγιο με ειδικούς όρους.,Συναισθηματικά φορτισμένες μετοχές - επίθετα και παρομοίωση.,Επίθετα ταξινομικά και περιγραφικά,Συνδετικά ρήματα,Β,,,,,,,,,,"Τα φορτισμένα επίθετα (τυραννισμένα, παγωμένο) και η παρομοίωση («σαν τσακισμένες μαντόνες») προδίδουν υποκειμενική/συγκινησιακή περιγραφή.",,,,2
P201,True,3.1,1,MC,Η Σαντορίνη είναι ένα ηφαιστειογενές νησί των Κυκλάδων.,Ποιο δομικό μέρος αποτελεί η φράση «είναι ένα ηφαιστειογενές νησί των Κυκλάδων»;,Ονομασία,Ταξινόμηση (ένταξη σε γένος),Συμπέρασμα,Αξιολόγηση,Β,,,,,,,,,,Είναι ταξινόμηση: εντάσσει το αντικείμενο σε ένα γενικότερο σύνολο/γένος («νησί των Κυκλάδων»).,,,,3
P202,True,3.1,1,DD,,Αντιστοίχισε κάθε χωρίο για τον Παρθενώνα με το δομικό μέρος της περιγραφής:,,,,,Αριστερά 1→Δεξιά 1| Αριστερά 2→Δεξιά 2| Αριστερά 3→Δεξιά 3|,«Ο Παρθενώνας είναι ο κεντρικός ναός της Ακρόπολης…»,«…θεωρείται δείγμα του δωρικού ρυθμού.»,«…τον καθιστούν μοναδικό μνημείο παγκόσμιας κληρονομιάς.»,,Ονομασία και ταξινόμηση,Γενικό χαρακτηριστικό,Συμπέρασμα / αξιολόγηση,,,,,,,3
P203,True,3.1,2,MC,Η δομή μιας περιγραφής: Ονομασία → Ταξινόμηση → Χαρακτηριστικά → Συμπέρασμα.,Με ποια σειρά οργανώνει «παραγωγικά» τα χαρακτηριστικά ο συντάκτης;,Από το ειδικό προς το γενικό,Από το γενικό χαρακτηριστικό προς το ειδικό,Τυχαία,Μόνο ιεραρχικά,Β,,,,,,,,,,Η παραγωγική οργάνωση κινείται από το γενικό χαρακτηριστικό προς το πιο ειδικό γνώρισμα.,,,,3
P210,True,3.1,2,DD,,Αντιστοίχισε κάθε χωρίο για την Πύλο με το δομικό μέρος της περιγραφής:,,,,,Αριστερά 1→Δεξιά 1| Αριστερά 2→Δεξιά 2| Αριστερά 3→Δεξιά 3|,«Η Πύλος είναι μια κωμόπολη…»,"«…χτισμένη αμφιθεατρικά σε δύο λοφίσκους, με λευκά διώροφα σπιτάκια…»",«Ξεχωρίζει για την γραφικότητά της από άλλες παραθαλάσσιες πόλεις της Ελλάδας .»,,Ονομασία - ταξινόμηση,Χαρακτηριστικά / ιδιότητες,Συμπέρασμα / αξιολόγηση,,,,,,,3
P204,True,3.2,1,MC,"«Απ' έξω μοιάζει λιτό. Μέσα, όμως, ανοίγεται μια φωτεινή αυλή με κίονες.»",Ποια κατεύθυνση στον άξονα του χώρου χρησιμοποιείται;,Από πάνω προς τα κάτω,Από έξω προς τα μέσα,Από μακριά προς κοντά,Περιφερειακά,Β,,,,,,,,,,"Η κίνηση είναι από έξω προς τα μέσα, τεχνική κατάλληλη για κτήρια και εσωτερικούς χώρους.",,,,3
P205,True,3.2,1,MC,"«Από μακριά φαίνεται μια ασημένια γραμμή· καθώς πλησιάζεις, ξεχωρίζεις τα κύματα να σκάνε στην παραλία.»",Ποια κατεύθυνση στον άξονα του χώρου χρησιμοποιείται;,Από το μακρινό προς το κοντινό (ζουμ),Από δεξιά προς τα αριστερά,Από πάνω προς τα κάτω,Κατά τη διαδρομή του παρατηρητή,Α,,,,,,,,,,"Είναι κίνηση από το μακρινό προς το κοντινό (ζουμ στη λεπτομέρεια), κατάλληλη για πανοραμικές εικόνες τοπίων.",,,,3
P206,True,3.2,2,DD,,Αντιστοίχισε κάθε διατύπωση με την κατεύθυνση στον χώρο:,,,,,Αριστερά 1→Δεξιά 1| Αριστερά 2→Δεξιά 2| Αριστερά 3→Δεξιά 3|,«Γύρω από την κεντρική αυλή αναπτύσσονται τέσσερις πτέρυγες.»,"«Μπροστά τα πρώτα σπίτια· πιο πίσω, στο βάθος, τα βουνά.»","«Μόλις μπεις από την είσοδο, στα δεξιά ανοίγεται η κουζίνα.»",,Περιφερειακά / κυκλικά,Από μπροστά προς τα πίσω,Κατά τη διαδρομή του παρατηρητή,,,,,,,3
P207,True,3.2,2,YN,"Ψηλά, η κεραμοσκεπή καταλήγει σε καμπάνα· πιο κάτω, οι πέτρινοι τοίχοι· στη βάση, μια ξύλινη πόρτα.",Η περιγραφή του κτηρίου οργανώνεται «από πάνω προς τα κάτω»;,Ναι,Όχι,,,Α,,,,,,,,,,"Ναι· η κίνηση είναι κάθετη (ψηλά → πιο κάτω → στη βάση), κατάλληλη για κτήρια και μορφές.",,,,3
P208,True,3.2,3,MC,"Ένας συντάκτης περιγράφει ένα σπίτι ξεκινώντας από την είσοδο, μπαίνοντας στο χολ, στρίβοντας δεξιά στην κουζίνα και καταλήγοντας στα υπνοδωμάτια στο βάθος.",Ποια οργανωτική τεχνική εφαρμόζει;,Ιεραρχική,Κατά τη διαδρομή του παρατηρητή,Από δεξιά προς τα αριστερά,Παραγωγική,Β,,,,,,,,,,Ακολουθεί τη «διαδρομή του παρατηρητή» (ξενάγηση): η περιγραφή εξελίσσεται όπως κινείται ο επισκέπτης στον χώρο.,,,,3
P211,True,3.2,1,MC,"«Μόλις μπαίνει κανείς από την κύρια είσοδο, συναντά το χολ· ξεκινάει ένας διάδρομος, στα δεξιά και αριστερά του οποίου βρίσκονται δωμάτια· στο βάθος τα υπνοδωμάτια.» (ΕΚΠΑ Γ΄, σελ. 92)",Ποια οργανωτική τεχνική χρησιμοποιείται;,Από πάνω προς τα κάτω,Κατά τη διαδρομή του παρατηρητή,Από μακριά προς κοντά,Ιεραρχική,Β,,,,,,,,,,Ακολουθεί τη «διαδρομή του παρατηρητή»: η κάτοψη αποδίδεται όπως κινείται ο επισκέπτης (είσοδος → χολ → διάδρομος → βάθος).,,,,3
P212,True,3.2,2,CLK,Γύρω από την κεντρική αυλή αναπτύσσονται τέσσερις πτέρυγες· στη δυτική πλευρά υπάρχουν οι αίθουσες στους επάνω ορόφους.,Κάνε κλικ σε έναν δείκτη τόπου που οργανώνει την περιγραφή του κτηρίου στον χώρο:,,,,,,,,,,,,,,γύρω από|στη δυτική πλευρά|στους επάνω ορόφους,"Δείκτες όπως «γύρω από», «στη δυτική πλευρά», «στους επάνω ορόφους» οργανώνουν την περιγραφή στον άξονα του χώρου.",,,,3
P213,True,3.2,2,MC,"«Αμφιθεατρικά χτισμένη πάνω σε δύο χαμηλούς λοφίσκους, στο νότιο άνοιγμα του όρμου, η Πύλος ξεχωρίζει χάρη στα λευκά, διώροφα σπιτάκια της.»",Πώς κινείται η περιγραφή στον χώρο;,"Από το γενικό/μακρινό (θέση, λοφίσκοι) προς το κοντινό/ειδικό (σπιτάκια, αυλές)",Από δεξιά προς τα αριστερά,Μόνο ιεραρχικά,Χωρίς καμία τάξη,Α,,,,,,,,,,"Η περιγραφή ξεκινά από τη γενική/μακρινή θέση (λοφίσκοι, όρμος) και εστιάζει στο κοντινό/ειδικό (λευκά διώροφα σπιτάκια) — κίνηση «ζουμ».",,,,3
P214,True,3.2,2,DD,,Αντιστοίχισε κάθε αυθεντικό απόσπασμα με την τεχνική οργάνωσης στον χώρο:,,,,,Αριστερά 1→Δεξιά 1| Αριστερά 2→Δεξιά 2| Αριστερά 3→Δεξιά 3|,«Στην τρίτη αίθουσα εκτίθενται οι τοιχογραφίες… Η τέταρτη αίθουσα είναι αφιερωμένη στη λαογραφία.»,«Στο νοτιοδυτικό τμήμα βρίσκεται η Δυτική Αυλή· στην αριστερή πλευρά του διαδρόμου τα Προπύλαια.»,«Γύρω από την κεντρική αυλή αναπτύσσονται τέσσερις πτέρυγες.»,,Κατά τη διαδρομή (ξενάγηση αιθουσών),Χωρική περιήγηση (πλευρές/σημεία ορίζοντα),Περιφερειακά / κυκλικά,,,,,,,3
P301,True,4.1,1,DD,,Κατάταξε κάθε χαρακτηριστικό προσώπου στην κατηγορία του:,,,,,Αριστερά 1→Δεξιά 1| Αριστερά 2→Δεξιά 1| Αριστερά 3→Δεξιά 2| Αριστερά 4→Δεξιά 2|,στρογγυλό πρόσωπο,κατσαρά μαλλιά,γλυκομίλητος και φιλικός,ηθικές αρχές,Εξωτερικό,Εσωτερικό,,,,,,,,4
P302,True,4.1,1,MC,,"Στην κάθετη σάρωση ενός προσώπου (κεφάλι → σώμα), ποια σειρά είναι σωστή;",Μαλλιά → μάτια → στόμα → λαιμός → ενδυμασία,Ενδυμασία → λαιμός → μάτια → μαλλιά,Στόμα → μαλλιά → λαιμός → μάτια,Λαιμός → μαλλιά → ενδυμασία → μάτια,Α,,,,,,,,,,"Η κάθετη σάρωση κινείται από πάνω προς τα κάτω: μαλλιά → μάτια → στόμα → λαιμός → ενδυμασία, με σταθερή φορά.",,,,4
P303,True,4.1,2,YN,Ο Ηνίοχος φορά μακρύ χιτώνα ζωσμένο ψηλά. Στο δεξί χέρι κρατούσε το κεντρί. Τα γυμνά πόδια πατούν στέρεα.,Η περιγραφή του αγάλματος οργανώνεται στον άξονα του χώρου (από πάνω προς τα κάτω);,Ναι,Όχι,,,Α,,,,,,,,,,"Ναι· η περιγραφή κινείται από το πάνω μέρος (χιτώνας, χέρι) προς τα κάτω (πόδια), με συνέπεια στη φορά.",,,,4
P311,True,4.1,2,DD,,Κατάταξε κάθε χαρακτηριστικό:,,,,,Αριστερά 1→Δεξιά 1| Αριστερά 2→Δεξιά 1| Αριστερά 3→Δεξιά 2|,«μαλλιά κομμένα κοντά»,«γεροδεμένο κορμί»,«ακτινοβολούσε κέφι και ζωντάνια»,,Εξωτερικό,Εσωτερικό / ψυχική διάθεση,,,,,,,,4
P312,True,4.1,2,MC,"«Ένα παρουσιαστικό τόσο άγριο και τόσο απειλητικό έκρυβε μια ψυχή γλυκιά, ευγενή και ήρεμη.»",Τι πετυχαίνει ο συντάκτης με αυτή τη διατύπωση;,Περιγράφει την εξωτερική εικόνα ενός προσώπου/ανθρώπου.,"Αντιπαραθέτει το εξωτερικό (άγριο, απειλητικό) με το εσωτερικό (γλυκιά, ευγενή ψυχή)",Δίνει πληροφορίες αποκλειστικά για τον χαρακτήρα ενός ανθρώπου.,Αφηγείται ένα γεγονός,Β,,,,,,,,,,"Ο συντάκτης αντιπαραθέτει τα εξωτερικά χαρακτηριστικά (άγριο, απειλητικό) με τα εσωτερικά (γλυκιά, ευγενή, ήρεμη ψυχή).",,,,4
P313,True,4.1,2,CLK,"Το πηγούνι της ήταν μισερό, τα δόντια τεράστια, ενώ τα μαλλιά της ήταν μαύρα και ολόισια.",Κάνε κλικ σε ένα εξωτερικό χαρακτηριστικό του προσώπου που περιγράφεται:,,,,,,,,,,,,,,πηγούνι|δόντια|μαλλιά,"Το πηγούνι, τα δόντια και τα μαλλιά είναι εξωτερικά χαρακτηριστικά — αποδίδονται με τη σάρωση του προσώπου.",,,,4
P304,True,4.2,1,MC,"Το smartwatch έχει ορθογώνιο σχήμα, μεταλλικό φινίρισμα και διαθέτει πάνω από 100 λειτουργίες άθλησης.",Τι επιπλέον από τα γενικά/ειδικά χαρακτηριστικά παρουσιάζει η περιγραφή αντικειμένου;,Το χρώμα,Τις λειτουργίες και τις δυνατότητες χρήσης,Την ιστορία του κατασκευαστή,Την τιμή πώλησης,Β,,,,,,,,,,Στην περιγραφή αντικειμένων παρουσιάζουμε και τις λειτουργίες και τις δυνατότητες χρήσης του (εδώ: λειτουργίες άθλησης).,,,,4
P305,True,4.2,2,DD,,Αντιστοίχισε το ουσιαστικό-χαρακτηριστικό με ένα κατάλληλο επίθετο:,,,,,Αριστερά 1→Δεξιά 2| Αριστερά 2→Δεξιά 3| Αριστερά 3→Δεξιά 1|,Υλικό,Σχήμα,Μέγεθος,,μικροσκοπικό,μεταλλικό,κυλινδρικό,,,,,,,4
P306,True,4.2,2,CLK,Το κυρτό γυαλί υψηλής αντοχής εγγυάται κομψή εμφάνιση και μεγαλύτερη αντοχή στη φθορά.,Κάνε κλικ στο επίθετο που δηλώνει το σχήμα του αντικειμένου:,,,,,,,,,,,,,,κυρτό,"Το επίθετο «κυρτό» δηλώνει το σχήμα του γυαλιού· τα υπόλοιπα (υψηλής αντοχής, κομψή) αφορούν ιδιότητα/αξιολόγηση.",,,,4
P315,True,4.2,2,MC,«Το κλασικό και ορθογώνιο σχήμα του ρολογιού διαθέτει μεταλλικό φινίρισμα. Η ιριδίζουσα οθόνη διαθέτει πλούσια χρώματα. Το κυρτό γυαλί εγγυάται κομψή εμφάνιση.»,Πώς οργανώνει τα χαρακτηριστικά ο συντάκτης;,Από τα ειδικά στα γενικά,"Παραγωγικά: από τα γενικά (σχήμα, φινίρισμα) στα ειδικά (οθόνη, γυαλί)",Χρονολογικά,Ιεραρχικά με βάση την τιμή,Β,,,,,,,,,,"Η οργάνωση είναι παραγωγική: ξεκινά από τα γενικά (σχήμα, φινίρισμα) και προχωρά στα επιμέρους/ειδικά (οθόνη, γυαλί).",,,,4
P316,True,4.3,2,CLK,"Απλώνεται στους νοτιοδυτικούς πρόποδες του κατάφυτου Κρονίου λόφου, μεταξύ των ποταμών Αλφειού και Κλαδέου.",Κάνε κλικ στον προσδιορισμό που δηλώνει τη θέση (γενικό χαρακτηριστικό τοπίου):,,,,,,,,,,,,,,μεταξύ των ποταμών αλφειου και κλαδεου|στους νοτιοδυτικους προποδες,"Οι φράσεις θέσης («στους νοτιοδυτικούς πρόποδες», «μεταξύ των ποταμών») δηλώνουν τη γεωγραφική θέση — γενικό χαρακτηριστικό της περιγραφής τοπίου.",,,,4
P308,True,4.4,1,MC,"Η Αποκριά ξετυλίγεται σταδιακά: στην αρχή η Κρεατινή, έπειτα η Τρανή Αποκριά, στο τέλος η Καθαρά Δευτέρα.",Πώς οργανώνεται η περιγραφή αυτής της δραστηριότητας/εθίμου;,Στον άξονα του χώρου,Στον άξονα του χρόνου (στάδια),Ιεραρχικά από το σημαντικότερο στο λιγότερο σημαντικό.,Περιφερειακά με βάση ένα κεντρικό χώρο.,Β,,,,,,,,,,"Οργανώνεται στον άξονα του χρόνου, με τα τυπικά επαναλαμβανόμενα στάδια (στην αρχή → έπειτα → στο τέλος).",,,,4
P309,True,4.4,2,CLK,Ένιωθε ανακουφισμένος αλλά και συγκινημένος καθώς έβλεπε το έθιμο να ζωντανεύει.,Κάνε κλικ στη λέξη (ή τις λέξεις) που δηλώνει συναισθηματική/ψυχική κατάσταση:,,,,,,,,,,,,,,ανακουφισμένος|συγκινημένος,Οι μετοχές «ανακουφισμένος» και «συγκινημένος» δηλώνουν ψυχική διάθεση — τυπικό μέσο περιγραφής συναισθηματικής κατάστασης.,,,,4

<script>
/* ═══════════════ ΕΝΟΤΗΤΑ «ΠΕΡΙΓΡΑΦΗ» — Engine ασκήσεων ═══════════════
   Προσαρμογή στη λογική/δομή της εφαρμογής «Ενεργητική & Παθητική Σύνταξη».
   Μόνο κλειστού τύπου ασκήσεις: mc, yesno, clk, gap, match. */

/* ── Ετικέτες κατηγοριών (στήλη «Κατηγορία») ── */
const CAT_LABEL = {
  "1.1":"Περιγραφή & αφήγηση",
  "2.1":"Η γλώσσα της περιγραφής",
  "3.1":"Δομικά μέρη",
  "3.2":"Κατεύθυνση στον χώρο",
  "4.1":"Περιγραφή προσώπου",
  "4.2":"Περιγραφή αντικειμένων",
  "4.3":"Περιγραφή τοπίου",
  "4.4":"Κατάσταση & δραστηριότητες",
  "5.1":"Πρόθεση του συντάκτη"
};
/* Ετικέτα βήματος (πρώτο ψηφίο κατηγορίας) για το intro */
const STEP_LABEL = {
  "1":"Διάκριση από την αφήγηση",
  "2":"Η γλώσσα της περιγραφής",
  "3":"Η οργάνωση της περιγραφής",
  "4":"Μορφές κατά αντικείμενο",
  "5":"Μορφές κατά πρόθεση"
};

/* ── Βοηθητικά ── */
const S = v => (v==null?'':String(v)).replace(/\s+$/,'').replace(/^\s+/,'');
const TRUEY = v => { const s=S(v).toLowerCase(); return s===''||s==='true'||s==='ναι'||s==='1'||s==='yes'||s==='x'; };
const LETTER = {'Α':0,'Β':1,'Γ':2,'Δ':3,'A':0,'B':1,'C':2,'D':3};
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[«».,;:!·()"'‘’–—?]/g,'').replace(/\s+/g,' ').trim();
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;} return a; };
const cleanExplain = t => S(t).replace(/^(Όχι\s+ακριβώς|Σωστά|Ναι|Όχι|Λάθος)\s*[.:·]\s*/i,'');

/* ── CSV parser (RFC 4180) ── */
function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  text=String(text).replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else{
      if(c==='"') q=true;
      else if(c===','){ row.push(f); f=''; }
      else if(c==='\n'){ row.push(f); f=''; rows.push(row); row=[]; }
      else if(c!=='\r') f+=c;
    }
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}

/* ── gap normalization: δέχεται «___» ── */
function gapify(raw){
  const t=S(raw);
  if(!/_{2,}/.test(t)) return { sentence:(t?t+' ':'')+'___' };
  return { sentence:t.replace(/_{2,}/g,' ___ ').replace(/\s{2,}/g,' ').trim() };
}

/* ── CLK: εντοπισμός πολλαπλών στόχων ── */
function clkSpansAll(words, targets){
  const used=new Array(words.length).fill(false);
  const spans=[];
  (targets||[]).forEach(t=>{
    const tgt=norm(t).split(' ').filter(Boolean);
    if(!tgt.length) return;
    for(let i=0;i+tgt.length<=words.length;i++){
      let free=true; for(let k=0;k<tgt.length;k++) if(used[i+k]){ free=false; break; }
      if(!free) continue;
      let hit=true; for(let k=0;k<tgt.length;k++) if(norm(words[i+k])!==tgt[k]){ hit=false; break; }
      if(hit){ for(let k=0;k<tgt.length;k++) used[i+k]=true; spans.push({start:i,len:tgt.length}); break; }
    }
  });
  return spans.sort((a,b)=>a.start-b.start);
}

/* ── row → exercise ── */
function rowToEx(o){
  const type=S(o['Τύπος']).toUpperCase();
  const cat=S(o['Κατηγορία']);
  const base={ cat:cat,
    diff: parseInt(S(o['Δυσκολία']),10)||1,
    domain: CAT_LABEL[cat] || (cat?('Ενότητα '+cat):'Άσκηση'),
    prompt: S(o['Κείμενο Ερώτησης']),
    sentence: S(o['Απόσπασμα']),
    explain: cleanExplain(o['Διόρθωση 1']) };
  if(!base.prompt && !base.sentence && type!=='DD') return null;

  if(type==='MC'||type==='YN'){
    const opts=['Επιλογή Α','Επιλογή Β','Επιλογή Γ','Επιλογή Δ'].map(k=>S(o[k])).filter(Boolean);
    const ans=LETTER[S(o['Σωστή Απάντηση']).charAt(0).toUpperCase()];
    if(opts.length<2 || ans==null || ans>=opts.length) return null;
    base.type=(type==='YN'?'yesno':'mc'); base.options=opts; base.answer=ans;
    return base;
  }
  if(type==='CLK'){
    const raw=S(o['Λέξη-Στόχος']);
    if(!raw || !base.sentence) return null;
    const cand=raw.split('|').map(x=>x.trim()).filter(Boolean);
    const words=String(base.sentence).split(/\s+/).filter(Boolean);
    const spans=clkSpansAll(words, cand);
    if(!spans.length) return null;
    base.type='clk'; base.answerWords=cand;
    base.clkHint='Κάνε κλικ στη λέξη-δείκτη μέσα στην πρόταση.';
    return base;
  }
  if(type==='GAP'){
    const hasBlank=s=>/_{2,}/.test(s);
    let gapText, context, lead;
    if(hasBlank(base.prompt)){ gapText=base.prompt; context=base.sentence; lead=''; }
    else { gapText=base.sentence||base.prompt; context=''; lead=hasBlank(base.sentence)?base.prompt:''; }
    const g=gapify(gapText);
    const groups=S(o['Σωστή Απάντηση']).split('|')
      .map(gr=>gr.split('/').map(x=>x.trim()).filter(Boolean)).filter(gr=>gr.length);
    if(!groups.length) return null;
    base.type='gap'; base.sentence=g.sentence; base.context=context; base.prompt=lead;
    base.answerGroups=groups;
    return base;
  }
  if(type==='DD'){
    const L=[1,2,3,4].map(i=>S(o['Αριστερά '+i]));
    const R=[1,2,3,4].map(i=>S(o['Δεξιά '+i]));
    const cats=R.filter(Boolean);
    const spec=S(o['Σωστή Απάντηση']);
    const map={};
    spec.split('|').forEach(seg=>{
      const m=seg.match(/Αριστερά\s*(\d+)\s*→\s*Δεξιά\s*(\d+)/);
      if(m) map[+m[1]]=+m[2];
    });
    const pairs=[];
    L.forEach((txt,i)=>{
      if(!txt) return;
      const rIdx=map[i+1];
      if(rIdx==null) return;
      pairs.push({ text:txt, cat:R[rIdx-1] });
    });
    if(pairs.length<2 || cats.length<2) return null;
    base.type='match'; base.pairs=pairs; base.cats=cats;
    return base;
  }
  return null;
}

/* ── Φόρτωση δεδομένων ── */
function loadEX(){
  const el=document.getElementById('__EX_CSV__');
  const csv=el?el.textContent:'';
  if(!csv.trim()) throw new Error('Δεν βρέθηκαν δεδομένα ασκήσεων.');
  const rows=parseCSV(csv);
  const hdr=rows[0].map(h=>S(h));
  return rows.slice(1).map(r=>{ const o={}; hdr.forEach((h,i)=>o[h]=r[i]); return o; })
    .filter(o=>S(o['ID']) && TRUEY(o['Ενεργό']))
    .map(rowToEx).filter(Boolean);
}

/* ═══════════════ Κατάσταση / πλοήγηση ═══════════════ */
const FREE_TYPES=[["mc","Πολλαπλή επιλογή"],["yesno","Ναι / Όχι"],["clk","Κλικ στη λέξη"],
                  ["gap","Συμπλήρωση κενού"],["match","Αντιστοίχιση"]];
const STEP_IDS=["1","2","3","4","5"];
let EX=[];
let HIST=[], p=0, __ready=false;
const ENG={ mode:'free', queue:[], free:null };
let freeSel={count:10, types:[]};

const slot=document.getElementById('slot');
const host=document.getElementById('cardhost');

/* auto-fit γραμματοσειράς ώστε η κάρτα να μη χρειάζεται κύλιση */
function fitCard(){
  const card=host.querySelector('.card');
  if(!card) return;
  requestAnimationFrame(()=>{
    const ref=Math.min(card.clientHeight, card.clientWidth*0.7);
    const areaCap=Math.min(3.2, Math.max(1, ref/380));
    let lo=0.62, hi=areaCap;
    card.style.setProperty('--sc',hi);
    if(card.scrollHeight<=card.clientHeight+1) return;
    for(let it=0; it<16; it++){
      const mid=(lo+hi)/2;
      card.style.setProperty('--sc',mid);
      if(card.scrollHeight>card.clientHeight+1) hi=mid; else lo=mid;
    }
    card.style.setProperty('--sc',lo);
  });
}

let __swipe=false;
function animateHost(dir){
  if(__swipe) return;
  host.classList.remove('slideR','slideL','fadeIn');
  void host.offsetWidth;
  host.classList.add(dir>0?'slideR':dir<0?'slideL':'fadeIn');
}

function render(dir){
  clearCheck();
  const item=HIST[p]; if(!item) return;
  const locked = item.kind==='ex' && !item.state.answered;
  slot.classList.toggle('no-prev', p===0);
  slot.classList.toggle('no-next', locked);
  document.getElementById('cuePrev').classList.toggle('dim', !canGo(-1));
  document.getElementById('cueNext').classList.toggle('dim', !canGo(1));
  if(item.kind==='ex'){ renderEx(item); }
  else if(item.kind==='freesetup'){ renderFreeSetup(); }
  else if(item.kind==='freedone'){ renderFreeDone(); }
  fitCard();
  animateHost(dir||0);
}

/* ── intro / setup ── */
function firstLetter(t){ return '<span class="initial">'+t.charAt(0)+'</span>'+t.slice(1); }

function renderFreeSetup(){
  const counts=[10,20,0];
  const cbtn=counts.map(c=>`<button class="pick${freeSel.count===c?' sel':''}" data-c="${c}">${c===0?'Όλες':c}</button>`).join('');
  const tbtn=FREE_TYPES.map(t=>`<button class="pick${freeSel.types.indexOf(t[0])>=0?' sel':''}" data-t="${t[0]}">${t[1]}</button>`).join('');
  host.innerHTML=`<div class="card gate">
    <div class="head"><span class="eyebrow">Περιγραφή</span><span class="badge">Εξάσκηση</span></div>
    <div class="title">${firstLetter('Ασκήσεις στην περιγραφή')}</div>
    <div class="lead">Ερωτήσεις <b>κλειστού τύπου</b> από <b>όλη την ύλη</b>. Το πλήθος που διαλέγεις μοιράζεται αναλογικά σε όλα τα βήματα (τυχαία επιλογή)· κάθε νέα εξάσκηση δίνει κατά κανόνα διαφορετικές ερωτήσεις. Απάντησε σε κάθε κάρτα για να προχωρήσεις.</div>
    <div class="setup"><div class="h">Πόσες ερωτήσεις;</div><div class="picks">${cbtn}</div></div>
    <div class="setup"><div class="h">Τύποι <small>(κανένας = όλοι)</small></div><div class="picks">${tbtn}</div></div>
    <div class="actions"><button class="reveal-btn" id="goFree">Ξεκίνησε →</button></div>
  </div>`;
  host.querySelectorAll('.pick[data-c]').forEach(b=>b.addEventListener('click',()=>{ freeSel.count=+b.dataset.c; renderFreeSetup(); fitCard(); }));
  host.querySelectorAll('.pick[data-t]').forEach(b=>b.addEventListener('click',()=>{ const t=b.dataset.t,i=freeSel.types.indexOf(t); if(i>=0)freeSel.types.splice(i,1); else freeSel.types.push(t); renderFreeSetup(); fitCard(); }));
  host.querySelector('#goFree').addEventListener('click',()=>{
    const n=startFree(freeSel.count, freeSel.types);
    if(!n){ alert('Δεν υπάρχουν ερωτήσεις με αυτά τα κριτήρια.'); return; }
    HIST=HIST.slice(0,p+1); const nx=nextCard(); if(nx) HIST.push(nx);
    p=HIST.length-1; render(1);
  });
}
function renderFreeDone(){
  const f=ENG.free||{done:0,right:0};
  const pct=f.done?Math.round(f.right/f.done*100):0;
  host.innerHTML=`<div class="card gate">
    <div class="head"><span class="eyebrow">Εξάσκηση</span><span class="badge">Ολοκληρώθηκε</span></div>
    <div class="title">${firstLetter('Τέλος εξάσκησης')}</div>
    <div class="score">${f.right}<small> / ${f.done} σωστές</small></div>
    <div class="lead">Ποσοστό επιτυχίας: <b>${pct}%</b>. Πάτησε «Νέα εξάσκηση» για διαφορετικές ερωτήσεις.</div>
    <div class="actions">
      <button class="reveal-btn" id="againFree">↻ Νέα εξάσκηση</button>
    </div>
  </div>`;
  host.querySelector('#againFree').addEventListener('click',()=>{
    const n=startFree(freeSel.count, freeSel.types);
    if(!n){ HIST=HIST.slice(0,p+1); HIST.push({kind:'freesetup'}); p++; render(1); return; }
    HIST=HIST.slice(0,p+1); const nx=nextCard(); if(nx) HIST.push(nx);
    p=HIST.length-1; render(1);
  });
}

/* ── επιλογή ερωτήσεων ── */
function mkEx(data,extra){ return Object.assign({kind:'ex', data:data, state:{answered:false,correct:false}}, extra||{}); }
function nextCard(){ if(ENG.queue.length) return ENG.queue.shift(); return {kind:'freedone'}; }

function startFree(count, types){
  const useType=q=>!types||!types.length||types.indexOf(q.type)>=0;
  /* Ομαδοποίηση ανά ΒΗΜΑ (πρώτο ψηφίο κατηγορίας), ώστε το πλήθος να
     μοιράζεται αναλογικά σε όλα τα βήματα (round-robin). Μέσα σε κάθε
     βήμα: φρέσκο ανακάτεμα → διαφορετικές ερωτήσεις κάθε φορά. */
  const byStep={};
  EX.forEach(e=>{ if(useType(e)){ const s=String(e.cat).split('.')[0]; (byStep[s]=byStep[s]||[]).push(e); } });
  const buckets=Object.keys(byStep).sort().map(k=>{ const qs=byStep[k].slice(); shuffle(qs); return {qs, taken:0}; });
  const totalAvail=buckets.reduce((a,s)=>a+s.qs.length,0);
  if(!totalAvail) return 0;
  const target=(count>0)?Math.min(count,totalAvail):totalAvail;
  /* Round-robin: 1 ανά βήμα σε κάθε γύρο, μέχρι να συμπληρωθεί το πλήθος. */
  let picked=0;
  while(picked<target){ let prog=false; for(const s of buckets){ if(picked>=target)break; if(s.taken<s.qs.length){ s.taken++; picked++; prog=true; } } if(!prog)break; }
  /* Συνεχόμενη ροή: οι ερωτήσεις τυχαίες ΜΕΣΑ σε κάθε βήμα, αλλά περνούν
     ΣΤΗ ΣΕΙΡΑ από βήμα σε βήμα (1→2→3→4→5), ώστε να καλύπτονται όλα
     αναλογικά — χωρίς διαχωρισμό ή τέλος ανά βήμα. */
  const pick=[];
  buckets.forEach(s=>{ s.qs.slice(0,s.taken).forEach(q=>pick.push(q)); });
  ENG.mode='free';
  ENG.free={ done:0, right:0, total:pick.length };
  ENG.queue=pick.map((q,i)=>mkEx(q,{n:i+1,total:pick.length}));
  return pick.length;
}

function onAnswered(item, ok){ if(!item||item.kind!=='ex')return; ENG.free.done++; if(ok)ENG.free.right++; }

/* ═══════════════ Render ασκήσεων ═══════════════ */
function renderEx(item){
  const e=item.data, st=item.state;
  const typeLabel=e.type==='clk'?'Κλικ στη λέξη':(e.type==='gap'?'Συμπλήρωση κενού':(e.type==='match'?'Αντιστοίχιση':(e.type==='yesno'?'Ναι / Όχι':'Πολλαπλή επιλογή')));
  const eyebrow=`Εξάσκηση ${item.n}/${item.total} · ${e.domain}`;
  let b=`<div class="card"><div class="head"><span class="eyebrow">${eyebrow}</span><span class="badge">${typeLabel}</span></div>`;
  if(e.prompt) b+=`<div class="prompt">${e.prompt}</div>`;

  if(e.type==='clk'){
    const words=String(e.sentence||'').split(/\s+/).filter(Boolean);
    const spans=clkSpansAll(words, e.answerWords);
    const cover={}; spans.forEach(sp=>cover[sp.start]=sp.len);
    const units=[];
    for(let i=0;i<words.length;i++){
      if(cover[i]){ units.push({t:words.slice(i,i+cover[i]).join(' '),tgt:true}); i+=cover[i]-1; }
      else units.push({t:words[i],tgt:false});
    }
    const toks=units.map((u,idx)=>`<span class="tok" data-idx="${idx}"${u.tgt?' data-tgt="1"':''}>${u.t}</span>`).join(' ');
    b+=`<div class="sentence clk">${toks}</div>`;
    if(!st.answered){ const many=spans.length>1?` <b>(${spans.length} σημεία)</b>`:''; b+=`<div class="clk-hint">${e.clkHint}${many}</div>`; }
  }
  else if(e.type==='gap'){
    if(e.context) b+=`<div class="gapsrc">${e.context}</div>`;
    const parts=e.sentence.split('___');
    b+=`<div class="sentence gap">${parts.join('<input class="gapinput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">')}</div>`;
    b+=`<div class="gaprow"><button class="opt gapcheck">Έλεγχος</button></div>`;
    if(!st.answered) b+=`<div class="clk-hint">Πληκτρολόγησε τη λέξη και πάτησε «Έλεγχος» (ή Enter).</div>`;
  }
  else if(e.type==='match'){
    const order=st.order||(st.order=shuffle([...e.pairs.keys()]));
    const chips=order.map(i=>`<div class="mitem" data-cat="${e.pairs[i].cat}">${e.pairs[i].text}</div>`).join('');
    const zones=e.cats.map(c=>`<div class="mzone" data-cat="${c}"><span class="mzlabel">${c}</span></div>`).join('');
    b+=`<div class="matchwrap"><div class="mpool">${chips}</div><div class="mzones">${zones}</div></div>`;
    if(!st.answered) b+=`<div class="clk-hint">Σύρε κάθε πρόταση στο σωστό πλαίσιο.</div>`;
  }
  else{
    if(e.sentence) b+=`<div class="sentence">${e.sentence}</div>`;
    const two=e.options.length===2?' two':'';
    b+=`<div class="options${two}">`+e.options.map((o,idx)=>`<button class="opt" data-idx="${idx}">${o}</button>`).join('')+`</div>`;
  }
  b+=`<div class="feedback"></div></div>`;
  host.innerHTML=b;
  const card=host.querySelector('.card'); card.scrollTop=0;
  if(e.type==='clk') bindClk(e,st,card);
  else if(e.type==='match') bindMatch(e,st,card);
  else if(e.type==='gap') bindGap(e,st,card);
  else bindOptions(e,st,card);
  if(st.answered) replay(e,st,card);
}

/* ── check bar ── */
let CHECK_MS=850, __checkTimer=null, __checking=false;
function clearCheck(){ if(__checkTimer){ clearTimeout(__checkTimer); __checkTimer=null; } __checking=false; }
function startCheck(card, done){
  if(CHECK_MS<=0){ done(); return; }
  __checking=true; card.classList.add('checking');
  const bar=document.createElement('div');
  bar.className='checkbar';
  bar.innerHTML='<div class="cb-label">Έλεγχος απάντησης…</div><div class="cb-track"><div class="cb-fill"></div></div>';
  card.appendChild(bar); fitCard();
  const fill=bar.querySelector('.cb-fill');
  requestAnimationFrame(()=>{ fill.style.transitionDuration=CHECK_MS+'ms'; fill.style.width='100%'; });
  __checkTimer=setTimeout(()=>{ __checkTimer=null; __checking=false; card.classList.remove('checking'); if(bar.parentNode)bar.remove(); done(); }, CHECK_MS);
}
function fb(card, ok, e){
  card.dataset.answered='1';
  card.querySelectorAll('.clk-hint').forEach(h=>h.style.display='none');
  const f=card.querySelector('.feedback');
  f.className='feedback show '+(ok?'ok':'ko');
  f.innerHTML=(ok?'✓ Σωστά. ':'✗ Όχι ακριβώς. ')+(e.explain||'');
  const it=HIST[p];
  const first=!!(it&&it.kind==='ex'&&!it.__scored);
  if(first){ it.__scored=true; onAnswered(it,ok); }
  const reveal=()=>{ slot.classList.remove('no-next'); document.getElementById('cueNext').classList.toggle('dim',!canGo(1)); fitCard(); };
  if(first) startCheck(card, reveal); else reveal();
}

/* ── bind: options ── */
function bindOptions(e,st,card){
  const opts=[...card.querySelectorAll('.opt:not(.gapcheck)')];
  opts.forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(st.answered)return;
      const idx=+btn.dataset.idx, ok=idx===e.answer;
      st.answered=true; st.correct=ok;
      opts.forEach(x=>{ x.disabled=true; x.style.pointerEvents='none'; });
      if(ok){ btn.classList.add('correct'); btn.insertAdjacentHTML('beforeend','<span class="mark">✓</span>'); }
      else{ btn.classList.add('wrong'); btn.insertAdjacentHTML('beforeend','<span class="mark">✗</span>');
        const right=opts[e.answer]; if(right){ right.classList.add('correct'); right.insertAdjacentHTML('beforeend','<span class="mark">✓</span>'); } }
      fb(card,ok,e);
    });
  });
}
/* ── bind: clk ── */
function bindClk(e,st,card){
  const toks=[...card.querySelectorAll('.tok')];
  const need=toks.filter(t=>t.dataset.tgt==='1').length;
  st.clkHit=st.clkHit||0;
  function finish(ok){ st.answered=true; st.correct=ok; if(!ok) toks.forEach(t=>{ if(t.dataset.tgt==='1') t.classList.add('correct'); }); fb(card,ok,e); }
  toks.forEach(tok=>{
    tok.addEventListener('click',()=>{
      if(st.answered)return;
      if(tok.dataset.tgt==='1'){ if(tok.classList.contains('correct'))return; tok.classList.add('correct'); st.clkHit++; if(st.clkHit>=need) finish(true); }
      else{ tok.classList.add('wrong'); finish(false); }
    });
  });
}
/* ── bind: gap ── */
function bindGap(e,st,card){
  const inps=[...card.querySelectorAll('.gapinput')];
  const btn=card.querySelector('.gapcheck');
  const groups=e.answerGroups||[['']];
  const hit=(val,alts)=>{ const v=norm(String(val)); return alts.some(a=>norm(String(a))===v); };
  function check(){
    if(st.answered||!inps.length)return;
    let ok;
    if(groups.length===inps.length){ ok=inps.every((inp,i)=>hit(inp.value,groups[i])); }
    else{ const all=[].concat(...groups); const used=new Set();
      ok=inps.every(inp=>{ const v=norm(String(inp.value)); const k=all.findIndex((a,idx)=>!used.has(idx)&&norm(String(a))===v); if(k>=0){used.add(k);return true;} return false; }) && used.size>=inps.length; }
    st.answered=true; st.correct=ok;
    inps.forEach(inp=>{ inp.disabled=true; inp.classList.add(ok?'correct':'wrong'); });
    if(btn) btn.disabled=true;
    fb(card,ok,e);
  }
  if(btn) btn.addEventListener('click',check);
  inps.forEach(inp=>inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); check(); } }));
  setTimeout(()=>{ if(inps[0]&&!st.answered) try{ inps[0].focus(); }catch(_){} },60);
}
/* ── bind: match (drag) ── */
function placeMatch(card,e){
  const zones=[...card.querySelectorAll('.mzone')];
  zones.forEach(z=>{ const chip=[...card.querySelectorAll('.mitem')].find(m=>m.dataset.cat===z.dataset.cat && !m.dataset.done); if(chip){ chip.dataset.done='1'; chip.classList.add('placed','correct','locked'); z.appendChild(chip); } });
}
function bindMatch(e,st,card){
  const pool=card.querySelector('.mpool');
  const zones=[...card.querySelectorAll('.mzone')];
  function evaluate(){
    if(!zones.every(z=>z.querySelector('.mitem'))) return;
    let allok=true;
    zones.forEach(z=>{ const it=z.querySelector('.mitem'); const ok=it.dataset.cat===z.dataset.cat; it.classList.add(ok?'correct':'wrong'); if(!ok)allok=false; });
    st.answered=true; st.correct=allok;
    card.querySelectorAll('.mpool').forEach(pp=>pp.style.display='none');
    const hint=card.querySelector('.clk-hint'); if(hint)hint.style.display='none';
    card.querySelectorAll('.mitem').forEach(m=>m.classList.add('locked'));
    fb(card,allok,e);
  }
  card.querySelectorAll('.mitem').forEach(chip=>{
    chip.addEventListener('pointerdown',ev=>{
      if(st.answered||chip.classList.contains('locked'))return;
      ev.preventDefault(); ev.stopPropagation();
      const r=chip.getBoundingClientRect();
      const ox=ev.clientX-r.left, oy=ev.clientY-r.top;
      const ghost=chip.cloneNode(true); ghost.classList.add('mghost'); ghost.classList.remove('mdragging');
      ghost.style.width=r.width+'px'; ghost.style.left=(ev.clientX-ox)+'px'; ghost.style.top=(ev.clientY-oy)+'px';
      document.body.appendChild(ghost); chip.classList.add('mdragging');
      const move=m=>{ ghost.style.left=(m.clientX-ox)+'px'; ghost.style.top=(m.clientY-oy)+'px';
        const el=document.elementFromPoint(m.clientX,m.clientY); const z=el&&el.closest?el.closest('.mzone'):null;
        zones.forEach(x=>x.classList.toggle('over',x===z)); if(m.cancelable)m.preventDefault(); };
      const up=m=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up);
        ghost.remove(); chip.classList.remove('mdragging'); zones.forEach(x=>x.classList.remove('over'));
        const el=document.elementFromPoint(m.clientX,m.clientY); const z=el&&el.closest?el.closest('.mzone'):null;
        if(z){ const ex=z.querySelector('.mitem'); if(ex&&ex!==chip)pool.appendChild(ex); z.appendChild(chip); } else pool.appendChild(chip);
        evaluate(); };
      window.addEventListener('pointermove',move,{passive:false});
      window.addEventListener('pointerup',up);
    });
  });
}
function replay(e,st,card){
  if(e.type==='clk'){ card.querySelectorAll('.tok[data-tgt="1"]').forEach(t=>t.classList.add('correct')); }
  else if(e.type==='match'){ placeMatch(card,e); }
  else if(e.type==='gap'){ const inps=[...card.querySelectorAll('.gapinput')]; const g=e.answerGroups||[['']]; inps.forEach((inp,i)=>{ inp.value=(g[i]&&g[i][0])||''; inp.disabled=true; inp.classList.add('correct'); }); card.querySelectorAll('.gapcheck').forEach(b=>b.disabled=true); }
  else{ card.querySelectorAll('.opt:not(.gapcheck)').forEach((x,k)=>{ x.disabled=true; if(k===e.answer){ x.classList.add('correct'); x.insertAdjacentHTML('beforeend','<span class="mark">✓</span>'); } }); }
  fb(card,st.correct,e);
}

/* ═══════════════ Πλοήγηση ═══════════════ */
function canGo(dir){
  if(!__ready||__checking) return false;
  const it=HIST[p]; if(!it) return false;
  if(dir<0) return p>0;
  if(it.kind==='ex' && !it.state.answered) return false;
  if(it.kind==='freesetup'||it.kind==='freedone') return false;
  return true;
}
function go(dir){
  if(!canGo(dir)) return;
  if(dir>0 && p===HIST.length-1){ const nx=nextCard(); if(!nx)return; HIST.push(nx); }
  p+=dir; render(dir);
}

/* zones + cues */
document.getElementById('zLeft').addEventListener('click',()=>go(-1));
document.getElementById('zRight').addEventListener('click',()=>go(1));
document.getElementById('cuePrev').addEventListener('click',()=>go(-1));
document.getElementById('cueNext').addEventListener('click',()=>go(1));
document.addEventListener('keydown',ev=>{ if(ev.key==='ArrowLeft')go(-1); else if(ev.key==='ArrowRight')go(1); });

/* topbar */
document.getElementById('btnClose').addEventListener('click',()=>{
  try{ window.close(); }catch(_){}
  if(!window.closed){ try{ if(history.length>1) history.back(); else location.href='about:blank'; }catch(_){} }
});
document.getElementById('btnTheme').addEventListener('click',()=>{
  const root=document.documentElement, cur=root.getAttribute('data-theme');
  let next; if(cur==='dark')next='light'; else if(cur==='light')next='dark'; else next=matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark';
  root.setAttribute('data-theme',next);
  try{ localStorage.setItem('perigrafi-theme',next); }catch(_){}
});
try{ const t=localStorage.getItem('perigrafi-theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(_){}

/* boot */
function boot(){
  try{ EX=loadEX(); }catch(err){ host.innerHTML='<div class="card"><div class="prompt">Σφάλμα φόρτωσης ασκήσεων.</div><div class="feedback show ko">'+err.message+'</div></div>'; return; }
  __ready=true;
  HIST=[{kind:'freesetup'}]; p=0; render(0);
  window.addEventListener('resize',()=>fitCard());
}
boot();

</script>
