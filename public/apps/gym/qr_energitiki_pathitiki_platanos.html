<style>

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--desk);color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif;min-height:100vh}
.serif{font-family:Georgia,"Times New Roman",serif}

.note p{font-size:14px;line-height:1.55}

.txt p{text-indent:1.6em;margin-bottom:6px}
.sen{border-radius:3px;cursor:pointer;transition:background .15s}
.st1 .sen:hover{background:#F6EFDF}
.sen.cut{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;color:#a39b8c;cursor:default}
.sen.shake{animation:sh .35s;background:var(--blue2)}
@keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.gap{display:inline-block;color:#cfc5b1;cursor:pointer;padding:0 4px;border-radius:3px;font-family:Arial;font-weight:700}
.gap:hover{background:var(--blue2);color:var(--blue)}
.gap.on{color:#fff;background:var(--blue)}
.gap.on::before{content:"¶ "}
.gap.ok{background:var(--green);color:#fff}.gap.ok::before{content:"¶ "}
.gap.miss{background:var(--amber);color:#fff}
.gap.miss::before{content:"? "}
.gap.ko{background:#fff;color:var(--red);outline:2px solid var(--red)}
.gap.ko::before{content:"✗ "}
.slot{display:inline-block;min-width:118px;border-bottom:2px solid var(--red);text-align:center;color:var(--red);cursor:pointer;font-family:Arial;font-size:15px;font-weight:700;padding:0 6px;text-indent:0}
.slot.empty{color:#d7a59e}
.slot:not(.empty){min-width:0}
.slot.sel{background:var(--red2)}
.slot.ok{border-color:var(--green);color:var(--green)}
.slot.ko{border-color:var(--red);background:var(--red2)}
.bank{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}

.placed{background:var(--green2);border-radius:4px}

{g:3,m:'Αναφορικές προτάσεις · αποθετικά',sh:'Ειδικές',type:'mcq',
 title:'Οι τελευταίες διορθώσεις',

 kw:'Οι πολίτες σέβονται τους νόμους → ✗ «Οι νόμοι σέβονται από τους πολίτες» · ✓ «Οι νόμοι είναι σεβαστοί από τους πολίτες».',

 qs:[{q:'…ο πλάτανος, <b>που φύτεψαν οι πρώτοι απόφοιτοι</b> το 1932, …',
      o:['ο πλάτανος, τον οποίο φυτεύτηκε από τους πρώτους αποφοίτους το 1932','ο πλάτανος, ο οποίος φυτεύτηκε από τους πρώτους αποφοίτους το 1932','ο πλάτανος, ο οποίος φυτευόταν από τους πρώτους αποφοίτους το 1932'],a:1,
      e:['Σωστά βρήκες ότι το «που» είναι αντικείμενο (= τον οποίο). Στην παθητική όμως γίνεται <b>υποκείμενο</b>, άρα περνά σε ονομαστική: «ο οποίος».','Σωστά: το «που» (= τον οποίο) ήταν αντικείμενο και έγινε υποκείμενο (ο οποίος)· οι απόφοιτοι έγιναν ποιητικό αίτιο.','Η δομή είναι σωστή, αλλά άλλαξε ο <b>χρόνος</b>: το «φύτεψαν» είναι αόριστος, άρα «φυτεύτηκε», όχι «φυτευόταν» (παρατατικός).']},
     {q:'…οι γεωπόνοι, <b>που εξέτασαν το δέντρο</b>, …',
      o:['οι γεωπόνοι, οι οποίοι εξετάστηκε το δέντρο','οι γεωπόνοι, από τους οποίους εξετάστηκαν το δέντρο','οι γεωπόνοι, από τους οποίους εξετάστηκε το δέντρο'],a:2,
      e:['Το «που» (= οι οποίοι) ήταν υποκείμενο· στην παθητική γίνεται <b>ποιητικό αίτιο</b>: «από τους οποίους». Δεν μπορεί να μείνει σε ονομαστική.','Το ποιητικό αίτιο είναι σωστό, όμως το ρήμα πρέπει να συμφωνεί με το νέο υποκείμενο, «το δέντρο» (ενικός): «εξετάστηκε», όχι «εξετάστηκαν».','Σωστά: το «που» (= οι οποίοι) ήταν υποκείμενο και έγινε ποιητικό αίτιο (από τους οποίους)· υποκείμενο έγινε «το δέντρο».']},
     {q:'Οι μαθητές <b>σέβονταν</b> τον πλάτανο.',
      o:['Ο πλάτανος σεβόταν από τους μαθητές.','Ο πλάτανος ήταν σεβαστός στους μαθητές.','Ο πλάτανος είναι σεβαστός στους μαθητές.'],a:1,
      e:['Το «σέβομαι» είναι αποθετικό: έχει παθητική κατάληξη αλλά <b>μόνο ενεργητική σημασία</b>. Το «σεβόταν» θα σήμαινε ότι ο πλάτανος σεβόταν κάποιον.','Σωστά: το αποθετικό αντικαθίσταται με ρηματικό επίθετο σε -τος (σεβαστός), στον ίδιο χρόνο (παρατατικός → ήταν). Το ποιητικό αίτιο εδώ: σε + αιτιατική.','Σωστή λύση με ρηματικό επίθετο, αλλά άλλαξε ο <b>χρόνος</b>: το «σέβονταν» είναι παρατατικός, άρα «ήταν σεβαστός».']},
     {q:'Ο αντιδήμαρχος <b>χειρίζεται</b> την υπόθεση του πλατάνου.',
      o:['Η υπόθεση του πλατάνου χειρίζεται από τον αντιδήμαρχο.','Η υπόθεση του πλατάνου είναι χειριστή από τον αντιδήμαρχο.','Η υπόθεση του πλατάνου είναι αντικείμενο χειρισμού από τον αντιδήμαρχο.'],a:2,
      e:['Το «χειρίζομαι» είναι αποθετικό: δεν έχει παθητική σημασία, άρα δεν σχηματίζει παθητική σύνταξη.','Σωστά σκέφτηκες ρηματικό επίθετο, αλλά από το «χειρίζομαι» δεν υπάρχει επίθετο σε -τος. Σε αυτή την περίπτωση χρησιμοποιούμε <b>περίφραση</b>.','Σωστά: όταν δεν υπάρχει ρηματικό επίθετο, χρησιμοποιούμε περίφραση με παθητική σημασία.']}],
 ok:'Σωστά! Πριν μετατρέψουμε, ελέγχουμε πρώτα τον ρόλο του «που» και αν το ρήμα είναι αποθετικό.'},

  {t:'Ο Δήμος έκοψε τον πλάτανο χωρίς να ενημερώσει τους γονείς',c:1,e:'Ενεργητική: ο Δήμος είναι υποκείμενο και η ευθύνη του φαίνεται καθαρά.'},
  {t:'Κόπηκε για λόγους ασφαλείας ο πλάτανος του σχολείου',c:0,e:'Παθητική χωρίς ποιητικό αίτιο: το βάρος πέφτει στους «λόγους ασφαλείας», όχι σε αυτόν που αποφάσισε.'},
  {t:'Το συνεργείο του Δήμου ξερίζωσε το δέντρο των μαθητών',c:1,e:'Ενεργητική: ο δράστης στη θέση του υποκειμένου και ένα ρήμα με ένταση (ξερίζωσε).'}],
 ok:'Σωστά! Ο ίδιος ο γεγονός, δύο συντάξεις, δύο διαφορετικές «αλήθειες». Ο κριτικός αναγνώστης ρωτά πάντα: <b>ποιος το έκανε, και γιατί δεν μου το λένε;</b>'}
];
ST[7].ok=ST[7].ok.replace('Ο ίδιος ο γεγονός','Το ίδιο γεγονός');
const N=ST.length;

let step=-1,maxStep=0,solved=Array(N).fill(false),firstTry=Array(N).fill(null);
const $=id=>document.getElementById(id);
const main=()=>$('main');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

function stamps(){ $('stamps').innerHTML=ST.map((s,i)=>{const can=i<=maxStep&&i!==step;const gs=i>0&&ST[i-1].g!==s.g;
  return `<div class="stamp ${gs?'gs':''} ${solved[i]&&i!==step?'ok':i===step?'now':''} ${can?'go':''}" ${can?`onclick="go(${i})" title="Μετάβαση: ${s.m}"`:''}>${solved[i]&&i!==step?'✓':i+1}<span>${s.sh}</span></div>`;}).join(''); navbar(); }
function navbar(){
  const b=$('nBack'),f=$('nFwd'),m=$('nMid');
  if(step<0){b.hidden=true;f.hidden=false;f.className='nbtn fwd on';f.textContent='Ξεκινάμε →';m.innerHTML='<b>Η υπόθεση</b>';return;}
  if(step>=N){b.hidden=false;f.hidden=true;m.innerHTML='<b>Τα δύο άρθρα τυπώθηκαν</b>';return;}
  b.hidden=false;f.hidden=false;
  const ok=solved[step];f.className='nbtn fwd'+(ok?' on':'');
  f.textContent=step===N-1?'Τύπωμα →':'Επόμενο →';
  m.innerHTML=`Στάδιο <b>${step+1} / ${N}</b><span class="nm-x"> · ${ST[step].m}</span>`+(ok?'':'<br><span class="nm-h">ολοκλήρωσε το στάδιο για να συνεχίσεις</span>');
}
function go(i){ if(i===-1){step=-1;stamps();note();intro();window.scrollTo({top:0});fitZoom();return;} if(i<0||i>maxStep)return; step=i; stamps(); note();
  if(step>=N)fin(); else ({slots:sSlots,sort:sSort,mcq:sMcq})[ST[step].type](ST[step]);
  if(step<N&&solved[step])fb('ok',ST[step].ok); window.scrollTo({top:0}); fitZoom(); }
function fwd(){ if(step<0){go(0);return;} if(step<N&&solved[step]) go(step+1); }
function note(){
  if(step<0){$('note').innerHTML='<div class="st">Νέα αποστολή</div><h2>Ρεπόρτερ σε δράση</h2><p>Ένα δέντρο κόπηκε. Όλοι μιλούν γι’ αυτό, αλλά κανείς δεν λέει καθαρά <b>ποιος</b> το έκοψε. Η απάντηση κρύβεται… στη σύνταξη.</p>';return;}
  if(step>=N){$('note').innerHTML='<div class="st">Τυπώθηκε</div><h2>Μπράβο, ρεπόρτερ!</h2><p>Έλυσες την υπόθεση: βρήκες ποιος έκοψε τον πλάτανο και πώς κάθε πλευρά διάλεξε τη σύνταξή της.</p><div class="kw"><b>Θυμήσου:</b> όταν διαβάζεις παθητική σύνταξη χωρίς ποιητικό αίτιο, ρώτα: «<b>από ποιον;</b>»</div>';return;}
  const s=ST[step]; $('note').innerHTML=`<span class="grp">Βήμα ${s.g+1} · ${GROUPS[s.g]}</span><div class="st">Θεωρία</div><h2>${s.m}</h2><p>${s.def}</p><div class="kw">${s.kw}</div>`; }
function attempt(ok){ if(firstTry[step]===null) firstTry[step]=ok; }
function fb(cls,html){const f=$('fb');if(!f)return;f.className='fb '+cls;f.innerHTML=html;setTimeout(()=>f.scrollIntoView({behavior:'smooth',block:'nearest'}),60);}
function finish(){ solved[step]=true; if(maxStep<step+1)maxStep=step+1; $('row').innerHTML=''; fb('ok',ST[step].ok); stamps(); fitZoom(); }
function sheet(inner,btns){return `<div class="sheet"><div class="kicker">Στάδιο ${step+1} · ${ST[step].m}</div><div class="ttl">${ST[step].title}</div><div class="order">${ST[step].task}<span class="by">— Η αρχισυντάκτρια</span></div>${inner}<div class="fb" id="fb"></div><div class="row" id="row">${solved[step]?'':btns}</div></div>`;}

/* ══ Κομμάτια σε κενά ══ */
function sSlots(s){
  const keys=Object.keys(s.ans);const val={};let sel=null,lock=solved[step];
  main().innerHTML=sheet('<div class="bank" id="B"></div><div id="T"></div>','<button class="btn" id="chk">Έλεγχος</button><button class="btn ghost" id="clr">Καθαρισμός</button>');
  if(lock){const usedI=new Set();keys.forEach(k=>{const i=s.bank.findIndex((w,j)=>w===s.ans[k]&&!usedI.has(j));usedI.add(i);val[k]=i;});}
  const isUsed=i=>Object.values(val).includes(i);
  function drawBank(){const B=$('B');B.innerHTML='';if(lock){B.style.display='none';return;}
    s.bank.forEach((w,i)=>{const c=document.createElement('span');c.className='chip'+(w.length>22?' wide':'')+(sel===i?' sel':'')+(isUsed(i)?' used':'');c.textContent=w;
      c.onclick=()=>{if(lock)return;sel=sel===i?null:i;drawBank();};B.appendChild(c);});}
  function drawT(){$('T').innerHTML=s.html.replace(/\[\[(\w)\]\]/g,(_,k)=>`<span class="slot${lock?' ok':''}" data-k="${k}" data-ph="${s.ph[k]}">${val[k]!==undefined?s.bank[val[k]]:''}</span>`);
    $('T').querySelectorAll('.slot').forEach(sl=>sl.onclick=()=>{if(lock)return;const k=sl.dataset.k;
      if(sel!==null){for(const x in val)if(val[x]===sel)delete val[x];val[k]=sel;sel=null;}else if(val[k]!==undefined)delete val[k];
      $('fb').className='fb';drawBank();drawT();});}
  drawBank();drawT();if(lock)return;
  $('clr').onclick=()=>{for(const k in val)delete val[k];sel=null;$('fb').className='fb';drawBank();drawT();};
  $('chk').onclick=()=>{if(keys.some(k=>val[k]===undefined)){fb('info','Συμπλήρωσε πρώτα όλα τα κενά.');return;}
    let bad=[];keys.forEach(k=>{const sl=$('T').querySelector(`.slot[data-k="${k}"]`);const w=s.bank[val[k]];const r=w===s.ans[k];sl.classList.add(r?'ok':'ko');if(!r)bad.push([k,w]);});
    attempt(!bad.length);
    if(!bad.length){lock=true;drawBank();finish();return;}
    const [k,w]=bad[0];fb('ko',`<b>${keys.length-bad.length} από ${keys.length}</b> σωστά. ${(s.why&&s.why[w])||s.slotMiss[k]} Πάτησε ένα κόκκινο κενό για να το αδειάσεις.`);};
}

/* ══ Ταξινόμηση σε στήλες ══ */
function sSort(s){
  const where={};let sel=null,lock=solved[step];const order=shuffle(s.cards.map((_,i)=>i));
  if(lock)s.cards.forEach((c,i)=>where[i]=c.c);
  const nb=s.cols.length;
  main().innerHTML=sheet(`<div class="pool" id="P"></div><div class="bins ${nb===2?'two':''}" id="BN">${s.cols.map((c,j)=>`<div class="bin" data-j="${j}"><h6>${c}</h6></div>`).join('')}</div>`,'<button class="btn" id="chk">Έλεγχος</button>');
  function card(i){const c=document.createElement('span');c.className='card'+(sel===i?' sel':'')+(lock?' ok':'');c.innerHTML=s.cards[i].t;
    c.onclick=e=>{e.stopPropagation();if(lock)return;
      if(where[i]!==undefined&&sel!==null&&sel!==i){where[sel]=where[i];sel=null;$('fb').className='fb';draw();return;}
      sel=sel===i?null:i;draw();};return c;}
  function draw(){const P=$('P');P.innerHTML='';order.forEach(i=>{if(where[i]===undefined)P.appendChild(card(i));});P.style.display=P.children.length?'flex':'none';
    document.querySelectorAll('#BN .bin').forEach(b=>{const j=+b.dataset.j;b.querySelectorAll('.card').forEach(x=>x.remove());order.forEach(i=>{if(where[i]===j)b.appendChild(card(i));});
      b.onclick=()=>{if(lock||sel===null)return;where[sel]=j;sel=null;$('fb').className='fb';draw();};});}
  draw();if(lock)return;
  $('chk').onclick=()=>{if(s.cards.some((_,i)=>where[i]===undefined)){fb('info','Τοποθέτησε πρώτα όλα τα αποσπάσματα στις στήλες.');return;}
    const bad=s.cards.map((c,i)=>i).filter(i=>where[i]!==s.cards[i].c);attempt(!bad.length);
    if(!bad.length){lock=true;draw();finish();return;}
    bad.forEach(i=>delete where[i]);draw();
    const c=s.cards[bad[0]];const tx=c.t.replace(/<span class="src">.*?<\/span>/,'').replace(/<[^>]+>/g,'');
    fb('ko',`<b>${s.cards.length-bad.length} από ${s.cards.length}</b> σωστά. Τα λάθος αποσπάσματα γύρισαν πάνω. Βοήθεια για το πρώτο: «${tx}» ${c.e||'Ξανασκέψου: '+ST[step].kw.replace(/<[^>]+>/g,'')}`);};
}

/* ══ Ερωτήσεις επιλογής ══ */
function sMcq(s){
  const ch={};let lock=solved[step];
  if(lock)s.qs.forEach((q,i)=>ch[i]=q.a);
  main().innerHTML=sheet(s.qs.map((q,i)=>`<div class="mcq" id="q${i}"><div class="q"><small>Απόσπασμα ${i+1}</small>${q.q}</div><div class="opts">${q.o.map((o,j)=>`<div class="opt" data-i="${i}" data-j="${j}">${o}</div>`).join('')}</div><div class="why" id="w${i}"></div></div>`).join(''),'<button class="btn" id="chk">Έλεγχος</button>');
  function draw(){document.querySelectorAll('.mcq .opt').forEach(o=>{const i=+o.dataset.i,j=+o.dataset.j;o.className='opt'+(ch[i]===j?(lock?' ok':' on'):'');
    o.onclick=()=>{if(lock)return;ch[i]=j;$('w'+i).className='why';draw();};});}
  draw();if(lock)return;
  $('chk').onclick=()=>{if(s.qs.some((_,i)=>ch[i]===undefined)){fb('info','Διάλεξε πρώτα μία απάντηση σε κάθε απόσπασμα.');return;}
    let n=0;s.qs.forEach((q,i)=>{const r=ch[i]===q.a;if(r)n++;const w=$('w'+i);w.className='why '+(r?'ok':'ko');w.innerHTML=q.e[ch[i]];
      const o=document.querySelector(`.opt[data-i="${i}"][data-j="${ch[i]}"]`);o.className='opt '+(r?'ok':'ko');});
    attempt(n===s.qs.length);
    if(n===s.qs.length){lock=true;finish();return;}
    fb('ko',`<b>${n} από ${s.qs.length}</b> σωστά. Διάβασε τα σχόλια κάτω από τις λάθος απαντήσεις και διάλεξε ξανά.`);};
}
