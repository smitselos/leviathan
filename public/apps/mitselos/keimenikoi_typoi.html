<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Κειμενικών Τύπων - Νεοελληνική Γλώσσα</title>
<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
            min-height: 100vh;
            padding: 16px;
            line-height: 1.6;
        }
        
        .container { max-width: 900px; margin: 0 auto; }
        
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 24px;
            margin-bottom: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .header h1 { font-size: 1.5rem; color: #1e293b; }
        .header-subtitle { color: #64748b; font-size: 0.875rem; }
        
        .question-counter { text-align: right; }
        .question-counter span {
            font-size: 1.75rem;
            font-weight: 700;
            color: #4f46e5;
        }
        
        .progress-bar {
            background: #e2e8f0;
            border-radius: 999px;
            height: 8px;
            margin-top: 16px;
            overflow: hidden;
        }
        
        .progress-fill {
            background: #4f46e5;
            height: 100%;
            transition: width 0.3s ease;
        }
        
        /* Οθόνη Επιλογών */
        .selection-screen { text-align: center; }
        .selection-screen h2 {
            color: #1e293b;
            margin-bottom: 8px;
            font-size: 1.75rem;
        }
        .selection-screen p {
            color: #64748b;
            margin-bottom: 24px;
        }
        
        .filter-section {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }
        
        .filter-section h3 {
            color: #374151;
            font-size: 1rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .filter-btn {
            padding: 10px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .filter-btn:hover { border-color: #94a3b8; }
        
        .filter-btn.selected {
            border-color: #4f46e5;
            background: #4f46e5;
            color: white;
            font-weight: 600;
        }
        
        .start-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            background: #4f46e5;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }
        
        .start-btn:hover { background: #3730a3; }
        .start-btn:disabled {
            background: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
        }
        
        .count-info {
            background: #ecfdf5;
            color: #065f46;
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
            font-weight: 500;
        }
        
        .count-info.warning {
            background: #fef3c7;
            color: #92400e;
        }
        
        /* Loading */
        .loading { text-align: center; padding: 60px 20px; }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e2e8f0;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Quiz */
        .paragraph-label {
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .syndyasmos-badge {
            display: inline-block;
            background: #fef3c7;
            color: #92400e;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 8px;
        }
        
        .paragraph-text {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            border-radius: 12px;
            text-align: justify;
            line-height: 1.9;
            font-size: 1rem;
            border-left: 4px solid #4f46e5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            /* Απαγόρευση επιλογής/αντιγραφής */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .question-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 20px;
            border: 2px solid transparent;
        }
        
        .question-card.correct { background: #dcfce7; border-color: #22c55e; }
        .question-card.incorrect { background: #fee2e2; border-color: #ef4444; }
        .question-card.partial { background: #fef9c3; border-color: #eab308; }
        
        .question-card h3 {
            color: #374151;
            font-size: 1rem;
            margin-bottom: 12px;
        }
        
        .multi-select-hint {
            font-size: 0.75rem;
            color: #6b7280;
            margin-bottom: 10px;
            font-style: italic;
        }
        
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .option-btn {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background: white;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
            position: relative;
        }
        
        .option-btn:hover:not(:disabled) { border-color: #94a3b8; }
        .option-btn.selected { border-color: #4f46e5; background: #eef2ff; }
        .option-btn.correct-answer { 
            border-color: #047857; 
            background: #059669; 
            color: white;
            font-weight: 600;
            animation: glow 1.5s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { 
                box-shadow: 0 0 5px #059669, 0 0 10px #059669, 0 0 15px #059669;
            }
            50% { 
                box-shadow: 0 0 10px #10b981, 0 0 20px #10b981, 0 0 30px #10b981, 0 0 40px #10b981;
            }
        }
        .option-btn.correct-answer.was-selected::after {
            content: '✓';
            position: absolute;
            top: -8px;
            right: -8px;
            background: #047857;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .option-btn.wrong-answer { 
            border-color: #b91c1c; 
            background: #dc2626; 
            color: white;
            font-weight: 600;
        }
        .option-btn.wrong-answer::after {
            content: '✗';
            position: absolute;
            top: -8px;
            right: -8px;
            background: #b91c1c;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .option-btn:disabled { cursor: default; }
        .option-hint { font-size: 0.75rem; color: #64748b; margin-left: 8px; }
        .option-btn.correct-answer .option-hint,
        .option-btn.wrong-answer .option-hint { color: rgba(255,255,255,0.8); }
        
        .tropos-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        
        .tropos-btn {
            padding: 10px 8px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            position: relative;
        }
        
        .tropos-btn:hover:not(:disabled) { border-color: #94a3b8; }
        .tropos-btn.selected { border-color: #7c3aed; background: #f3e8ff; }
        .tropos-btn.selected-primary { border-color: #7c3aed; background: #ddd6fe; }
        .tropos-btn.correct-answer { 
            border-color: #047857; 
            background: #059669; 
            color: white;
            font-weight: 600;
            animation: glow 1.5s ease-in-out infinite;
        }
        .tropos-btn.correct-answer.was-selected::after {
            content: '✓';
            position: absolute;
            top: -8px;
            right: -8px;
            background: #047857;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tropos-btn.correct-primary { 
            border-color: #047857; 
            background: #059669; 
            color: white;
            font-weight: 600;
            animation: glow 1.5s ease-in-out infinite;
        }
        .tropos-btn.correct-primary.was-selected::after {
            content: '✓';
            position: absolute;
            top: -8px;
            right: -8px;
            background: #047857;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tropos-btn.wrong-answer {
            border-color: #b91c1c;
            background: #dc2626;
            color: white;
            font-weight: 600;
        }
        .tropos-btn.wrong-answer::after {
            content: '✗';
            position: absolute;
            top: -8px;
            right: -8px;
            background: #b91c1c;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .selection-order {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #7c3aed;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        
        .main-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .main-btn.primary { background: #4f46e5; color: white; }
        .main-btn.primary:hover { background: #3730a3; }
        .main-btn.success { background: #16a34a; color: white; }
        .main-btn.success:hover { background: #15803d; }
        .main-btn:disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }
        
        .feedback-section {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 24px;
            margin-bottom: 20px;
        }
        
        .feedback-section h3 {
            color: #1e293b;
            font-size: 1.2rem;
            margin-bottom: 16px;
        }
        
        .feedback-box {
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        
        .feedback-box.blue { background: #eff6ff; }
        .feedback-box.purple { background: #faf5ff; }
        .feedback-box.green { background: #ecfdf5; }
        .feedback-box.amber { background: #fffbeb; }
        
        .feedback-box h4 { font-size: 0.95rem; margin-bottom: 8px; }
        .feedback-box.blue h4 { color: #1e40af; }
        .feedback-box.purple h4 { color: #6b21a8; }
        .feedback-box.green h4 { color: #065f46; }
        .feedback-box.amber h4 { color: #92400e; }
        
        .feedback-box p { font-size: 0.875rem; color: #374151; margin-bottom: 6px; }
        
        .tropos-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-right: 6px;
        }
        
        .tropos-tag.primary { background: #ddd6fe; color: #5b21b6; }
        .tropos-tag.secondary { background: #e0e7ff; color: #3730a3; }
        
        /* Results */
        .results-card { text-align: center; padding: 40px 24px; }
        .results-emoji { font-size: 4rem; margin-bottom: 16px; }
        .results-title { font-size: 1.75rem; color: #1e293b; margin-bottom: 24px; }
        
        .results-score-box {
            background: linear-gradient(135deg, #eef2ff 0%, #faf5ff 100%);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }
        
        .results-score { font-size: 3rem; font-weight: 700; color: #4f46e5; }
        .results-percentage { color: #64748b; font-size: 1.1rem; }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .detail-box { padding: 16px; border-radius: 12px; }
        .detail-box.blue { background: #eff6ff; }
        .detail-box.purple { background: #faf5ff; }
        .detail-box.green { background: #ecfdf5; }
        
        .detail-box p:first-child { font-size: 0.8rem; font-weight: 500; }
        .detail-box.blue p:first-child { color: #2563eb; }
        .detail-box.purple p:first-child { color: #7c3aed; }
        .detail-box.green p:first-child { color: #059669; }
        
        .detail-box p:last-child { font-size: 1.5rem; font-weight: 700; }
        .detail-box.blue p:last-child { color: #1d4ed8; }
        .detail-box.purple p:last-child { color: #6b21a8; }
        .detail-box.green p:last-child { color: #047857; }
        
        .theory-toggle {
            background: none;
            border: none;
            color: #4f46e5;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 8px 0;
        }
        
        .theory-box {
            background: #fffbeb;
            border: 1px solid #fcd34d;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            font-size: 0.875rem;
        }
        
        .theory-box h3 { color: #92400e; margin-bottom: 12px; }
        .theory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }
        .theory-box ul { margin-left: 20px; color: #78350f; }
        .theory-box li { margin-bottom: 4px; font-size: 0.8rem; }
        
        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: flex-start; }
            .tropos-grid { grid-template-columns: 1fr; }
            .results-grid { grid-template-columns: 1fr; }
            .filter-options { flex-direction: column; }
            .filter-btn { width: 100%; text-align: center; }
        }
        
        /* Εκτύπωση */
        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-container {
                max-width: 100%;
                padding: 20px;
            }
            .print-header {
                text-align: center;
                margin-bottom: 30px;
                border-bottom: 2px solid #333;
                padding-bottom: 15px;
            }
            .print-header h1 { font-size: 18pt; margin-bottom: 5px; }
            .print-header p { font-size: 11pt; color: #666; }
            .print-paragraph {
                margin-bottom: 25px;
                page-break-inside: avoid;
            }
            .print-paragraph-number {
                font-weight: bold;
                font-size: 12pt;
                margin-bottom: 8px;
            }
            .print-paragraph-text {
                font-size: 11pt;
                line-height: 1.8;
                text-align: justify;
                border: 1px solid #ccc;
                padding: 15px;
                background: #fafafa;
            }
            .print-answer-section {
                margin-top: 10px;
                border: 1px dashed #ccc;
                padding: 10px;
                min-height: 60px;
            }
            .print-answer-section p {
                font-size: 10pt;
                color: #666;
                margin-bottom: 5px;
            }
        }
        
        .print-only { display: none; }
        
        .print-btn {
            background: #059669;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        .print-btn:hover { background: #047857; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="card loading">
            <div class="loading-spinner"></div>
            <p>Φόρτωση δεδομένων...</p>
        </div>
    </div>

    <script>
        // =====================================================
        // ΡΥΘΜΙΣΕΙΣ
        // =====================================================
        // Δημόσια δημοσιευμένη διεύθυνση CSV του Google Sheet.
        // Άφησέ την κενή ('') για χρήση των ενσωματωμένων δεδομένων,
        // ή βάλε τη διεύθυνση publish-to-web (output=csv) όταν είναι έτοιμη.
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSvU-B3J9LdZGD9amAY5zjNchc4YjjqC8fNLCf8FiDvr58-Gg4IGhj_YZqsG1Acwg/pub?gid=47489621&single=true&output=csv';

        // Οι πέντε κειμενικοί τύποι (μονή επιλογή).
        const TEXT_TYPES = [
            "Περιγραφή",
            "Αφήγηση",
            "Εξήγηση",
            "Οδηγίες",
            "Επιχειρηματολογία"
        ];

        // Θεωρία ανά κειμενικό γένος (πηγή: σχολικό υλικό «Κειμενικά γένη»).
        // Κάθε γένος: Τι είναι — (Είδη, όπου υπάρχουν) — Δομή — Γλώσσα.
        const THEORY = {
            "Περιγραφή": {
                ti: "Παρουσίαση ιδιοτήτων / χαρακτηριστικών ενός αντικειμένου, προσώπου, φαινομένου, έννοιας ή κατάστασης.",
                domi: "Ονομασία – ταξινόμηση – ιδιότητες και λειτουργίες",
                glossa: "Συνδετικά ρήματα που βοηθούν στην ταξινόμηση, επίθετα, προσδιορισμοί τόπου (αν πρόκειται για περιγραφή χώρου)"
            },
            "Αφήγηση": {
                ti: "Εξιστόρηση μιας ακολουθίας γεγονότων στον άξονα του χρόνου.",
                domi: "Προσανατολισμός – δράση/περιπέτεια – λύση (± επιμύθιο)",
                glossa: "Παρελθοντικά ρήματα δράσης, δείκτες χρόνου"
            },
            "Εξήγηση": {
                ti: "Προσπάθεια ερμηνείας της εμφάνισης ενός κοινωνικού ή φυσικού φαινομένου με βάση χρονικές / αιτιακές σχέσεις.",
                eidi: "Εξηγήσεις του «πώς» (πώς δημιουργείται η βροχή), εξηγήσεις του «γιατί» (γιατί οι έφηβοι χρησιμοποιούν υπερβολικά το κινητό), εξηγήσεις αποτελεσμάτων (τι επιπτώσεις προκαλεί το φαινόμενο)",
                domi: "Αναφορά στο φαινόμενο – διαδοχή βημάτων / αιτίων / αποτελεσμάτων – (± κρίση/σχόλιο συντάκτη)",
                glossa: "Χρονικοί ή αιτιακοί δείκτες, ονοματοποίηση"
            },
            "Οδηγίες": {
                ti: "Παράθεση οδηγιών χρήσης ή προτάσεων, συμβουλών και προτροπών.",
                eidi: "Διαδικαστικές οδηγίες (αυστηρά ιεραρχημένα στη σειρά βήματα, π.χ. συνταγή μαγειρικής), μη διαδικαστικές (προτάσεις και συμβουλές χωρίς ιεράρχηση ή βήματα)",
                domi: "Στόχος – υλικά / μέσα – εκτέλεση (μόνο στις διαδικαστικές οδηγίες)",
                glossa: "Δεοντική τροπικότητα (προστακτική / υποτακτική, «πρέπει να» κ.λπ.), διαρθρωτικές λέξεις σειράς"
            },
            "Επιχειρηματολογία": {
                ti: "Κείμενο με στόχο την υποστήριξη μιας θέσης (πειθώ).",
                eidi: "Εκθέσεις – Συζητήσεις",
                domi: "Ισχυρισμός / θέση – απόδειξη (επιχειρήματα και άλλοι τρόποι πειθούς) – συμπέρασμα",
                glossa: "Επιστημική τροπικότητα, δοξαστικά ρήματα"
            }
        };

        // Ενσωματωμένα δεδομένα (πηγή: quiz_paragrafos_clean.xlsx) — εφεδρικά
        // και για άμεση δοκιμή χωρίς σύνδεση στο Sheet.

    "diorthosi": "Επιχειρηματολογία: διατυπώνεται θέση (αξίζει να δαπανούμε πόρους για την εξερεύνηση του Διαστήματος) και στηρίζεται με αλυσίδα επιχειρημάτων (ιατρική πρόοδος → αύξηση πληθυσμού → εξάντληση πόρων → ανάγκη αποίκισης άλλων πλανητών). Επιστημική τροπικότητα και δείκτες λογικής σύνδεσης/πιθανολόγησης («μάλλον απίθανο», «ως εκ τούτου»)."
  }
];

        let allData = [];  // Όλα τα δεδομένα
        let quizData = []; // Επιλεγμένα/φιλτραρισμένα δεδομένα

        let state = {
            screen: 'loading', // loading, selection, quiz, results
            // Φίλτρα
            selectedTypeFilter: 'all', // all ή ένας από τους TEXT_TYPES
            selectedCount: 10,         // 5, 10, ή 999 (= Όλα)
            // Quiz
            currentQuestion: 0,
            selected: null,            // ο τύπος που επέλεξε ο μαθητής
            showResult: false,
            score: 0,
            perType: {},               // {τύπος: {correct, total}}
            showTheory: false
        };

        // =====================================================
        // DATA LOADING
        // =====================================================

        function parseCSVLine(line, delimiter) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === delimiter && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result.map(val => val.replace(/^"|"$/g, '').replace(/""/g, '"'));
        }

        function detectDelimiter(firstLine) {
            const commas = (firstLine.match(/,/g) || []).length;
            const semicolons = (firstLine.match(/;/g) || []).length;
            return semicolons > commas ? ';' : ',';
        }

        // Σωστός χειρισμός πεδίων CSV με εσωτερικές αλλαγές γραμμής (μέσα σε "...").
        function splitCSVRecords(csv) {
            const records = [];
            let field = '';
            let record = [];
            let inQuotes = false;
            for (let i = 0; i < csv.length; i++) {
                const c = csv[i];
                if (c === '"') {
                    if (inQuotes && csv[i + 1] === '"') { field += '"'; i++; }
                    else inQuotes = !inQuotes;
                } else if (c === '\n' && !inQuotes) {
                    record.push(field); records.push(record); field = ''; record = [];
                } else if (c === '\r') {
                    // αγνόησέ το
                } else {
                    field += c;
                }
            }
            if (field.length > 0 || record.length > 0) { record.push(field); records.push(record); }
            return records;
        }

        function parseCSV(csv) {
            const records = splitCSVRecords(csv).filter(r => r.some(v => v && v.trim()));
            if (records.length < 2) return [];
            const headers = records[0].map(h => h.trim().toLowerCase());
            const data = [];
            for (let i = 1; i < records.length; i++) {
                const values = records[i];
                const obj = {};
                headers.forEach((header, index) => {
                    let value = (values[index] || '').trim();
                    if (value === '' || value.toLowerCase() === 'null') value = null;
                    obj[header] = value;
                });
                // Απαιτούνται μόνο keimeno + typos_keimenou.
                if (obj.keimeno && obj.typos_keimenou) {
                    // Κανονικοποίηση Unicode (NFC), ώστε η σύγκριση του τύπου να
                    // λειτουργεί ανεξάρτητα από τη μορφή που σερβίρει το Sheet.
                    obj.typos_keimenou = obj.typos_keimenou.normalize('NFC');
                    data.push(obj);
                }
            }
            return data;
        }

        async function loadData() {
            // Αν δεν έχει οριστεί URL, χρησιμοποίησε τα ενσωματωμένα δεδομένα.
            if (!GOOGLE_SHEET_CSV_URL) {
                allData = FALLBACK_DATA.slice();
                state.screen = 'selection';
                render();
                return;
            }

            const proxies = [
                (u) => 'https://corsproxy.io/?' + encodeURIComponent(u),
                (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
                (u) => u
            ];

            for (const getProxyUrl of proxies) {
                try {
                    const response = await fetch(getProxyUrl(GOOGLE_SHEET_CSV_URL));
                    if (!response.ok) continue;
                    const csv = await response.text();
                    if (!csv || csv.trim().startsWith('<!') || csv.trim().startsWith('<html')) continue;
                    const parsed = parseCSV(csv);
                    if (parsed.length > 0) {
                        allData = parsed;
                        state.screen = 'selection';
                        render();
                        return;
                    }
                } catch (e) { continue; }
            }

            // Εφεδρική λύση: ενσωματωμένα δεδομένα.
            allData = FALLBACK_DATA.slice();
            state.screen = 'selection';
            render();
        }

        function shuffleArray(array) {
            const a = [...array];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function formatText(t) {
            return (t || '').replace(/\n/g, '<br>');
        }

        // =====================================================
        // FILTERING
        // =====================================================

        function getFilteredData() {
            let filtered = [...allData];
            if (state.selectedTypeFilter !== 'all') {
                filtered = filtered.filter(item => item.typos_keimenou === state.selectedTypeFilter);
            }
            return filtered;
        }

        // =====================================================
        // RENDERING
        // =====================================================

        function render() {
            const app = document.getElementById('app');
            switch (state.screen) {
                case 'loading':   app.innerHTML = renderLoading();   break;
                case 'selection': app.innerHTML = renderSelection(); break;
                case 'quiz':      app.innerHTML = renderQuiz();      break;
                case 'results':   app.innerHTML = renderResults();   break;
            }
            attachEventListeners();
        }

        function renderLoading() {
            return `
                <div class="card loading">
                    <div class="loading-spinner"></div>
                    <p>Φόρτωση δεδομένων...</p>
                </div>
            `;
        }

        function renderSelection() {
            const filteredCount = getFilteredData().length;
            const wanted = state.selectedCount === 999 ? filteredCount : state.selectedCount;

            const typeButtons = ['all', ...TEXT_TYPES].map(t => `
                <button class="filter-btn ${state.selectedTypeFilter === t ? 'selected' : ''}" data-type-filter="${t}">
                    ${t === 'all' ? 'Όλοι' : t}
                </button>
            `).join('');

            return `
                <div class="card selection-screen">
                    <h2>📝 Quiz Κειμενικών Τύπων</h2>
                    <p>Νεοελληνική Γλώσσα - Αναγνώριση κειμενικού τύπου</p>

                    <div class="filter-section">
                        <h3>📚 Επιλέξτε Κειμενικό Τύπο</h3>
                        <div class="filter-options">
                            ${typeButtons}
                        </div>
                    </div>

                    <div class="filter-section">
                        <h3>🔢 Αριθμός Κειμένων</h3>
                        <div class="filter-options">
                            <button class="filter-btn ${state.selectedCount === 5 ? 'selected' : ''}" data-count="5">5</button>
                            <button class="filter-btn ${state.selectedCount === 10 ? 'selected' : ''}" data-count="10">10</button>
                            <button class="filter-btn ${state.selectedCount === 999 ? 'selected' : ''}" data-count="999">Όλα</button>
                        </div>
                    </div>

                    <div class="count-info ${filteredCount === 0 ? 'warning' : ''}">
                        ${filteredCount > 0
                            ? `✅ Βρέθηκαν <strong>${filteredCount}</strong> κείμενα ${filteredCount < wanted ? `(θα εμφανιστούν όλα)` : `(θα εμφανιστούν ${wanted})`}`
                            : '⚠️ Δεν βρέθηκαν κείμενα με αυτά τα κριτήρια'}
                    </div>

                    <button class="start-btn" id="startBtn" ${filteredCount === 0 ? 'disabled' : ''}>
                        Ξεκινήστε το Quiz
                    </button>

                    <button class="print-btn" id="printBtn" ${filteredCount === 0 ? 'disabled' : ''}>
                        🖨️ Εκτύπωση Άσκησης (Φύλλο Εργασίας)
                    </button>
                </div>
            `;
        }

        function renderQuiz() {
            const current = quizData[state.currentQuestion];
            const progress = ((state.currentQuestion + 1) / quizData.length) * 100;
            const isCorrect = state.selected === current.typos_keimenou;

            const optionButtons = TEXT_TYPES.map(t => {
                let classes = 'option-btn';
                if (!state.showResult && state.selected === t) classes += ' selected';
                if (state.showResult) {
                    if (t === current.typos_keimenou) {
                        classes += ' correct-answer';
                        if (state.selected === t) classes += ' was-selected';
                    } else if (state.selected === t) {
                        classes += ' wrong-answer';
                    }
                }
                return `
                    <button class="${classes}" data-type="${t}" ${state.showResult ? 'disabled' : ''}>
                        ${t}
                    </button>
                `;
            }).join('');

            return `
                <div class="card">
                    <div class="header">
                        <div>
                            <h1>📝 Κειμενικοί Τύποι</h1>
                            <p class="header-subtitle">Νεοελληνική Γλώσσα</p>
                        </div>
                        <div class="question-counter">
                            <p style="color: #64748b; font-size: 0.875rem;">Ερώτηση</p>
                            <span>${state.currentQuestion + 1}/${quizData.length}</span>
                        </div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                </div>

                <button class="theory-toggle" id="theoryToggle">
                    ${state.showTheory ? '▼' : '▶'} Βοήθεια: Θεωρητικό Πλαίσιο
                </button>

                ${state.showTheory ? `
                <div class="theory-box">
                    <h3>📚 Τα κειμενικά γένη</h3>
                    <div class="theory-grid">
                        ${TEXT_TYPES.map(t => `
                            <div>
                                <p style="font-weight: 600; margin-bottom: 4px; color: #92400e;">${t}</p>
                                <ul>
                                    <li><strong>Τι είναι:</strong> ${THEORY[t].ti}</li>
                                    ${THEORY[t].eidi ? `<li><strong>Είδη:</strong> ${THEORY[t].eidi}</li>` : ''}
                                    <li><strong>Δομή:</strong> ${THEORY[t].domi}</li>
                                    <li><strong>Γλώσσα:</strong> ${THEORY[t].glossa}</li>
                                </ul>
                            </div>
                        `).join('')}
                    </div>
                </div>
                ` : ''}

                <div class="card">
                    <span class="paragraph-label">Κείμενο ${state.currentQuestion + 1}</span>
                    <p class="paragraph-text">${formatText(current.keimeno)}</p>
                </div>

                <div class="question-card ${state.showResult ? (isCorrect ? 'correct' : 'incorrect') : ''}">
                    <h3>Ποια επικοινωνιακή λειτουργία επιτελείται;</h3>
                    <div class="options-list">
                        ${optionButtons}
                    </div>
                </div>

                ${!state.showResult ? `
                    <button class="main-btn primary" id="checkBtn" ${!state.selected ? 'disabled' : ''}>
                        Έλεγχος Απάντησης
                    </button>
                ` : `
                    <div class="feedback-section">
                        <h3>📋 Ανάλυση Απάντησης</h3>

                        <div class="feedback-box ${isCorrect ? 'green' : 'purple'}">
                            <h4>${isCorrect ? '✅ Σωστή απάντηση' : '❌ Λάθος απάντηση'} — Κύριο κειμενικό γένος: ${current.typos_keimenou}</h4>
                            ${current.diorthosi ? `<p style="margin-top: 8px;">${formatText(current.diorthosi)}</p>` : `<p style="margin-top: 8px;">${THEORY[current.typos_keimenou].ti}</p>`}
                        </div>
                    </div>

                    <button class="main-btn success" id="nextBtn">
                        ${state.currentQuestion < quizData.length - 1 ? 'Επόμενο Κείμενο →' : 'Δες τα Αποτελέσματα'}
                    </button>
                `}
            `;
        }

        function renderResults() {
            const total = quizData.length;
            const percentage = total ? Math.round((state.score / total) * 100) : 0;
            const emoji = percentage >= 80 ? '🎉' : percentage >= 60 ? '👍' : '📚';

            const perTypeRows = TEXT_TYPES
                .filter(t => state.perType[t] && state.perType[t].total > 0)
                .map(t => {
                    const pt = state.perType[t];
                    return `
                        <div class="detail-box blue">
                            <p>${t}</p>
                            <p>${pt.correct}/${pt.total}</p>
                        </div>
                    `;
                }).join('');

            return `
                <div class="card results-card">
                    <div class="results-emoji">${emoji}</div>
                    <h2 class="results-title">Ολοκλήρωσες το Quiz!</h2>

                    <div class="results-score-box">
                        <p class="results-score">${state.score} / ${total}</p>
                        <p class="results-percentage">(${percentage}%)</p>
                    </div>

                    ${perTypeRows ? `<div class="results-grid">${perTypeRows}</div>` : ''}

                    <button class="main-btn primary" id="restartBtn" style="margin-bottom: 12px;">
                        Ξεκίνα Ξανά
                    </button>
                    <button class="main-btn" id="newSelectionBtn" style="background: #64748b; color: white;">
                        Νέα Επιλογή Κριτηρίων
                    </button>
                </div>
            `;
        }

        // =====================================================
        // EVENT LISTENERS
        // =====================================================

        function startQuiz() {
            let filtered = shuffleArray(getFilteredData());
            const n = state.selectedCount === 999 ? filtered.length : state.selectedCount;
            quizData = filtered.slice(0, n);
            state.screen = 'quiz';
            state.currentQuestion = 0;
            state.selected = null;
            state.showResult = false;
            state.score = 0;
            state.perType = {};
        }

        function attachEventListeners() {
            // --- Selection screen ---
            document.querySelectorAll('[data-type-filter]').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.selectedTypeFilter = btn.dataset.typeFilter;
                    render();
                });
            });

            document.querySelectorAll('[data-count]').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.selectedCount = parseInt(btn.dataset.count);
                    render();
                });
            });

            const startBtn = document.getElementById('startBtn');
            if (startBtn) startBtn.addEventListener('click', () => { startQuiz(); render(); });

            const printBtn = document.getElementById('printBtn');
            if (printBtn) printBtn.addEventListener('click', () => {
                const filtered = shuffleArray(getFilteredData());
                const n = state.selectedCount === 999 ? filtered.length : state.selectedCount;
                printWorksheet(filtered.slice(0, n));
            });

            // --- Quiz screen ---
            const theoryToggle = document.getElementById('theoryToggle');
            if (theoryToggle) theoryToggle.addEventListener('click', () => {
                state.showTheory = !state.showTheory; render();
            });

            document.querySelectorAll('[data-type]').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.selected = btn.dataset.type;
                    render();
                });
            });

            const checkBtn = document.getElementById('checkBtn');
            if (checkBtn) checkBtn.addEventListener('click', () => {
                const current = quizData[state.currentQuestion];
                const correct = state.selected === current.typos_keimenou;
                if (correct) state.score += 1;
                // Στατιστικά ανά τύπο (με βάση τον σωστό τύπο του κειμένου).
                if (!state.perType[current.typos_keimenou]) state.perType[current.typos_keimenou] = { correct: 0, total: 0 };
                state.perType[current.typos_keimenou].total += 1;
                if (correct) state.perType[current.typos_keimenou].correct += 1;
                state.showResult = true;
                render();
            });

            const nextBtn = document.getElementById('nextBtn');
            if (nextBtn) nextBtn.addEventListener('click', () => {
                if (state.currentQuestion < quizData.length - 1) {
                    state.currentQuestion += 1;
                    state.selected = null;
                    state.showResult = false;
                } else {
                    state.screen = 'results';
                }
                render();
            });

            // --- Results screen ---
            const restartBtn = document.getElementById('restartBtn');
            if (restartBtn) restartBtn.addEventListener('click', () => { startQuiz(); render(); });

            const newSelectionBtn = document.getElementById('newSelectionBtn');
            if (newSelectionBtn) newSelectionBtn.addEventListener('click', () => {
                state.screen = 'selection';
                render();
            });
        }

        // =====================================================
        // PRINT WORKSHEET
        // =====================================================

        function printWorksheet(data) {
            const printWindow = window.open('', '_blank');
            const paragraphsHTML = data.map((item, index) => `
                <div class="print-paragraph">
                    <div class="print-paragraph-number"><b>Κείμενο ${index + 1}</b></div>
                    <div class="print-paragraph-text">${formatText(item.keimeno)}</div>
                    <div class="print-answer-section">
                        <p>Κειμενικός τύπος: ______________________________</p>
                        <p>Αιτιολόγηση: ______________________________________</p>
                    </div>
                </div>
            `).join('');

            printWindow.document.write(`
                <!DOCTYPE html>
                <html lang="el">
                <head>
                    <meta charset="UTF-8">
                    <title>ΑΣΚΗΣΗ - Κειμενικοί Τύποι</title>
                    <style>
                        * { margin: 0; padding: 0; box-sizing: border-box; }
                        body { font-family: 'Times New Roman', serif; padding: 40px; line-height: 1.6; }
                        .print-title { text-align: center; font-size: 18pt; font-weight: bold; margin-bottom: 20px; }
                        .print-instructions { font-size: 11pt; text-align: justify; margin-bottom: 30px; line-height: 1.8; }
                        .print-paragraph { margin-bottom: 25px; page-break-inside: avoid; }
                        .print-paragraph-number { font-size: 11pt; margin-bottom: 8px; }
                        .print-paragraph-text { font-size: 11pt; line-height: 1.8; text-align: justify; }
                        .print-answer-section { margin-top: 10px; border: 1px dashed #ccc; padding: 10px; min-height: 50px; }
                        .print-answer-section p { font-size: 10pt; color: #444; margin-bottom: 10px; }
                        @media print { body { padding: 20px; } .no-print { display: none; } }
                    </style>
                </head>
                <body>
                    <div class="print-title">ΑΣΚΗΣΗ — Κειμενικοί Τύποι</div>
                    <div class="print-instructions">
                        Να αναγνωρίσετε τον κύριο κειμενικό τύπο καθενός από τα παρακάτω κείμενα
                        (Περιγραφή, Αφήγηση, Εξήγηση, Οδηγίες, Επιχειρηματολογία) και να αιτιολογήσετε
                        την επιλογή σας με βάση τα γλωσσικά χαρακτηριστικά και την πρόθεση του συντάκτη.
                    </div>
                    ${paragraphsHTML}
                    <button class="no-print" onclick="window.print()" style="
                        position: fixed; top: 20px; right: 20px; padding: 15px 30px;
                        font-size: 16px; background: #4f46e5; color: white; border: none;
                        border-radius: 8px; cursor: pointer;">🖨️ Εκτύπωση</button>
                </body>
                </html>
            `);
            printWindow.document.close();
        }

        // =====================================================
        // INIT
        // =====================================================
        loadData();

        // Απαγόρευση αντιγραφής στο κείμενο
        document.addEventListener('copy', function(e) {
            const selection = window.getSelection();
            const container = selection.anchorNode?.parentElement;
            if (container && container.closest('.paragraph-text')) e.preventDefault();
        });
        document.addEventListener('contextmenu', function(e) {
            if (e.target.closest('.paragraph-text')) e.preventDefault();
        });
    </script>
</body>
</html>
