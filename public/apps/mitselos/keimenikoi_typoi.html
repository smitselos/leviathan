<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Κειμενικών Τύπων - Νεοελληνική Γλώσσα</title>
<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
            min-height: 100vh;
            padding: 16px;
            line-height: 1.6;
        }
        
        .container { max-width: 900px; margin: 0 auto; }
        
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 24px;
            margin-bottom: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .header h1 { font-size: 1.5rem; color: #1e293b; }
        .header-subtitle { color: #64748b; font-size: 0.875rem; }
        
        .question-counter { text-align: right; }
        .question-counter span {
            font-size: 1.75rem;
            font-weight: 700;
            color: #4f46e5;
        }
        
        .progress-bar {
            background: #e2e8f0;
            border-radius: 999px;
            height: 8px;
            margin-top: 16px;
            overflow: hidden;
        }
        
        .progress-fill {
            background: #4f46e5;
            height: 100%;
            transition: width 0.3s ease;
        }
        
        /* Οθόνη Επιλογών */
        .selection-screen { text-align: center; }
        .selection-screen h2 {
            color: #1e293b;
            margin-bottom: 8px;
            font-size: 1.75rem;
        }
        .selection-screen p {
            color: #64748b;
            margin-bottom: 24px;
        }
        
        .filter-section {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }
        
        .filter-section h3 {
            color: #374151;
            font-size: 1rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .filter-btn {
            padding: 10px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .filter-btn:hover { border-color: #94a3b8; }
        
        .filter-btn.selected {
            border-color: #4f46e5;
            background: #4f46e5;
            color: white;
            font-weight: 600;
        }
        
        .start-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            background: #4f46e5;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }
        
        .start-btn:hover { background: #3730a3; }
        .start-btn:disabled {
            background: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
        }
        
        .count-info {
            background: #ecfdf5;
            color: #065f46;
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
            font-weight: 500;
        }
        
        .count-info.warning {
            background: #fef3c7;
            color: #92400e;
        }
        
        /* Loading */
        .loading { text-align: center; padding: 60px 20px; }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e2e8f0;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Quiz */
        .paragraph-label {
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .syndyasmos-badge {
            display: inline-block;
            background: #fef3c7;
            color: #92400e;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 8px;
        }
        
        .paragraph-text {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            border-radius: 12px;
            text-align: justify;
            line-height: 1.9;
            font-size: 1rem;
            border-left: 4px solid #4f46e5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            /* Απαγόρευση επιλογής/αντιγραφής */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .question-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 20px;
            border: 2px solid transparent;
        }
        
        .question-card.correct { background: #dcfce7; border-color: #22c55e; }
        .question-card.incorrect { background: #fee2e2; border-color: #ef4444; }
        .question-card.partial { background: #fef9c3; border-color: #eab308; }
        
        .question-card h3 {
            color: #374151;
            font-size: 1rem;
            margin-bottom: 12px;
        }
        
        .multi-select-hint {
            font-size: 0.75rem;
            color: #6b7280;
            margin-bottom: 10px;
            font-style: italic;
        }
        
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .option-btn {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background: white;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
            position: relative;
        }
        
        .option-btn:hover:not(:disabled) { border-color: #94a3b8; }
        .option-btn.selected { border-color: #4f46e5; background: #eef2ff; }
        .option-btn.correct-answer { 
            border-color: #047857; 
            background: #059669; 
            color: white;
            font-weight: 600;
            animation: glow 1.5s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { 
                box-shadow: 0 0 5px #059669, 0 0 10px #059669, 0 0 15px #059669;
            }
            50% { 
                box-shadow: 0 0 10px #10b981, 0 0 20px #10b981, 0 0 30px #10b981, 0 0 40px #10b981;
            }
        }
        .option-btn.correct-answer.was-selected::after {
            content: '✓';
            position: absolute;
            top: -8px;
            right: -8px;
            background: #047857;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .option-btn.wrong-answer { 
            border-color: #b91c1c; 
            background: #dc2626; 
            color: white;
            font-weight: 600;
        }
        .option-btn.wrong-answer::after {
            content: '✗';
            position: absolute;
            top: -8px;
            right: -8px;
            background: #b91c1c;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .option-btn:disabled { cursor: default; }
        .option-hint { font-size: 0.75rem; color: #64748b; margin-left: 8px; }
        .option-btn.correct-answer .option-hint,
        .option-btn.wrong-answer .option-hint { color: rgba(255,255,255,0.8); }
        
        .tropos-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        
        .tropos-btn {
            padding: 10px 8px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            position: relative;
        }
        
        .tropos-btn:hover:not(:disabled) { border-color: #94a3b8; }
        .tropos-btn.selected { border-color: #7c3aed; background: #f3e8ff; }
        .tropos-btn.selected-primary { border-color: #7c3aed; background: #ddd6fe; }
        .tropos-btn.correct-answer { 
            border-color: #047857; 
            background: #059669; 
            color: white;
            font-weight: 600;
            animation: glow 1.5s ease-in-out infinite;
        }
        .tropos-btn.correct-answer.was-selected::after {
            content: '✓';
            position: absolute;
            top: -8px;
            right: -8px;
            background: #047857;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tropos-btn.correct-primary { 
            border-color: #047857; 
            background: #059669; 
            color: white;
            font-weight: 600;
            animation: glow 1.5s ease-in-out infinite;
        }
        .tropos-btn.correct-primary.was-selected::after {
            content: '✓';
            position: absolute;
            top: -8px;
            right: -8px;
            background: #047857;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tropos-btn.wrong-answer {
            border-color: #b91c1c;
            background: #dc2626;
            color: white;
            font-weight: 600;
        }
        .tropos-btn.wrong-answer::after {
            content: '✗';
            position: absolute;
            top: -8px;
            right: -8px;
            background: #b91c1c;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .selection-order {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #7c3aed;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        
        .main-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .main-btn.primary { background: #4f46e5; color: white; }
        .main-btn.primary:hover { background: #3730a3; }
        .main-btn.success { background: #16a34a; color: white; }
        .main-btn.success:hover { background: #15803d; }
        .main-btn:disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }
        
        .feedback-section {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 24px;
            margin-bottom: 20px;
        }
        
        .feedback-section h3 {
            color: #1e293b;
            font-size: 1.2rem;
            margin-bottom: 16px;
        }
        
        .feedback-box {
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        
        .feedback-box.blue { background: #eff6ff; }
        .feedback-box.purple { background: #faf5ff; }
        .feedback-box.green { background: #ecfdf5; }
        .feedback-box.amber { background: #fffbeb; }
        
        .feedback-box h4 { font-size: 0.95rem; margin-bottom: 8px; }
        .feedback-box.blue h4 { color: #1e40af; }
        .feedback-box.purple h4 { color: #6b21a8; }
        .feedback-box.green h4 { color: #065f46; }
        .feedback-box.amber h4 { color: #92400e; }
        
        .feedback-box p { font-size: 0.875rem; color: #374151; margin-bottom: 6px; }
        
        .tropos-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-right: 6px;
        }
        
        .tropos-tag.primary { background: #ddd6fe; color: #5b21b6; }
        .tropos-tag.secondary { background: #e0e7ff; color: #3730a3; }
        
        /* Results */
        .results-card { text-align: center; padding: 40px 24px; }
        .results-emoji { font-size: 4rem; margin-bottom: 16px; }
        .results-title { font-size: 1.75rem; color: #1e293b; margin-bottom: 24px; }
        
        .results-score-box {
            background: linear-gradient(135deg, #eef2ff 0%, #faf5ff 100%);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }
        
        .results-score { font-size: 3rem; font-weight: 700; color: #4f46e5; }
        .results-percentage { color: #64748b; font-size: 1.1rem; }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .detail-box { padding: 16px; border-radius: 12px; }
        .detail-box.blue { background: #eff6ff; }
        .detail-box.purple { background: #faf5ff; }
        .detail-box.green { background: #ecfdf5; }
        
        .detail-box p:first-child { font-size: 0.8rem; font-weight: 500; }
        .detail-box.blue p:first-child { color: #2563eb; }
        .detail-box.purple p:first-child { color: #7c3aed; }
        .detail-box.green p:first-child { color: #059669; }
        
        .detail-box p:last-child { font-size: 1.5rem; font-weight: 700; }
        .detail-box.blue p:last-child { color: #1d4ed8; }
        .detail-box.purple p:last-child { color: #6b21a8; }
        .detail-box.green p:last-child { color: #047857; }
        
        .theory-toggle {
            background: none;
            border: none;
            color: #4f46e5;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 8px 0;
        }
        
        .theory-box {
            background: #fffbeb;
            border: 1px solid #fcd34d;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            font-size: 0.875rem;
        }
        
        .theory-box h3 { color: #92400e; margin-bottom: 12px; }
        .theory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }
        .theory-box ul { margin-left: 20px; color: #78350f; }
        .theory-box li { margin-bottom: 4px; font-size: 0.8rem; }
        
        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: flex-start; }
            .tropos-grid { grid-template-columns: 1fr; }
            .results-grid { grid-template-columns: 1fr; }
            .filter-options { flex-direction: column; }
            .filter-btn { width: 100%; text-align: center; }
        }
        
        /* Εκτύπωση */
        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-container {
                max-width: 100%;
                padding: 20px;
            }
            .print-header {
                text-align: center;
                margin-bottom: 30px;
                border-bottom: 2px solid #333;
                padding-bottom: 15px;
            }
            .print-header h1 { font-size: 18pt; margin-bottom: 5px; }
            .print-header p { font-size: 11pt; color: #666; }
            .print-paragraph {
                margin-bottom: 25px;
                page-break-inside: avoid;
            }
            .print-paragraph-number {
                font-weight: bold;
                font-size: 12pt;
                margin-bottom: 8px;
            }
            .print-paragraph-text {
                font-size: 11pt;
                line-height: 1.8;
                text-align: justify;
                border: 1px solid #ccc;
                padding: 15px;
                background: #fafafa;
            }
            .print-answer-section {
                margin-top: 10px;
                border: 1px dashed #ccc;
                padding: 10px;
                min-height: 60px;
            }
            .print-answer-section p {
                font-size: 10pt;
                color: #666;
                margin-bottom: 5px;
            }
        }
        
        .print-only { display: none; }
        
        .print-btn {
            background: #059669;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        .print-btn:hover { background: #047857; }
    .print-modal-overlay{--ink:#2a2420;--ink2:#4a3f38;--muted:#8a7d73;--border:#e8e1d6;--white:#fff;--accent:#a68a2e;--accent-d:#7d6820;--r:18px;--r-sm:12px;font-family:inherit}
/* ══ PRINT MODAL STYLES ══ */
.print-modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:2000;opacity:0;pointer-events:none;transition:opacity .3s}
.print-modal-overlay.active{opacity:1;pointer-events:auto}
.print-modal{background:var(--white);border-radius:var(--r);box-shadow:0 10px 40px rgba(0,0,0,.2);max-width:500px;width:90%;max-height:85vh;overflow-y:auto;padding:0}
.pm-hdr{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--white)}
.pm-hdr h2{font-family:'IBM Plex Serif',serif;font-size:1.1rem;font-weight:700;color:var(--ink);margin:0}
.pm-close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--muted);padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.pm-close:hover{color:var(--ink)}
.pm-section{padding:18px 22px;border-bottom:1px solid var(--border)}
.pm-section h3{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:12px}
.pm-lbl{display:block;font-size:.8rem;font-weight:600;color:var(--ink2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.pm-input,.pm-textarea,.pm-select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-family:inherit;font-size:.9rem;color:var(--ink);background:var(--white);transition:border-color .2s}
.pm-input:focus,.pm-textarea:focus,.pm-select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(166,138,46,.1)}
.pm-textarea{min-height:60px;resize:vertical}
.pm-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pm-toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;margin:10px 0}
.pm-toggle-row label:first-child{font-size:.88rem;font-weight:600;color:var(--ink2)}
.pm-switch{position:relative;display:inline-block;width:48px;height:26px}
.pm-switch input{opacity:0;width:0;height:0}
.pm-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#ccc;transition:.4s;border-radius:26px}
.pm-slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background-color:#fff;transition:.4s;border-radius:50%}
.pm-switch input:checked+.pm-slider{background-color:var(--accent)}
.pm-switch input:checked+.pm-slider:before{transform:translateX(22px)}
.pm-footer{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap}
.pm-btn{flex:1 1 auto;min-width:0;padding:12px 16px;border:none;border-radius:var(--r-sm);font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap}
@media (max-width:600px){
  .pm-footer{gap:8px;padding:14px 16px}
  .pm-btn{flex:1 1 calc(50% - 4px);padding:11px 10px;font-size:.82rem}
}
.pm-btn-primary{background:var(--accent);color:#fff}
.pm-btn-primary:hover{background:var(--accent-d);transform:translateY(-1px)}
.pm-btn-secondary{background:var(--border);color:var(--ink)}
.pm-btn-secondary:hover{background:#d4d4d4}

</style>
</head>
<body>
    <div class="container" id="app">
        <div class="card loading">
            <div class="loading-spinner"></div>
            <p>Φόρτωση δεδομένων...</p>
        </div>
    </div>

    <script>
        // =====================================================
        // ΡΥΘΜΙΣΕΙΣ
        // =====================================================
        // Δημόσια δημοσιευμένη διεύθυνση CSV του Google Sheet.
        // Άφησέ την κενή ('') για χρήση των ενσωματωμένων δεδομένων,
        // ή βάλε τη διεύθυνση publish-to-web (output=csv) όταν είναι έτοιμη.
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSvU-B3J9LdZGD9amAY5zjNchc4YjjqC8fNLCf8FiDvr58-Gg4IGhj_YZqsG1Acwg/pub?gid=47489621&single=true&output=csv';

        // Οι πέντε κειμενικοί τύποι (μονή επιλογή).
        const TEXT_TYPES = [
            "Περιγραφή",
            "Αφήγηση",
            "Εξήγηση",
            "Οδηγίες",
            "Επιχειρηματολογία"

        // =====================================================
        // DATA LOADING
        // =====================================================

        function parseCSVLine(line, delimiter) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === delimiter && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result.map(val => val.replace(/^"|"$/g, '').replace(/""/g, '"'));
        }

        function detectDelimiter(firstLine) {
            const commas = (firstLine.match(/,/g) || []).length;
            const semicolons = (firstLine.match(/;/g) || []).length;
            return semicolons > commas ? ';' : ',';
        }

        // Σωστός χειρισμός πεδίων CSV με εσωτερικές αλλαγές γραμμής (μέσα σε "...").
        // Χωρίζει ΚΑΙ σε πεδία (κόμμα εκτός εισαγωγικών) ΚΑΙ σε εγγραφές (νέα γραμμή
        // εκτός εισαγωγικών), επιστρέφοντας πίνακα-2D [εγγραφή][πεδίο].
        function splitCSVRecords(csv) {
            const records = [];
            let field = '';
            let record = [];
            let inQuotes = false;
            for (let i = 0; i < csv.length; i++) {
                const c = csv[i];
                if (c === '"') {
                    if (inQuotes && csv[i + 1] === '"') { field += '"'; i++; }
                    else inQuotes = !inQuotes;
                } else if (c === ',' && !inQuotes) {
                    record.push(field); field = '';
                } else if (c === '\n' && !inQuotes) {
                    record.push(field); records.push(record); field = ''; record = [];
                } else if (c === '\r') {
                    // αγνόησέ το
                } else {
                    field += c;
                }
            }
            if (field.length > 0 || record.length > 0) { record.push(field); records.push(record); }
            return records;
        }

        function parseCSV(csv) {
            const records = splitCSVRecords(csv).filter(r => r.some(v => v && v.trim()));
            if (records.length < 2) return [];
            const headers = records[0].map(h => h.trim().toLowerCase());
            const data = [];
            for (let i = 1; i < records.length; i++) {
                const values = records[i];
                const obj = {};
                headers.forEach((header, index) => {
                    let value = (values[index] || '').trim();
                    if (value === '' || value.toLowerCase() === 'null') value = null;
                    obj[header] = value;
                });
                // Απαιτούνται μόνο keimeno + typos_keimenou.
                if (obj.keimeno && obj.typos_keimenou) {
                    // Κανονικοποίηση Unicode (NFC), ώστε η σύγκριση του τύπου να
                    // λειτουργεί ανεξάρτητα από τη μορφή που σερβίρει το Sheet.
                    obj.typos_keimenou = obj.typos_keimenou.normalize('NFC');
                    data.push(obj);
                }
            }
            return data;
        }

        async function loadData() {
            // Αν δεν έχει οριστεί URL, χρησιμοποίησε τα ενσωματωμένα δεδομένα.
            if (!GOOGLE_SHEET_CSV_URL) {
                allData = FALLBACK_DATA.slice();
                state.screen = 'selection';
                render();
                return;
            }

            // Στρατηγική φόρτωσης (βάσει δοκιμών):
            //  • Η ΑΜΕΣΗ σύνδεση στο δημοσιευμένο CSV του Google είναι η αξιόπιστη
            //    (στέλνει CORS headers, ~1-2s). Τη δοκιμάζουμε ΠΡΩΤΗ, με γενναιόδωρο
            //    όριο και ΜΙΑ επανάληψη (η πρώτη «ψυχρή» κλήση μπορεί να αργήσει).
            //  • Οι proxies μπαίνουν μόνο ως ύστατη εφεδρεία και με ΣΥΝΤΟΜΟ όριο,
            //    ώστε ένας «νεκρός» proxy να μην κρεμάει τη φόρτωση.
            const direct = (u) => u;
            const proxies = [
                (u) => 'https://corsproxy.io/?' + encodeURIComponent(u)
            ];

            // Cache-busting: μοναδική παράμετρος σε κάθε φόρτωση, ώστε να μη
            // σερβίρεται παλιά (cached) έκδοση του φύλλου από browser/proxy.
            const sep = GOOGLE_SHEET_CSV_URL.includes('?') ? '&' : '?';
            const mkFresh = () => GOOGLE_SHEET_CSV_URL + sep + 'cb=' + Date.now();

            // Βοηθητικό fetch με χρονικό όριο, ώστε μια προσπάθεια που «κολλάει»
            // να μην καθυστερεί όλη τη φόρτωση.
            async function fetchWithTimeout(url, ms) {
                const ctrl = new AbortController();
                const t = setTimeout(() => ctrl.abort(), ms);
                try {
                    return await fetch(url, { cache: 'no-store', signal: ctrl.signal });
                } finally {
                    clearTimeout(t);
                }
            }

            async function tryLoad(buildUrl, ms) {
                const response = await fetchWithTimeout(buildUrl(mkFresh()), ms);
                if (!response.ok) return false;
                const csv = await response.text();
                if (!csv || csv.trim().startsWith('<!') || csv.trim().startsWith('<html')) return false;
                const parsed = parseCSV(csv);
                if (parsed.length > 0) {
                    allData = parsed;
                    state.screen = 'selection';
                    render();
                    return true;
                }
                return false;
            }

            // 1) Άμεση σύνδεση, έως 2 προσπάθειες με μεγάλο όριο (15s).
            for (let attempt = 0; attempt < 2; attempt++) {
                try { if (await tryLoad(direct, 15000)) return; }
                catch (e) { /* επόμενη προσπάθεια */ }
            }

            // 2) Proxies ως ύστατη εφεδρεία, με σύντομο όριο (7s) ο καθένας.
            for (const getProxyUrl of proxies) {
                try { if (await tryLoad(getProxyUrl, 7000)) return; }
                catch (e) { continue; }
            }

            // 3) Εφεδρική λύση: ενσωματωμένα δεδομένα (πλήρη, 20 κείμενα).
            allData = FALLBACK_DATA.slice();
            state.screen = 'selection';
            render();
        }

        function shuffleArray(array) {
            const a = [...array];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function formatText(t) {
            return (t || '').replace(/\n/g, '<br>');
        }

        // =====================================================
        // FILTERING
        // =====================================================

        function getFilteredData() {
            let filtered = [...allData];
            if (state.selectedTypeFilter !== 'all') {
                filtered = filtered.filter(item => item.typos_keimenou === state.selectedTypeFilter);
            }
            return filtered;
        }

        // =====================================================
        // RENDERING
        // =====================================================

        let _setChecked = false;
        function render() {
            if (!_setChecked && state.screen === 'selection') {
                _setChecked = true;
                const m = (location.hash || '').match(/set=([^&]+)/);
                if (m) {
                    const byId = {}; allData.forEach(it => { byId[ktId(it)] = it; });
                    const q = decodeURIComponent(m[1]).split(',').map(x => byId[x.trim()]).filter(Boolean);
                    if (q.length) {
                        quizData = q; state.screen = 'quiz'; state.currentQuestion = 0;
                        state.selected = null; state.showResult = false; state.score = 0; state.perType = {};
                    }
                }
            }
            const app = document.getElementById('app');
            switch (state.screen) {
                case 'loading':   app.innerHTML = renderLoading();   break;
                case 'selection': app.innerHTML = renderSelection(); break;
                case 'quiz':      app.innerHTML = renderQuiz();      break;
                case 'results':   app.innerHTML = renderResults();   break;
            }
            attachEventListeners();
        }

        function renderLoading() {
            return `
                <div class="card loading">
                    <div class="loading-spinner"></div>
                    <p>Φόρτωση δεδομένων...</p>
                </div>
            `;
        }

        function renderSelection() {
            const filteredCount = getFilteredData().length;
            const wanted = state.selectedCount === 999 ? filteredCount : state.selectedCount;

            const typeButtons = ['all', ...TEXT_TYPES].map(t => `
                <button class="filter-btn ${state.selectedTypeFilter === t ? 'selected' : ''}" data-type-filter="${t}">
                    ${t === 'all' ? 'Όλοι' : t}
                </button>
            `).join('');

            return `
                <div class="card selection-screen">
                    <h2>📝 Quiz Κειμενικών Τύπων</h2>
                    <p>Νεοελληνική Γλώσσα - Αναγνώριση κειμενικού τύπου</p>

                    <div class="filter-section">
                        <h3>📚 Επιλέξτε Κειμενικό Τύπο</h3>
                        <div class="filter-options">
                            ${typeButtons}
                        </div>
                    </div>

                    <div class="filter-section">
                        <h3>🔢 Αριθμός Κειμένων</h3>
                        <div class="filter-options">
                            <button class="filter-btn ${state.selectedCount === 5 ? 'selected' : ''}" data-count="5">5</button>
                            <button class="filter-btn ${state.selectedCount === 10 ? 'selected' : ''}" data-count="10">10</button>
                            <button class="filter-btn ${state.selectedCount === 999 ? 'selected' : ''}" data-count="999">Όλα</button>
                        </div>
                    </div>

                    <div class="count-info ${filteredCount === 0 ? 'warning' : ''}">
                        ${filteredCount > 0
                            ? `✅ Βρέθηκαν <strong>${filteredCount}</strong> κείμενα ${filteredCount < wanted ? `(θα εμφανιστούν όλα)` : `(θα εμφανιστούν ${wanted})`}`
                            : '⚠️ Δεν βρέθηκαν κείμενα με αυτά τα κριτήρια'}
                    </div>

                    <button class="start-btn" id="startBtn" ${filteredCount === 0 ? 'disabled' : ''}>
                        Ξεκινήστε το Quiz
                    </button>

                    <button class="print-btn" id="printBtn" ${filteredCount === 0 ? 'disabled' : ''}>
                        🖨️ Εκτύπωση Άσκησης (Φύλλο Εργασίας)
                    </button>
                </div>
            `;
        }

        function renderQuiz() {
            const current = quizData[state.currentQuestion];
            const progress = ((state.currentQuestion + 1) / quizData.length) * 100;
            const isCorrect = state.selected === current.typos_keimenou;

            const optionButtons = TEXT_TYPES.map(t => {
                let classes = 'option-btn';
                if (!state.showResult && state.selected === t) classes += ' selected';
                if (state.showResult) {
                    if (t === current.typos_keimenou) {
                        classes += ' correct-answer';
                        if (state.selected === t) classes += ' was-selected';
                    } else if (state.selected === t) {
                        classes += ' wrong-answer';
                    }
                }
                return `
                    <button class="${classes}" data-type="${t}" ${state.showResult ? 'disabled' : ''}>
                        ${t}
                    </button>
                `;
            }).join('');

            return `
                <div class="card">
                    <div class="header">
                        <div>
                            <h1>📝 Κειμενικοί Τύποι</h1>
                            <p class="header-subtitle">Νεοελληνική Γλώσσα</p>
                        </div>
                        <div class="question-counter">
                            <p style="color: #64748b; font-size: 0.875rem;">Ερώτηση</p>
                            <span>${state.currentQuestion + 1}/${quizData.length}</span>
                        </div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                </div>

                <button class="theory-toggle" id="theoryToggle">
                    ${state.showTheory ? '▼' : '▶'} Βοήθεια: Θεωρητικό Πλαίσιο
                </button>

                ${state.showTheory ? `
                <div class="theory-box">
                    <h3>📚 Τα κειμενικά γένη</h3>
                    <div class="theory-grid">
                        ${TEXT_TYPES.map(t => `
                            <div>
                                <p style="font-weight: 600; margin-bottom: 4px; color: #92400e;">${t}</p>
                                <ul>
                                    <li><strong>Τι είναι:</strong> ${THEORY[t].ti}</li>
                                    ${THEORY[t].eidi ? `<li><strong>Είδη:</strong> ${THEORY[t].eidi}</li>` : ''}
                                    <li><strong>Δομή:</strong> ${THEORY[t].domi}</li>
                                    <li><strong>Γλώσσα:</strong> ${THEORY[t].glossa}</li>
                                </ul>
                            </div>
                        `).join('')}
                    </div>
                </div>
                ` : ''}

                <div class="card">
                    <span class="paragraph-label">Κείμενο ${state.currentQuestion + 1}</span>
                    <p class="paragraph-text">${formatText(current.keimeno)}</p>
                </div>

                <div class="question-card ${state.showResult ? (isCorrect ? 'correct' : 'incorrect') : ''}">
                    <h3>Ποια επικοινωνιακή λειτουργία επιτελείται;</h3>
                    <div class="options-list">
                        ${optionButtons}
                    </div>
                </div>

                ${!state.showResult ? `
                    <button class="main-btn primary" id="checkBtn" ${!state.selected ? 'disabled' : ''}>
                        Έλεγχος Απάντησης
                    </button>
                ` : `
                    <div class="feedback-section">
                        <h3>📋 Ανάλυση Απάντησης</h3>

                        <div class="feedback-box ${isCorrect ? 'green' : 'purple'}">
                            <h4>${isCorrect ? '✅ Σωστή απάντηση' : '❌ Λάθος απάντηση'} — Κύριο κειμενικό γένος: ${current.typos_keimenou}</h4>
                            ${current.diorthosi ? `<p style="margin-top: 8px;">${formatText(current.diorthosi)}</p>` : `<p style="margin-top: 8px;">${THEORY[current.typos_keimenou].ti}</p>`}
                        </div>
                    </div>

                    <button class="main-btn success" id="nextBtn">
                        ${state.currentQuestion < quizData.length - 1 ? 'Επόμενο Κείμενο →' : 'Δες τα Αποτελέσματα'}
                    </button>
                `}
            `;
        }

        function renderResults() {
            const total = quizData.length;
            const percentage = total ? Math.round((state.score / total) * 100) : 0;
            const emoji = percentage >= 80 ? '🎉' : percentage >= 60 ? '👍' : '📚';

            const perTypeRows = TEXT_TYPES
                .filter(t => state.perType[t] && state.perType[t].total > 0)
                .map(t => {
                    const pt = state.perType[t];
                    return `
                        <div class="detail-box blue">
                            <p>${t}</p>
                            <p>${pt.correct}/${pt.total}</p>
                        </div>
                    `;
                }).join('');

            return `
                <div class="card results-card">
                    <div class="results-emoji">${emoji}</div>
                    <h2 class="results-title">Ολοκλήρωσες το Quiz!</h2>

                    <div class="results-score-box">
                        <p class="results-score">${state.score} / ${total}</p>
                        <p class="results-percentage">(${percentage}%)</p>
                    </div>

                    ${perTypeRows ? `<div class="results-grid">${perTypeRows}</div>` : ''}

                    <button class="main-btn primary" id="restartBtn" style="margin-bottom: 12px;">
                        Ξεκίνα Ξανά
                    </button>
                    <button class="main-btn" id="newSelectionBtn" style="background: #64748b; color: white;">
                        Νέα Επιλογή Κριτηρίων
                    </button>
                </div>
            `;
        }

        // =====================================================
        // EVENT LISTENERS
        // =====================================================

        function startQuiz() {
            let filtered = shuffleArray(getFilteredData());
            const n = state.selectedCount === 999 ? filtered.length : state.selectedCount;
            quizData = filtered.slice(0, n);
            state.screen = 'quiz';
            state.currentQuestion = 0;
            state.selected = null;
            state.showResult = false;
            state.score = 0;
            state.perType = {};
        }

        function attachEventListeners() {
            // --- Selection screen ---
            document.querySelectorAll('[data-type-filter]').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.selectedTypeFilter = btn.dataset.typeFilter;
                    render();
                });
            });

            document.querySelectorAll('[data-count]').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.selectedCount = parseInt(btn.dataset.count);
                    render();
                });
            });

            const startBtn = document.getElementById('startBtn');
            if (startBtn) startBtn.addEventListener('click', () => { startQuiz(); render(); });

            const printBtn = document.getElementById('printBtn');
            if (printBtn) printBtn.addEventListener('click', () => {
                const filtered = shuffleArray(getFilteredData());
                const n = state.selectedCount === 999 ? filtered.length : state.selectedCount;
                showPrintModal(filtered.slice(0, n).map(it => Object.assign({}, it, { id: ktId(it) })));
            });

            // --- Quiz screen ---
            const theoryToggle = document.getElementById('theoryToggle');
            if (theoryToggle) theoryToggle.addEventListener('click', () => {
                state.showTheory = !state.showTheory; render();
            });

            document.querySelectorAll('[data-type]').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.selected = btn.dataset.type;
                    render();
                });
            });

            const checkBtn = document.getElementById('checkBtn');
            if (checkBtn) checkBtn.addEventListener('click', () => {
                const current = quizData[state.currentQuestion];
                const correct = state.selected === current.typos_keimenou;
                if (correct) state.score += 1;
                // Στατιστικά ανά τύπο (με βάση τον σωστό τύπο του κειμένου).
                if (!state.perType[current.typos_keimenou]) state.perType[current.typos_keimenou] = { correct: 0, total: 0 };
                state.perType[current.typos_keimenou].total += 1;
                if (correct) state.perType[current.typos_keimenou].correct += 1;
                state.showResult = true;
                render();
            });

            const nextBtn = document.getElementById('nextBtn');
            if (nextBtn) nextBtn.addEventListener('click', () => {
                if (state.currentQuestion < quizData.length - 1) {
                    state.currentQuestion += 1;
                    state.selected = null;
                    state.showResult = false;
                } else {
                    state.screen = 'results';
                }
                render();
            });

            // --- Results screen ---
            const restartBtn = document.getElementById('restartBtn');
            if (restartBtn) restartBtn.addEventListener('click', () => { startQuiz(); render(); });

            const newSelectionBtn = document.getElementById('newSelectionBtn');
            if (newSelectionBtn) newSelectionBtn.addEventListener('click', () => {
                state.screen = 'selection';
                render();
            });
        }

        // =====================================================
        // PRINT WORKSHEET
        // =====================================================
        
        // ══════════════ ΕΚΤΥΠΩΣΗ (ίδιο πάνελ με τις άλλες εφαρμογές) ══════════════
        let _pmListenersAttached = false;
        let _pendingPrintQ = null;
        // Σταθερό αναγνωριστικό κειμένου (για QR / σύνδεσμο σετ)
        function ktId(item) { const t = String(item && item.keimeno || ''); let h = 0; for (let i = 0; i < t.length; i++) { h = ((h << 5) - h + t.charCodeAt(i)) | 0; } return 'T' + (h >>> 0).toString(36); }
        function buildSetLink(ids) { return location.origin + location.pathname + '#set=' + encodeURIComponent(ids.join(',')); }
        function renderTextForPrint(q, idx, s) {
          let html = `<div class="pq"><p class="pq-num">Κείμενο ${idx + 1}</p>`;
          html += `<div class="pq-excerpt" style="font-style:normal">${formatText(q.keimeno)}</div>`;
          html += `<p class="pq-q">Κειμενικός τύπος: ______________________________</p>`;
          html += `<p class="pq-q">Αιτιολόγηση:</p>`;
          if (s.showLines) { html += '<div class="pq-lines">'; for (let i = 0; i < s.linesCount; i++) html += '<div class="pq-line"></div>'; html += '</div>'; }
          else html += `<p class="pq-q">______________________________________________________</p>`;
          return html + '</div>';
        }
        function showPrintModal(questions) {
          _pendingPrintQ = questions;
          document.getElementById('printModalOverlay').classList.add('active');
          setTimeout(() => attachPrintModalListeners(), 100);
        }
        
        function closePrintModal() {
          document.getElementById('printModalOverlay').classList.remove('active');
        }
        
        function attachPrintModalListeners() {
          if (_pmListenersAttached) return;
          _pmListenersAttached = true;
        
          document.getElementById('pmClose').addEventListener('click', closePrintModal);
          document.getElementById('pmCancel').addEventListener('click', closePrintModal);
          document.getElementById('printModalOverlay').addEventListener('click', e => {
            if (e.target === document.getElementById('printModalOverlay')) closePrintModal();
          });
        
          document.getElementById('pmShowLines').addEventListener('change', function() {
            document.getElementById('pmLinesCountRow').style.display = this.checked ? 'block' : 'none';
          });
          document.getElementById('pmWatermarkOn').addEventListener('change', function() {
            document.getElementById('pmWatermarkRow').style.display = this.checked ? 'block' : 'none';
          });
          // Αρχική κατάσταση
          document.getElementById('pmWatermarkRow').style.display = 'none';
        
          document.getElementById('pmPrint').addEventListener('click', () => {
            const s = collectPrintSettings();
            closePrintModal();
            printTextWorksheet(_pendingPrintQ, s);
          });
        
          // Helper: φτιάχνει το link του τρέχοντος σετ
          const _setLink = () => {
            const ids = (_pendingPrintQ || []).map(q => q.id).filter(v => v != null && v !== '');
            return ids.length ? buildSetLink(ids) : null;
          };
        
          // 📋 Αντιγραφή — πάντα clipboard (για paste στο Live), χωρίς share sheet
          const pmCopy = document.getElementById('pmCopyLink');
          if (pmCopy) pmCopy.addEventListener('click', async () => {
            const url = _setLink();
            if (!url) return;
            try {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(url);
              } else {
                const ta = document.createElement('textarea');
                ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.focus(); ta.select();
                document.execCommand('copy'); document.body.removeChild(ta);
              }
              pmCopy.textContent = '✓ Αντιγράφηκε';
              setTimeout(() => { pmCopy.innerHTML = '📋 Αντιγραφή'; }, 1800);
            } catch (e) {
              window.prompt('Αντιγράψτε τον σύνδεσμο:', url);
            }
          });
        
          // 🔗 Κοινή χρήση — share sheet (για αποστολή αλλού: email, μήνυμα κ.λπ.)
          const pmShare = document.getElementById('pmShareLink');
          if (pmShare) pmShare.addEventListener('click', async () => {
            const url = _setLink();
            if (!url) return;
            try {
              if (navigator.share) {
                await navigator.share({ title: 'Σετ ερωτήσεων', text: 'Άνοιγμα σετ στην εφαρμογή:', url });
              } else if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(url);
                pmShare.textContent = '✓ Αντιγράφηκε';
                setTimeout(() => { pmShare.innerHTML = '🔗 Κοινή χρήση'; }, 1800);
              } else {
                window.prompt('Αντιγράψτε τον σύνδεσμο:', url);
              }
            } catch (e) { /* ο χρήστης ακύρωσε την κοινή χρήση */ }
          });
        }
        
        function collectPrintSettings() {
          return {
            title:    document.getElementById('pmTitle').value.trim() || 'ΑΣΚΗΣΗ',
            instructions: document.getElementById('pmInstructions').value.trim(),
            score:    document.getElementById('pmScore').value.trim(),
            school:   document.getElementById('pmSchool').value.trim(),
            subject:  document.getElementById('pmSubject').value.trim(),
            className:document.getElementById('pmClass').value.trim(),
            date:     document.getElementById('pmDate').value.trim(),
            showName: document.getElementById('pmShowName').checked,
            logoUrl:  document.getElementById('pmLogo').value.trim(),
            logoW:    document.getElementById('pmLogoW').value,
            logoH:    document.getElementById('pmLogoH').value,
            font:     document.getElementById('pmFont').value,
            fontSize: document.getElementById('pmFontSize').value,
            marginV:  document.getElementById('pmMarginV').value,
            marginH:  document.getElementById('pmMarginH').value,
            showLines:document.getElementById('pmShowLines').checked,
            linesCount:parseInt(document.getElementById('pmLinesCount').value),
            lineHeight:document.getElementById('pmLineHeight').value,
            qSpacing:document.getElementById('pmQSpacing').value,
            optSpacing:document.getElementById('pmOptSpacing').value,
            watermark: document.getElementById('pmWatermarkOn').checked,
            watermarkText: document.getElementById('pmWatermarkText').value.trim() || 'ΔΕΙΓΜΑ',
            watermarkOpacity: document.getElementById('pmWatermarkOpacity').value,
            watermarkColor: document.getElementById('pmWatermarkColor').value,
          };
        }
        
        function printTextWorksheet(questions, s) {
          // QR deep-link για το ίδιο ακριβώς σετ ερωτήσεων (σταθερά IDs)
          const setIds = questions.map(q => q.id).filter(v => v != null && v !== '');
          const setUrl = buildSetLink(setIds);
          const qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=4&data=' + encodeURIComponent(setUrl);
        
          // Περιεχόμενο QR για την 3η στήλη (πιο μικρό, ώστε να χωρά δίπλα στα στοιχεία)
          const qrCornerInner = setIds.length ? `
              <a href="${setUrl}" style="display:inline-block;text-align:center;text-decoration:none;color:#000">
                <img src="${qrSrc}" alt="QR σετ ερωτήσεων" style="width:76px;height:76px;border:1px solid #ddd;border-radius:6px" loading="eager">
              </a>` : '';
        
          // 3η στήλη: αν υπάρχει λογότυπο → λογότυπο (χωρίς QR)· αλλιώς → QR (αν υπάρχει σετ).
          const cornerCell = s.logoUrl ? `
            <td rowspan="2" style="text-align:right;vertical-align:middle;padding-left:10px;width:${s.logoW}px">
              <img src="${s.logoUrl}" style="width:${s.logoW}px;height:${s.logoH==='auto'?'auto':s.logoH+'px'};object-fit:contain" onerror="this.style.display='none'">
            </td>`
            : (qrCornerInner ? `
            <td rowspan="2" style="text-align:right;vertical-align:middle;padding-left:10px;width:96px">${qrCornerInner}
            </td>` : '');
        
          let headerHTML = '';
          if (s.school || s.subject || s.className || s.date || s.showName || s.logoUrl || setIds.length) {
            headerHTML = `<table class="hdr-table">`;
            headerHTML += `<tr>`;
            headerHTML += s.school ? `<td><strong>Σχολείο:</strong> ${s.school}</td>` : `<td></td>`;
            headerHTML += s.subject ? `<td><strong>Μάθημα:</strong> ${s.subject}</td>` : `<td></td>`;
            headerHTML += cornerCell;
            headerHTML += `</tr><tr>`;
            if (s.showName) headerHTML += `<td><strong>Ονοματεπώνυμο:</strong> ___________________________</td>`;
            else if (s.className) headerHTML += `<td><strong>Τμήμα:</strong> ${s.className}</td>`;
            else headerHTML += `<td></td>`;
            if (s.date) headerHTML += `<td><strong>Ημερομηνία:</strong> ${s.date}</td>`;
            else if (s.className && s.showName) headerHTML += `<td><strong>Τμήμα:</strong> ${s.className}</td>`;
            else headerHTML += `<td></td>`;
            headerHTML += `</tr></table><hr class="hdr-line">`;
          }
        
          const questionsHTML = questions.map((q, i) => renderTextForPrint(q, i, s)).join('');
        
          const html = `<!DOCTYPE html>
        <html lang="el"><head><meta charset="UTF-8">
        <title>${s.title}</title>
        <style>
          *{margin:0;padding:0;box-sizing:border-box}
          @page{margin:${s.marginV} ${s.marginH}}
          body{font-family:${s.font};font-size:${s.fontSize};color:#000;padding:${s.marginV} ${s.marginH}}
          @media print{body{padding:0}}
          .hdr-table{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:${s.fontSize}}
          .hdr-table td{padding:3px 0;width:50%;vertical-align:top}
          .hdr-line{border:none;border-top:1.5px solid #333;margin-bottom:14px}
          .print-title{text-align:center;font-size:calc(${s.fontSize} + 3pt);font-weight:bold;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px}
          .print-instr{font-size:${s.fontSize};text-align:justify;margin-bottom:5px;line-height:1.7}
          .print-score{font-size:${s.fontSize};font-style:italic;color:#444;margin-bottom:14px}
          .pq{margin-bottom:${s.qSpacing};page-break-inside:avoid}
          .pq-excerpt{font-size:${s.fontSize};line-height:${s.lineHeight};text-align:justify;font-style:italic;margin-bottom:8px;padding:4px 0}
          .pq-num{font-weight:bold;font-size:${s.fontSize};margin-bottom:3px}
          .pq-q{font-size:${s.fontSize};margin-bottom:8px;line-height:${s.lineHeight}}
          .pq-yn{display:flex;gap:32px;font-size:${s.fontSize};margin-top:6px}
          .pq-opts{display:flex;flex-direction:column;gap:${s.optSpacing};margin-top:6px}

<script>
/* ═══════════════════════════════════════════════════════════════
   ΛΕΒΙΑΘΑΝ — Ζωντανά αποτελέσματα (Κουίζ Live)
   Ενεργό ΜΟΝΟ όταν ο σύνδεσμος έχει #session=XXXX
   ═══════════════════════════════════════════════════════════════ */
(function(){
  var m = (location.hash || '').match(/session=(\d{4})/);
  if (!m) return;
  var CODE = m[1];
  var API = (/vercel\.app$/.test(location.hostname) ? location.origin : 'https://leviathan-olive.vercel.app') + '/api/quiz-results';
  var NAME = null, finalSent = false, lastKey = null;
  function askName(){
    var n = null; try { n = localStorage.getItem('lev_name_' + CODE); } catch(e){}
    while (!n || !n.trim()) { n = prompt('Γράψε το όνομά σου (θα το δει ο/η καθηγητής/τρια):'); if (n === null) n = ''; }
    NAME = n.trim().slice(0, 40);
    try { localStorage.setItem('lev_name_' + CODE, NAME); } catch(e){}
  }
  function send(body){
    if (!NAME) askName();
    body.code = CODE; body.student = NAME;
    try { fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body), keepalive:true }).catch(function(){}); } catch(e){}
  }
  function hash(s){ var h = 0; for (var i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; } return 'T' + (h >>> 0).toString(36); }
  setTimeout(askName, 400);

  var _render = window.render;
  window.render = function(){
    var r = _render.apply(this, arguments);
    try {
      if (state.screen === 'quiz') {
        finalSent = false;
        var cur = quizData[state.currentQuestion];
        var key = state.currentQuestion + ':' + (cur && cur.keimeno || '').slice(0, 20);
        if (state.showResult && cur && key !== lastKey) {
          lastKey = key;
          var txt = String(cur.keimeno || '');
          send({ qid: hash(txt), qtext: 'Κειμενικός τύπος:', excerpt: txt.slice(0, 600), cat: cur.typos_keimenou || '',
                 choice: String(state.selected || '—').slice(0, 20), ok: state.selected === cur.typos_keimenou });
        }
      } else if (state.screen === 'results' && !finalSent) {
        finalSent = true; lastKey = null;
        send({ final: true, score: state.score, totalQ: quizData.length });
      }
    } catch(e){}
    return r;
  };
})();
</script>
