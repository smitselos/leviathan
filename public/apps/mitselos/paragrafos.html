        </div>
      </div>
    </div>

    <div class="pm-section">
      <h3>🎨 Μορφοποίηση</h3>
      <div class="pm-grid2" style="margin-bottom:10px">
        <div>
          <label class="pm-lbl">Γραμματοσειρά</label>
          <select class="pm-select" id="pmFont">
            <option value="'Helvetica Neue', Helvetica, Arial, sans-serif" selected>Helvetica Neue</option>
            <option value="'Times New Roman', serif">Times New Roman</option>
            <option value="'Georgia', serif">Georgia</option>
            <option value="'Garamond', serif">Garamond</option>
            <option value="'Arial', sans-serif">Arial</option>
            <option value="'Calibri', sans-serif">Calibri</option>
          </select>
        </div>
        <div>
          <label class="pm-lbl">Μέγεθος</label>
          <select class="pm-select" id="pmFontSize">
            <option value="10pt">10pt</option>
            <option value="11pt" selected>11pt</option>
            <option value="12pt">12pt</option>
            <option value="13pt">13pt</option>
            <option value="14pt">14pt</option>
          </select>
        </div>
      </div>
      <div class="pm-grid2" style="margin-bottom:10px">
        <div>
          <label class="pm-lbl">Περιθώριο πάνω/κάτω</label>
          <select class="pm-select" id="pmMarginV">
            <option value="15mm">15mm</option>
            <option value="20mm" selected>20mm</option>
            <option value="25mm">25mm</option>
            <option value="30mm">30mm</option>
          </select>
        </div>
        <div>
          <label class="pm-lbl">Περιθώριο αριστερά/δεξιά</label>
          <select class="pm-select" id="pmMarginH">
            <option value="15mm">15mm</option>
            <option value="20mm" selected>20mm</option>
            <option value="30mm">30mm</option>
            <option value="40mm">40mm</option>
            <option value="50mm">50mm</option>
            <option value="60mm">60mm</option>
            <option value="70mm">70mm</option>
            <option value="80mm">80mm</option>
            <option value="100mm">100mm</option>
          </select>
        </div>
      </div>
      <div class="pm-grid3" style="margin-bottom:10px">
        <div>
          <label class="pm-lbl">Διάστιχο κειμένου</label>
          <select class="pm-select" id="pmLineHeight">
            <option value="1.4">1.4</option>
            <option value="1.6" selected>1.6</option>
            <option value="1.8">1.8</option>
            <option value="2.0">2.0</option>
            <option value="2.2">2.2</option>
          </select>
        </div>
        <div>
          <label class="pm-lbl">Απόσταση ερωτήσεων</label>
          <select class="pm-select" id="pmQSpacing">
            <option value="14px">Μικρή</option>
            <option value="22px" selected>Κανονική</option>
            <option value="32px">Μεγάλη</option>
            <option value="44px">Πολύ μεγάλη</option>
          </select>
        </div>
        <div>
          <label class="pm-lbl">Απόσταση επιλογών</label>
          <select class="pm-select" id="pmOptSpacing">
            <option value="4px">Μικρή</option>
            <option value="8px" selected>Κανονική</option>
            <option value="12px">Μεγάλη</option>
            <option value="18px">Πολύ μεγάλη</option>
          </select>
        </div>
      </div>
      <div class="pm-toggle-row">
        <label for="pmShowLines">Γραμμές απάντησης κάτω από κάθε ερώτηση</label>
        <label class="pm-switch"><input type="checkbox" id="pmShowLines" checked><span class="pm-slider"></span></label>
      </div>
      <div id="pmLinesCountRow" style="margin-top:8px">
        <label class="pm-lbl">Αριθμός γραμμών</label>
        <select class="pm-select" id="pmLinesCount" style="max-width:160px">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
    </div>

    <div class="pm-section">
      <h3>💧 Υδατογράφημα</h3>
      <div class="pm-toggle-row" style="margin-bottom:8px">
        <label for="pmWatermarkOn">Εμφάνιση υδατογραφήματος</label>
        <label class="pm-switch"><input type="checkbox" id="pmWatermarkOn"><span class="pm-slider"></span></label>
      </div>
      <div id="pmWatermarkRow">
        <div class="pm-grid2" style="margin-bottom:8px">
          <div>
            <label class="pm-lbl">Κείμενο</label>
            <input type="text" class="pm-input" id="pmWatermarkText" value="ΔΕΙΓΜΑ" placeholder="π.χ. ΔΕΙΓΜΑ, ΑΠΑΝΤΗΣΕΙΣ">
          </div>
          <div>
            <label class="pm-lbl">Διαφάνεια</label>
            <select class="pm-select" id="pmWatermarkOpacity">
              <option value="0.05">Πολύ αχνό (5%)</option>
              <option value="0.10" selected>Αχνό (10%)</option>
              <option value="0.15">Μέτριο (15%)</option>
              <option value="0.25">Έντονο (25%)</option>
              <option value="0.40">Πολύ έντονο (40%)</option>
            </select>
          </div>
        </div>
        <div>
          <label class="pm-lbl">Χρώμα</label>
          <select class="pm-select" id="pmWatermarkColor">
            <option value="#000000">Μαύρο</option>
            <option value="#cc0000" selected>Κόκκινο</option>
            <option value="#0000cc">Μπλε</option>
            <option value="#006600">Πράσινο</option>
            <option value="#888888">Γκρι</option>
          </select>
        </div>
      </div>
    </div>

    <div class="pm-actions">
      <button class="pm-btn cancel" id="pmCancel">Ακύρωση</button>
      <button class="pm-btn cancel" id="pmCopyLink">📋 Αντιγραφή</button>
      <button class="pm-btn cancel" id="pmShareLink">🔗 Κοινή χρήση</button>
      <button class="pm-btn go" id="pmPrint">🖨️ Εκτύπωση</button>
    </div>
  </div>
</div>

</body>
</html>
